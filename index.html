ㄢˋ魅ㄇㄟˋ蠱ㄍㄨˇ毒ㄉㄨˊ所ㄙㄨㄛˇ中ㄓㄨㄥˋ，或ㄏㄨㄛˋ復ㄈㄨˋ短ㄉㄨㄢˇ命ㄇㄧㄥˋ，或ㄏㄨㄛˋ時ㄕˊ橫ㄏㄥˋ死ㄙˇ，欲ㄩˋ令ㄌㄧㄥˋ是ㄕˋ等ㄉㄥˇ病ㄅㄧㄥˋ苦ㄎㄨˇ消ㄒㄧㄠ除ㄔㄨˊ，所ㄙㄨㄛˇ求ㄑㄧㄡˊ願ㄩㄢˋ滿ㄇㄢˇ。時ㄕˊ彼ㄅㄧˇ世ㄕˋ尊ㄗㄨㄣ入ㄖㄨˋ三ㄙㄢ摩ㄇㄛˊ地ㄉㄧˋ，名ㄇㄧㄥˊ曰ㄩㄝ：除ㄔㄨˊ滅ㄇㄧㄝˋ一ㄧˊ切ㄑㄧㄝˋ眾ㄓㄨㄥˋ生ㄕㄥ苦ㄎㄨˇ惱ㄋㄠˇ。既ㄐㄧˋ入ㄖㄨˋ定ㄉㄧㄥˋ已ㄧˇ，於ㄩˊ肉ㄖㄡˋ髻ㄐㄧˋ中ㄓㄨㄥ，出ㄔㄨ大ㄉㄚˋ光ㄍㄨㄤ明ㄇㄧㄥˊ，光ㄍㄨㄤ中ㄓㄨㄥ演ㄧㄢˇ說ㄕㄨㄛ大ㄉㄚˋ陀ㄊㄨㄛˊ羅ㄌㄨㄛˊ尼ㄋㄧˊ曰ㄩㄝ：『南ㄋㄚˊ無ㄇㄛˊ薄ㄅㄛˊ伽ㄑㄧㄝˊ伐ㄈㄚˊ帝ㄉㄧˋ。鞞ㄅㄧˋ殺ㄕㄚˊ社ㄕㄜˋ窶ㄐㄩˋ嚕ㄌㄨˋ薜ㄅㄧˋ琉ㄌㄧㄡˊ璃ㄌㄧˊ。鉢ㄅㄛ喇ㄌㄚˋ婆ㄆㄛˊ。喝ㄏㄜˋ囉ㄌㄚˋ闍ㄕㄜˊ也ㄧㄝˇ。怛ㄉㄚˊ陀ㄊㄨㄛˊ揭ㄐㄧㄝˊ多ㄉㄨㄛˊ耶ㄧㄝˊ。阿ㄚ囉ㄌㄚˋ喝ㄏㄜˋ帝ㄉㄧˋ。三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ勃ㄅㄛˊ陀ㄊㄨㄛˊ耶ㄧㄝˊ。怛ㄉㄚˊ姪ㄓˊ他ㄊㄨㄛˊ。唵ㄨㄥ。鞞ㄅㄧˋ殺ㄕㄚˊ逝ㄕˋ。鞞ㄅㄧˋ殺ㄕㄚˊ逝ㄕˋ。鞞ㄅㄧˋ殺ㄕㄚˊ社ㄕㄜˋ。三ㄙㄢ沒ㄇㄛˋ揭ㄐㄧㄝˊ帝ㄉㄧˋ。莎ㄙㄨㄛ訶ㄏㄜ。』\n爾ㄦˇ時ㄕˊ，光ㄍㄨㄤ中ㄓㄨㄥ說ㄕㄨㄛ此ㄘˇ咒ㄓㄡˋ已ㄧˇ，大ㄉㄚˋ地ㄉㄧˋ震ㄓㄣˋ動ㄉㄨㄥˋ，放ㄈㄤˋ大ㄉㄚˋ光ㄍㄨㄤ明ㄇㄧㄥˊ，一ㄧˊ切ㄑㄧㄝˋ眾ㄓㄨㄥˋ生ㄕㄥ，病ㄅㄧㄥˋ苦ㄎㄨˇ皆ㄐㄧㄝ除ㄔㄨˊ，受ㄕㄡˋ安ㄢ穩ㄨㄣˇ樂ㄌㄜˋ。\n曼ㄇㄢˋ殊ㄕㄨ室ㄕˋ利ㄌㄧˋ！若ㄖㄨㄛˋ見ㄐㄧㄢˋ男ㄋㄢˊ子ㄗˇ、女ㄋㄩˇ人ㄖㄣˊ，有ㄧㄡˇ病ㄅㄧㄥˋ苦ㄎㄨˇ者ㄓㄜˇ，應ㄧㄥ當ㄉㄤ一ㄧˋ心ㄒㄧㄣ為ㄨㄟˋ彼ㄅㄧˇ病ㄅㄧㄥˋ人ㄖㄣˊ，常ㄔㄤˊ清ㄑㄧㄥ淨ㄐㄧㄥˋ澡ㄗㄠˇ漱ㄕㄨˋ，或ㄏㄨㄛˋ食ㄕˊ、或ㄏㄨㄛˋ藥ㄧㄠˋ、或ㄏㄨㄛˋ無ㄨˊ蟲ㄔㄨㄥˊ水ㄕㄨㄟˇ，咒ㄓㄡˋ一ㄧˋ百ㄅㄞˇ八ㄅㄚ遍ㄅㄧㄢˋ，與ㄩˇ彼ㄅㄧˇ服ㄈㄨˊ食ㄕˊ，所ㄙㄨㄛˇ有ㄧㄡˇ病ㄅㄧㄥˋ苦ㄎㄨˇ悉ㄒㄧ皆ㄐㄧㄝ消ㄒㄧㄠ滅ㄇㄧㄝˋ。若ㄖㄨㄛˋ有ㄧㄡˇ所ㄙㄨㄛˇ求ㄑㄧㄡˊ，至ㄓˋ心ㄒㄧㄣ念ㄋㄧㄢˋ誦ㄙㄨㄥˋ，皆ㄐㄧㄝ得ㄉㄜˊ如ㄖㄨˊ是ㄕˋ，無ㄨˊ病ㄅㄧㄥˋ延ㄧㄢˊ年ㄋㄧㄢˊ。命ㄇㄧㄥˋ終ㄓㄨㄥ之ㄓ後ㄏㄡˋ，生ㄕㄥ彼ㄅㄧˇ世ㄕˋ界ㄐㄧㄝˋ，得ㄉㄜˊ不ㄅㄨˋ退ㄊㄨㄟˋ轉ㄓㄨㄢˇ，乃ㄋㄞˇ至ㄓˋ菩ㄆㄨˊ提ㄊㄧˊ。是ㄕˋ故ㄍㄨˋ曼ㄇㄢˋ殊ㄕㄨ室ㄕˋ利ㄌㄧˋ！若ㄖㄨㄛˋ有ㄧㄡˇ男ㄋㄢˊ子ㄗˇ、女ㄋㄩˇ人ㄖㄣˊ，於ㄩˊ彼ㄅㄧˇ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ，至ㄓˋ心ㄒㄧㄣ殷ㄧㄣ重ㄓㄨㄥˋ，恭ㄍㄨㄥ敬ㄐㄧㄥˋ供ㄍㄨㄥˋ養ㄧㄤˇ者ㄓㄜˇ，常ㄔㄤˊ持ㄔˊ此ㄘˇ咒ㄓㄡˋ，勿ㄨˋ令ㄌㄧㄥˋ廢ㄈㄟˋ忘ㄨㄤˋ。\n復ㄈㄨˋ次ㄘˋ，曼ㄇㄢˋ殊ㄕㄨ室ㄕˋ利ㄌㄧˋ！若ㄖㄨㄛˋ有ㄧㄡˇ淨ㄐㄧㄥˋ信ㄒㄧㄣˋ男ㄋㄢˊ子ㄗˇ、女ㄋㄩˇ人ㄖㄣˊ，得ㄉㄜˊ聞ㄨㄣˊ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ、應ㄧㄥ正ㄓㄥˋ等ㄉㄥˇ覺ㄐㄩㄝˊ所ㄙㄨㄛˇ有ㄧㄡˇ名ㄇㄧㄥˊ號ㄏㄠˋ，聞ㄨㄣˊ已ㄧˇ誦ㄙㄨㄥˋ持ㄔˊ。晨ㄔㄣˊ嚼ㄐㄧㄠˊ齒ㄔˇ木ㄇㄨˋ，澡ㄗㄠˇ漱ㄕㄨˋ清ㄑㄧㄥ淨ㄐㄧㄥˋ，以ㄧˇ諸ㄓㄨ香ㄒㄧㄤ花ㄏㄨㄚ、燒ㄕㄠ香ㄒㄧㄤ、塗ㄊㄨˊ香ㄒㄧㄤ，作ㄗㄨㄛˋ眾ㄓㄨㄥˋ伎ㄐㄧˋ樂ㄩㄝˋ，供ㄍㄨㄥˋ養ㄧㄤˇ形ㄒㄧㄥˊ像ㄒㄧㄤˋ。於ㄩˊ此ㄘˇ經ㄐㄧㄥ典ㄉㄧㄢˇ，若ㄖㄨㄛˋ自ㄗˋ書ㄕㄨ、若ㄖㄨㄛˋ教ㄐㄧㄠˋ人ㄖㄣˊ書ㄕㄨ，一ㄧˋ心ㄒㄧㄣ受ㄕㄡˋ持ㄔˊ，聽ㄊㄧㄥ聞ㄨㄣˊ其ㄑㄧˊ義ㄧˋ。於ㄩˊ彼ㄅㄧˇ法ㄈㄚˇ師ㄕ，應ㄧㄥ修ㄒㄧㄡ供ㄍㄨㄥˋ養ㄧㄤˇ，一ㄧˊ切ㄑㄧㄝˋ所ㄙㄨㄛˇ有ㄧㄡˇ資ㄗ身ㄕㄣ之ㄓ具ㄐㄩˋ，悉ㄒㄧ皆ㄐㄧㄝ於ㄩˊ與ㄩˇ，勿ㄨˋ令ㄌㄧㄥˋ乏ㄈㄚˊ少ㄕㄠˇ。如ㄖㄨˊ是ㄕˋ便ㄅㄧㄢˋ蒙ㄇㄥˊ諸ㄓㄨ佛ㄈㄛˊ護ㄏㄨˋ念ㄋㄧㄢˋ，所ㄙㄨㄛˇ求ㄑㄧㄡˊ願ㄩㄢˋ滿ㄇㄢˇ，乃ㄋㄞˇ至ㄓˋ菩ㄆㄨˊ提ㄊㄧˊ。」\n爾ㄦˇ時ㄕˊ，曼ㄇㄢˋ殊ㄕㄨ室ㄕˋ利ㄌㄧˋ童ㄊㄨㄥˊ子ㄗˇ白ㄅㄛˊ佛ㄈㄛˊ言ㄧㄢˊ：「世ㄕˋ尊ㄗㄨㄣ！我ㄨㄛˇ當ㄉㄤ誓ㄕˋ於ㄩˊ像ㄒㄧㄤˋ法ㄈㄚˇ轉ㄓㄨㄢˇ時ㄕˊ，以ㄧˇ種ㄓㄨㄥˇ種ㄓㄨㄥˇ方ㄈㄤ便ㄅㄧㄢˋ，令ㄌㄧㄥˋ諸ㄓㄨ淨ㄐㄧㄥˋ信ㄒㄧㄣˋ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ、善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ等ㄉㄥˇ，得ㄉㄜˊ聞ㄨㄣˊ世ㄕˋ尊ㄗㄨㄣ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ名ㄇㄧㄥˊ號ㄏㄠˋ，乃ㄋㄞˇ至ㄓˋ睡ㄕㄨㄟˋ中ㄓㄨㄥ，亦ㄧˋ以ㄧˇ佛ㄈㄛˊ名ㄇㄧㄥˊ覺ㄐㄩㄝˊ悟ㄨˋ其ㄑㄧˊ耳ㄦˇ。世ㄕˋ尊ㄗㄨㄣ！若ㄖㄨㄛˋ於ㄩˊ此ㄘˇ經ㄐㄧㄥ受ㄕㄡˋ持ㄔˊ讀ㄉㄨˊ誦ㄙㄨㄥˋ，或ㄏㄨㄛˋ復ㄈㄨˋ為ㄨㄟˋ他ㄊㄚ演ㄧㄢˇ說ㄕㄨㄛ開ㄎㄞ示ㄕˋ，若ㄖㄨㄛˋ自ㄗˋ書ㄕㄨ、若ㄖㄨㄛˋ教ㄐㄧㄠˋ人ㄖㄣˊ書ㄕㄨ，恭ㄍㄨㄥ敬ㄐㄧㄥˋ尊ㄗㄨㄣ重ㄓㄨㄥˋ。以ㄧˇ種ㄓㄨㄥˇ種ㄓㄨㄥˇ花ㄏㄨㄚ香ㄒㄧㄤ、塗ㄊㄨˊ香ㄒㄧㄤ、末ㄇㄛˋ香ㄒㄧㄤ、燒ㄕㄠ香ㄒㄧㄤ、花ㄏㄨㄚ鬘ㄇㄢˊ、瓔ㄧㄥ珞ㄌㄨㄛˋ、幡ㄈㄢ蓋ㄍㄞˋ、伎ㄐㄧˋ樂ㄩㄝˋ而ㄦˊ為ㄨㄟˊ供ㄍㄨㄥˋ養ㄧㄤˇ。以ㄧˇ五ㄨˇ色ㄙㄜˋ綵ㄘㄞˇ，作ㄗㄨㄛˋ囊ㄋㄤˊ盛ㄔㄥˊ之ㄓ，掃ㄙㄠˇ灑ㄙㄚˇ淨ㄐㄧㄥˋ處ㄔㄨˋ，敷ㄈㄨ設ㄕㄜˋ高ㄍㄠ座ㄗㄨㄛˋ而ㄦˊ用ㄩㄥˋ安ㄢ處ㄔㄨˋ。爾ㄦˇ時ㄕˊ，四ㄙˋ大ㄉㄚˋ天ㄊㄧㄢ王ㄨㄤˊ與ㄩˇ其ㄑㄧˊ眷ㄐㄩㄢˋ屬ㄕㄨˇ，及ㄐㄧˊ餘ㄩˊ無ㄨˊ量ㄌㄧㄤˋ百ㄅㄞˇ千ㄑㄧㄢ天ㄊㄧㄢ眾ㄓㄨㄥˋ，皆ㄐㄧㄝ詣ㄧˋ其ㄑㄧˊ所ㄙㄨㄛˇ，供ㄍㄨㄥˋ養ㄧㄤˇ守ㄕㄡˇ護ㄏㄨˋ。世ㄕˋ尊ㄗㄨㄣ！若ㄖㄨㄛˋ此ㄘˇ經ㄐㄧㄥ寶ㄅㄠˇ流ㄌㄧㄡˊ行ㄒㄧㄥˊ之ㄓ處ㄔㄨˋ，有ㄧㄡˇ能ㄋㄥˊ受ㄕㄡˋ持ㄔˊ，以ㄧˇ彼ㄅㄧˇ世ㄕˋ尊ㄗㄨㄣ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ本ㄅㄣˇ願ㄩㄢˋ功ㄍㄨㄥ德ㄉㄜˊ，及ㄐㄧˊ聞ㄨㄣˊ名ㄇㄧㄥˊ號ㄏㄠˋ，當ㄉㄤ知ㄓ是ㄕˋ處ㄔㄨˋ，無ㄨˊ復ㄈㄨˋ橫ㄏㄥˋ死ㄙˇ，亦ㄧˋ復ㄈㄨˋ不ㄅㄨˋ為ㄨㄟˊ諸ㄓㄨ惡ㄜˋ鬼ㄍㄨㄟˇ神ㄕㄣˊ奪ㄉㄨㄛˊ其ㄑㄧˊ精ㄐㄧㄥ氣ㄑㄧˋ。設ㄕㄜˋ已ㄧˇ奪ㄉㄨㄛˊ者ㄓㄜˇ，還ㄏㄨㄢˊ得ㄉㄜˊ如ㄖㄨˊ故ㄍㄨˋ，身ㄕㄣ心ㄒㄧㄣ安ㄢ樂ㄌㄜˋ。」\n佛ㄈㄛˊ告ㄍㄠˋ曼ㄇㄢˋ殊ㄕㄨ室ㄕˋ利ㄌㄧˋ：「如ㄖㄨˊ是ㄕˋ！如ㄖㄨˊ是ㄕˋ！如ㄖㄨˊ汝ㄖㄨˇ所ㄙㄨㄛˇ說ㄕㄨㄛ。曼ㄇㄢˋ殊ㄕㄨ室ㄕˋ利ㄌㄧˋ！若ㄖㄨㄛˋ有ㄧㄡˇ淨ㄐㄧㄥˋ信ㄒㄧㄣˋ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ、善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ等ㄉㄥˇ，欲ㄩˋ供ㄍㄨㄥˋ養ㄧㄤˇ彼ㄅㄧˇ世ㄕˋ尊ㄗㄨㄣ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ者ㄓㄜˇ，應ㄧㄥ先ㄒㄧㄢ造ㄗㄠˋ立ㄌㄧˋ彼ㄅㄧˇ佛ㄈㄛˊ形ㄒㄧㄥˊ像ㄒㄧㄤˋ，敷ㄈㄨ清ㄑㄧㄥ淨ㄐㄧㄥˋ座ㄗㄨㄛˋ而ㄦˊ安ㄢ處ㄔㄨˋ之ㄓ，散ㄙㄢˋ種ㄓㄨㄥˇ種ㄓㄨㄥˇ花ㄏㄨㄚ，燒ㄕㄠ種ㄓㄨㄥˇ種ㄓㄨㄥˇ香ㄒㄧㄤ，以ㄧˇ種ㄓㄨㄥˇ種ㄓㄨㄥˇ幢ㄔㄨㄤˊ幡ㄈㄢ莊ㄓㄨㄤ嚴ㄧㄢˊ其ㄑㄧˊ處ㄔㄨˋ。七ㄑㄧ日ㄖˋ七ㄑㄧ夜ㄧㄝˋ，受ㄕㄡˋ持ㄔˊ八ㄅㄚ分ㄈㄣˋ齋ㄓㄞ戒ㄐㄧㄝˋ，食ㄕˊ清ㄑㄧㄥ淨ㄐㄧㄥˋ食ㄕˊ，澡ㄗㄠˇ浴ㄩˋ香ㄒㄧㄤ潔ㄐㄧㄝˊ，著ㄓㄨㄛˊ清ㄑㄧㄥ淨ㄐㄧㄥˋ衣ㄧ；應ㄧㄥ生ㄕㄥ無ㄨˊ垢ㄍㄡˋ濁ㄓㄨㄛˊ心ㄒㄧㄣ、無ㄨˊ怒ㄋㄨˋ害ㄏㄞˋ心ㄒㄧㄣ，於ㄩˊ一ㄧˊ切ㄑㄧㄝˋ有ㄧㄡˇ情ㄑㄧㄥˊ，起ㄑㄧˇ利ㄌㄧˋ益ㄧˋ安ㄢ樂ㄌㄜˋ、慈ㄘˊ悲ㄅㄟ喜ㄒㄧˇ捨ㄕㄜˇ、平ㄆㄧㄥˊ等ㄉㄥˇ之ㄓ心ㄒㄧㄣ；鼓ㄍㄨˇ樂ㄩㄝˋ歌ㄍㄜ讚ㄗㄢˋ，右ㄧㄡˋ繞ㄖㄠˋ佛ㄈㄛˊ像ㄒㄧㄤˋ。復ㄈㄨˋ應ㄧㄥ念ㄋㄧㄢˋ彼ㄅㄧˇ如ㄖㄨˊ來ㄌㄞˊ本ㄅㄣˇ願ㄩㄢˋ功ㄍㄨㄥ德ㄉㄜˊ，讀ㄉㄨˊ誦ㄙㄨㄥˋ此ㄘˇ經ㄐㄧㄥ，思ㄙ惟ㄨㄟˊ其ㄑㄧˊ義ㄧˋ，演ㄧㄢˇ說ㄕㄨㄛ開ㄎㄞ示ㄕˋ，隨ㄙㄨㄟˊ所ㄙㄨㄛˇ樂ㄌㄜˋ求ㄑㄧㄡˊ，一ㄧˊ切ㄑㄧㄝˋ皆ㄐㄧㄝ遂ㄙㄨㄟˋ。求ㄑㄧㄡˊ長ㄔㄤˊ壽ㄕㄡˋ，得ㄉㄜˊ長ㄔㄤˊ壽ㄕㄡˋ；求ㄑㄧㄡˊ富ㄈㄨˋ饒ㄖㄠˊ，得ㄉㄜˊ富ㄈㄨˋ饒ㄖㄠˊ；求ㄑㄧㄡˊ官ㄍㄨㄢ位ㄨㄟˋ，得ㄉㄜˊ官ㄍㄨㄢ位ㄨㄟˋ；求ㄑㄧㄡˊ男ㄋㄢˊ女ㄋㄩˇ，得ㄉㄜˊ男ㄋㄢˊ女ㄋㄩˇ。若ㄖㄨㄛˋ復ㄈㄨˋ有ㄧㄡˇ人ㄖㄣˊ，忽ㄏㄨ得ㄉㄜˊ惡ㄜˋ夢ㄇㄥˋ，見ㄐㄧㄢˋ諸ㄓㄨ惡ㄜˋ相ㄒㄧㄤˋ，或ㄏㄨㄛˋ怪ㄍㄨㄞˋ鳥ㄋㄧㄠˇ來ㄌㄞˊ集ㄐㄧˊ，或ㄏㄨㄛˋ於ㄩˊ住ㄓㄨˋ處ㄔㄨˋ百ㄅㄞˇ怪ㄍㄨㄞˋ出ㄔㄨ現ㄒㄧㄢˋ。此ㄘˇ人ㄖㄣˊ若ㄖㄨㄛˋ以ㄧˇ眾ㄓㄨㄥˋ妙ㄇㄧㄠˋ資ㄗ具ㄐㄩˋ，恭ㄍㄨㄥ敬ㄐㄧㄥˋ供ㄍㄨㄥˋ養ㄧㄤˇ彼ㄅㄧˇ世ㄕˋ尊ㄗㄨㄣ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ者ㄓㄜˇ，惡ㄜˋ夢ㄇㄥˋ惡ㄜˋ相ㄒㄧㄤˋ，諸ㄓㄨ不ㄅㄨˋ吉ㄐㄧˊ祥ㄒㄧㄤˊ，皆ㄐㄧㄝ悉ㄒㄧ隱ㄧㄣˇ沒ㄇㄛˋ，不ㄅㄨˋ能ㄋㄥˊ為ㄨㄟˊ患ㄏㄨㄢˋ。或ㄏㄨㄛˋ有ㄧㄡˇ水ㄕㄨㄟˇ、火ㄏㄨㄛˇ、刀ㄉㄠ、毒ㄉㄨˊ、懸ㄒㄩㄢˊ險ㄒㄧㄢˇ、惡ㄜˋ象ㄒㄧㄤˋ、獅ㄕ子ㄗˇ、虎ㄏㄨˇ狼ㄌㄤˊ、熊ㄒㄩㄥˊ羆ㄆㄧ、毒ㄉㄨˊ蛇ㄕㄜˊ、惡ㄜˋ蠍ㄒㄧㄝ、蜈ㄨˊ蚣ㄍㄨㄥ、蚰ㄧㄡˊ蜒ㄧㄢˊ、蚊ㄨㄣˊ虻ㄇㄥˊ等ㄉㄥˇ怖ㄅㄨˋ，若ㄖㄨㄛˋ能ㄋㄥˊ至ㄓˋ心ㄒㄧㄣ憶ㄧˋ念ㄋㄧㄢˋ彼ㄅㄧˇ佛ㄈㄛˊ，恭ㄍㄨㄥ敬ㄐㄧㄥˋ供ㄍㄨㄥˋ養ㄧㄤˇ，一ㄧˊ切ㄑㄧㄝˋ怖ㄅㄨˋ畏ㄨㄟˋ皆ㄐㄧㄝ得ㄉㄜˊ解ㄐㄧㄝˇ脫ㄊㄨㄛ。若ㄖㄨㄛˋ他ㄊㄚ國ㄍㄨㄛˊ侵ㄑㄧㄣ擾ㄖㄠˇ，盜ㄉㄠˋ賊ㄗㄟˊ反ㄈㄢˇ亂ㄌㄨㄢˋ，憶ㄧˋ念ㄋㄧㄢˋ恭ㄍㄨㄥ敬ㄐㄧㄥˋ彼ㄅㄧˇ如ㄖㄨˊ來ㄌㄞˊ者ㄓㄜˇ，亦ㄧˋ皆ㄐㄧㄝ解ㄐㄧㄝˇ脫ㄊㄨㄛ。\n復ㄈㄨˋ次ㄘˋ，曼ㄇㄢˋ殊ㄕㄨ室ㄕˋ利ㄌㄧˋ！若ㄖㄨㄛˋ有ㄧㄡˇ淨ㄐㄧㄥˋ信ㄒㄧㄣˋ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ、善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ等ㄉㄥˇ，乃ㄋㄞˇ至ㄓˋ盡ㄐㄧㄣˋ形ㄒㄧㄥˊ不ㄅㄨˋ事ㄕˋ餘ㄩˊ天ㄊㄧㄢ，唯ㄨㄟˊ當ㄉㄤ一ㄧˋ心ㄒㄧㄣ歸ㄍㄨㄟ佛ㄈㄛˊ、法ㄈㄚˇ、僧ㄙㄥ，受ㄕㄡˋ持ㄔˊ禁ㄐㄧㄣˋ戒ㄐㄧㄝˋ，若ㄖㄨㄛˋ五ㄨˇ戒ㄐㄧㄝˋ、十ㄕˊ戒ㄐㄧㄝˋ、菩ㄆㄨˊ薩ㄙㄚˋ四ㄙˋ百ㄅㄞˇ戒ㄐㄧㄝˋ、苾ㄅㄧˋ芻ㄔㄨ二ㄦˋ百ㄅㄞˇ五ㄨˇ十ㄕˊ戒ㄐㄧㄝˋ、苾ㄅㄧˋ芻ㄔㄨ尼ㄋㄧˊ五ㄨˇ百ㄅㄞˇ戒ㄐㄧㄝˋ，於ㄩˊ所ㄙㄨㄛˇ受ㄕㄡˋ中ㄓㄨㄥ，或ㄏㄨㄛˋ有ㄧㄡˇ毀ㄏㄨㄟˇ犯ㄈㄢˋ，怖ㄅㄨˋ墮ㄉㄨㄛˋ惡ㄜˋ趣ㄑㄩˋ，若ㄖㄨㄛˋ能ㄋㄥˊ專ㄓㄨㄢ念ㄋㄧㄢˋ彼ㄅㄧˇ佛ㄈㄛˊ名ㄇㄧㄥˊ號ㄏㄠˋ，恭ㄍㄨㄥ敬ㄐㄧㄥˋ供ㄍㄨㄥˋ養ㄧㄤˇ者ㄓㄜˇ，必ㄅㄧˋ定ㄉㄧㄥˋ不ㄅㄨˋ受ㄕㄡˋ三ㄙㄢ惡ㄜˋ趣ㄑㄩˋ生ㄕㄥ。或ㄏㄨㄛˋ有ㄧㄡˇ女ㄋㄩˇ人ㄖㄣˊ，臨ㄌㄧㄣˊ當ㄉㄤ產ㄔㄢˇ時ㄕˊ，受ㄕㄡˋ於ㄩˊ極ㄐㄧˊ苦ㄎㄨˇ，若ㄖㄨㄛˋ能ㄋㄥˊ至ㄓˋ心ㄒㄧㄣ稱ㄔㄥ名ㄇㄧㄥˊ禮ㄌㄧˇ讚ㄗㄢˋ，恭ㄍㄨㄥ敬ㄐㄧㄥˋ供ㄍㄨㄥˋ養ㄧㄤˇ彼ㄅㄧˇ如ㄖㄨˊ來ㄌㄞˊ者ㄓㄜˇ，眾ㄓㄨㄥˋ苦ㄎㄨˇ皆ㄐㄧㄝ除ㄔㄨˊ；所ㄙㄨㄛˇ生ㄕㄥ之ㄓ子ㄗˇ，身ㄕㄣ分ㄈㄣˋ具ㄐㄩˋ足ㄗㄨˊ，形ㄒㄧㄥˊ色ㄙㄜˋ端ㄉㄨㄢ正ㄓㄥˋ，見ㄐㄧㄢˋ者ㄓㄜˇ歡ㄏㄨㄢ喜ㄒㄧˇ，利ㄌㄧˋ根ㄍㄣ聰ㄘㄨㄥ明ㄇㄧㄥˊ，安ㄢ穩ㄨㄣˇ少ㄕㄠˇ病ㄅㄧㄥˋ，無ㄨˊ有ㄧㄡˇ非ㄈㄟ人ㄖㄣˊ奪ㄉㄨㄛˊ其ㄑㄧˊ精ㄐㄧㄥ氣ㄑㄧˋ。」\n爾ㄦˇ時ㄕˊ，世ㄕˋ尊ㄗㄨㄣ告ㄍㄠˋ阿ㄚ難ㄋㄢˊ言ㄧㄢˊ：「如ㄖㄨˊ我ㄨㄛˇ稱ㄔㄥ揚ㄧㄤˊ彼ㄅㄧˇ世ㄕˋ尊ㄗㄨㄣ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ所ㄙㄨㄛˇ有ㄧㄡˇ功ㄍㄨㄥ德ㄉㄜˊ，此ㄘˇ是ㄕˋ諸ㄓㄨ佛ㄈㄛˊ甚ㄕㄣˋ深ㄕㄣ行ㄒㄧㄥˊ處ㄔㄨˋ，難ㄋㄢˊ可ㄎㄜˇ解ㄐㄧㄝˇ了ㄌㄧㄠˇ，汝ㄖㄨˇ為ㄨㄟˋ信ㄒㄧㄣˋ不ㄈㄡˇ？」阿ㄚ難ㄋㄢˊ白ㄅㄛˊ言ㄧㄢˊ：「大ㄉㄚˋ德ㄉㄜˊ世ㄕˋ尊ㄗㄨㄣ！我ㄨㄛˇ於ㄩˊ如ㄖㄨˊ來ㄌㄞˊ所ㄙㄨㄛˇ說ㄕㄨㄛ契ㄑㄧˋ經ㄐㄧㄥ不ㄅㄨˋ生ㄕㄥ疑ㄧˊ惑ㄏㄨㄛˋ。所ㄙㄨㄛˇ以ㄧˇ者ㄓㄜˇ何ㄏㄜˊ？一ㄧˊ切ㄑㄧㄝˋ如ㄖㄨˊ來ㄌㄞˊ身ㄕㄣ語ㄩˇ意ㄧˋ業ㄧㄝˋ，無ㄨˊ不ㄅㄨˋ清ㄑㄧㄥ淨ㄐㄧㄥˋ。世ㄕˋ尊ㄗㄨㄣ！此ㄘˇ日ㄖˋ月ㄩㄝˋ輪ㄌㄨㄣˊ可ㄎㄜˇ令ㄌㄧㄥˋ墮ㄉㄨㄛˋ落ㄌㄨㄛˋ，妙ㄇㄧㄠˋ高ㄍㄠ山ㄕㄢ王ㄨㄤˊ可ㄎㄜˇ使ㄕˇ傾ㄑㄧㄥ動ㄉㄨㄥˋ，諸ㄓㄨ佛ㄈㄛˊ所ㄙㄨㄛˇ言ㄧㄢˊ，無ㄨˊ有ㄧㄡˇ異ㄧˋ也ㄧㄝˇ。世ㄕˋ尊ㄗㄨㄣ！有ㄧㄡˇ諸ㄓㄨ眾ㄓㄨㄥˋ生ㄕㄥ，信ㄒㄧㄣˋ根ㄍㄣ不ㄅㄨˋ具ㄐㄩˋ，聞ㄨㄣˊ說ㄕㄨㄛ諸ㄓㄨ佛ㄈㄛˊ甚ㄕㄣˋ深ㄕㄣ行ㄒㄧㄥˊ處ㄔㄨˋ，作ㄗㄨㄛˋ是ㄕˋ思ㄙ惟ㄨㄟˊ：云ㄩㄣˊ何ㄏㄜˊ但ㄉㄢˋ念ㄋㄧㄢˋ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ一ㄧˋ佛ㄈㄛˊ名ㄇㄧㄥˊ號ㄏㄠˋ，便ㄅㄧㄢˋ獲ㄏㄨㄛˋ爾ㄦˇ所ㄙㄨㄛˇ功ㄍㄨㄥ德ㄉㄜˊ勝ㄕㄥˋ利ㄌㄧˋ？由ㄧㄡˊ此ㄘˇ不ㄅㄨˋ信ㄒㄧㄣˋ，反ㄈㄢˇ生ㄕㄥ誹ㄈㄟˇ謗ㄅㄤˋ，彼ㄅㄧˇ於ㄩˊ長ㄔㄤˊ夜ㄧㄝˋ，失ㄕ大ㄉㄚˋ利ㄌㄧˋ樂ㄌㄜˋ，墮ㄉㄨㄛˋ諸ㄓㄨ惡ㄜˋ趣ㄑㄩˋ，流ㄌㄧㄡˊ轉ㄓㄨㄢˇ無ㄨˊ窮ㄑㄩㄥˊ。」\n佛ㄈㄛˊ告ㄍㄠˋ阿ㄚ難ㄋㄢˊ：「是ㄕˋ諸ㄓㄨ有ㄧㄡˇ情ㄑㄧㄥˊ，若ㄖㄨㄛˋ聞ㄨㄣˊ世ㄕˋ尊ㄗㄨㄣ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ名ㄇㄧㄥˊ號ㄏㄠˋ，至ㄓˋ心ㄒㄧㄣ受ㄕㄡˋ持ㄔˊ，不ㄅㄨˋ生ㄕㄥ疑ㄧˊ惑ㄏㄨㄛˋ，墮ㄉㄨㄛˋ惡ㄜˋ趣ㄑㄩˋ者ㄓㄜˇ，無ㄨˊ有ㄧㄡˇ是ㄕˋ處ㄔㄨˋ。阿ㄚ難ㄋㄢˊ！此ㄘˇ是ㄕˋ諸ㄓㄨ佛ㄈㄛˊ甚ㄕㄣˋ深ㄕㄣ所ㄙㄨㄛˇ行ㄒㄧㄥˊ，難ㄋㄢˊ可ㄎㄜˇ信ㄒㄧㄣˋ解ㄐㄧㄝˇ，汝ㄖㄨˇ今ㄐㄧㄣ能ㄋㄥˊ受ㄕㄡˋ，當ㄉㄤ知ㄓ皆ㄐㄧㄝ是ㄕˋ如ㄖㄨˊ來ㄌㄞˊ威ㄨㄟ力ㄌㄧˋ。阿ㄚ難ㄋㄢˊ！一ㄧˊ切ㄑㄧㄝˋ聲ㄕㄥ聞ㄨㄣˊ、獨ㄉㄨˊ覺ㄐㄩㄝˊ，及ㄐㄧˊ未ㄨㄟˋ登ㄉㄥ地ㄉㄧˋ諸ㄓㄨ菩ㄆㄨˊ薩ㄙㄚˋ，等ㄉㄥˇ，皆ㄐㄧㄝ悉ㄒㄧ不ㄅㄨˋ能ㄋㄥˊ如ㄖㄨˊ實ㄕˊ信ㄒㄧㄣˋ解ㄐㄧㄝˇ，唯ㄨㄟˊ除ㄔㄨˊ一ㄧˋ生ㄕㄥ所ㄙㄨㄛˇ繫ㄒㄧˋ菩ㄆㄨˊ薩ㄙㄚˋ。阿ㄚ難ㄋㄢˊ！人ㄖㄣˊ身ㄕㄣ難ㄋㄢˊ得ㄉㄜˊ；於ㄩˊ三ㄙㄢ寶ㄅㄠˇ中ㄓㄨㄥ信ㄒㄧㄣˋ敬ㄐㄧㄥˋ尊ㄗㄨㄣ重ㄓㄨㄥˋ，亦ㄧˋ難ㄋㄢˊ可ㄎㄜˇ得ㄉㄜˊ；得ㄉㄜˊ聞ㄨㄣˊ世ㄕˋ尊ㄗㄨㄣ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ名ㄇㄧㄥˊ號ㄏㄠˋ，復ㄈㄨˋ難ㄋㄢˊ於ㄩˊ是ㄕˋ。阿ㄚ難ㄋㄢˊ！彼ㄅㄧˇ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ，無ㄨˊ量ㄌㄧㄤˋ菩ㄆㄨˊ薩ㄙㄚˋ行ㄒㄧㄥˊ、無ㄨˊ量ㄌㄧㄤˋ善ㄕㄢˋ巧ㄑㄧㄠˇ方ㄈㄤ便ㄅㄧㄢˋ、無ㄨˊ量ㄌㄧㄤˋ廣ㄍㄨㄤˇ大ㄉㄚˋ願ㄩㄢˋ，我ㄨㄛˇ若ㄖㄨㄛˋ一ㄧˊ劫ㄐㄧㄝˊ、若ㄖㄨㄛˋ一ㄧˊ劫ㄐㄧㄝˊ餘ㄩˊ，而ㄦˊ廣ㄍㄨㄤˇ說ㄕㄨㄛ者ㄓㄜˇ，劫ㄐㄧㄝˊ可ㄎㄜˇ速ㄙㄨˋ盡ㄐㄧㄣˋ，彼ㄅㄧˇ佛ㄈㄛˊ行ㄒㄧㄥˊ願ㄩㄢˋ、善ㄕㄢˋ巧ㄑㄧㄠˇ方ㄈㄤ便ㄅㄧㄢˋ，無ㄨˊ有ㄧㄡˇ盡ㄐㄧㄣˋ也ㄧㄝˇ。」\n爾ㄦˇ時ㄕˊ，眾ㄓㄨㄥˋ中ㄓㄨㄥ有ㄧㄡˇ一ㄧˋ菩ㄆㄨˊ薩ㄙㄚˋ摩ㄇㄛˊ訶ㄏㄜ薩ㄙㄚˋ，名ㄇㄧㄥˊ曰ㄩㄝ救ㄐㄧㄡˋ脫ㄊㄨㄛ，即ㄐㄧˊ從ㄘㄨㄥˊ座ㄗㄨㄛˋ起ㄑㄧˇ，偏ㄆㄧㄢ袒ㄊㄢˇ右ㄧㄡˋ肩ㄐㄧㄢ，右ㄧㄡˋ膝ㄒㄧ著ㄓㄨㄛˊ地ㄉㄧˋ，曲ㄑㄩ躬ㄍㄨㄥ合ㄏㄜˊ掌ㄓㄤˇ而ㄦˊ白ㄅㄛˊ佛ㄈㄛˊ言ㄧㄢˊ：「大ㄉㄚˋ德ㄉㄜˊ世ㄕˋ尊ㄗㄨㄣ！像ㄒㄧㄤˋ法ㄈㄚˇ轉ㄓㄨㄢˇ時ㄕˊ，有ㄧㄡˇ諸ㄓㄨ眾ㄓㄨㄥˋ生ㄕㄥ，為ㄨㄟˊ種ㄓㄨㄥˇ種ㄓㄨㄥˇ患ㄏㄨㄢˋ之ㄓ所ㄙㄨㄛˇ困ㄎㄨㄣˋ厄ㄜˋ，長ㄔㄤˊ病ㄅㄧㄥˋ羸ㄌㄟˊ瘦ㄕㄡˋ，不ㄅㄨˋ能ㄋㄥˊ飲ㄧㄣˇ食ㄕˊ，喉ㄏㄡˊ脣ㄔㄨㄣˊ乾ㄍㄢ燥ㄗㄠˋ，見ㄐㄧㄢˋ諸ㄓㄨ方ㄈㄤ暗ㄢˋ，死ㄙˇ相ㄒㄧㄤˋ現ㄒㄧㄢˋ前ㄑㄧㄢˊ，父ㄈㄨˋ母ㄇㄨˇ、親ㄑㄧㄣ屬ㄕㄨˇ、朋ㄆㄥˊ友ㄧㄡˇ、知ㄓ識ㄕˋ，啼ㄊㄧˊ泣ㄑㄧˋ圍ㄨㄟˊ繞ㄖㄠˋ。然ㄖㄢˊ彼ㄅㄧˇ自ㄗˋ身ㄕㄣ臥ㄨㄛˋ在ㄗㄞˋ本ㄅㄣˇ處ㄔㄨˋ，見ㄐㄧㄢˋ琰ㄧㄢˇ魔ㄇㄛˊ使ㄕˇ，引ㄧㄣˇ其ㄑㄧˊ神ㄕㄣˊ識ㄕˋ，至ㄓˋ於ㄩˊ琰ㄧㄢˇ魔ㄇㄛˊ法ㄈㄚˇ王ㄨㄤˊ之ㄓ前ㄑㄧㄢˊ。然ㄖㄢˊ諸ㄓㄨ有ㄧㄡˇ情ㄑㄧㄥˊ，有ㄧㄡˇ俱ㄐㄩˋ生ㄕㄥ神ㄕㄣˊ，隨ㄙㄨㄟˊ其ㄑㄧˊ所ㄙㄨㄛˇ作ㄗㄨㄛˋ，若ㄖㄨㄛˋ罪ㄗㄨㄟˋ若ㄖㄨㄛˋ福ㄈㄨˊ，皆ㄐㄧㄝ具ㄐㄩˋ書ㄕㄨ之ㄓ，盡ㄐㄧㄣˋ持ㄔˊ授ㄕㄡˋ與ㄩˇ琰ㄧㄢˇ魔ㄇㄛˊ法ㄈㄚˇ王ㄨㄤˊ。爾ㄦˇ時ㄕˊ，彼ㄅㄧˇ王ㄨㄤˊ推ㄊㄨㄟ問ㄨㄣˋ其ㄑㄧˊ人ㄖㄣˊ，算ㄙㄨㄢˋ計ㄐㄧˋ所ㄙㄨㄛˇ作ㄗㄨㄛˋ，隨ㄙㄨㄟˊ其ㄑㄧˊ罪ㄗㄨㄟˋ福ㄈㄨˊ而ㄦˊ處ㄔㄨˇ斷ㄉㄨㄢˋ之ㄓ。時ㄕˊ彼ㄅㄧˇ病ㄅㄧㄥˋ人ㄖㄣˊ親ㄑㄧㄣ屬ㄕㄨˇ、知ㄓ識ㄕˋ，若ㄖㄨㄛˋ能ㄋㄥˊ為ㄨㄟˋ彼ㄅㄧˇ，歸ㄍㄨㄟ依ㄧ世ㄕˋ尊ㄗㄨㄣ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ，請ㄑㄧㄥˇ諸ㄓㄨ眾ㄓㄨㄥˋ僧ㄙㄥ，轉ㄓㄨㄢˇ讀ㄉㄨˊ此ㄘˇ經ㄐㄧㄥ，燃ㄖㄢˊ七ㄑㄧ層ㄘㄥˊ之ㄓ燈ㄉㄥ，懸ㄒㄩㄢˊ五ㄨˇ色ㄙㄜˋ續ㄒㄩˋ命ㄇㄧㄥˋ神ㄕㄣˊ幡ㄈㄢ。或ㄏㄨㄛˋ有ㄧㄡˇ是ㄕˋ處ㄔㄨˋ，彼ㄅㄧˇ識ㄕˋ得ㄉㄜˊ還ㄏㄨㄢˊ，如ㄖㄨˊ在ㄗㄞˋ夢ㄇㄥˋ中ㄓㄨㄥ，明ㄇㄧㄥˊ了ㄌㄧㄠˇ自ㄗˋ見ㄐㄧㄢˋ。或ㄏㄨㄛˋ經ㄐㄧㄥ七ㄑㄧ日ㄖˋ、或ㄏㄨㄛˋ二ㄦˋ十ㄕˊ一ㄧ日ㄖˋ、或ㄏㄨㄛˋ三ㄙㄢ十ㄕˊ五ㄨˇ日ㄖˋ、或ㄏㄨㄛˋ四ㄙˋ十ㄕˊ九ㄐㄧㄡˇ日ㄖˋ，彼ㄅㄧˇ識ㄕˋ還ㄏㄨㄢˊ時ㄕˊ，如ㄖㄨˊ從ㄘㄨㄥˊ夢ㄇㄥˋ覺ㄐㄩㄝˊ，皆ㄐㄧㄝ自ㄗˋ憶ㄧˋ知ㄓ，善ㄕㄢˋ不ㄅㄨˋ善ㄕㄢˋ業ㄧㄝˋ，所ㄙㄨㄛˇ得ㄉㄜˊ果ㄍㄨㄛˇ報ㄅㄠˋ。由ㄧㄡˊ自ㄗˋ證ㄓㄥˋ見ㄐㄧㄢˋ業ㄧㄝˋ果ㄍㄨㄛˇ報ㄅㄠˋ故ㄍㄨˋ，乃ㄋㄞˇ至ㄓˋ命ㄇㄧㄥˋ難ㄋㄢˋ，亦ㄧˋ不ㄅㄨˋ造ㄗㄠˋ作ㄗㄨㄛˋ諸ㄓㄨ惡ㄜˋ之ㄓ業ㄧㄝˋ。是ㄕˋ故ㄍㄨˋ淨ㄐㄧㄥˋ信ㄒㄧㄣˋ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ、善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ等ㄉㄥˇ，皆ㄐㄧㄝ應ㄧㄥ受ㄕㄡˋ持ㄔˊ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ名ㄇㄧㄥˊ號ㄏㄠˋ，隨ㄙㄨㄟˊ力ㄌㄧˋ所ㄙㄨㄛˇ能ㄋㄥˊ，恭ㄍㄨㄥ敬ㄐㄧㄥˋ供ㄍㄨㄥˋ養ㄧㄤˇ。」\n爾ㄦˇ時ㄕˊ，阿ㄚ難ㄋㄢˊ問ㄨㄣˋ救ㄐㄧㄡˋ脫ㄊㄨㄛ菩ㄆㄨˊ薩ㄙㄚˋ曰ㄩㄝ：「善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ！應ㄧㄥ云ㄩㄣˊ何ㄏㄜˊ恭ㄍㄨㄥ敬ㄐㄧㄥˋ供ㄍㄨㄥˋ養ㄧㄤˇ彼ㄅㄧˇ世ㄕˋ尊ㄗㄨㄣ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ？續ㄒㄩˋ命ㄇㄧㄥˋ幡ㄈㄢ燈ㄉㄥ復ㄈㄨˋ云ㄩㄣˊ何ㄏㄜˊ造ㄗㄠˋ？」救ㄐㄧㄡˋ脫ㄊㄨㄛ菩ㄆㄨˊ薩ㄙㄚˋ言ㄧㄢˊ：「大ㄉㄚˋ德ㄉㄜˊ！若ㄖㄨㄛˋ有ㄧㄡˇ病ㄅㄧㄥˋ人ㄖㄣˊ，欲ㄩˋ脫ㄊㄨㄛ病ㄅㄧㄥˋ苦ㄎㄨˇ，當ㄉㄤ為ㄨㄟˋ其ㄑㄧˊ人ㄖㄣˊ，七ㄑㄧ日ㄖˋ七ㄑㄧ夜ㄧㄝˋ，受ㄕㄡˋ持ㄔˊ八ㄅㄚ分ㄈㄣˋ齋ㄓㄞ戒ㄐㄧㄝˋ。應ㄧㄥ以ㄧˇ飲ㄧㄣˇ食ㄕˊ及ㄐㄧˊ餘ㄩˊ資ㄗ具ㄐㄩˋ，隨ㄙㄨㄟˊ力ㄌㄧˋ所ㄙㄨㄛˇ辦ㄅㄢˋ，供ㄍㄨㄥˋ養ㄧㄤˇ苾ㄅㄧˋ芻ㄔㄨ僧ㄙㄥ；晝ㄓㄡˋ夜ㄧㄝˋ六ㄌㄧㄡˋ時ㄕˊ，禮ㄌㄧˇ拜ㄅㄞˋ行ㄒㄧㄥˊ道ㄉㄠˋ，供ㄍㄨㄥˋ養ㄧㄤˇ彼ㄅㄧˇ世ㄕˋ尊ㄗㄨㄣ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ；讀ㄉㄨˊ誦ㄙㄨㄥˋ此ㄘˇ經ㄐㄧㄥ四ㄙˋ十ㄕˊ九ㄐㄧㄡˇ遍ㄅㄧㄢˋ，燃ㄖㄢˊ四ㄙˋ十ㄕˊ九ㄐㄧㄡˇ燈ㄉㄥ；造ㄗㄠˋ彼ㄅㄧˇ如ㄖㄨˊ來ㄌㄞˊ形ㄒㄧㄥˊ像ㄒㄧㄤˋ七ㄑㄧ軀ㄑㄩ，一ㄧˊ一ㄧˊ像ㄒㄧㄤˋ前ㄑㄧㄢˊ各ㄍㄜˋ置ㄓˋ七ㄑㄧ燈ㄉㄥ，一ㄧˊ一ㄧˊ燈ㄉㄥ量ㄌㄧㄤˋ大ㄉㄚˋ如ㄖㄨˊ車ㄔㄜ輪ㄌㄨㄣˊ，乃ㄋㄞˇ至ㄓˋ四ㄙˋ十ㄕˊ九ㄐㄧㄡˇ日ㄖˋ，光ㄍㄨㄤ明ㄇㄧㄥˊ不ㄅㄨˋ絕ㄐㄩㄝˊ；造ㄗㄠˋ五ㄨˇ色ㄙㄜˋ綵ㄘㄞˇ幡ㄈㄢ，長ㄔㄤˊ四ㄙˋ十ㄕˊ九ㄐㄧㄡˇ搩ㄓㄜˊ手ㄕㄡˇ；應ㄧㄥ放ㄈㄤˋ雜ㄗㄚˊ類ㄌㄟˋ眾ㄓㄨㄥˋ生ㄕㄥ至ㄓˋ四ㄙˋ十ㄕˊ九ㄐㄧㄡˇ，可ㄎㄜˇ得ㄉㄜˊ過ㄍㄨㄛˋ度ㄉㄨˋ危ㄨㄟ厄ㄜˋ之ㄓ難ㄋㄢˋ，不ㄅㄨˋ為ㄨㄟˋ諸ㄓㄨ橫ㄏㄥˋ惡ㄜˋ鬼ㄍㄨㄟˇ所ㄙㄨㄛˇ持ㄔˊ。\n復ㄈㄨˋ次ㄘˋ，阿ㄚ難ㄋㄢˊ！若ㄖㄨㄛˋ剎ㄔㄚˋ帝ㄉㄧˋ利ㄌㄧˋ、灌ㄍㄨㄢˋ頂ㄉㄧㄥˇ王ㄨㄤˊ等ㄉㄥˇ，災ㄗㄞ難ㄋㄢˋ起ㄑㄧˇ時ㄕˊ，所ㄙㄨㄛˇ謂ㄨㄟˋ人ㄖㄣˊ眾ㄓㄨㄥˋ疾ㄐㄧˊ疫ㄧˋ難ㄋㄢˋ、他ㄊㄚ國ㄍㄨㄛˊ侵ㄑㄧㄣ逼ㄅㄧ難ㄋㄢˋ、自ㄗˋ界ㄐㄧㄝˋ叛ㄆㄢˋ逆ㄋㄧˋ難ㄋㄢˋ、星ㄒㄧㄥ宿ㄒㄧㄡˋ變ㄅㄧㄢˋ怪ㄍㄨㄞˋ難ㄋㄢˋ、日ㄖˋ月ㄩㄝˋ薄ㄅㄛˊ蝕ㄕˊ難ㄋㄢˋ、非ㄈㄟ時ㄕˊ風ㄈㄥ雨ㄩˇ難ㄋㄢˋ、過ㄍㄨㄛˋ時ㄕˊ不ㄅㄨˋ雨ㄩˇ難ㄋㄢˋ。彼ㄅㄧˇ剎ㄔㄚˋ帝ㄉㄧˋ利ㄌㄧˋ、灌ㄍㄨㄢˋ頂ㄉㄧㄥˇ王ㄨㄤˊ等ㄉㄥˇ，爾ㄦˇ時ㄕˊ應ㄧㄥ於ㄩˊ一ㄧˊ切ㄑㄧㄝˋ有ㄧㄡˇ情ㄑㄧㄥˊ，起ㄑㄧˇ慈ㄘˊ悲ㄅㄟ心ㄒㄧㄣ，赦ㄕㄜˋ諸ㄓㄨ繫ㄒㄧˋ閉ㄅㄧˋ。依ㄧ前ㄑㄧㄢˊ所ㄙㄨㄛˇ說ㄕㄨㄛ供ㄍㄨㄥˋ養ㄧㄤˇ之ㄓ法ㄈㄚˇ，供ㄍㄨㄥˋ養ㄧㄤˇ彼ㄅㄧˇ世ㄕˋ尊ㄗㄨㄣ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ。由ㄧㄡˊ此ㄘˇ善ㄕㄢˋ根ㄍㄣ，及ㄐㄧˊ彼ㄅㄧˇ如ㄖㄨˊ來ㄌㄞˊ本ㄅㄣˇ願ㄩㄢˋ力ㄌㄧˋ故ㄍㄨˋ，令ㄌㄧㄥˋ其ㄑㄧˊ國ㄍㄨㄛˊ界ㄐㄧㄝˋ，即ㄐㄧˊ得ㄉㄜˊ安ㄢ穩ㄨㄣˇ；風ㄈㄥ雨ㄩˇ順ㄕㄨㄣˋ時ㄕˊ，穀ㄍㄨˇ稼ㄐㄧㄚˋ成ㄔㄥˊ熟ㄕㄨˊ；一ㄧˊ切ㄑㄧㄝˋ有ㄧㄡˇ情ㄑㄧㄥˊ，無ㄨˊ病ㄅㄧㄥˋ歡ㄏㄨㄢ樂ㄌㄜˋ。於ㄩˊ其ㄑㄧˊ國ㄍㄨㄛˊ中ㄓㄨㄥ，無ㄨˊ有ㄧㄡˇ暴ㄅㄠˋ惡ㄜˋ藥ㄧㄠˋ叉ㄔㄚ等ㄉㄥˇ神ㄕㄣˊ，惱ㄋㄠˇ有ㄧㄡˇ情ㄑㄧㄥˊ者ㄓㄜˇ；一ㄧˊ切ㄑㄧㄝˋ惡ㄜˋ相ㄒㄧㄤˋ，皆ㄐㄧㄝ即ㄐㄧˊ隱ㄧㄣˇ沒ㄇㄛˋ；而ㄦˊ剎ㄔㄚˋ帝ㄉㄧˋ利ㄌㄧˋ、灌ㄍㄨㄢˋ頂ㄉㄧㄥˇ王ㄨㄤˊ等ㄉㄥˇ，壽ㄕㄡˋ命ㄇㄧㄥˋ色ㄙㄜˋ力ㄌㄧˋ，無ㄨˊ病ㄅㄧㄥˋ自ㄗˋ在ㄗㄞˋ，皆ㄐㄧㄝ得ㄉㄜˊ增ㄗㄥ益ㄧˋ。阿ㄚ難ㄋㄢˊ！若ㄖㄨㄛˋ帝ㄉㄧˋ后ㄏㄡˋ妃ㄈㄟ主ㄓㄨˇ、儲ㄔㄨˊ君ㄐㄩㄣ王ㄨㄤˊ子ㄗˇ、大ㄉㄚˋ臣ㄔㄣˊ輔ㄈㄨˇ相ㄒㄧㄤˋ、中ㄓㄨㄥ宮ㄍㄨㄥ綵ㄘㄞˇ女ㄋㄩˇ、百ㄅㄞˇ官ㄍㄨㄢ黎ㄌㄧˊ庶ㄕㄨˋ，為ㄨㄟˊ病ㄅㄧㄥˋ所ㄙㄨㄛˇ苦ㄎㄨˇ，及ㄐㄧˊ餘ㄩˊ厄ㄜˋ難ㄋㄢˋ，亦ㄧˋ應ㄧㄥ造ㄗㄠˋ立ㄌㄧˋ五ㄨˇ色ㄙㄜˋ神ㄕㄣˊ幡ㄈㄢ，燃ㄖㄢˊ燈ㄉㄥ續ㄒㄩˋ明ㄇㄧㄥˊ，放ㄈㄤˋ諸ㄓㄨ生ㄕㄥ命ㄇㄧㄥˋ，散ㄙㄢˋ雜ㄗㄚˊ色ㄙㄜˋ花ㄏㄨㄚ，燒ㄕㄠ眾ㄓㄨㄥˋ名ㄇㄧㄥˊ香ㄒㄧㄤ，病ㄅㄧㄥˋ得ㄉㄜˊ除ㄔㄨˊ愈ㄩˋ，眾ㄓㄨㄥˋ難ㄋㄢˋ解ㄐㄧㄝˇ脫ㄊㄨㄛ。」\n爾ㄦˇ時ㄕˊ，阿ㄚ難ㄋㄢˊ問ㄨㄣˋ救ㄐㄧㄡˋ脫ㄊㄨㄛ菩ㄆㄨˊ薩ㄙㄚˋ言ㄧㄢˊ：「善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ！云ㄩㄣˊ何ㄏㄜˊ已ㄧˇ盡ㄐㄧㄣˋ之ㄓ命ㄇㄧㄥˋ而ㄦˊ可ㄎㄜˇ增ㄗㄥ益ㄧˋ？」救ㄐㄧㄡˋ脫ㄊㄨㄛ菩ㄆㄨˊ薩ㄙㄚˋ言ㄧㄢˊ：「大ㄉㄚˋ德ㄉㄜˊ！汝ㄖㄨˇ豈ㄑㄧˇ不ㄅㄨˋ聞ㄨㄣˊ如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ有ㄧㄡˇ九ㄐㄧㄡˇ橫ㄏㄥˋ死ㄙˇ耶ㄧㄝˊ？是ㄕˋ故ㄍㄨˋ勸ㄑㄩㄢˋ造ㄗㄠˋ續ㄒㄩˋ命ㄇㄧㄥˋ幡ㄈㄢ燈ㄉㄥ，修ㄒㄧㄡ諸ㄓㄨ福ㄈㄨˊ德ㄉㄜˊ；以ㄧˇ修ㄒㄧㄡ福ㄈㄨˊ故ㄍㄨˋ，盡ㄐㄧㄣˋ其ㄑㄧˊ壽ㄕㄡˋ命ㄇㄧㄥˋ，不ㄅㄨˋ經ㄐㄧㄥ苦ㄎㄨˇ患ㄏㄨㄢˋ。」阿ㄚ難ㄋㄢˊ問ㄨㄣˋ言ㄧㄢˊ：「九ㄐㄧㄡˇ橫ㄏㄥˋ云ㄩㄣˊ何ㄏㄜˊ？」救ㄐㄧㄡˋ脫ㄊㄨㄛ菩ㄆㄨˊ薩ㄙㄚˋ言ㄧㄢˊ：「若ㄖㄨㄛˋ諸ㄓㄨ有ㄧㄡˇ情ㄑㄧㄥˊ，得ㄉㄜˊ病ㄅㄧㄥˋ雖ㄙㄨㄟ輕ㄑㄧㄥ，然ㄖㄢˊ無ㄨˊ醫ㄧ藥ㄧㄠˋ及ㄐㄧˊ看ㄎㄢˋ病ㄅㄧㄥˋ者ㄓㄜˇ；設ㄕㄜˋ得ㄉㄜˊ遇ㄩˋ醫ㄧ，授ㄕㄡˋ以ㄧˇ非ㄈㄟ藥ㄧㄠˋ，實ㄕˊ不ㄅㄨˋ應ㄧㄥ死ㄙˇ，而ㄦˊ便ㄅㄧㄢˋ橫ㄏㄥˋ死ㄙˇ；又ㄧㄡˋ信ㄒㄧㄣˋ世ㄕˋ間ㄐㄧㄢ邪ㄒㄧㄝˊ魔ㄇㄛˊ外ㄨㄞˋ道ㄉㄠˋ、妖ㄧㄠ孽ㄋㄧㄝˋ之ㄓ師ㄕ，妄ㄨㄤˋ說ㄕㄨㄛ禍ㄏㄨㄛˋ福ㄈㄨˊ，便ㄅㄧㄢˋ生ㄕㄥ恐ㄎㄨㄥˇ動ㄉㄨㄥˋ，心ㄒㄧㄣ不ㄅㄨˋ自ㄗˋ正ㄓㄥˋ，卜ㄅㄨˇ問ㄨㄣˋ覓ㄇㄧˋ禍ㄏㄨㄛˋ，殺ㄕㄚ種ㄓㄨㄥˇ種ㄓㄨㄥˇ眾ㄓㄨㄥˋ生ㄕㄥ，解ㄐㄧㄝˇ奏ㄗㄡˋ神ㄕㄣˊ明ㄇㄧㄥˊ，呼ㄏㄨ諸ㄓㄨ魍ㄨㄤˇ魎ㄌㄧㄤˇ，請ㄑㄧㄥˇ乞ㄑㄧˇ福ㄈㄨˊ祐ㄧㄡˋ，欲ㄩˋ冀ㄐㄧˋ延ㄧㄢˊ年ㄋㄧㄢˊ，終ㄓㄨㄥ不ㄅㄨˋ能ㄋㄥˊ得ㄉㄜˊ；愚ㄩˊ癡ㄔ迷ㄇㄧˊ惑ㄏㄨㄛˋ，信ㄒㄧㄣˋ邪ㄒㄧㄝˊ倒ㄉㄠˇ見ㄐㄧㄢˋ，遂ㄙㄨㄟˋ令ㄌㄧㄥˋ橫ㄏㄥˋ死ㄙˇ，入ㄖㄨˋ於ㄩˊ地ㄉㄧˋ獄ㄩˋ，無ㄨˊ有ㄧㄡˇ出ㄔㄨ期ㄑㄧˊ，是ㄕˋ名ㄇㄧㄥˊ初ㄔㄨ橫ㄏㄥˋ。二ㄦˋ者ㄓㄜˇ、橫ㄏㄥˋ被ㄅㄟˋ王ㄨㄤˊ法ㄈㄚˇ之ㄓ所ㄙㄨㄛˇ誅ㄓㄨ戮ㄌㄨˋ。三ㄙㄢ者ㄓㄜˇ、畋ㄊㄧㄢˊ獵ㄌㄧㄝˋ嬉ㄒㄧ戲ㄒㄧˋ、耽ㄉㄢ婬ㄧㄣˊ嗜ㄕˋ酒ㄐㄧㄡˇ、放ㄈㄤˋ逸ㄧˋ無ㄨˊ度ㄉㄨˋ，橫ㄏㄥˋ為ㄨㄟˊ非ㄈㄟ人ㄖㄣˊ奪ㄉㄨㄛˊ其ㄑㄧˊ精ㄐㄧㄥ氣ㄑㄧˋ。四ㄙˋ者ㄓㄜˇ、橫ㄏㄥˋ為ㄨㄟˊ火ㄏㄨㄛˇ焚ㄈㄣˊ。五ㄨˇ者ㄓㄜˇ、橫ㄏㄥˋ為ㄨㄟˊ水ㄕㄨㄟˇ溺ㄋㄧˋ。六ㄌㄧㄡˋ者ㄓㄜˇ、橫ㄏㄥˋ為ㄨㄟˊ種ㄓㄨㄥˇ種ㄓㄨㄥˇ惡ㄜˋ獸ㄕㄡˋ所ㄙㄨㄛˇ噉ㄉㄢˋ。七ㄑㄧ者ㄓㄜˇ、橫ㄏㄥˋ墮ㄉㄨㄛˋ山ㄕㄢ崖ㄧㄞˊ。八ㄅㄚ者ㄓㄜˇ、橫ㄏㄥˋ為ㄨㄟˊ毒ㄉㄨˊ藥ㄧㄠˋ、厭ㄧㄢˋ禱ㄉㄠˇ、咒ㄓㄡˋ詛ㄗㄨˇ、起ㄑㄧˇ屍ㄕ鬼ㄍㄨㄟˇ等ㄉㄥˇ之ㄓ所ㄙㄨㄛˇ中ㄓㄨㄥˋ害ㄏㄞˋ。九ㄐㄧㄡˇ者ㄓㄜˇ、飢ㄐㄧ渴ㄎㄜˇ所ㄙㄨㄛˇ困ㄎㄨㄣˋ，不ㄅㄨˋ得ㄉㄜˊ飲ㄧㄣˇ食ㄕˊ，而ㄦˊ便ㄅㄧㄢˋ橫ㄏㄥˋ死ㄙˇ。是ㄕˋ為ㄨㄟˊ如ㄖㄨˊ來ㄌㄞˊ略ㄌㄩㄝˋ說ㄕㄨㄛ橫ㄏㄥˋ死ㄙˇ，有ㄧㄡˇ此ㄘˇ九ㄐㄧㄡˇ種ㄓㄨㄥˇ。其ㄑㄧˊ餘ㄩˊ復ㄈㄨˋ有ㄧㄡˇ無ㄨˊ量ㄌㄧㄤˋ諸ㄓㄨ橫ㄏㄥˋ，難ㄋㄢˊ可ㄎㄜˇ具ㄐㄩˋ說ㄕㄨㄛ。\n復ㄈㄨˋ次ㄘˋ，阿ㄚ難ㄋㄢˊ！彼ㄅㄧˇ琰ㄧㄢˇ魔ㄇㄛˊ王ㄨㄤˊ，主ㄓㄨˇ領ㄌㄧㄥˇ世ㄕˋ間ㄐㄧㄢ名ㄇㄧㄥˊ籍ㄐㄧˊ之ㄓ記ㄐㄧˋ，若ㄖㄨㄛˋ諸ㄓㄨ有ㄧㄡˇ情ㄑㄧㄥˊ，不ㄅㄨˋ孝ㄒㄧㄠˋ五ㄨˇ逆ㄋㄧˋ、破ㄆㄛˋ辱ㄖㄨˋ三ㄙㄢ寶ㄅㄠˇ、壞ㄏㄨㄞˋ君ㄐㄩㄣ臣ㄔㄣˊ法ㄈㄚˇ、毀ㄏㄨㄟˇ於ㄩˊ信ㄒㄧㄣˋ戒ㄐㄧㄝˋ，琰ㄧㄢˇ魔ㄇㄛˊ法ㄈㄚˇ王ㄨㄤˊ隨ㄙㄨㄟˊ罪ㄗㄨㄟˋ輕ㄑㄧㄥ重ㄓㄨㄥˋ，考ㄎㄠˇ而ㄦˊ罰ㄈㄚˊ之ㄓ。是ㄕˋ故ㄍㄨˋ我ㄨㄛˇ今ㄐㄧㄣ勸ㄑㄩㄢˋ諸ㄓㄨ有ㄧㄡˇ情ㄑㄧㄥˊ，燃ㄖㄢˊ燈ㄉㄥ造ㄗㄠˋ幡ㄈㄢ，放ㄈㄤˋ生ㄕㄥ修ㄒㄧㄡ福ㄈㄨˊ，令ㄌㄧㄥˋ度ㄉㄨˋ苦ㄎㄨˇ厄ㄜˋ，不ㄅㄨˋ遭ㄗㄠ眾ㄓㄨㄥˋ難ㄋㄢˋ。」\n爾ㄦˇ時ㄕˊ，眾ㄓㄨㄥˋ中ㄓㄨㄥ有ㄧㄡˇ十ㄕˊ二ㄦˋ藥ㄧㄠˋ叉ㄔㄚ大ㄉㄚˋ將ㄐㄧㄤˋ，俱ㄐㄩˋ在ㄗㄞˋ會ㄏㄨㄟˋ坐ㄗㄨㄛˋ，所ㄙㄨㄛˇ謂ㄨㄟˋ：宮ㄍㄨㄥ毗ㄆㄧˊ羅ㄌㄨㄛˊ大ㄉㄚˋ將ㄐㄧㄤˋ、伐ㄈㄚˊ折ㄓㄜˊ羅ㄌㄨㄛˊ大ㄉㄚˋ將ㄐㄧㄤˋ、迷ㄇㄧˊ企ㄑㄧˇ羅ㄌㄨㄛˊ大ㄉㄚˋ將ㄐㄧㄤˋ、安ㄢ底ㄉㄧˇ羅ㄌㄨㄛˊ大ㄉㄚˋ將ㄐㄧㄤˋ、頞ㄜˋ儞ㄋㄧˇ羅ㄌㄨㄛˊ大ㄉㄚˋ將ㄐㄧㄤˋ、珊ㄕㄢ底ㄉㄧˇ羅ㄌㄨㄛˊ大ㄉㄚˋ將ㄐㄧㄤˋ、因ㄧㄣ達ㄉㄚˊ羅ㄌㄨㄛˊ大ㄉㄚˋ將ㄐㄧㄤˋ、波ㄅㄛ夷ㄧˊ羅ㄌㄨㄛˊ大ㄉㄚˋ將ㄐㄧㄤˋ、摩ㄇㄛˊ虎ㄏㄨˇ羅ㄌㄨㄛˊ大ㄉㄚˋ將ㄐㄧㄤˋ、真ㄓㄣ達ㄉㄚˊ羅ㄌㄨㄛˊ大ㄉㄚˋ將ㄐㄧㄤˋ、招ㄓㄠ杜ㄉㄨˋ羅ㄌㄨㄛˊ大ㄉㄚˋ將ㄐㄧㄤˋ、毗ㄆㄧˊ羯ㄐㄧㄝˊ羅ㄌㄨㄛˊ大ㄉㄚˋ將ㄐㄧㄤˋ。此ㄘˇ十ㄕˊ二ㄦˋ藥ㄧㄠˋ叉ㄔㄚ大ㄉㄚˋ將ㄐㄧㄤˋ，一ㄧˊ一ㄧˊ各ㄍㄜˋ有ㄧㄡˇ七ㄑㄧ千ㄑㄧㄢ藥ㄧㄠˋ叉ㄔㄚ以ㄧˇ為ㄨㄟˊ眷ㄐㄩㄢˋ屬ㄕㄨˇ，同ㄊㄨㄥˊ時ㄕˊ舉ㄐㄩˇ聲ㄕㄥ白ㄅㄛˊ佛ㄈㄛˊ言ㄧㄢˊ：「世ㄕˋ尊ㄗㄨㄣ！我ㄨㄛˇ等ㄉㄥˇ今ㄐㄧㄣ者ㄓㄜˇ，蒙ㄇㄥˊ佛ㄈㄛˊ威ㄨㄟ力ㄌㄧˋ，得ㄉㄜˊ聞ㄨㄣˊ世ㄕˋ尊ㄗㄨㄣ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ名ㄇㄧㄥˊ號ㄏㄠˋ，不ㄅㄨˋ復ㄈㄨˋ更ㄍㄥˋ有ㄧㄡˇ惡ㄜˋ趣ㄑㄩˋ之ㄓ怖ㄅㄨˋ。我ㄨㄛˇ等ㄉㄥˇ相ㄒㄧㄤ率ㄕㄨㄞˋ，皆ㄐㄧㄝ同ㄊㄨㄥˊ一ㄧˋ心ㄒㄧㄣ，乃ㄋㄞˇ至ㄓˋ盡ㄐㄧㄣˋ形ㄒㄧㄥˊ，歸ㄍㄨㄟ佛ㄈㄛˊ、法ㄈㄚˇ、僧ㄙㄥ，誓ㄕˋ當ㄉㄤ荷ㄏㄜˋ負ㄈㄨˋ一ㄧˊ切ㄑㄧㄝˋ有ㄧㄡˇ情ㄑㄧㄥˊ，為ㄨㄟˋ作ㄗㄨㄛˋ義ㄧˋ利ㄌㄧˋ，饒ㄖㄠˊ益ㄧˋ安ㄢ樂ㄌㄜˋ。隨ㄙㄨㄟˊ於ㄩˊ何ㄏㄜˊ等ㄉㄥˇ，村ㄘㄨㄣ城ㄔㄥˊ國ㄍㄨㄛˊ邑ㄧˋ，空ㄎㄨㄥ閑ㄒㄧㄢˊ林ㄌㄧㄣˊ中ㄓㄨㄥ，若ㄖㄨㄛˋ有ㄧㄡˇ流ㄌㄧㄡˊ布ㄅㄨˋ此ㄘˇ經ㄐㄧㄥ，或ㄏㄨㄛˋ復ㄈㄨˋ受ㄕㄡˋ持ㄔˊ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ名ㄇㄧㄥˊ號ㄏㄠˋ，恭ㄍㄨㄥ敬ㄐㄧㄥˋ供ㄍㄨㄥˋ養ㄧㄤˇ者ㄓㄜˇ，我ㄨㄛˇ等ㄉㄥˇ眷ㄐㄩㄢˋ屬ㄕㄨˇ衛ㄨㄟˋ護ㄏㄨˋ是ㄕˋ人ㄖㄣˊ，皆ㄐㄧㄝ使ㄕˇ解ㄐㄧㄝˇ脫ㄊㄨㄛ一ㄧˊ切ㄑㄧㄝˋ苦ㄎㄨˇ難ㄋㄢˋ；諸ㄓㄨ有ㄧㄡˇ願ㄩㄢˋ求ㄑㄧㄡˊ，悉ㄒㄧ令ㄌㄧㄥˋ滿ㄇㄢˇ足ㄗㄨˊ；或ㄏㄨㄛˋ有ㄧㄡˇ疾ㄐㄧˊ厄ㄜˋ，求ㄑㄧㄡˊ度ㄉㄨˋ脫ㄊㄨㄛ者ㄓㄜˇ，亦ㄧˋ應ㄧㄥ讀ㄉㄨˊ誦ㄙㄨㄥˋ此ㄘˇ經ㄐㄧㄥ，以ㄧˇ五ㄨˇ色ㄙㄜˋ縷ㄌㄩˇ，結ㄐㄧㄝˊ我ㄨㄛˇ名ㄇㄧㄥˊ字ㄗˋ，得ㄉㄜˊ如ㄖㄨˊ願ㄩㄢˋ已ㄧˇ，然ㄖㄢˊ後ㄏㄡˋ解ㄐㄧㄝˇ結ㄐㄧㄝˊ。」\n爾ㄦˇ時ㄕˊ，世ㄕˋ尊ㄗㄨㄣ讚ㄗㄢˋ諸ㄓㄨ藥ㄧㄠˋ叉ㄔㄚ大ㄉㄚˋ將ㄐㄧㄤˋ言ㄧㄢˊ：「善ㄕㄢˋ哉ㄗㄞ！善ㄕㄢˋ哉ㄗㄞ！大ㄉㄚˋ藥ㄧㄠˋ叉ㄔㄚ將ㄐㄧㄤˋ！汝ㄖㄨˇ等ㄉㄥˇ念ㄋㄧㄢˋ報ㄅㄠˋ世ㄕˋ尊ㄗㄨㄣ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ恩ㄣ德ㄉㄜˊ者ㄓㄜˇ，常ㄔㄤˊ應ㄧㄥ如ㄖㄨˊ是ㄕˋ利ㄌㄧˋ益ㄧˋ安ㄢ樂ㄌㄜˋ一ㄧˊ切ㄑㄧㄝˋ有ㄧㄡˇ情ㄑㄧㄥˊ。」\n爾ㄦˇ時ㄕˊ，阿ㄚ難ㄋㄢˊ白ㄅㄛˊ佛ㄈㄛˊ言ㄧㄢˊ：「世ㄕˋ尊ㄗㄨㄣ！當ㄉㄤ何ㄏㄜˊ名ㄇㄧㄥˊ此ㄘˇ法ㄈㄚˇ門ㄇㄣˊ？我ㄨㄛˇ等ㄉㄥˇ云ㄩㄣˊ何ㄏㄜˊ奉ㄈㄥˋ持ㄔˊ？」佛ㄈㄛˊ告ㄍㄠˋ阿ㄚ難ㄋㄢˊ：「此ㄘˇ法ㄈㄚˇ門ㄇㄣˊ名ㄇㄧㄥˊ說ㄕㄨㄛ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ本ㄅㄣˇ願ㄩㄢˋ功ㄍㄨㄥ德ㄉㄜˊ，亦ㄧˋ名ㄇㄧㄥˊ說ㄕㄨㄛ十ㄕˊ二ㄦˋ神ㄕㄣˊ將ㄐㄧㄤˋ饒ㄖㄠˊ益ㄧˋ有ㄧㄡˇ情ㄑㄧㄥˊ結ㄐㄧㄝˊ願ㄩㄢˋ神ㄕㄣˊ咒ㄓㄡˋ，亦ㄧˋ名ㄇㄧㄥˊ拔ㄅㄚˊ除ㄔㄨˊ一ㄧˊ切ㄑㄧㄝˋ業ㄧㄝˋ障ㄓㄤˋ。應ㄧㄥ如ㄖㄨˊ是ㄕˋ持ㄔˊ。」\n時ㄕˊ，薄ㄅㄛˊ伽ㄑㄧㄝˊ梵ㄈㄢˋ說ㄕㄨㄛ是ㄕˋ語ㄩˇ已ㄧˇ，諸ㄓㄨ菩ㄆㄨˊ薩ㄙㄚˋ摩ㄇㄛˊ訶ㄏㄜ薩ㄙㄚˋ，及ㄐㄧˊ大ㄉㄚˋ聲ㄕㄥ聞ㄨㄣˊ、國ㄍㄨㄛˊ王ㄨㄤˊ、大ㄉㄚˋ臣ㄔㄣˊ、婆ㄆㄛˊ羅ㄌㄨㄛˊ門ㄇㄣˊ、居ㄐㄩ士ㄕˋ、天ㄊㄧㄢ龍ㄌㄨㄥˊ、藥ㄧㄠˋ叉ㄔㄚ、犍ㄑㄧㄢˊ達ㄉㄚˊ縛ㄈㄨˊ、阿ㄚ素ㄙㄨˋ洛ㄌㄨㄛˋ、揭ㄐㄧㄝˊ路ㄌㄨˋ荼ㄊㄨˊ、緊ㄐㄧㄣˇ捺ㄋㄚˋ洛ㄌㄨㄛˋ、莫ㄇㄛˋ呼ㄏㄨ洛ㄌㄨㄛˋ伽ㄑㄧㄝˊ、人ㄖㄣˊ、非ㄈㄟ人ㄖㄣˊ等ㄉㄥˇ，一ㄧˊ切ㄑㄧㄝˋ大ㄉㄚˋ眾ㄓㄨㄥˋ，聞ㄨㄣˊ佛ㄈㄛˊ所ㄙㄨㄛˇ說ㄕㄨㄛ，皆ㄐㄧㄝ大ㄉㄚˋ歡ㄏㄨㄢ喜ㄒㄧˇ，信ㄒㄧㄣˋ受ㄕㄡˋ奉ㄈㄥˋ行ㄒㄧㄥˊ。','《藥師琉璃光如來本願功德經》簡稱《藥師經》，玄奘法師譯。經中說藥師佛的十二大願，以及稱念名號、受持供養所得的功德，常為祈求消災延壽、病苦消除、遠離橫禍而持誦。注音由使用者提供的圖片逐頁辨識整理，請以您慣用的版本核對。','曼殊室利菩薩請佛宣說諸佛名號與本願功德。佛說東方過十殑伽沙佛土，有淨琉璃世界，佛號藥師琉璃光如來；本行菩薩道時發十二大願，要使眾生身相莊嚴、身心清淨、資用無缺、安住正道、持戒清淨、諸根完具、病苦消除、轉女成男、遠離邪見、免於刑戮、飲食充足、衣服滿願。又說彼佛國土清淨莊嚴，有日光、月光二大菩薩為上首。佛勸有情受持名號、供養讀誦，並說明病苦、橫死、持咒、燃燈續命等法門，十二藥叉大將也發願守護受持者。最後佛說此經名為「說藥師琉璃光如來本願功德」，大眾歡喜信受奉行。（白話大意）'),
  mk('s_jingang','金剛般若波羅蜜經','經','本師釋迦牟尼佛','以般若智慧破除執著、消業增福','般若類','姚秦・鳩摩羅什譯',['智慧開悟','消業障','增長福慧'],1,1800,'如ㄖㄨˊ是ㄕˋ我ㄨㄛˇ聞ㄨㄣˊ：\n一ㄧˋ時ㄕˊ，佛ㄈㄛˊ在ㄗㄞˋ舍ㄕㄜˋ衛ㄨㄟˋ國ㄍㄨㄛˊ祇ㄑㄧˊ樹ㄕㄨˋ給ㄐㄧˇ孤ㄍㄨ獨ㄉㄨˊ園ㄩㄢˊ，與ㄩˇ大ㄉㄚˋ比ㄅㄧˇ丘ㄑㄧㄡ眾ㄓㄨㄥˋ千ㄑㄧㄢ二ㄦˋ百ㄅㄞˇ五ㄨˇ十ㄕˊ人ㄖㄣˊ俱ㄐㄩ。\n爾ㄦˇ時ㄕˊ，世ㄕˋ尊ㄗㄨㄣ食ㄕˋ時ㄕˊ，著ㄓㄨㄛˊ衣ㄧ持ㄔˊ缽ㄅㄛ，入ㄖㄨˋ舍ㄕㄜˋ衛ㄨㄟˋ大ㄉㄚˋ城ㄔㄥˊ乞ㄑㄧˇ食ㄕˋ，於ㄩˊ其ㄑㄧˊ城ㄔㄥˊ中ㄓㄨㄥ，次ㄘˋ第ㄉㄧˋ乞ㄑㄧˇ已ㄧˇ，還ㄏㄨㄢˊ至ㄓˋ本ㄅㄣˇ處ㄔㄨˋ，飯ㄈㄢˋ食ㄕˋ訖ㄑㄧˋ，收ㄕㄡ衣ㄧ缽ㄅㄛ，洗ㄒㄧˇ足ㄗㄨˊ已ㄧˇ，敷ㄈㄨ座ㄗㄨㄛˋ而ㄦˊ坐ㄗㄨㄛˋ。\n時ㄕˊ，長ㄓㄤˇ老ㄌㄠˇ須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ在ㄗㄞˋ大ㄉㄚˋ眾ㄓㄨㄥˋ中ㄓㄨㄥ，即ㄐㄧˊ從ㄘㄨㄥˊ座ㄗㄨㄛˋ起ㄑㄧˇ，偏ㄆㄧㄢ袒ㄊㄢˇ右ㄧㄡˋ肩ㄐㄧㄢ，右ㄧㄡˋ膝ㄒㄧ著ㄓㄨㄛˊ地ㄉㄧˋ，合ㄏㄜˊ掌ㄓㄤˇ恭ㄍㄨㄥ敬ㄐㄧㄥˋ，而ㄦˊ白ㄅㄛˊ佛ㄈㄛˊ言ㄧㄢˊ：「希ㄒㄧ有ㄧㄡˇ，世ㄕˋ尊ㄗㄨㄣ，如ㄖㄨˊ來ㄌㄞˊ善ㄕㄢˋ護ㄏㄨˋ念ㄋㄧㄢˋ諸ㄓㄨ菩ㄆㄨˊ薩ㄙㄚˋ，善ㄕㄢˋ付ㄈㄨˋ囑ㄓㄨˇ諸ㄓㄨ菩ㄆㄨˊ薩ㄙㄚˋ。世ㄕˋ尊ㄗㄨㄣ，善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ、善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ，發ㄈㄚ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ心ㄒㄧㄣ，應ㄧㄥ云ㄩㄣˊ何ㄏㄜˊ住ㄓㄨˋ，云ㄩㄣˊ何ㄏㄜˊ降ㄒㄧㄤˊ伏ㄈㄨˊ其ㄑㄧˊ心ㄒㄧㄣ。」\n佛ㄈㄛˊ言ㄧㄢˊ：「善ㄕㄢˋ哉ㄗㄞ，善ㄕㄢˋ哉ㄗㄞ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，如ㄖㄨˊ汝ㄖㄨˇ所ㄙㄨㄛˇ說ㄕㄨㄛ：如ㄖㄨˊ來ㄌㄞˊ善ㄕㄢˋ護ㄏㄨˋ念ㄋㄧㄢˋ諸ㄓㄨ菩ㄆㄨˊ薩ㄙㄚˋ，善ㄕㄢˋ付ㄈㄨˋ囑ㄓㄨˇ諸ㄓㄨ菩ㄆㄨˊ薩ㄙㄚˋ。汝ㄖㄨˇ今ㄐㄧㄣ諦ㄉㄧˋ聽ㄊㄧㄥ，當ㄉㄤ為ㄨㄟˋ汝ㄖㄨˇ說ㄕㄨㄛ：善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ、善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ，發ㄈㄚ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ心ㄒㄧㄣ，應ㄧㄥ如ㄖㄨˊ是ㄕˋ住ㄓㄨˋ，如ㄖㄨˊ是ㄕˋ降ㄒㄧㄤˊ伏ㄈㄨˊ其ㄑㄧˊ心ㄒㄧㄣ。」\n「唯ㄨㄟˇ然ㄖㄢˊ，世ㄕˋ尊ㄗㄨㄣ，願ㄩㄢˋ樂ㄧㄠˋ欲ㄩˋ聞ㄨㄣˊ。」\n佛ㄈㄛˊ告ㄍㄠˋ須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ：「諸ㄓㄨ菩ㄆㄨˊ薩ㄙㄚˋ摩ㄇㄛˊ訶ㄏㄜ薩ㄙㄚˋ應ㄧㄥ如ㄖㄨˊ是ㄕˋ降ㄒㄧㄤˊ伏ㄈㄨˊ其ㄑㄧˊ心ㄒㄧㄣ：所ㄙㄨㄛˇ有ㄧㄡˇ一ㄧˊ切ㄑㄧㄝˋ眾ㄓㄨㄥˋ生ㄕㄥ之ㄓ類ㄌㄟˋ：若ㄖㄨㄛˋ卵ㄌㄨㄢˇ生ㄕㄥ，若ㄖㄨㄛˋ胎ㄊㄞ生ㄕㄥ，若ㄖㄨㄛˋ濕ㄕ生ㄕㄥ，若ㄖㄨㄛˋ化ㄏㄨㄚˋ生ㄕㄥ，若ㄖㄨㄛˋ有ㄧㄡˇ色ㄙㄜˋ，若ㄖㄨㄛˋ無ㄨˊ色ㄙㄜˋ，若ㄖㄨㄛˋ有ㄧㄡˇ想ㄒㄧㄤˇ，若ㄖㄨㄛˋ無ㄨˊ想ㄒㄧㄤˇ，若ㄖㄨㄛˋ非ㄈㄟ有ㄧㄡˇ想ㄒㄧㄤˇ非ㄈㄟ無ㄨˊ想ㄒㄧㄤˇ，我ㄨㄛˇ皆ㄐㄧㄝ令ㄌㄧㄥˋ入ㄖㄨˋ無ㄨˊ餘ㄩˊ涅ㄋㄧㄝˋ槃ㄆㄢˊ而ㄦˊ滅ㄇㄧㄝˋ度ㄉㄨˋ之ㄓ。如ㄖㄨˊ是ㄕˋ滅ㄇㄧㄝˋ度ㄉㄨˋ無ㄨˊ量ㄌㄧㄤˋ無ㄨˊ數ㄕㄨˋ無ㄨˊ邊ㄅㄧㄢ眾ㄓㄨㄥˋ生ㄕㄥ，實ㄕˊ無ㄨˊ眾ㄓㄨㄥˋ生ㄕㄥ得ㄉㄜˊ滅ㄇㄧㄝˋ度ㄉㄨˋ者ㄓㄜˇ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，若ㄖㄨㄛˋ菩ㄆㄨˊ薩ㄙㄚˋ有ㄧㄡˇ我ㄨㄛˇ相ㄒㄧㄤˋ、人ㄖㄣˊ相ㄒㄧㄤˋ、眾ㄓㄨㄥˋ生ㄕㄥ相ㄒㄧㄤˋ、壽ㄕㄡˋ者ㄓㄜˇ相ㄒㄧㄤˋ，即ㄐㄧˊ非ㄈㄟ菩ㄆㄨˊ薩ㄙㄚˋ。」\n「復ㄈㄨˋ次ㄘˋ，須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，菩ㄆㄨˊ薩ㄙㄚˋ於ㄩˊ法ㄈㄚˇ，應ㄧㄥ無ㄨˊ所ㄙㄨㄛˇ住ㄓㄨˋ行ㄒㄧㄥˊ於ㄩˊ布ㄅㄨˋ施ㄕˋ，所ㄙㄨㄛˇ謂ㄨㄟˋ不ㄅㄨˋ住ㄓㄨˋ色ㄙㄜˋ布ㄅㄨˋ施ㄕˋ，不ㄅㄨˋ住ㄓㄨˋ聲ㄕㄥ、香ㄒㄧㄤ、味ㄨㄟˋ、觸ㄔㄨˋ、法ㄈㄚˇ布ㄅㄨˋ施ㄕˋ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，菩ㄆㄨˊ薩ㄙㄚˋ應ㄧㄥ如ㄖㄨˊ是ㄕˋ布ㄅㄨˋ施ㄕˋ，不ㄅㄨˋ住ㄓㄨˋ於ㄩˊ相ㄒㄧㄤˋ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，若ㄖㄨㄛˋ菩ㄆㄨˊ薩ㄙㄚˋ不ㄅㄨˋ住ㄓㄨˋ相ㄒㄧㄤˋ布ㄅㄨˋ施ㄕˋ，其ㄑㄧˊ福ㄈㄨˊ德ㄉㄜˊ不ㄅㄨˋ可ㄎㄜˇ思ㄙ量ㄌㄧㄤˋ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，東ㄉㄨㄥ方ㄈㄤ虛ㄒㄩ空ㄎㄨㄥ可ㄎㄜˇ思ㄙ量ㄌㄧㄤˋ不ㄈㄡˇ？」\n「不ㄈㄡˇ也ㄧㄝˇ，世ㄕˋ尊ㄗㄨㄣ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，南ㄋㄢˊ西ㄒㄧ北ㄅㄟˇ方ㄈㄤ四ㄙˋ維ㄨㄟˊ上ㄕㄤˋ下ㄒㄧㄚˋ虛ㄒㄩ空ㄎㄨㄥ可ㄎㄜˇ思ㄙ量ㄌㄧㄤˋ不ㄈㄡˇ？」\n「不ㄈㄡˇ也ㄧㄝˇ，世ㄕˋ尊ㄗㄨㄣ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，菩ㄆㄨˊ薩ㄙㄚˋ無ㄨˊ住ㄓㄨˋ相ㄒㄧㄤˋ布ㄅㄨˋ施ㄕˋ，福ㄈㄨˊ德ㄉㄜˊ亦ㄧˋ復ㄈㄨˋ如ㄖㄨˊ是ㄕˋ不ㄅㄨˋ可ㄎㄜˇ思ㄙ量ㄌㄧㄤˋ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，菩ㄆㄨˊ薩ㄙㄚˋ但ㄉㄢˋ應ㄧㄥ如ㄖㄨˊ所ㄙㄨㄛˇ教ㄐㄧㄠˋ住ㄓㄨˋ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，可ㄎㄜˇ以ㄧˇ身ㄕㄣ相ㄒㄧㄤˋ見ㄐㄧㄢˋ如ㄖㄨˊ來ㄌㄞˊ不ㄈㄡˇ？」\n「不ㄈㄡˇ也ㄧㄝˇ，世ㄕˋ尊ㄗㄨㄣ，不ㄅㄨˋ可ㄎㄜˇ以ㄧˇ身ㄕㄣ相ㄒㄧㄤˋ得ㄉㄜˊ見ㄐㄧㄢˋ如ㄖㄨˊ來ㄌㄞˊ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，如ㄖㄨˊ來ㄌㄞˊ所ㄙㄨㄛˇ說ㄕㄨㄛ身ㄕㄣ相ㄒㄧㄤˋ，即ㄐㄧˊ非ㄈㄟ身ㄕㄣ相ㄒㄧㄤˋ。」\n佛ㄈㄛˊ告ㄍㄠˋ須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ：「凡ㄈㄢˊ所ㄙㄨㄛˇ有ㄧㄡˇ相ㄒㄧㄤˋ，皆ㄐㄧㄝ是ㄕˋ虛ㄒㄩ妄ㄨㄤˋ。若ㄖㄨㄛˋ見ㄐㄧㄢˋ諸ㄓㄨ相ㄒㄧㄤˋ非ㄈㄟ相ㄒㄧㄤˋ，則ㄗㄜˊ見ㄐㄧㄢˋ如ㄖㄨˊ來ㄌㄞˊ。」\n須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ白ㄅㄛˊ佛ㄈㄛˊ言ㄧㄢˊ：「世ㄕˋ尊ㄗㄨㄣ，頗ㄆㄛˇ有ㄧㄡˇ眾ㄓㄨㄥˋ生ㄕㄥ，得ㄉㄜˊ聞ㄨㄣˊ如ㄖㄨˊ是ㄕˋ言ㄧㄢˊ說ㄕㄨㄛ章ㄓㄤ句ㄐㄩˋ，生ㄕㄥ實ㄕˊ信ㄒㄧㄣˋ不ㄈㄡˇ？」\n佛ㄈㄛˊ告ㄍㄠˋ須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ：「莫ㄇㄛˋ作ㄗㄨㄛˋ是ㄕˋ說ㄕㄨㄛ，如ㄖㄨˊ來ㄌㄞˊ滅ㄇㄧㄝˋ後ㄏㄡˋ，後ㄏㄡˋ五ㄨˇ百ㄅㄞˇ歲ㄙㄨㄟˋ，有ㄧㄡˇ持ㄔˊ戒ㄐㄧㄝˋ修ㄒㄧㄡ福ㄈㄨˊ者ㄓㄜˇ，於ㄩˊ此ㄘˇ章ㄓㄤ句ㄐㄩˋ，能ㄋㄥˊ生ㄕㄥ信ㄒㄧㄣˋ心ㄒㄧㄣ，以ㄧˇ此ㄘˇ為ㄨㄟˊ實ㄕˊ。當ㄉㄤ知ㄓ是ㄕˋ人ㄖㄣˊ不ㄅㄨˋ於ㄩˊ一ㄧˋ佛ㄈㄛˊ二ㄦˋ佛ㄈㄛˊ三ㄙㄢ四ㄙˋ五ㄨˇ佛ㄈㄛˊ而ㄦˊ種ㄓㄨㄥˋ善ㄕㄢˋ根ㄍㄣ，已ㄧˇ於ㄩˊ無ㄨˊ量ㄌㄧㄤˋ千ㄑㄧㄢ萬ㄨㄢˋ佛ㄈㄛˊ所ㄙㄨㄛˇ種ㄓㄨㄥˋ諸ㄓㄨ善ㄕㄢˋ根ㄍㄣ，聞ㄨㄣˊ是ㄕˋ章ㄓㄤ句ㄐㄩˋ，乃ㄋㄞˇ至ㄓˋ一ㄧˊ念ㄋㄧㄢˋ生ㄕㄥ淨ㄐㄧㄥˋ信ㄒㄧㄣˋ者ㄓㄜˇ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，如ㄖㄨˊ來ㄌㄞˊ悉ㄒㄧ知ㄓ悉ㄒㄧ見ㄐㄧㄢˋ，是ㄕˋ諸ㄓㄨ眾ㄓㄨㄥˋ生ㄕㄥ得ㄉㄜˊ如ㄖㄨˊ是ㄕˋ無ㄨˊ量ㄌㄧㄤˋ福ㄈㄨˊ德ㄉㄜˊ。」\n「何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，是ㄕˋ諸ㄓㄨ眾ㄓㄨㄥˋ生ㄕㄥ無ㄨˊ復ㄈㄨˋ我ㄨㄛˇ相ㄒㄧㄤˋ、人ㄖㄣˊ相ㄒㄧㄤˋ、眾ㄓㄨㄥˋ生ㄕㄥ相ㄒㄧㄤˋ、壽ㄕㄡˋ者ㄓㄜˇ相ㄒㄧㄤˋ，無ㄨˊ法ㄈㄚˇ相ㄒㄧㄤˋ，亦ㄧˋ無ㄨˊ非ㄈㄟ法ㄈㄚˇ相ㄒㄧㄤˋ。」\n「何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，是ㄕˋ諸ㄓㄨ眾ㄓㄨㄥˋ生ㄕㄥ若ㄖㄨㄛˋ心ㄒㄧㄣ取ㄑㄩˇ相ㄒㄧㄤˋ，則ㄗㄜˊ為ㄨㄟˊ著ㄓㄨㄛˊ我ㄨㄛˇ人ㄖㄣˊ眾ㄓㄨㄥˋ生ㄕㄥ壽ㄕㄡˋ者ㄓㄜˇ。若ㄖㄨㄛˋ取ㄑㄩˇ法ㄈㄚˇ相ㄒㄧㄤˋ，即ㄐㄧˊ著ㄓㄨㄛˊ我ㄨㄛˇ人ㄖㄣˊ眾ㄓㄨㄥˋ生ㄕㄥ壽ㄕㄡˋ者ㄓㄜˇ。」\n「何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，若ㄖㄨㄛˋ取ㄑㄩˇ非ㄈㄟ法ㄈㄚˇ相ㄒㄧㄤˋ，即ㄐㄧˊ著ㄓㄨㄛˊ我ㄨㄛˇ人ㄖㄣˊ眾ㄓㄨㄥˋ生ㄕㄥ壽ㄕㄡˋ者ㄓㄜˇ。是ㄕˋ故ㄍㄨˋ不ㄅㄨˋ應ㄧㄥ取ㄑㄩˇ法ㄈㄚˇ，不ㄅㄨˋ應ㄧㄥ取ㄑㄩˇ非ㄈㄟ法ㄈㄚˇ。以ㄧˇ是ㄕˋ義ㄧˋ故ㄍㄨˋ，如ㄖㄨˊ來ㄌㄞˊ常ㄔㄤˊ說ㄕㄨㄛ：汝ㄖㄨˇ等ㄉㄥˇ比ㄅㄧˇ丘ㄑㄧㄡ，知ㄓ我ㄨㄛˇ說ㄕㄨㄛ法ㄈㄚˇ，如ㄖㄨˊ筏ㄈㄚˊ喻ㄩˋ者ㄓㄜˇ，法ㄈㄚˇ尚ㄕㄤˋ應ㄧㄥ捨ㄕㄜˇ，何ㄏㄜˊ況ㄎㄨㄤˋ非ㄈㄟ法ㄈㄚˇ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，如ㄖㄨˊ來ㄌㄞˊ得ㄉㄜˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ耶ㄧㄝˊ，如ㄖㄨˊ來ㄌㄞˊ有ㄧㄡˇ所ㄙㄨㄛˇ說ㄕㄨㄛ法ㄈㄚˇ耶ㄧㄝˊ？」\n須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ言ㄧㄢˊ：「如ㄖㄨˊ我ㄨㄛˇ解ㄐㄧㄝˇ佛ㄈㄛˊ所ㄙㄨㄛˇ說ㄕㄨㄛ義ㄧˋ，無ㄨˊ有ㄧㄡˇ定ㄉㄧㄥˋ法ㄈㄚˇ名ㄇㄧㄥˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ，亦ㄧˋ無ㄨˊ有ㄧㄡˇ定ㄉㄧㄥˋ法ㄈㄚˇ如ㄖㄨˊ來ㄌㄞˊ可ㄎㄜˇ說ㄕㄨㄛ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，如ㄖㄨˊ來ㄌㄞˊ所ㄙㄨㄛˇ說ㄕㄨㄛ法ㄈㄚˇ，皆ㄐㄧㄝ不ㄅㄨˋ可ㄎㄜˇ取ㄑㄩˇ，不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ，非ㄈㄟ法ㄈㄚˇ、非ㄈㄟ非ㄈㄟ法ㄈㄚˇ。所ㄙㄨㄛˇ以ㄧˇ者ㄓㄜˇ何ㄏㄜˊ，一ㄧˊ切ㄑㄧㄝˋ賢ㄒㄧㄢˊ聖ㄕㄥˋ，皆ㄐㄧㄝ以ㄧˇ無ㄨˊ為ㄨㄟˊ法ㄈㄚˇ而ㄦˊ有ㄧㄡˇ差ㄔㄚ別ㄅㄧㄝˊ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，若ㄖㄨㄛˋ人ㄖㄣˊ滿ㄇㄢˇ三ㄙㄢ千ㄑㄧㄢ大ㄉㄚˋ千ㄑㄧㄢ世ㄕˋ界ㄐㄧㄝˋ七ㄑㄧ寶ㄅㄠˇ以ㄧˇ用ㄩㄥˋ布ㄅㄨˋ施ㄕˋ，是ㄕˋ人ㄖㄣˊ所ㄙㄨㄛˇ得ㄉㄜˊ福ㄈㄨˊ德ㄉㄜˊ，寧ㄋㄧㄥˊ為ㄨㄟˊ多ㄉㄨㄛ不ㄈㄡˇ？」\n須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ言ㄧㄢˊ：「甚ㄕㄣˋ多ㄉㄨㄛ，世ㄕˋ尊ㄗㄨㄣ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，是ㄕˋ福ㄈㄨˊ德ㄉㄜˊ即ㄐㄧˊ非ㄈㄟ福ㄈㄨˊ德ㄉㄜˊ性ㄒㄧㄥˋ，是ㄕˋ故ㄍㄨˋ如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ福ㄈㄨˊ德ㄉㄜˊ多ㄉㄨㄛ。」\n「若ㄖㄨㄛˋ復ㄈㄨˋ有ㄧㄡˇ人ㄖㄣˊ於ㄩˊ此ㄘˇ經ㄐㄧㄥ中ㄓㄨㄥ，受ㄕㄡˋ持ㄔˊ乃ㄋㄞˇ至ㄓˋ四ㄙˋ句ㄐㄩˋ偈ㄐㄧˋ等ㄉㄥˇ，為ㄨㄟˋ他ㄊㄚ人ㄖㄣˊ說ㄕㄨㄛ，其ㄑㄧˊ福ㄈㄨˊ勝ㄕㄥˋ彼ㄅㄧˇ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，一ㄧˊ切ㄑㄧㄝˋ諸ㄓㄨ佛ㄈㄛˊ及ㄐㄧˊ諸ㄓㄨ佛ㄈㄛˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ法ㄈㄚˇ，皆ㄐㄧㄝ從ㄘㄨㄥˊ此ㄘˇ經ㄐㄧㄥ出ㄔㄨ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，所ㄙㄨㄛˇ謂ㄨㄟˋ佛ㄈㄛˊ法ㄈㄚˇ者ㄓㄜˇ，即ㄐㄧˊ非ㄈㄟ佛ㄈㄛˊ法ㄈㄚˇ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，須ㄒㄩ陀ㄊㄨㄛˊ洹ㄏㄨㄢˊ能ㄋㄥˊ作ㄗㄨㄛˋ是ㄕˋ念ㄋㄧㄢˋ：『我ㄨㄛˇ得ㄉㄜˊ須ㄒㄩ陀ㄊㄨㄛˊ洹ㄏㄨㄢˊ果ㄍㄨㄛˇ』不ㄈㄡˇ？」\n須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ言ㄧㄢˊ：「不ㄈㄡˇ也ㄧㄝˇ，世ㄕˋ尊ㄗㄨㄣ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，須ㄒㄩ陀ㄊㄨㄛˊ洹ㄏㄨㄢˊ名ㄇㄧㄥˊ為ㄨㄟˊ入ㄖㄨˋ流ㄌㄧㄡˊ，而ㄦˊ無ㄨˊ所ㄙㄨㄛˇ入ㄖㄨˋ，不ㄅㄨˋ入ㄖㄨˋ色ㄙㄜˋ、聲ㄕㄥ、香ㄒㄧㄤ、味ㄨㄟˋ、觸ㄔㄨˋ、法ㄈㄚˇ，是ㄕˋ名ㄇㄧㄥˊ須ㄒㄩ陀ㄊㄨㄛˊ洹ㄏㄨㄢˊ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，斯ㄙ陀ㄊㄨㄛˊ含ㄏㄢˊ能ㄋㄥˊ作ㄗㄨㄛˋ是ㄕˋ念ㄋㄧㄢˋ：『我ㄨㄛˇ得ㄉㄜˊ斯ㄙ陀ㄊㄨㄛˊ含ㄏㄢˊ果ㄍㄨㄛˇ』不ㄈㄡˇ？」\n須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ言ㄧㄢˊ：「不ㄈㄡˇ也ㄧㄝˇ，世ㄕˋ尊ㄗㄨㄣ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，斯ㄙ陀ㄊㄨㄛˊ含ㄏㄢˊ名ㄇㄧㄥˊ一ㄧˋ往ㄨㄤˇ來ㄌㄞˊ，而ㄦˊ實ㄕˊ無ㄨˊ往ㄨㄤˇ來ㄌㄞˊ，是ㄕˋ名ㄇㄧㄥˊ斯ㄙ陀ㄊㄨㄛˊ含ㄏㄢˊ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，阿ㄚ那ㄋㄚˋ含ㄏㄢˊ能ㄋㄥˊ作ㄗㄨㄛˋ是ㄕˋ念ㄋㄧㄢˋ：『我ㄨㄛˇ得ㄉㄜˊ阿ㄚ那ㄋㄚˋ含ㄏㄢˊ果ㄍㄨㄛˇ』不ㄈㄡˇ？」\n須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ言ㄧㄢˊ：「不ㄈㄡˇ也ㄧㄝˇ，世ㄕˋ尊ㄗㄨㄣ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，阿ㄚ那ㄋㄚˋ含ㄏㄢˊ名ㄇㄧㄥˊ為ㄨㄟˊ不ㄅㄨˋ來ㄌㄞˊ，而ㄦˊ實ㄕˊ無ㄨˊ不ㄅㄨˋ來ㄌㄞˊ，是ㄕˋ故ㄍㄨˋ名ㄇㄧㄥˊ阿ㄚ那ㄋㄚˋ含ㄏㄢˊ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，阿ㄚ羅ㄌㄨㄛˊ漢ㄏㄢˋ能ㄋㄥˊ作ㄗㄨㄛˋ是ㄕˋ念ㄋㄧㄢˋ：『我ㄨㄛˇ得ㄉㄜˊ阿ㄚ羅ㄌㄨㄛˊ漢ㄏㄢˋ道ㄉㄠˋ』不ㄈㄡˇ？」\n須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ言ㄧㄢˊ：「不ㄈㄡˇ也ㄧㄝˇ，世ㄕˋ尊ㄗㄨㄣ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，實ㄕˊ無ㄨˊ有ㄧㄡˇ法ㄈㄚˇ名ㄇㄧㄥˊ阿ㄚ羅ㄌㄨㄛˊ漢ㄏㄢˋ。世ㄕˋ尊ㄗㄨㄣ，若ㄖㄨㄛˋ阿ㄚ羅ㄌㄨㄛˊ漢ㄏㄢˋ作ㄗㄨㄛˋ是ㄕˋ念ㄋㄧㄢˋ：『我ㄨㄛˇ得ㄉㄜˊ阿ㄚ羅ㄌㄨㄛˊ漢ㄏㄢˋ道ㄉㄠˋ』，即ㄐㄧˊ為ㄨㄟˊ著ㄓㄨㄛˊ我ㄨㄛˇ、人ㄖㄣˊ、眾ㄓㄨㄥˋ生ㄕㄥ、壽ㄕㄡˋ者ㄓㄜˇ。世ㄕˋ尊ㄗㄨㄣ，佛ㄈㄛˊ說ㄕㄨㄛ我ㄨㄛˇ得ㄉㄜˊ無ㄨˊ諍ㄓㄥˋ三ㄙㄢ昧ㄇㄟˋ，人ㄖㄣˊ中ㄓㄨㄥ最ㄗㄨㄟˋ為ㄨㄟˊ第ㄉㄧˋ一ㄧ，是ㄕˋ第ㄉㄧˋ一ㄧ離ㄌㄧˊ欲ㄩˋ阿ㄚ羅ㄌㄨㄛˊ漢ㄏㄢˋ。我ㄨㄛˇ不ㄅㄨˋ作ㄗㄨㄛˋ是ㄕˋ念ㄋㄧㄢˋ：『我ㄨㄛˇ是ㄕˋ離ㄌㄧˊ欲ㄩˋ阿ㄚ羅ㄌㄨㄛˊ漢ㄏㄢˋ。』世ㄕˋ尊ㄗㄨㄣ，我ㄨㄛˇ若ㄖㄨㄛˋ作ㄗㄨㄛˋ是ㄕˋ念ㄋㄧㄢˋ：『我ㄨㄛˇ得ㄉㄜˊ阿ㄚ羅ㄌㄨㄛˊ漢ㄏㄢˋ道ㄉㄠˋ』，世ㄕˋ尊ㄗㄨㄣ則ㄗㄜˊ不ㄅㄨˋ說ㄕㄨㄛ須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ是ㄕˋ樂ㄧㄠˋ阿ㄚ蘭ㄌㄢˊ那ㄋㄚˋ行ㄒㄧㄥˊ者ㄓㄜˇ。以ㄧˇ須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ實ㄕˊ無ㄨˊ所ㄙㄨㄛˇ行ㄒㄧㄥˊ，而ㄦˊ名ㄇㄧㄥˊ須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ是ㄕˋ樂ㄧㄠˋ阿ㄚ蘭ㄌㄢˊ那ㄋㄚˋ行ㄒㄧㄥˊ。」\n佛ㄈㄛˊ告ㄍㄠˋ須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ：「於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，如ㄖㄨˊ來ㄌㄞˊ昔ㄒㄧˊ在ㄗㄞˋ燃ㄖㄢˊ燈ㄉㄥ佛ㄈㄛˊ所ㄙㄨㄛˇ，於ㄩˊ法ㄈㄚˇ有ㄧㄡˇ所ㄙㄨㄛˇ得ㄉㄜˊ不ㄈㄡˇ？」\n「世ㄕˋ尊ㄗㄨㄣ，如ㄖㄨˊ來ㄌㄞˊ在ㄗㄞˋ燃ㄖㄢˊ燈ㄉㄥ佛ㄈㄛˊ所ㄙㄨㄛˇ，於ㄩˊ法ㄈㄚˇ實ㄕˊ無ㄨˊ所ㄙㄨㄛˇ得ㄉㄜˊ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，菩ㄆㄨˊ薩ㄙㄚˋ莊ㄓㄨㄤ嚴ㄧㄢˊ佛ㄈㄛˊ土ㄊㄨˇ不ㄈㄡˇ？」\n「不ㄈㄡˇ也ㄧㄝˇ，世ㄕˋ尊ㄗㄨㄣ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，莊ㄓㄨㄤ嚴ㄧㄢˊ佛ㄈㄛˊ土ㄊㄨˇ者ㄓㄜˇ，則ㄗㄜˊ非ㄈㄟ莊ㄓㄨㄤ嚴ㄧㄢˊ，是ㄕˋ名ㄇㄧㄥˊ莊ㄓㄨㄤ嚴ㄧㄢˊ。」\n「是ㄕˋ故ㄍㄨˋ須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，諸ㄓㄨ菩ㄆㄨˊ薩ㄙㄚˋ摩ㄇㄛˊ訶ㄏㄜ薩ㄙㄚˋ應ㄧㄥ如ㄖㄨˊ是ㄕˋ生ㄕㄥ清ㄑㄧㄥ淨ㄐㄧㄥˋ心ㄒㄧㄣ，不ㄅㄨˋ應ㄧㄥ住ㄓㄨˋ色ㄙㄜˋ生ㄕㄥ心ㄒㄧㄣ，不ㄅㄨˋ應ㄧㄥ住ㄓㄨˋ聲ㄕㄥ、香ㄒㄧㄤ、味ㄨㄟˋ、觸ㄔㄨˋ、法ㄈㄚˇ生ㄕㄥ心ㄒㄧㄣ，應ㄧㄥ無ㄨˊ所ㄙㄨㄛˇ住ㄓㄨˋ而ㄦˊ生ㄕㄥ其ㄑㄧˊ心ㄒㄧㄣ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，譬ㄆㄧˋ如ㄖㄨˊ有ㄧㄡˇ人ㄖㄣˊ身ㄕㄣ如ㄖㄨˊ須ㄒㄩ彌ㄇㄧˊ山ㄕㄢ王ㄨㄤˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，是ㄕˋ身ㄕㄣ為ㄨㄟˊ大ㄉㄚˋ不ㄈㄡˇ？」\n須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ言ㄧㄢˊ：「甚ㄕㄣˋ大ㄉㄚˋ，世ㄕˋ尊ㄗㄨㄣ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，佛ㄈㄛˊ說ㄕㄨㄛ非ㄈㄟ身ㄕㄣ，是ㄕˋ名ㄇㄧㄥˊ大ㄉㄚˋ身ㄕㄣ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，如ㄖㄨˊ恆ㄏㄥˊ河ㄏㄜˊ中ㄓㄨㄥ所ㄙㄨㄛˇ有ㄧㄡˇ沙ㄕㄚ數ㄕㄨˋ，如ㄖㄨˊ是ㄕˋ沙ㄕㄚ等ㄉㄥˇ恆ㄏㄥˊ河ㄏㄜˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，是ㄕˋ諸ㄓㄨ恆ㄏㄥˊ河ㄏㄜˊ沙ㄕㄚ寧ㄋㄧㄥˊ為ㄨㄟˊ多ㄉㄨㄛ不ㄈㄡˇ？」\n須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ言ㄧㄢˊ：「甚ㄕㄣˋ多ㄉㄨㄛ，世ㄕˋ尊ㄗㄨㄣ。但ㄉㄢˋ諸ㄓㄨ恆ㄏㄥˊ河ㄏㄜˊ尚ㄕㄤˋ多ㄉㄨㄛ無ㄨˊ數ㄕㄨˋ，何ㄏㄜˊ況ㄎㄨㄤˋ其ㄑㄧˊ沙ㄕㄚ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，我ㄨㄛˇ今ㄐㄧㄣ實ㄕˊ言ㄧㄢˊ告ㄍㄠˋ汝ㄖㄨˇ：若ㄖㄨㄛˋ有ㄧㄡˇ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ、善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ，以ㄧˇ七ㄑㄧ寶ㄅㄠˇ滿ㄇㄢˇ爾ㄦˇ所ㄙㄨㄛˇ恆ㄏㄥˊ河ㄏㄜˊ沙ㄕㄚ數ㄕㄨˋ三ㄙㄢ千ㄑㄧㄢ大ㄉㄚˋ千ㄑㄧㄢ世ㄕˋ界ㄐㄧㄝˋ，以ㄧˇ用ㄩㄥˋ布ㄅㄨˋ施ㄕˋ，得ㄉㄜˊ福ㄈㄨˊ多ㄉㄨㄛ不ㄈㄡˇ？」\n須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ言ㄧㄢˊ：「甚ㄕㄣˋ多ㄉㄨㄛ，世ㄕˋ尊ㄗㄨㄣ。」\n佛ㄈㄛˊ告ㄍㄠˋ須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ：「若ㄖㄨㄛˋ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ、善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ，於ㄩˊ此ㄘˇ經ㄐㄧㄥ中ㄓㄨㄥ，乃ㄋㄞˇ至ㄓˋ受ㄕㄡˋ持ㄔˊ四ㄙˋ句ㄐㄩˋ偈ㄐㄧˋ等ㄉㄥˇ，為ㄨㄟˋ他ㄊㄚ人ㄖㄣˊ說ㄕㄨㄛ，而ㄦˊ此ㄘˇ福ㄈㄨˊ德ㄉㄜˊ勝ㄕㄥˋ前ㄑㄧㄢˊ福ㄈㄨˊ德ㄉㄜˊ。」\n復ㄈㄨˋ次ㄘˋ，須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，隨ㄙㄨㄟˊ說ㄕㄨㄛ是ㄕˋ經ㄐㄧㄥ，乃ㄋㄞˇ至ㄓˋ四ㄙˋ句ㄐㄩˋ偈ㄐㄧˋ等ㄉㄥˇ，當ㄉㄤ知ㄓ此ㄘˇ處ㄔㄨˋ，一ㄧˊ切ㄑㄧㄝˋ世ㄕˋ間ㄐㄧㄢ、天ㄊㄧㄢ、人ㄖㄣˊ、阿ㄚ修ㄒㄧㄡ羅ㄌㄨㄛˊ，皆ㄐㄧㄝ應ㄧㄥ供ㄍㄨㄥˋ養ㄧㄤˇ如ㄖㄨˊ佛ㄈㄛˊ塔ㄊㄚˇ廟ㄇㄧㄠˋ。何ㄏㄜˊ況ㄎㄨㄤˋ有ㄧㄡˇ人ㄖㄣˊ盡ㄐㄧㄣˋ能ㄋㄥˊ受ㄕㄡˋ持ㄔˊ讀ㄉㄨˊ誦ㄙㄨㄥˋ。\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，當ㄉㄤ知ㄓ是ㄕˋ人ㄖㄣˊ成ㄔㄥˊ就ㄐㄧㄡˋ最ㄗㄨㄟˋ上ㄕㄤˋ第ㄉㄧˋ一ㄧ希ㄒㄧ有ㄧㄡˇ之ㄓ法ㄈㄚˇ。若ㄖㄨㄛˋ是ㄕˋ經ㄐㄧㄥ典ㄉㄧㄢˇ所ㄙㄨㄛˇ在ㄗㄞˋ之ㄓ處ㄔㄨˋ，則ㄗㄜˊ為ㄨㄟˊ有ㄧㄡˇ佛ㄈㄛˊ，若ㄖㄨㄛˋ尊ㄗㄨㄣ重ㄓㄨㄥˋ弟ㄉㄧˋ子ㄗˇ。」\n爾ㄦˇ時ㄕˊ，須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ白ㄅㄛˊ佛ㄈㄛˊ言ㄧㄢˊ：「世ㄕˋ尊ㄗㄨㄣ，當ㄉㄤ何ㄏㄜˊ名ㄇㄧㄥˊ此ㄘˇ經ㄐㄧㄥ，我ㄨㄛˇ等ㄉㄥˇ云ㄩㄣˊ何ㄏㄜˊ奉ㄈㄥˋ持ㄔˊ？」\n佛ㄈㄛˊ告ㄍㄠˋ須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ：「是ㄕˋ經ㄐㄧㄥ名ㄇㄧㄥˊ為ㄨㄟˊ《金ㄐㄧㄣ剛ㄍㄤ般ㄅㄛ若ㄖㄜˋ波ㄅㄛ羅ㄌㄨㄛˊ蜜ㄇㄧˋ》，以ㄧˇ是ㄕˋ名ㄇㄧㄥˊ字ㄗˋ，汝ㄖㄨˇ當ㄉㄤ奉ㄈㄥˋ持ㄔˊ。所ㄙㄨㄛˇ以ㄧˇ者ㄓㄜˇ何ㄏㄜˊ，須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，佛ㄈㄛˊ說ㄕㄨㄛ般ㄅㄛ若ㄖㄜˋ波ㄅㄛ羅ㄌㄨㄛˊ蜜ㄇㄧˋ，則ㄗㄜˊ非ㄈㄟ般ㄅㄛ若ㄖㄜˋ波ㄅㄛ羅ㄌㄨㄛˊ蜜ㄇㄧˋ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，如ㄖㄨˊ來ㄌㄞˊ有ㄧㄡˇ所ㄙㄨㄛˇ說ㄕㄨㄛ法ㄈㄚˇ不ㄈㄡˇ？」\n須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ白ㄅㄛˊ佛ㄈㄛˊ言ㄧㄢˊ：「世ㄕˋ尊ㄗㄨㄣ，如ㄖㄨˊ來ㄌㄞˊ無ㄨˊ所ㄙㄨㄛˇ說ㄕㄨㄛ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，三ㄙㄢ千ㄑㄧㄢ大ㄉㄚˋ千ㄑㄧㄢ世ㄕˋ界ㄐㄧㄝˋ所ㄙㄨㄛˇ有ㄧㄡˇ微ㄨㄟˊ塵ㄔㄣˊ，是ㄕˋ為ㄨㄟˊ多ㄉㄨㄛ不ㄈㄡˇ？」\n須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ言ㄧㄢˊ：「甚ㄕㄣˋ多ㄉㄨㄛ，世ㄕˋ尊ㄗㄨㄣ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，諸ㄓㄨ微ㄨㄟˊ塵ㄔㄣˊ，如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ『非ㄈㄟ微ㄨㄟˊ塵ㄔㄣˊ，是ㄕˋ名ㄇㄧㄥˊ微ㄨㄟˊ塵ㄔㄣˊ』。如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ：『世ㄕˋ界ㄐㄧㄝˋ，非ㄈㄟ世ㄕˋ界ㄐㄧㄝˋ，是ㄕˋ名ㄇㄧㄥˊ世ㄕˋ界ㄐㄧㄝˋ』。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，可ㄎㄜˇ以ㄧˇ三ㄙㄢ十ㄕˊ二ㄦˋ相ㄒㄧㄤˋ見ㄐㄧㄢˋ如ㄖㄨˊ來ㄌㄞˊ不ㄈㄡˇ？」\n「不ㄈㄡˇ也ㄧㄝˇ，世ㄕˋ尊ㄗㄨㄣ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ？」\n如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ：「三ㄙㄢ十ㄕˊ二ㄦˋ相ㄒㄧㄤˋ，即ㄐㄧˊ是ㄕˋ非ㄈㄟ相ㄒㄧㄤˋ，是ㄕˋ名ㄇㄧㄥˊ三ㄙㄢ十ㄕˊ二ㄦˋ相ㄒㄧㄤˋ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，若ㄖㄨㄛˋ有ㄧㄡˇ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ、善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ，以ㄧˇ恆ㄏㄥˊ河ㄏㄜˊ沙ㄕㄚ等ㄉㄥˇ身ㄕㄣ命ㄇㄧㄥˋ布ㄅㄨˋ施ㄕˋ，若ㄖㄨㄛˋ復ㄈㄨˋ有ㄧㄡˇ人ㄖㄣˊ，於ㄩˊ此ㄘˇ經ㄐㄧㄥ中ㄓㄨㄥ，乃ㄋㄞˇ至ㄓˋ受ㄕㄡˋ持ㄔˊ四ㄙˋ句ㄐㄩˋ偈ㄐㄧˋ等ㄉㄥˇ，為ㄨㄟˋ他ㄊㄚ人ㄖㄣˊ說ㄕㄨㄛ，其ㄑㄧˊ福ㄈㄨˊ甚ㄕㄣˋ多ㄉㄨㄛ。」\n爾ㄦˇ時ㄕˊ，須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ聞ㄨㄣˊ說ㄕㄨㄛ是ㄕˋ經ㄐㄧㄥ，深ㄕㄣ解ㄐㄧㄝˇ義ㄧˋ趣ㄑㄩˋ，涕ㄊㄧˋ淚ㄌㄟˋ悲ㄅㄟ泣ㄑㄧˋ，而ㄦˊ白ㄅㄛˊ佛ㄈㄛˊ言ㄧㄢˊ：「希ㄒㄧ有ㄧㄡˇ，世ㄕˋ尊ㄗㄨㄣ。佛ㄈㄛˊ說ㄕㄨㄛ如ㄖㄨˊ是ㄕˋ甚ㄕㄣˋ深ㄕㄣ經ㄐㄧㄥ典ㄉㄧㄢˇ，我ㄨㄛˇ從ㄘㄨㄥˊ昔ㄒㄧˊ來ㄌㄞˊ所ㄙㄨㄛˇ得ㄉㄜˊ慧ㄏㄨㄟˋ眼ㄧㄢˇ，未ㄨㄟˋ曾ㄘㄥˊ得ㄉㄜˊ聞ㄨㄣˊ如ㄖㄨˊ是ㄕˋ之ㄓ經ㄐㄧㄥ。世ㄕˋ尊ㄗㄨㄣ，若ㄖㄨㄛˋ復ㄈㄨˋ有ㄧㄡˇ人ㄖㄣˊ得ㄉㄜˊ聞ㄨㄣˊ是ㄕˋ經ㄐㄧㄥ，信ㄒㄧㄣˋ心ㄒㄧㄣ清ㄑㄧㄥ淨ㄐㄧㄥˋ，則ㄗㄜˊ生ㄕㄥ實ㄕˊ相ㄒㄧㄤˋ，當ㄉㄤ知ㄓ是ㄕˋ人ㄖㄣˊ，成ㄔㄥˊ就ㄐㄧㄡˋ第ㄉㄧˋ一ㄧ希ㄒㄧ有ㄧㄡˇ功ㄍㄨㄥ德ㄉㄜˊ。世ㄕˋ尊ㄗㄨㄣ，是ㄕˋ實ㄕˊ相ㄒㄧㄤˋ者ㄓㄜˇ，則ㄗㄜˊ是ㄕˋ非ㄈㄟ相ㄒㄧㄤˋ，是ㄕˋ故ㄍㄨˋ如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ名ㄇㄧㄥˊ實ㄕˊ相ㄒㄧㄤˋ。世ㄕˋ尊ㄗㄨㄣ，我ㄨㄛˇ今ㄐㄧㄣ得ㄉㄜˊ聞ㄨㄣˊ如ㄖㄨˊ是ㄕˋ經ㄐㄧㄥ典ㄉㄧㄢˇ，信ㄒㄧㄣˋ解ㄐㄧㄝˇ受ㄕㄡˋ持ㄔˊ不ㄅㄨˋ足ㄗㄨˊ為ㄨㄟˊ難ㄋㄢˊ。若ㄖㄨㄛˋ當ㄉㄤ來ㄌㄞˊ世ㄕˋ，後ㄏㄡˋ五ㄨˇ百ㄅㄞˇ歲ㄙㄨㄟˋ，其ㄑㄧˊ有ㄧㄡˇ眾ㄓㄨㄥˋ生ㄕㄥ，得ㄉㄜˊ聞ㄨㄣˊ是ㄕˋ經ㄐㄧㄥ，信ㄒㄧㄣˋ解ㄐㄧㄝˇ受ㄕㄡˋ持ㄔˊ，是ㄕˋ人ㄖㄣˊ則ㄗㄜˊ為ㄨㄟˊ第ㄉㄧˋ一ㄧ希ㄒㄧ有ㄧㄡˇ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，此ㄘˇ人ㄖㄣˊ無ㄨˊ我ㄨㄛˇ相ㄒㄧㄤˋ、人ㄖㄣˊ相ㄒㄧㄤˋ、眾ㄓㄨㄥˋ生ㄕㄥ相ㄒㄧㄤˋ、壽ㄕㄡˋ者ㄓㄜˇ相ㄒㄧㄤˋ。所ㄙㄨㄛˇ以ㄧˇ者ㄓㄜˇ何ㄏㄜˊ，我ㄨㄛˇ相ㄒㄧㄤˋ即ㄐㄧˊ是ㄕˋ非ㄈㄟ相ㄒㄧㄤˋ，人ㄖㄣˊ相ㄒㄧㄤˋ、眾ㄓㄨㄥˋ生ㄕㄥ相ㄒㄧㄤˋ、壽ㄕㄡˋ者ㄓㄜˇ相ㄒㄧㄤˋ即ㄐㄧˊ是ㄕˋ非ㄈㄟ相ㄒㄧㄤˋ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，離ㄌㄧˊ一ㄧˊ切ㄑㄧㄝˋ諸ㄓㄨ相ㄒㄧㄤˋ，則ㄗㄜˊ名ㄇㄧㄥˊ諸ㄓㄨ佛ㄈㄛˊ。」\n佛ㄈㄛˊ告ㄍㄠˋ須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ：「如ㄖㄨˊ是ㄕˋ，如ㄖㄨˊ是ㄕˋ。若ㄖㄨㄛˋ復ㄈㄨˋ有ㄧㄡˇ人ㄖㄣˊ，得ㄉㄜˊ聞ㄨㄣˊ是ㄕˋ經ㄐㄧㄥ，不ㄅㄨˋ驚ㄐㄧㄥ，不ㄅㄨˋ怖ㄅㄨˋ，不ㄅㄨˋ畏ㄨㄟˋ，當ㄉㄤ知ㄓ是ㄕˋ人ㄖㄣˊ甚ㄕㄣˋ為ㄨㄟˊ希ㄒㄧ有ㄧㄡˇ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ：第ㄉㄧˋ一ㄧ波ㄅㄛ羅ㄌㄨㄛˊ蜜ㄇㄧˋ，非ㄈㄟ第ㄉㄧˋ一ㄧ波ㄅㄛ羅ㄌㄨㄛˊ蜜ㄇㄧˋ，是ㄕˋ名ㄇㄧㄥˊ第ㄉㄧˋ一ㄧ波ㄅㄛ羅ㄌㄨㄛˊ蜜ㄇㄧˋ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，忍ㄖㄣˇ辱ㄖㄨˋ波ㄅㄛ羅ㄌㄨㄛˊ蜜ㄇㄧˋ，如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ非ㄈㄟ忍ㄖㄣˇ辱ㄖㄨˋ波ㄅㄛ羅ㄌㄨㄛˊ蜜ㄇㄧˋ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，如ㄖㄨˊ我ㄨㄛˇ昔ㄒㄧˊ為ㄨㄟˋ歌ㄍㄜ利ㄌㄧˋ王ㄨㄤˊ割ㄍㄜ截ㄐㄧㄝˊ身ㄕㄣ體ㄊㄧˇ，我ㄨㄛˇ於ㄩˊ爾ㄦˇ時ㄕˊ，無ㄨˊ我ㄨㄛˇ相ㄒㄧㄤˋ、無ㄨˊ人ㄖㄣˊ相ㄒㄧㄤˋ、無ㄨˊ眾ㄓㄨㄥˋ生ㄕㄥ相ㄒㄧㄤˋ、無ㄨˊ壽ㄕㄡˋ者ㄓㄜˇ相ㄒㄧㄤˋ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，我ㄨㄛˇ於ㄩˊ往ㄨㄤˇ昔ㄒㄧˊ節ㄐㄧㄝˊ節ㄐㄧㄝˊ支ㄓ解ㄐㄧㄝˇ時ㄕˊ，若ㄖㄨㄛˋ有ㄧㄡˇ我ㄨㄛˇ相ㄒㄧㄤˋ、人ㄖㄣˊ相ㄒㄧㄤˋ、眾ㄓㄨㄥˋ生ㄕㄥ相ㄒㄧㄤˋ、壽ㄕㄡˋ者ㄓㄜˇ相ㄒㄧㄤˋ，應ㄧㄥ生ㄕㄥ瞋ㄔㄣ恨ㄏㄣˋ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，又ㄧㄡˋ念ㄋㄧㄢˋ過ㄍㄨㄛˋ去ㄑㄩˋ於ㄩˊ五ㄨˇ百ㄅㄞˇ世ㄕˋ作ㄗㄨㄛˋ忍ㄖㄣˇ辱ㄖㄨˋ仙ㄒㄧㄢ人ㄖㄣˊ，於ㄩˊ爾ㄦˇ所ㄙㄨㄛˇ世ㄕˋ，無ㄨˊ我ㄨㄛˇ相ㄒㄧㄤˋ、無ㄨˊ人ㄖㄣˊ相ㄒㄧㄤˋ、無ㄨˊ眾ㄓㄨㄥˋ生ㄕㄥ相ㄒㄧㄤˋ、無ㄨˊ壽ㄕㄡˋ者ㄓㄜˇ相ㄒㄧㄤˋ。是ㄕˋ故ㄍㄨˋ須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，菩ㄆㄨˊ薩ㄙㄚˋ應ㄧㄥ離ㄌㄧˊ一ㄧˊ切ㄑㄧㄝˋ相ㄒㄧㄤˋ，發ㄈㄚ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ心ㄒㄧㄣ，不ㄅㄨˋ應ㄧㄥ住ㄓㄨˋ色ㄙㄜˋ生ㄕㄥ心ㄒㄧㄣ，不ㄅㄨˋ應ㄧㄥ住ㄓㄨˋ聲ㄕㄥ、香ㄒㄧㄤ、味ㄨㄟˋ、觸ㄔㄨˋ、法ㄈㄚˇ生ㄕㄥ心ㄒㄧㄣ，應ㄧㄥ生ㄕㄥ無ㄨˊ所ㄙㄨㄛˇ住ㄓㄨˋ心ㄒㄧㄣ。若ㄖㄨㄛˋ心ㄒㄧㄣ有ㄧㄡˇ住ㄓㄨˋ，則ㄗㄜˊ為ㄨㄟˊ非ㄈㄟ住ㄓㄨˋ。是ㄕˋ故ㄍㄨˋ佛ㄈㄛˊ說ㄕㄨㄛ：『菩ㄆㄨˊ薩ㄙㄚˋ心ㄒㄧㄣ不ㄅㄨˋ應ㄧㄥ住ㄓㄨˋ色ㄙㄜˋ布ㄅㄨˋ施ㄕˋ。』」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，菩ㄆㄨˊ薩ㄙㄚˋ為ㄨㄟˋ利ㄌㄧˋ益ㄧˋ一ㄧˊ切ㄑㄧㄝˋ眾ㄓㄨㄥˋ生ㄕㄥ，應ㄧㄥ如ㄖㄨˊ是ㄕˋ布ㄅㄨˋ施ㄕˋ。」\n如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ：「一ㄧˊ切ㄑㄧㄝˋ諸ㄓㄨ相ㄒㄧㄤˋ即ㄐㄧˊ是ㄕˋ非ㄈㄟ相ㄒㄧㄤˋ。」\n又ㄧㄡˋ說ㄕㄨㄛ：「一ㄧˊ切ㄑㄧㄝˋ眾ㄓㄨㄥˋ生ㄕㄥ則ㄗㄜˊ非ㄈㄟ眾ㄓㄨㄥˋ生ㄕㄥ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，如ㄖㄨˊ來ㄌㄞˊ是ㄕˋ真ㄓㄣ語ㄩˇ者ㄓㄜˇ、實ㄕˊ語ㄩˇ者ㄓㄜˇ、如ㄖㄨˊ語ㄩˇ者ㄓㄜˇ、不ㄅㄨˋ誑ㄎㄨㄤˋ語ㄩˇ者ㄓㄜˇ、不ㄅㄨˋ異ㄧˋ語ㄩˇ者ㄓㄜˇ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，如ㄖㄨˊ來ㄌㄞˊ所ㄙㄨㄛˇ得ㄉㄜˊ法ㄈㄚˇ，此ㄘˇ法ㄈㄚˇ無ㄨˊ實ㄕˊ無ㄨˊ虛ㄒㄩ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，若ㄖㄨㄛˋ菩ㄆㄨˊ薩ㄙㄚˋ心ㄒㄧㄣ住ㄓㄨˋ於ㄩˊ法ㄈㄚˇ而ㄦˊ行ㄒㄧㄥˊ布ㄅㄨˋ施ㄕˋ，如ㄖㄨˊ人ㄖㄣˊ入ㄖㄨˋ暗ㄢˋ，則ㄗㄜˊ無ㄨˊ所ㄙㄨㄛˇ見ㄐㄧㄢˋ；若ㄖㄨㄛˋ菩ㄆㄨˊ薩ㄙㄚˋ心ㄒㄧㄣ不ㄅㄨˋ住ㄓㄨˋ法ㄈㄚˇ而ㄦˊ行ㄒㄧㄥˊ布ㄅㄨˋ施ㄕˋ，如ㄖㄨˊ人ㄖㄣˊ有ㄧㄡˇ目ㄇㄨˋ，日ㄖˋ光ㄍㄨㄤ明ㄇㄧㄥˊ照ㄓㄠˋ，見ㄐㄧㄢˋ種ㄓㄨㄥˇ種ㄓㄨㄥˇ色ㄙㄜˋ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，當ㄉㄤ來ㄌㄞˊ之ㄓ世ㄕˋ，若ㄖㄨㄛˋ有ㄧㄡˇ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ、善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ，能ㄋㄥˊ於ㄩˊ此ㄘˇ經ㄐㄧㄥ受ㄕㄡˋ持ㄔˊ讀ㄉㄨˊ誦ㄙㄨㄥˋ，則ㄗㄜˊ為ㄨㄟˊ如ㄖㄨˊ來ㄌㄞˊ以ㄧˇ佛ㄈㄛˊ智ㄓˋ慧ㄏㄨㄟˋ，悉ㄒㄧ知ㄓ是ㄕˋ人ㄖㄣˊ，悉ㄒㄧ見ㄐㄧㄢˋ是ㄕˋ人ㄖㄣˊ，皆ㄐㄧㄝ得ㄉㄜˊ成ㄔㄥˊ就ㄐㄧㄡˋ無ㄨˊ量ㄌㄧㄤˋ無ㄨˊ邊ㄅㄧㄢ功ㄍㄨㄥ德ㄉㄜˊ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，若ㄖㄨㄛˋ有ㄧㄡˇ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ、善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ，初ㄔㄨ日ㄖˋ分ㄈㄣˋ以ㄧˇ恆ㄏㄥˊ河ㄏㄜˊ沙ㄕㄚ等ㄉㄥˇ身ㄕㄣ布ㄅㄨˋ施ㄕˋ，中ㄓㄨㄥ日ㄖˋ分ㄈㄣˋ復ㄈㄨˋ以ㄧˇ恆ㄏㄥˊ河ㄏㄜˊ沙ㄕㄚ等ㄉㄥˇ身ㄕㄣ布ㄅㄨˋ施ㄕˋ，後ㄏㄡˋ日ㄖˋ分ㄈㄣˋ亦ㄧˋ以ㄧˇ恆ㄏㄥˊ河ㄏㄜˊ沙ㄕㄚ等ㄉㄥˇ身ㄕㄣ布ㄅㄨˋ施ㄕˋ，如ㄖㄨˊ是ㄕˋ無ㄨˊ量ㄌㄧㄤˋ百ㄅㄞˇ千ㄑㄧㄢ萬ㄨㄢˋ億ㄧˋ劫ㄐㄧㄝˊ以ㄧˇ身ㄕㄣ布ㄅㄨˋ施ㄕˋ。若ㄖㄨㄛˋ復ㄈㄨˋ有ㄧㄡˇ人ㄖㄣˊ，聞ㄨㄣˊ此ㄘˇ經ㄐㄧㄥ典ㄉㄧㄢˇ，信ㄒㄧㄣˋ心ㄒㄧㄣ不ㄅㄨˋ逆ㄋㄧˋ，其ㄑㄧˊ福ㄈㄨˊ勝ㄕㄥˋ彼ㄅㄧˇ，何ㄏㄜˊ況ㄎㄨㄤˋ書ㄕㄨ寫ㄒㄧㄝˇ、受ㄕㄡˋ持ㄔˊ、讀ㄉㄨˊ誦ㄙㄨㄥˋ、為ㄨㄟˋ人ㄖㄣˊ解ㄐㄧㄝˇ說ㄕㄨㄛ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，以ㄧˇ要ㄧㄠˋ言ㄧㄢˊ之ㄓ，是ㄕˋ經ㄐㄧㄥ有ㄧㄡˇ不ㄅㄨˋ可ㄎㄜˇ思ㄙ議ㄧˋ、不ㄅㄨˋ可ㄎㄜˇ稱ㄔㄥ量ㄌㄧㄤˋ、無ㄨˊ邊ㄅㄧㄢ功ㄍㄨㄥ德ㄉㄜˊ。如ㄖㄨˊ來ㄌㄞˊ為ㄨㄟˋ發ㄈㄚ大ㄉㄚˋ乘ㄕㄥˋ者ㄓㄜˇ說ㄕㄨㄛ，為ㄨㄟˋ發ㄈㄚ最ㄗㄨㄟˋ上ㄕㄤˋ乘ㄕㄥˋ者ㄓㄜˇ說ㄕㄨㄛ。若ㄖㄨㄛˋ有ㄧㄡˇ人ㄖㄣˊ能ㄋㄥˊ受ㄕㄡˋ持ㄔˊ讀ㄉㄨˊ誦ㄙㄨㄥˋ，廣ㄍㄨㄤˇ為ㄨㄟˋ人ㄖㄣˊ說ㄕㄨㄛ，如ㄖㄨˊ來ㄌㄞˊ悉ㄒㄧ知ㄓ是ㄕˋ人ㄖㄣˊ，悉ㄒㄧ見ㄐㄧㄢˋ是ㄕˋ人ㄖㄣˊ，皆ㄐㄧㄝ成ㄔㄥˊ就ㄐㄧㄡˋ不ㄅㄨˋ可ㄎㄜˇ量ㄌㄧㄤˋ、不ㄅㄨˋ可ㄎㄜˇ稱ㄔㄥ、無ㄨˊ有ㄧㄡˇ邊ㄅㄧㄢ、不ㄅㄨˋ可ㄎㄜˇ思ㄙ議ㄧˋ功ㄍㄨㄥ德ㄉㄜˊ。如ㄖㄨˊ是ㄕˋ人ㄖㄣˊ等ㄉㄥˇ，則ㄗㄜˊ為ㄨㄟˊ荷ㄏㄜˋ擔ㄉㄢ如ㄖㄨˊ來ㄌㄞˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，若ㄖㄨㄛˋ樂ㄧㄠˋ小ㄒㄧㄠˇ法ㄈㄚˇ者ㄓㄜˇ，著ㄓㄨㄛˊ我ㄨㄛˇ見ㄐㄧㄢˋ、人ㄖㄣˊ見ㄐㄧㄢˋ、眾ㄓㄨㄥˋ生ㄕㄥ見ㄐㄧㄢˋ、壽ㄕㄡˋ者ㄓㄜˇ見ㄐㄧㄢˋ，則ㄗㄜˊ於ㄩˊ此ㄘˇ經ㄐㄧㄥ不ㄅㄨˋ能ㄋㄥˊ聽ㄊㄧㄥ受ㄕㄡˋ讀ㄉㄨˊ誦ㄙㄨㄥˋ，為ㄨㄟˋ人ㄖㄣˊ解ㄐㄧㄝˇ說ㄕㄨㄛ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，在ㄗㄞˋ在ㄗㄞˋ處ㄔㄨˋ處ㄔㄨˋ，若ㄖㄨㄛˋ有ㄧㄡˇ此ㄘˇ經ㄐㄧㄥ，一ㄧˊ切ㄑㄧㄝˋ世ㄕˋ間ㄐㄧㄢ、天ㄊㄧㄢ、人ㄖㄣˊ、阿ㄚ修ㄒㄧㄡ羅ㄌㄨㄛˊ，所ㄙㄨㄛˇ應ㄧㄥ供ㄍㄨㄥˋ養ㄧㄤˇ。當ㄉㄤ知ㄓ此ㄘˇ處ㄔㄨˋ，則ㄗㄜˊ為ㄨㄟˊ是ㄕˋ塔ㄊㄚˇ，皆ㄐㄧㄝ應ㄧㄥ恭ㄍㄨㄥ敬ㄐㄧㄥˋ，作ㄗㄨㄛˋ禮ㄌㄧˇ圍ㄨㄟˊ繞ㄖㄠˋ，以ㄧˇ諸ㄓㄨ華ㄏㄨㄚ香ㄒㄧㄤ而ㄦˊ散ㄙㄢˋ其ㄑㄧˊ處ㄔㄨˋ。」\n「復ㄈㄨˋ次ㄘˋ，須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ、善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ，受ㄕㄡˋ持ㄔˊ讀ㄉㄨˊ誦ㄙㄨㄥˋ此ㄘˇ經ㄐㄧㄥ，若ㄖㄨㄛˋ為ㄨㄟˊ人ㄖㄣˊ輕ㄑㄧㄥ賤ㄐㄧㄢˋ，是ㄕˋ人ㄖㄣˊ先ㄒㄧㄢ世ㄕˋ罪ㄗㄨㄟˋ業ㄧㄝˋ，應ㄧㄥ墮ㄉㄨㄛˋ惡ㄜˋ道ㄉㄠˋ，以ㄧˇ今ㄐㄧㄣ世ㄕˋ人ㄖㄣˊ輕ㄑㄧㄥ賤ㄐㄧㄢˋ故ㄍㄨˋ，先ㄒㄧㄢ世ㄕˋ罪ㄗㄨㄟˋ業ㄧㄝˋ則ㄗㄜˊ為ㄨㄟˊ消ㄒㄧㄠ滅ㄇㄧㄝˋ，當ㄉㄤ得ㄉㄜˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，我ㄨㄛˇ念ㄋㄧㄢˋ過ㄍㄨㄛˋ去ㄑㄩˋ無ㄨˊ量ㄌㄧㄤˋ阿ㄚ僧ㄙㄥ祇ㄑㄧˊ劫ㄐㄧㄝˊ，於ㄩˊ燃ㄖㄢˊ燈ㄉㄥ佛ㄈㄛˊ前ㄑㄧㄢˊ，得ㄉㄜˊ值ㄓˊ八ㄅㄚ百ㄅㄞˇ四ㄙˋ千ㄑㄧㄢ萬ㄨㄢˋ億ㄧˋ那ㄋㄚˋ由ㄧㄡˊ他ㄊㄚ諸ㄓㄨ佛ㄈㄛˊ，悉ㄒㄧ皆ㄐㄧㄝ供ㄍㄨㄥˋ養ㄧㄤˇ承ㄔㄥˊ事ㄕˋ，無ㄨˊ空ㄎㄨㄥ過ㄍㄨㄛˋ者ㄓㄜˇ。若ㄖㄨㄛˋ復ㄈㄨˋ有ㄧㄡˇ人ㄖㄣˊ，於ㄩˊ後ㄏㄡˋ末ㄇㄛˋ世ㄕˋ，能ㄋㄥˊ受ㄕㄡˋ持ㄔˊ讀ㄉㄨˊ誦ㄙㄨㄥˋ此ㄘˇ經ㄐㄧㄥ，所ㄙㄨㄛˇ得ㄉㄜˊ功ㄍㄨㄥ德ㄉㄜˊ，於ㄩˊ我ㄨㄛˇ所ㄙㄨㄛˇ供ㄍㄨㄥˋ養ㄧㄤˇ諸ㄓㄨ佛ㄈㄛˊ功ㄍㄨㄥ德ㄉㄜˊ，百ㄅㄞˇ分ㄈㄣˋ不ㄅㄨˋ及ㄐㄧˊ一ㄧ，千ㄑㄧㄢ萬ㄨㄢˋ億ㄧˋ分ㄈㄣˋ，乃ㄋㄞˇ至ㄓˋ算ㄙㄨㄢˋ數ㄕㄨˋ譬ㄆㄧˋ喻ㄩˋ所ㄙㄨㄛˇ不ㄅㄨˋ能ㄋㄥˊ及ㄐㄧˊ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，若ㄖㄨㄛˋ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ、善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ，於ㄩˊ後ㄏㄡˋ末ㄇㄛˋ世ㄕˋ，有ㄧㄡˇ受ㄕㄡˋ持ㄔˊ讀ㄉㄨˊ誦ㄙㄨㄥˋ此ㄘˇ經ㄐㄧㄥ，所ㄙㄨㄛˇ得ㄉㄜˊ功ㄍㄨㄥ德ㄉㄜˊ，我ㄨㄛˇ若ㄖㄨㄛˋ具ㄐㄩˋ說ㄕㄨㄛ者ㄓㄜˇ，或ㄏㄨㄛˋ有ㄧㄡˇ人ㄖㄣˊ聞ㄨㄣˊ，心ㄒㄧㄣ則ㄗㄜˊ狂ㄎㄨㄤˊ亂ㄌㄨㄢˋ，狐ㄏㄨˊ疑ㄧˊ不ㄅㄨˋ信ㄒㄧㄣˋ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，當ㄉㄤ知ㄓ是ㄕˋ經ㄐㄧㄥ義ㄧˋ不ㄅㄨˋ可ㄎㄜˇ思ㄙ議ㄧˋ，果ㄍㄨㄛˇ報ㄅㄠˋ亦ㄧˋ不ㄅㄨˋ可ㄎㄜˇ思ㄙ議ㄧˋ。」\n爾ㄦˇ時ㄕˊ，須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ白ㄅㄛˊ佛ㄈㄛˊ言ㄧㄢˊ：「世ㄕˋ尊ㄗㄨㄣ，善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ、善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ，發ㄈㄚ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ心ㄒㄧㄣ，云ㄩㄣˊ何ㄏㄜˊ應ㄧㄥ住ㄓㄨˋ，云ㄩㄣˊ何ㄏㄜˊ降ㄒㄧㄤˊ伏ㄈㄨˊ其ㄑㄧˊ心ㄒㄧㄣ。」\n佛ㄈㄛˊ告ㄍㄠˋ須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ：「善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ、善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ，發ㄈㄚ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ者ㄓㄜˇ，當ㄉㄤ生ㄕㄥ如ㄖㄨˊ是ㄕˋ心ㄒㄧㄣ：我ㄨㄛˇ應ㄧㄥ滅ㄇㄧㄝˋ度ㄉㄨˋ一ㄧˊ切ㄑㄧㄝˋ眾ㄓㄨㄥˋ生ㄕㄥ，滅ㄇㄧㄝˋ度ㄉㄨˋ一ㄧˊ切ㄑㄧㄝˋ眾ㄓㄨㄥˋ生ㄕㄥ已ㄧˇ，而ㄦˊ無ㄨˊ有ㄧㄡˇ一ㄧˊ眾ㄓㄨㄥˋ生ㄕㄥ實ㄕˊ滅ㄇㄧㄝˋ度ㄉㄨˋ者ㄓㄜˇ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，若ㄖㄨㄛˋ菩ㄆㄨˊ薩ㄙㄚˋ有ㄧㄡˇ我ㄨㄛˇ相ㄒㄧㄤˋ、人ㄖㄣˊ相ㄒㄧㄤˋ、眾ㄓㄨㄥˋ生ㄕㄥ相ㄒㄧㄤˋ、壽ㄕㄡˋ者ㄓㄜˇ相ㄒㄧㄤˋ，則ㄗㄜˊ非ㄈㄟ菩ㄆㄨˊ薩ㄙㄚˋ。所ㄙㄨㄛˇ以ㄧˇ者ㄓㄜˇ何ㄏㄜˊ，須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，實ㄕˊ無ㄨˊ有ㄧㄡˇ法ㄈㄚˇ發ㄈㄚ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ者ㄓㄜˇ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，如ㄖㄨˊ來ㄌㄞˊ於ㄩˊ燃ㄖㄢˊ燈ㄉㄥ佛ㄈㄛˊ所ㄙㄨㄛˇ，有ㄧㄡˇ法ㄈㄚˇ得ㄉㄜˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ不ㄈㄡˇ？」\n「不ㄈㄡˇ也ㄧㄝˇ，世ㄕˋ尊ㄗㄨㄣ。如ㄖㄨˊ我ㄨㄛˇ解ㄐㄧㄝˇ佛ㄈㄛˊ所ㄙㄨㄛˇ說ㄕㄨㄛ義ㄧˋ，佛ㄈㄛˊ於ㄩˊ燃ㄖㄢˊ燈ㄉㄥ佛ㄈㄛˊ所ㄙㄨㄛˇ，無ㄨˊ有ㄧㄡˇ法ㄈㄚˇ得ㄉㄜˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ。」\n佛ㄈㄛˊ言ㄧㄢˊ：「如ㄖㄨˊ是ㄕˋ，如ㄖㄨˊ是ㄕˋ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，實ㄕˊ無ㄨˊ有ㄧㄡˇ法ㄈㄚˇ如ㄖㄨˊ來ㄌㄞˊ得ㄉㄜˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，若ㄖㄨㄛˋ有ㄧㄡˇ法ㄈㄚˇ如ㄖㄨˊ來ㄌㄞˊ得ㄉㄜˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ，燃ㄖㄢˊ燈ㄉㄥ佛ㄈㄛˊ則ㄗㄜˊ不ㄅㄨˋ與ㄩˇ我ㄨㄛˇ授ㄕㄡˋ記ㄐㄧˋ：『汝ㄖㄨˇ於ㄩˊ來ㄌㄞˊ世ㄕˋ，當ㄉㄤ得ㄉㄜˊ作ㄗㄨㄛˋ佛ㄈㄛˊ，號ㄏㄠˋ釋ㄕˋ迦ㄐㄧㄚ牟ㄇㄡˊ尼ㄋㄧˊ。』以ㄧˇ實ㄕˊ無ㄨˊ有ㄧㄡˇ法ㄈㄚˇ得ㄉㄜˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ，是ㄕˋ故ㄍㄨˋ燃ㄖㄢˊ燈ㄉㄥ佛ㄈㄛˊ與ㄩˇ我ㄨㄛˇ授ㄕㄡˋ記ㄐㄧˋ，作ㄗㄨㄛˋ是ㄕˋ言ㄧㄢˊ：『汝ㄖㄨˇ於ㄩˊ來ㄌㄞˊ世ㄕˋ，當ㄉㄤ得ㄉㄜˊ作ㄗㄨㄛˋ佛ㄈㄛˊ，號ㄏㄠˋ釋ㄕˋ迦ㄐㄧㄚ牟ㄇㄡˊ尼ㄋㄧˊ。』何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，如ㄖㄨˊ來ㄌㄞˊ者ㄓㄜˇ，即ㄐㄧˊ諸ㄓㄨ法ㄈㄚˇ如ㄖㄨˊ義ㄧˋ。」\n「若ㄖㄨㄛˋ有ㄧㄡˇ人ㄖㄣˊ言ㄧㄢˊ：如ㄖㄨˊ來ㄌㄞˊ得ㄉㄜˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ，須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，實ㄕˊ無ㄨˊ有ㄧㄡˇ法ㄈㄚˇ佛ㄈㄛˊ得ㄉㄜˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，如ㄖㄨˊ來ㄌㄞˊ所ㄙㄨㄛˇ得ㄉㄜˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ是ㄕˋ中ㄓㄨㄥ無ㄨˊ實ㄕˊ無ㄨˊ虛ㄒㄩ，是ㄕˋ故ㄍㄨˋ如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ：一ㄧˊ切ㄑㄧㄝˋ法ㄈㄚˇ皆ㄐㄧㄝ是ㄕˋ佛ㄈㄛˊ法ㄈㄚˇ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，所ㄙㄨㄛˇ言ㄧㄢˊ一ㄧˊ切ㄑㄧㄝˋ法ㄈㄚˇ者ㄓㄜˇ，即ㄐㄧˊ非ㄈㄟ一ㄧˊ切ㄑㄧㄝˋ法ㄈㄚˇ，是ㄕˋ故ㄍㄨˋ名ㄇㄧㄥˊ一ㄧˊ切ㄑㄧㄝˋ法ㄈㄚˇ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，譬ㄆㄧˋ如ㄖㄨˊ人ㄖㄣˊ身ㄕㄣ長ㄔㄤˊ大ㄉㄚˋ。」\n須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ言ㄧㄢˊ：「世ㄕˋ尊ㄗㄨㄣ，如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ：人ㄖㄣˊ身ㄕㄣ長ㄔㄤˊ大ㄉㄚˋ，則ㄗㄜˊ為ㄨㄟˊ非ㄈㄟ大ㄉㄚˋ身ㄕㄣ，是ㄕˋ名ㄇㄧㄥˊ大ㄉㄚˋ身ㄕㄣ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，菩ㄆㄨˊ薩ㄙㄚˋ亦ㄧˋ如ㄖㄨˊ是ㄕˋ，若ㄖㄨㄛˋ作ㄗㄨㄛˋ是ㄕˋ言ㄧㄢˊ：『我ㄨㄛˇ當ㄉㄤ滅ㄇㄧㄝˋ度ㄉㄨˋ無ㄨˊ量ㄌㄧㄤˋ眾ㄓㄨㄥˋ生ㄕㄥ』，則ㄗㄜˊ不ㄅㄨˋ名ㄇㄧㄥˊ菩ㄆㄨˊ薩ㄙㄚˋ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，無ㄨˊ有ㄧㄡˇ法ㄈㄚˇ名ㄇㄧㄥˊ為ㄨㄟˊ菩ㄆㄨˊ薩ㄙㄚˋ。是ㄕˋ故ㄍㄨˋ佛ㄈㄛˊ說ㄕㄨㄛ：一ㄧˊ切ㄑㄧㄝˋ法ㄈㄚˇ無ㄨˊ我ㄨㄛˇ、無ㄨˊ人ㄖㄣˊ、無ㄨˊ眾ㄓㄨㄥˋ生ㄕㄥ、無ㄨˊ壽ㄕㄡˋ者ㄓㄜˇ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，若ㄖㄨㄛˋ菩ㄆㄨˊ薩ㄙㄚˋ作ㄗㄨㄛˋ是ㄕˋ言ㄧㄢˊ：『我ㄨㄛˇ當ㄉㄤ莊ㄓㄨㄤ嚴ㄧㄢˊ佛ㄈㄛˊ土ㄊㄨˇ』，是ㄕˋ不ㄅㄨˋ名ㄇㄧㄥˊ菩ㄆㄨˊ薩ㄙㄚˋ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ：莊ㄓㄨㄤ嚴ㄧㄢˊ佛ㄈㄛˊ土ㄊㄨˇ者ㄓㄜˇ，即ㄐㄧˊ非ㄈㄟ莊ㄓㄨㄤ嚴ㄧㄢˊ，是ㄕˋ名ㄇㄧㄥˊ莊ㄓㄨㄤ嚴ㄧㄢˊ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，若ㄖㄨㄛˋ菩ㄆㄨˊ薩ㄙㄚˋ通ㄊㄨㄥ達ㄉㄚˊ無ㄨˊ我ㄨㄛˇ法ㄈㄚˇ者ㄓㄜˇ，如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ名ㄇㄧㄥˊ真ㄓㄣ是ㄕˋ菩ㄆㄨˊ薩ㄙㄚˋ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，如ㄖㄨˊ來ㄌㄞˊ有ㄧㄡˇ肉ㄖㄡˋ眼ㄧㄢˇ不ㄈㄡˇ？」\n「如ㄖㄨˊ是ㄕˋ，世ㄕˋ尊ㄗㄨㄣ，如ㄖㄨˊ來ㄌㄞˊ有ㄧㄡˇ肉ㄖㄡˋ眼ㄧㄢˇ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，如ㄖㄨˊ來ㄌㄞˊ有ㄧㄡˇ天ㄊㄧㄢ眼ㄧㄢˇ不ㄈㄡˇ？」\n「如ㄖㄨˊ是ㄕˋ，世ㄕˋ尊ㄗㄨㄣ，如ㄖㄨˊ來ㄌㄞˊ有ㄧㄡˇ天ㄊㄧㄢ眼ㄧㄢˇ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，如ㄖㄨˊ來ㄌㄞˊ有ㄧㄡˇ慧ㄏㄨㄟˋ眼ㄧㄢˇ不ㄈㄡˇ？」\n「如ㄖㄨˊ是ㄕˋ，世ㄕˋ尊ㄗㄨㄣ，如ㄖㄨˊ來ㄌㄞˊ有ㄧㄡˇ慧ㄏㄨㄟˋ眼ㄧㄢˇ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，如ㄖㄨˊ來ㄌㄞˊ有ㄧㄡˇ法ㄈㄚˇ眼ㄧㄢˇ不ㄈㄡˇ？」\n「如ㄖㄨˊ是ㄕˋ，世ㄕˋ尊ㄗㄨㄣ，如ㄖㄨˊ來ㄌㄞˊ有ㄧㄡˇ法ㄈㄚˇ眼ㄧㄢˇ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，如ㄖㄨˊ來ㄌㄞˊ有ㄧㄡˇ佛ㄈㄛˊ眼ㄧㄢˇ不ㄈㄡˇ？」\n「如ㄖㄨˊ是ㄕˋ，世ㄕˋ尊ㄗㄨㄣ，如ㄖㄨˊ來ㄌㄞˊ有ㄧㄡˇ佛ㄈㄛˊ眼ㄧㄢˇ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，恆ㄏㄥˊ河ㄏㄜˊ中ㄓㄨㄥ所ㄙㄨㄛˇ有ㄧㄡˇ沙ㄕㄚ，佛ㄈㄛˊ說ㄕㄨㄛ是ㄕˋ沙ㄕㄚ不ㄈㄡˇ？」\n「如ㄖㄨˊ是ㄕˋ，世ㄕˋ尊ㄗㄨㄣ，如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ是ㄕˋ沙ㄕㄚ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，如ㄖㄨˊ一ㄧˋ恆ㄏㄥˊ河ㄏㄜˊ中ㄓㄨㄥ所ㄙㄨㄛˇ有ㄧㄡˇ沙ㄕㄚ，有ㄧㄡˇ如ㄖㄨˊ是ㄕˋ沙ㄕㄚ等ㄉㄥˇ恆ㄏㄥˊ河ㄏㄜˊ，是ㄕˋ諸ㄓㄨ恆ㄏㄥˊ河ㄏㄜˊ所ㄙㄨㄛˇ有ㄧㄡˇ沙ㄕㄚ數ㄕㄨˋ佛ㄈㄛˊ世ㄕˋ界ㄐㄧㄝˋ，如ㄖㄨˊ是ㄕˋ寧ㄋㄧㄥˊ為ㄨㄟˊ多ㄉㄨㄛ不ㄈㄡˇ？」\n「甚ㄕㄣˋ多ㄉㄨㄛ，世ㄕˋ尊ㄗㄨㄣ。」\n佛ㄈㄛˊ告ㄍㄠˋ須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ：「爾ㄦˇ所ㄙㄨㄛˇ國ㄍㄨㄛˊ土ㄊㄨˇ中ㄓㄨㄥ，所ㄙㄨㄛˇ有ㄧㄡˇ眾ㄓㄨㄥˋ生ㄕㄥ，若ㄖㄨㄛˋ干ㄍㄢ種ㄓㄨㄥˇ心ㄒㄧㄣ，如ㄖㄨˊ來ㄌㄞˊ悉ㄒㄧ知ㄓ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ：諸ㄓㄨ心ㄒㄧㄣ皆ㄐㄧㄝ為ㄨㄟˊ非ㄈㄟ心ㄒㄧㄣ，是ㄕˋ名ㄇㄧㄥˊ為ㄨㄟˊ心ㄒㄧㄣ。所ㄙㄨㄛˇ以ㄧˇ者ㄓㄜˇ何ㄏㄜˊ，須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，過ㄍㄨㄛˋ去ㄑㄩˋ心ㄒㄧㄣ不ㄅㄨˋ可ㄎㄜˇ得ㄉㄜˊ，現ㄒㄧㄢˋ在ㄗㄞˋ心ㄒㄧㄣ不ㄅㄨˋ可ㄎㄜˇ得ㄉㄜˊ，未ㄨㄟˋ來ㄌㄞˊ心ㄒㄧㄣ不ㄅㄨˋ可ㄎㄜˇ得ㄉㄜˊ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，若ㄖㄨㄛˋ有ㄧㄡˇ人ㄖㄣˊ滿ㄇㄢˇ三ㄙㄢ千ㄑㄧㄢ大ㄉㄚˋ千ㄑㄧㄢ世ㄕˋ界ㄐㄧㄝˋ七ㄑㄧ寶ㄅㄠˇ以ㄧˇ用ㄩㄥˋ布ㄅㄨˋ施ㄕˋ，是ㄕˋ人ㄖㄣˊ以ㄧˇ是ㄕˋ因ㄧㄣ緣ㄩㄢˊ，得ㄉㄜˊ福ㄈㄨˊ多ㄉㄨㄛ不ㄈㄡˇ？」\n「如ㄖㄨˊ是ㄕˋ，世ㄕˋ尊ㄗㄨㄣ，此ㄘˇ人ㄖㄣˊ以ㄧˇ是ㄕˋ因ㄧㄣ緣ㄩㄢˊ，得ㄉㄜˊ福ㄈㄨˊ甚ㄕㄣˋ多ㄉㄨㄛ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，若ㄖㄨㄛˋ福ㄈㄨˊ德ㄉㄜˊ有ㄧㄡˇ實ㄕˊ，如ㄖㄨˊ來ㄌㄞˊ不ㄅㄨˋ說ㄕㄨㄛ得ㄉㄜˊ福ㄈㄨˊ德ㄉㄜˊ多ㄉㄨㄛ，以ㄧˇ福ㄈㄨˊ德ㄉㄜˊ無ㄨˊ故ㄍㄨˋ，如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ得ㄉㄜˊ福ㄈㄨˊ德ㄉㄜˊ多ㄉㄨㄛ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，佛ㄈㄛˊ可ㄎㄜˇ以ㄧˇ具ㄐㄩˋ足ㄗㄨˊ色ㄙㄜˋ身ㄕㄣ見ㄐㄧㄢˋ不ㄈㄡˇ？」\n「不ㄈㄡˇ也ㄧㄝˇ，世ㄕˋ尊ㄗㄨㄣ，如ㄖㄨˊ來ㄌㄞˊ不ㄅㄨˋ應ㄧㄥ以ㄧˇ色ㄙㄜˋ身ㄕㄣ見ㄐㄧㄢˋ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ：具ㄐㄩˋ足ㄗㄨˊ色ㄙㄜˋ身ㄕㄣ，即ㄐㄧˊ非ㄈㄟ具ㄐㄩˋ足ㄗㄨˊ色ㄙㄜˋ身ㄕㄣ，是ㄕˋ名ㄇㄧㄥˊ具ㄐㄩˋ足ㄗㄨˊ色ㄙㄜˋ身ㄕㄣ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，如ㄖㄨˊ來ㄌㄞˊ可ㄎㄜˇ以ㄧˇ具ㄐㄩˋ足ㄗㄨˊ諸ㄓㄨ相ㄒㄧㄤˋ見ㄐㄧㄢˋ不ㄈㄡˇ？」\n「不ㄈㄡˇ也ㄧㄝˇ，世ㄕˋ尊ㄗㄨㄣ，如ㄖㄨˊ來ㄌㄞˊ不ㄅㄨˋ應ㄧㄥ以ㄧˇ具ㄐㄩˋ足ㄗㄨˊ諸ㄓㄨ相ㄒㄧㄤˋ見ㄐㄧㄢˋ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ：諸ㄓㄨ相ㄒㄧㄤˋ具ㄐㄩˋ足ㄗㄨˊ，即ㄐㄧˊ非ㄈㄟ具ㄐㄩˋ足ㄗㄨˊ，是ㄕˋ名ㄇㄧㄥˊ諸ㄓㄨ相ㄒㄧㄤˋ具ㄐㄩˋ足ㄗㄨˊ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，汝ㄖㄨˇ勿ㄨˋ謂ㄨㄟˋ如ㄖㄨˊ來ㄌㄞˊ作ㄗㄨㄛˋ是ㄕˋ念ㄋㄧㄢˋ：『我ㄨㄛˇ當ㄉㄤ有ㄧㄡˇ所ㄙㄨㄛˇ說ㄕㄨㄛ法ㄈㄚˇ。』莫ㄇㄛˋ作ㄗㄨㄛˋ是ㄕˋ念ㄋㄧㄢˋ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，若ㄖㄨㄛˋ人ㄖㄣˊ言ㄧㄢˊ：如ㄖㄨˊ來ㄌㄞˊ有ㄧㄡˇ所ㄙㄨㄛˇ說ㄕㄨㄛ法ㄈㄚˇ，即ㄐㄧˊ為ㄨㄟˊ謗ㄅㄤˋ佛ㄈㄛˊ，不ㄅㄨˋ能ㄋㄥˊ解ㄐㄧㄝˇ我ㄨㄛˇ所ㄙㄨㄛˇ說ㄕㄨㄛ故ㄍㄨˋ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，說ㄕㄨㄛ法ㄈㄚˇ者ㄓㄜˇ，無ㄨˊ法ㄈㄚˇ可ㄎㄜˇ說ㄕㄨㄛ，是ㄕˋ名ㄇㄧㄥˊ說ㄕㄨㄛ法ㄈㄚˇ。」\n爾ㄦˇ時ㄕˊ，慧ㄏㄨㄟˋ命ㄇㄧㄥˋ須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ白ㄅㄛˊ佛ㄈㄛˊ言ㄧㄢˊ：「世ㄕˋ尊ㄗㄨㄣ，頗ㄆㄛˇ有ㄧㄡˇ眾ㄓㄨㄥˋ生ㄕㄥ，於ㄩˊ未ㄨㄟˋ來ㄌㄞˊ世ㄕˋ，聞ㄨㄣˊ說ㄕㄨㄛ是ㄕˋ法ㄈㄚˇ，生ㄕㄥ信ㄒㄧㄣˋ心ㄒㄧㄣ不ㄈㄡˇ？」\n佛ㄈㄛˊ言ㄧㄢˊ：「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，彼ㄅㄧˇ非ㄈㄟ眾ㄓㄨㄥˋ生ㄕㄥ，非ㄈㄟ不ㄅㄨˋ眾ㄓㄨㄥˋ生ㄕㄥ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，眾ㄓㄨㄥˋ生ㄕㄥ眾ㄓㄨㄥˋ生ㄕㄥ者ㄓㄜˇ，如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ非ㄈㄟ眾ㄓㄨㄥˋ生ㄕㄥ，是ㄕˋ名ㄇㄧㄥˊ眾ㄓㄨㄥˋ生ㄕㄥ。」\n須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ白ㄅㄛˊ佛ㄈㄛˊ言ㄧㄢˊ：「世ㄕˋ尊ㄗㄨㄣ，佛ㄈㄛˊ得ㄉㄜˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ，為ㄨㄟˋ無ㄨˊ所ㄙㄨㄛˇ得ㄉㄜˊ耶ㄧㄝˊ？」\n「如ㄖㄨˊ是ㄕˋ，如ㄖㄨˊ是ㄕˋ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，我ㄨㄛˇ於ㄩˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ，乃ㄋㄞˇ至ㄓˋ無ㄨˊ有ㄧㄡˇ少ㄕㄠˇ法ㄈㄚˇ可ㄎㄜˇ得ㄉㄜˊ，是ㄕˋ名ㄇㄧㄥˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ。」\n「復ㄈㄨˋ次ㄘˋ，須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，是ㄕˋ法ㄈㄚˇ平ㄆㄧㄥˊ等ㄉㄥˇ，無ㄨˊ有ㄧㄡˇ高ㄍㄠ下ㄒㄧㄚˋ，是ㄕˋ名ㄇㄧㄥˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ，以ㄧˇ無ㄨˊ我ㄨㄛˇ、無ㄨˊ人ㄖㄣˊ、無ㄨˊ眾ㄓㄨㄥˋ生ㄕㄥ、無ㄨˊ壽ㄕㄡˋ者ㄓㄜˇ，修ㄒㄧㄡ一ㄧˊ切ㄑㄧㄝˋ善ㄕㄢˋ法ㄈㄚˇ，則ㄗㄜˊ得ㄉㄜˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，所ㄙㄨㄛˇ言ㄧㄢˊ善ㄕㄢˋ法ㄈㄚˇ者ㄓㄜˇ，如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ非ㄈㄟ善ㄕㄢˋ法ㄈㄚˇ，是ㄕˋ名ㄇㄧㄥˊ善ㄕㄢˋ法ㄈㄚˇ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，若ㄖㄨㄛˋ三ㄙㄢ千ㄑㄧㄢ大ㄉㄚˋ千ㄑㄧㄢ世ㄕˋ界ㄐㄧㄝˋ中ㄓㄨㄥ所ㄙㄨㄛˇ有ㄧㄡˇ諸ㄓㄨ須ㄒㄩ彌ㄇㄧˊ山ㄕㄢ王ㄨㄤˊ，如ㄖㄨˊ是ㄕˋ等ㄉㄥˇ七ㄑㄧ寶ㄅㄠˇ聚ㄐㄩˋ，有ㄧㄡˇ人ㄖㄣˊ持ㄔˊ用ㄩㄥˋ布ㄅㄨˋ施ㄕˋ，若ㄖㄨㄛˋ人ㄖㄣˊ以ㄧˇ此ㄘˇ《般ㄅㄛ若ㄖㄜˋ波ㄅㄛ羅ㄌㄨㄛˊ蜜ㄇㄧˋ經ㄐㄧㄥ》，乃ㄋㄞˇ至ㄓˋ四ㄙˋ句ㄐㄩˋ偈ㄐㄧˋ等ㄉㄥˇ，受ㄕㄡˋ持ㄔˊ讀ㄉㄨˊ誦ㄙㄨㄥˋ，為ㄨㄟˋ他ㄊㄚ人ㄖㄣˊ說ㄕㄨㄛ，於ㄩˊ前ㄑㄧㄢˊ福ㄈㄨˊ德ㄉㄜˊ百ㄅㄞˇ分ㄈㄣˋ不ㄅㄨˋ及ㄐㄧˊ一ㄧ，百ㄅㄞˇ千ㄑㄧㄢ萬ㄨㄢˋ億ㄧˋ分ㄈㄣˋ，乃ㄋㄞˇ至ㄓˋ算ㄙㄨㄢˋ數ㄕㄨˋ譬ㄆㄧˋ喻ㄩˋ所ㄙㄨㄛˇ不ㄅㄨˋ能ㄋㄥˊ及ㄐㄧˊ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，汝ㄖㄨˇ等ㄉㄥˇ勿ㄨˋ謂ㄨㄟˋ如ㄖㄨˊ來ㄌㄞˊ作ㄗㄨㄛˋ是ㄕˋ念ㄋㄧㄢˋ：『我ㄨㄛˇ當ㄉㄤ度ㄉㄨˋ眾ㄓㄨㄥˋ生ㄕㄥ。』須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，莫ㄇㄛˋ作ㄗㄨㄛˋ是ㄕˋ念ㄋㄧㄢˋ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，實ㄕˊ無ㄨˊ有ㄧㄡˇ眾ㄓㄨㄥˋ生ㄕㄥ如ㄖㄨˊ來ㄌㄞˊ度ㄉㄨˋ者ㄓㄜˇ。若ㄖㄨㄛˋ有ㄧㄡˇ眾ㄓㄨㄥˋ生ㄕㄥ如ㄖㄨˊ來ㄌㄞˊ度ㄉㄨˋ者ㄓㄜˇ，如ㄖㄨˊ來ㄌㄞˊ則ㄗㄜˊ有ㄧㄡˇ我ㄨㄛˇ、人ㄖㄣˊ、眾ㄓㄨㄥˋ生ㄕㄥ、壽ㄕㄡˋ者ㄓㄜˇ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ：『有ㄧㄡˇ我ㄨㄛˇ者ㄓㄜˇ，則ㄗㄜˊ非ㄈㄟ有ㄧㄡˇ我ㄨㄛˇ，而ㄦˊ凡ㄈㄢˊ夫ㄈㄨ之ㄓ人ㄖㄣˊ以ㄧˇ為ㄨㄟˊ有ㄧㄡˇ我ㄨㄛˇ。』須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，凡ㄈㄢˊ夫ㄈㄨ者ㄓㄜˇ，如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ則ㄗㄜˊ非ㄈㄟ凡ㄈㄢˊ夫ㄈㄨ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，可ㄎㄜˇ以ㄧˇ三ㄙㄢ十ㄕˊ二ㄦˋ相ㄒㄧㄤˋ觀ㄍㄨㄢ如ㄖㄨˊ來ㄌㄞˊ不ㄈㄡˇ？」\n須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ言ㄧㄢˊ：「如ㄖㄨˊ是ㄕˋ，如ㄖㄨˊ是ㄕˋ，以ㄧˇ三ㄙㄢ十ㄕˊ二ㄦˋ相ㄒㄧㄤˋ觀ㄍㄨㄢ如ㄖㄨˊ來ㄌㄞˊ。」\n佛ㄈㄛˊ言ㄧㄢˊ：「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，若ㄖㄨㄛˋ以ㄧˇ三ㄙㄢ十ㄕˊ二ㄦˋ相ㄒㄧㄤˋ觀ㄍㄨㄢ如ㄖㄨˊ來ㄌㄞˊ者ㄓㄜˇ，轉ㄓㄨㄢˇ輪ㄌㄨㄣˊ聖ㄕㄥˋ王ㄨㄤˊ則ㄗㄜˊ是ㄕˋ如ㄖㄨˊ來ㄌㄞˊ。」\n須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ白ㄅㄛˊ佛ㄈㄛˊ言ㄧㄢˊ：「世ㄕˋ尊ㄗㄨㄣ，如ㄖㄨˊ我ㄨㄛˇ解ㄐㄧㄝˇ佛ㄈㄛˊ所ㄙㄨㄛˇ說ㄕㄨㄛ義ㄧˋ，不ㄅㄨˋ應ㄧㄥ以ㄧˇ三ㄙㄢ十ㄕˊ二ㄦˋ相ㄒㄧㄤˋ觀ㄍㄨㄢ如ㄖㄨˊ來ㄌㄞˊ。」\n爾ㄦˇ時ㄕˊ，世ㄕˋ尊ㄗㄨㄣ而ㄦˊ說ㄕㄨㄛ偈ㄐㄧˋ言ㄧㄢˊ：「若ㄖㄨㄛˋ以ㄧˇ色ㄙㄜˋ見ㄐㄧㄢˋ我ㄨㄛˇ，以ㄧˇ音ㄧㄣ聲ㄕㄥ求ㄑㄧㄡˊ我ㄨㄛˇ，是ㄕˋ人ㄖㄣˊ行ㄒㄧㄥˊ邪ㄒㄧㄝˊ道ㄉㄠˋ，不ㄅㄨˋ能ㄋㄥˊ見ㄐㄧㄢˋ如ㄖㄨˊ來ㄌㄞˊ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，汝ㄖㄨˇ若ㄖㄨㄛˋ作ㄗㄨㄛˋ是ㄕˋ念ㄋㄧㄢˋ：『如ㄖㄨˊ來ㄌㄞˊ不ㄅㄨˋ以ㄧˇ具ㄐㄩˋ足ㄗㄨˊ相ㄒㄧㄤˋ故ㄍㄨˋ，得ㄉㄜˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ。』須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，莫ㄇㄛˋ作ㄗㄨㄛˋ是ㄕˋ念ㄋㄧㄢˋ：『如ㄖㄨˊ來ㄌㄞˊ不ㄅㄨˋ以ㄧˇ具ㄐㄩˋ足ㄗㄨˊ相ㄒㄧㄤˋ故ㄍㄨˋ，得ㄉㄜˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ。』須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，汝ㄖㄨˇ若ㄖㄨㄛˋ作ㄗㄨㄛˋ是ㄕˋ念ㄋㄧㄢˋ，發ㄈㄚ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ者ㄓㄜˇ，說ㄕㄨㄛ諸ㄓㄨ法ㄈㄚˇ斷ㄉㄨㄢˋ滅ㄇㄧㄝˋ，莫ㄇㄛˋ作ㄗㄨㄛˋ是ㄕˋ念ㄋㄧㄢˋ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，發ㄈㄚ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ者ㄓㄜˇ，於ㄩˊ法ㄈㄚˇ不ㄅㄨˋ說ㄕㄨㄛ斷ㄉㄨㄢˋ滅ㄇㄧㄝˋ相ㄒㄧㄤˋ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，若ㄖㄨㄛˋ菩ㄆㄨˊ薩ㄙㄚˋ以ㄧˇ滿ㄇㄢˇ恆ㄏㄥˊ河ㄏㄜˊ沙ㄕㄚ等ㄉㄥˇ世ㄕˋ界ㄐㄧㄝˋ七ㄑㄧ寶ㄅㄠˇ布ㄅㄨˋ施ㄕˋ，若ㄖㄨㄛˋ復ㄈㄨˋ有ㄧㄡˇ人ㄖㄣˊ知ㄓ一ㄧˊ切ㄑㄧㄝˋ法ㄈㄚˇ無ㄨˊ我ㄨㄛˇ，得ㄉㄜˊ成ㄔㄥˊ於ㄩˊ忍ㄖㄣˇ，此ㄘˇ菩ㄆㄨˊ薩ㄙㄚˋ勝ㄕㄥˋ前ㄑㄧㄢˊ菩ㄆㄨˊ薩ㄙㄚˋ所ㄙㄨㄛˇ得ㄉㄜˊ功ㄍㄨㄥ德ㄉㄜˊ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，以ㄧˇ諸ㄓㄨ菩ㄆㄨˊ薩ㄙㄚˋ不ㄅㄨˋ受ㄕㄡˋ福ㄈㄨˊ德ㄉㄜˊ故ㄍㄨˋ。」\n須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ白ㄅㄛˊ佛ㄈㄛˊ言ㄧㄢˊ：「世ㄕˋ尊ㄗㄨㄣ，云ㄩㄣˊ何ㄏㄜˊ菩ㄆㄨˊ薩ㄙㄚˋ不ㄅㄨˋ受ㄕㄡˋ福ㄈㄨˊ德ㄉㄜˊ？」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，菩ㄆㄨˊ薩ㄙㄚˋ所ㄙㄨㄛˇ作ㄗㄨㄛˋ福ㄈㄨˊ德ㄉㄜˊ，不ㄅㄨˋ應ㄧㄥ貪ㄊㄢ著ㄓㄨㄛˊ，是ㄕˋ故ㄍㄨˋ說ㄕㄨㄛ不ㄅㄨˋ受ㄕㄡˋ福ㄈㄨˊ德ㄉㄜˊ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，若ㄖㄨㄛˋ有ㄧㄡˇ人ㄖㄣˊ言ㄧㄢˊ：如ㄖㄨˊ來ㄌㄞˊ若ㄖㄨㄛˋ來ㄌㄞˊ若ㄖㄨㄛˋ去ㄑㄩˋ，若ㄖㄨㄛˋ坐ㄗㄨㄛˋ若ㄖㄨㄛˋ臥ㄨㄛˋ，是ㄕˋ人ㄖㄣˊ不ㄅㄨˋ解ㄐㄧㄝˇ我ㄨㄛˇ所ㄙㄨㄛˇ說ㄕㄨㄛ義ㄧˋ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，如ㄖㄨˊ來ㄌㄞˊ者ㄓㄜˇ，無ㄨˊ所ㄙㄨㄛˇ從ㄘㄨㄥˊ來ㄌㄞˊ，亦ㄧˋ無ㄨˊ所ㄙㄨㄛˇ去ㄑㄩˋ，故ㄍㄨˋ名ㄇㄧㄥˊ如ㄖㄨˊ來ㄌㄞˊ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，若ㄖㄨㄛˋ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ、善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ，以ㄧˇ三ㄙㄢ千ㄑㄧㄢ大ㄉㄚˋ千ㄑㄧㄢ世ㄕˋ界ㄐㄧㄝˋ碎ㄙㄨㄟˋ為ㄨㄟˊ微ㄨㄟˊ塵ㄔㄣˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，是ㄕˋ微ㄨㄟˊ塵ㄔㄣˊ眾ㄓㄨㄥˋ寧ㄋㄧㄥˊ為ㄨㄟˊ多ㄉㄨㄛ不ㄈㄡˇ？」\n「甚ㄕㄣˋ多ㄉㄨㄛ，世ㄕˋ尊ㄗㄨㄣ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，若ㄖㄨㄛˋ是ㄕˋ微ㄨㄟˊ塵ㄔㄣˊ眾ㄓㄨㄥˋ實ㄕˊ有ㄧㄡˇ者ㄓㄜˇ，佛ㄈㄛˊ則ㄗㄜˊ不ㄅㄨˋ說ㄕㄨㄛ是ㄕˋ微ㄨㄟˊ塵ㄔㄣˊ眾ㄓㄨㄥˋ。所ㄙㄨㄛˇ以ㄧˇ者ㄓㄜˇ何ㄏㄜˊ，佛ㄈㄛˊ說ㄕㄨㄛ微ㄨㄟˊ塵ㄔㄣˊ眾ㄓㄨㄥˋ，則ㄗㄜˊ非ㄈㄟ微ㄨㄟˊ塵ㄔㄣˊ眾ㄓㄨㄥˋ，是ㄕˋ名ㄇㄧㄥˊ微ㄨㄟˊ塵ㄔㄣˊ眾ㄓㄨㄥˋ。世ㄕˋ尊ㄗㄨㄣ，如ㄖㄨˊ來ㄌㄞˊ所ㄙㄨㄛˇ說ㄕㄨㄛ三ㄙㄢ千ㄑㄧㄢ大ㄉㄚˋ千ㄑㄧㄢ世ㄕˋ界ㄐㄧㄝˋ，則ㄗㄜˊ非ㄈㄟ世ㄕˋ界ㄐㄧㄝˋ，是ㄕˋ名ㄇㄧㄥˊ世ㄕˋ界ㄐㄧㄝˋ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ，若ㄖㄨㄛˋ世ㄕˋ界ㄐㄧㄝˋ實ㄕˊ有ㄧㄡˇ，則ㄗㄜˊ是ㄕˋ一ㄧˊ合ㄏㄜˊ相ㄒㄧㄤˋ。」\n如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ：「一ㄧˊ合ㄏㄜˊ相ㄒㄧㄤˋ，則ㄗㄜˊ非ㄈㄟ一ㄧˊ合ㄏㄜˊ相ㄒㄧㄤˋ，是ㄕˋ名ㄇㄧㄥˊ一ㄧˊ合ㄏㄜˊ相ㄒㄧㄤˋ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，一ㄧˊ合ㄏㄜˊ相ㄒㄧㄤˋ者ㄓㄜˇ，則ㄗㄜˊ是ㄕˋ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ，但ㄉㄢˋ凡ㄈㄢˊ夫ㄈㄨ之ㄓ人ㄖㄣˊ貪ㄊㄢ著ㄓㄨㄛˊ其ㄑㄧˊ事ㄕˋ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，若ㄖㄨㄛˋ人ㄖㄣˊ言ㄧㄢˊ：佛ㄈㄛˊ說ㄕㄨㄛ我ㄨㄛˇ見ㄐㄧㄢˋ、人ㄖㄣˊ見ㄐㄧㄢˋ、眾ㄓㄨㄥˋ生ㄕㄥ見ㄐㄧㄢˋ、壽ㄕㄡˋ者ㄓㄜˇ見ㄐㄧㄢˋ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，是ㄕˋ人ㄖㄣˊ解ㄐㄧㄝˇ我ㄨㄛˇ所ㄙㄨㄛˇ說ㄕㄨㄛ義ㄧˋ不ㄈㄡˇ？」\n「世ㄕˋ尊ㄗㄨㄣ，是ㄕˋ人ㄖㄣˊ不ㄅㄨˋ解ㄐㄧㄝˇ如ㄖㄨˊ來ㄌㄞˊ所ㄙㄨㄛˇ說ㄕㄨㄛ義ㄧˋ，何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ？」\n世ㄕˋ尊ㄗㄨㄣ說ㄕㄨㄛ：「我ㄨㄛˇ見ㄐㄧㄢˋ、人ㄖㄣˊ見ㄐㄧㄢˋ、眾ㄓㄨㄥˋ生ㄕㄥ見ㄐㄧㄢˋ、壽ㄕㄡˋ者ㄓㄜˇ見ㄐㄧㄢˋ，即ㄐㄧˊ非ㄈㄟ我ㄨㄛˇ見ㄐㄧㄢˋ、人ㄖㄣˊ見ㄐㄧㄢˋ、眾ㄓㄨㄥˋ生ㄕㄥ見ㄐㄧㄢˋ、壽ㄕㄡˋ者ㄓㄜˇ見ㄐㄧㄢˋ，是ㄕˋ名ㄇㄧㄥˊ我ㄨㄛˇ見ㄐㄧㄢˋ、人ㄖㄣˊ見ㄐㄧㄢˋ、眾ㄓㄨㄥˋ生ㄕㄥ見ㄐㄧㄢˋ、壽ㄕㄡˋ者ㄓㄜˇ見ㄐㄧㄢˋ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，發ㄈㄚ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ心ㄒㄧㄣ者ㄓㄜˇ，於ㄩˊ一ㄧˊ切ㄑㄧㄝˋ法ㄈㄚˇ，應ㄧㄥ如ㄖㄨˊ是ㄕˋ知ㄓ、如ㄖㄨˊ是ㄕˋ見ㄐㄧㄢˋ、如ㄖㄨˊ是ㄕˋ信ㄒㄧㄣˋ解ㄐㄧㄝˇ，不ㄅㄨˋ生ㄕㄥ法ㄈㄚˇ相ㄒㄧㄤˋ。須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，所ㄙㄨㄛˇ言ㄧㄢˊ法ㄈㄚˇ相ㄒㄧㄤˋ者ㄓㄜˇ，如ㄖㄨˊ來ㄌㄞˊ說ㄕㄨㄛ即ㄐㄧˊ非ㄈㄟ法ㄈㄚˇ相ㄒㄧㄤˋ，是ㄕˋ名ㄇㄧㄥˊ法ㄈㄚˇ相ㄒㄧㄤˋ。」\n「須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ，若ㄖㄨㄛˋ有ㄧㄡˇ人ㄖㄣˊ以ㄧˇ滿ㄇㄢˇ無ㄨˊ量ㄌㄧㄤˋ阿ㄚ僧ㄙㄥ祇ㄑㄧˊ世ㄕˋ界ㄐㄧㄝˋ七ㄑㄧ寶ㄅㄠˇ持ㄔˊ用ㄩㄥˋ布ㄅㄨˋ施ㄕˋ，若ㄖㄨㄛˋ有ㄧㄡˇ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ、善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ，發ㄈㄚ菩ㄆㄨˊ薩ㄙㄚˋ心ㄒㄧㄣ者ㄓㄜˇ，持ㄔˊ於ㄩˊ此ㄘˇ經ㄐㄧㄥ，乃ㄋㄞˇ至ㄓˋ四ㄙˋ句ㄐㄩˋ偈ㄐㄧˋ等ㄉㄥˇ，受ㄕㄡˋ持ㄔˊ讀ㄉㄨˊ誦ㄙㄨㄥˋ，為ㄨㄟˋ人ㄖㄣˊ演ㄧㄢˇ說ㄕㄨㄛ，其ㄑㄧˊ福ㄈㄨˊ勝ㄕㄥˋ彼ㄅㄧˇ。云ㄩㄣˊ何ㄏㄜˊ『為ㄨㄟˋ人ㄖㄣˊ演ㄧㄢˇ說ㄕㄨㄛ，不ㄅㄨˋ取ㄑㄩˇ於ㄩˊ相ㄒㄧㄤˋ，如ㄖㄨˊ如ㄖㄨˊ不ㄅㄨˋ動ㄉㄨㄥˋ。』何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ？」\n一ㄧˊ切ㄑㄧㄝˋ有ㄧㄡˇ為ㄨㄟˊ法ㄈㄚˇ，如ㄖㄨˊ夢ㄇㄥˋ幻ㄏㄨㄢˋ泡ㄆㄠˋ影ㄧㄥˇ，\n如ㄖㄨˊ露ㄌㄨˋ亦ㄧˋ如ㄖㄨˊ電ㄉㄧㄢˋ，應ㄧㄥ作ㄗㄨㄛˋ如ㄖㄨˊ是ㄕˋ觀ㄍㄨㄢ。\n佛ㄈㄛˊ說ㄕㄨㄛ是ㄕˋ經ㄐㄧㄥ已ㄧˇ，長ㄓㄤˇ老ㄌㄠˇ須ㄒㄩ菩ㄆㄨˊ提ㄊㄧˊ及ㄐㄧˊ諸ㄓㄨ比ㄅㄧˇ丘ㄑㄧㄡ、比ㄅㄧˇ丘ㄑㄧㄡ尼ㄋㄧˊ、優ㄧㄡ婆ㄆㄛˊ塞ㄙㄜˋ、優ㄧㄡ婆ㄆㄛˊ夷ㄧˊ、一ㄧˊ切ㄑㄧㄝˋ世ㄕˋ間ㄐㄧㄢ、天ㄊㄧㄢ、人ㄖㄣˊ、阿ㄚ修ㄒㄧㄡ羅ㄌㄨㄛˊ，聞ㄨㄣˊ佛ㄈㄛˊ所ㄙㄨㄛˇ說ㄕㄨㄛ，皆ㄐㄧㄝ大ㄉㄚˋ歡ㄏㄨㄢ喜ㄒㄧˇ，信ㄒㄧㄣˋ受ㄕㄡˋ奉ㄈㄥˋ行ㄒㄧㄥˊ。','《金剛般若波羅蜜經》簡稱《金剛經》，鳩摩羅什譯，是般若類經典的代表，佛陀為須菩提宣說「應無所住而生其心」，破除我、人、眾生、壽者四相，常為開智慧、消業障、增福而持誦。注音由使用者提供的圖片逐頁辨識整理，請以您慣用的版本核對。','佛在舍衛國祇樹給孤獨園，須菩提請問：發無上菩提心的人，應該如何安住、如何降伏其心？佛說：要發願度盡一切眾生，卻不執著有眾生被度；布施時不住於色聲香味觸法，不執著於相，福德才不可思量。凡所有相皆是虛妄，若見諸相非相，即見如來。佛又說明受持此經乃至四句偈、為人演說的功德遠勝以滿三千大千世界七寶布施；一切法無我，佛法如筏，應捨法與非法；過去心、現在心、未來心不可得；最後以偈頌總結：「一切有為法，如夢幻泡影，如露亦如電，應作如是觀。」大眾歡喜信受奉行。（白話大意）'),
  mk('s_pumen','觀世音菩薩普門品','經','觀世音菩薩','尋聲救苦、遠離怖畏、祈求平安與求子','觀音類','姚秦・鳩摩羅什譯',['消災除惡','滿願得子','平安順遂'],1,900,'爾ㄦˇ時ㄕˊ，無ㄨˊ盡ㄐㄧㄣˋ意ㄧˋ菩ㄆㄨˊ薩ㄙㄚˋ即ㄐㄧˊ從ㄘㄨㄥˊ座ㄗㄨㄛˋ起ㄑㄧˇ，偏ㄆㄧㄢ袒ㄊㄢˇ右ㄧㄡˋ肩ㄐㄧㄢ，合ㄏㄜˊ掌ㄓㄤˇ向ㄒㄧㄤˋ佛ㄈㄛˊ，而ㄦˊ作ㄗㄨㄛˋ是ㄕˋ言ㄧㄢˊ：「世ㄕˋ尊ㄗㄨㄣ！觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ以ㄧˇ何ㄏㄜˊ因ㄧㄣ緣ㄩㄢˊ，名ㄇㄧㄥˊ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ？」佛ㄈㄛˊ告ㄍㄠˋ無ㄨˊ盡ㄐㄧㄣˋ意ㄧˋ菩ㄆㄨˊ薩ㄙㄚˋ：「善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ！若ㄖㄨㄛˋ有ㄧㄡˇ無ㄨˊ量ㄌㄧㄤˋ百ㄅㄞˇ千ㄑㄧㄢ萬ㄨㄢˋ億ㄧˋ眾ㄓㄨㄥˋ生ㄕㄥ，受ㄕㄡˋ諸ㄓㄨ苦ㄎㄨˇ惱ㄋㄠˇ，聞ㄨㄣˊ是ㄕˋ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ，一ㄧˋ心ㄒㄧㄣ稱ㄔㄥ名ㄇㄧㄥˊ，觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ即ㄐㄧˊ時ㄕˊ觀ㄍㄨㄢ其ㄑㄧˊ音ㄧㄣ聲ㄕㄥ，皆ㄐㄧㄝ得ㄉㄜˊ解ㄐㄧㄝˇ脫ㄊㄨㄛ。若ㄖㄨㄛˋ有ㄧㄡˇ持ㄔˊ是ㄕˋ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ名ㄇㄧㄥˊ者ㄓㄜˇ，設ㄕㄜˋ入ㄖㄨˋ大ㄉㄚˋ火ㄏㄨㄛˇ，火ㄏㄨㄛˇ不ㄅㄨˋ能ㄋㄥˊ燒ㄕㄠ，由ㄧㄡˊ是ㄕˋ菩ㄆㄨˊ薩ㄙㄚˋ威ㄨㄟ神ㄕㄣˊ力ㄌㄧˋ故ㄍㄨˋ。若ㄖㄨㄛˋ為ㄨㄟˊ大ㄉㄚˋ水ㄕㄨㄟˇ所ㄙㄨㄛˇ漂ㄆㄧㄠ，稱ㄔㄥ其ㄑㄧˊ名ㄇㄧㄥˊ號ㄏㄠˋ，即ㄐㄧˊ得ㄉㄜˊ淺ㄑㄧㄢˇ處ㄔㄨˋ。若ㄖㄨㄛˋ有ㄧㄡˇ百ㄅㄞˇ千ㄑㄧㄢ萬ㄨㄢˋ億ㄧˋ眾ㄓㄨㄥˋ生ㄕㄥ，為ㄨㄟˋ求ㄑㄧㄡˊ金ㄐㄧㄣ銀ㄧㄣˊ、琉ㄌㄧㄡˊ璃ㄌㄧˊ、硨ㄔㄜ磲ㄑㄩˊ、瑪ㄇㄚˇ瑙ㄋㄠˇ、珊ㄕㄢ瑚ㄏㄨˊ、琥ㄏㄨˇ珀ㄆㄛˋ、真ㄓㄣ珠ㄓㄨ等ㄉㄥˇ寶ㄅㄠˇ，入ㄖㄨˋ於ㄩˊ大ㄉㄚˋ海ㄏㄞˇ，假ㄐㄧㄚˇ使ㄕˇ黑ㄏㄟ風ㄈㄥ吹ㄔㄨㄟ其ㄑㄧˊ船ㄔㄨㄢˊ舫ㄈㄤˇ，漂ㄆㄧㄠ墮ㄉㄨㄛˋ羅ㄌㄨㄛˊ剎ㄔㄚˋ鬼ㄍㄨㄟˇ國ㄍㄨㄛˊ，其ㄑㄧˊ中ㄓㄨㄥ若ㄖㄨㄛˋ有ㄧㄡˇ乃ㄋㄞˇ至ㄓˋ一ㄧˋ人ㄖㄣˊ稱ㄔㄥ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ名ㄇㄧㄥˊ者ㄓㄜˇ，是ㄕˋ諸ㄓㄨ人ㄖㄣˊ等ㄉㄥˇ，皆ㄐㄧㄝ得ㄉㄜˊ解ㄐㄧㄝˇ脫ㄊㄨㄛ羅ㄌㄨㄛˊ剎ㄔㄚˋ之ㄓ難ㄋㄢˋ，以ㄧˇ是ㄕˋ因ㄧㄣ緣ㄩㄢˊ，名ㄇㄧㄥˊ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ。」\n「若ㄖㄨㄛˋ復ㄈㄨˋ有ㄧㄡˇ人ㄖㄣˊ臨ㄌㄧㄣˊ當ㄉㄤ被ㄅㄟˋ害ㄏㄞˋ，稱ㄔㄥ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ名ㄇㄧㄥˊ者ㄓㄜˇ，彼ㄅㄧˇ所ㄙㄨㄛˇ執ㄓˊ刀ㄉㄠ杖ㄓㄤˋ，尋ㄒㄩㄣˊ段ㄉㄨㄢˋ段ㄉㄨㄢˋ壞ㄏㄨㄞˋ，而ㄦˊ得ㄉㄜˊ解ㄐㄧㄝˇ脫ㄊㄨㄛ。若ㄖㄨㄛˋ三ㄙㄢ千ㄑㄧㄢ大ㄉㄚˋ千ㄑㄧㄢ國ㄍㄨㄛˊ土ㄊㄨˇ，滿ㄇㄢˇ中ㄓㄨㄥ夜ㄧㄝˋ叉ㄔㄚ羅ㄌㄨㄛˊ剎ㄔㄚˋ，欲ㄩˋ來ㄌㄞˊ惱ㄋㄠˇ人ㄖㄣˊ，聞ㄨㄣˊ其ㄑㄧˊ稱ㄔㄥ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ名ㄇㄧㄥˊ者ㄓㄜˇ，是ㄕˋ諸ㄓㄨ惡ㄜˋ鬼ㄍㄨㄟˇ尚ㄕㄤˋ不ㄅㄨˋ能ㄋㄥˊ以ㄧˇ惡ㄜˋ眼ㄧㄢˇ視ㄕˋ之ㄓ，況ㄎㄨㄤˋ復ㄈㄨˋ加ㄐㄧㄚ害ㄏㄞˋ？設ㄕㄜˋ復ㄈㄨˋ有ㄧㄡˇ人ㄖㄣˊ，若ㄖㄨㄛˋ有ㄧㄡˇ罪ㄗㄨㄟˋ，若ㄖㄨㄛˋ無ㄨˊ罪ㄗㄨㄟˋ，杻ㄔㄡˇ械ㄒㄧㄝˋ枷ㄐㄧㄚ鎖ㄙㄨㄛˇ，檢ㄐㄧㄢˇ繫ㄒㄧˋ其ㄑㄧˊ身ㄕㄣ，稱ㄔㄥ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ名ㄇㄧㄥˊ者ㄓㄜˇ，皆ㄐㄧㄝ悉ㄒㄧ斷ㄉㄨㄢˋ壞ㄏㄨㄞˋ，即ㄐㄧˊ得ㄉㄜˊ解ㄐㄧㄝˇ脫ㄊㄨㄛ。若ㄖㄨㄛˋ三ㄙㄢ千ㄑㄧㄢ大ㄉㄚˋ千ㄑㄧㄢ國ㄍㄨㄛˊ土ㄊㄨˇ，滿ㄇㄢˇ中ㄓㄨㄥ怨ㄩㄢˋ賊ㄗㄟˊ，有ㄧㄡˇ一ㄧˋ商ㄕㄤ主ㄓㄨˇ，將ㄐㄧㄤ諸ㄓㄨ商ㄕㄤ人ㄖㄣˊ，齎ㄐㄧ持ㄔˊ重ㄓㄨㄥˋ寶ㄅㄠˇ，經ㄐㄧㄥ過ㄍㄨㄛˋ險ㄒㄧㄢˇ路ㄌㄨˋ，其ㄑㄧˊ中ㄓㄨㄥ一ㄧˋ人ㄖㄣˊ，作ㄗㄨㄛˋ是ㄕˋ唱ㄔㄤˋ言ㄧㄢˊ：『諸ㄓㄨ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ！勿ㄨˋ得ㄉㄜˊ恐ㄎㄨㄥˇ怖ㄅㄨˋ，汝ㄖㄨˇ等ㄉㄥˇ應ㄧㄥ當ㄉㄤ一ㄧˋ心ㄒㄧㄣ稱ㄔㄥ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ名ㄇㄧㄥˊ號ㄏㄠˋ，是ㄕˋ菩ㄆㄨˊ薩ㄙㄚˋ能ㄋㄥˊ以ㄧˇ無ㄨˊ畏ㄨㄟˋ施ㄕ於ㄩˊ眾ㄓㄨㄥˋ生ㄕㄥ。汝ㄖㄨˇ等ㄉㄥˇ若ㄖㄨㄛˋ稱ㄔㄥ名ㄇㄧㄥˊ者ㄓㄜˇ，於ㄩˊ此ㄘˇ怨ㄩㄢˋ賊ㄗㄟˊ當ㄉㄤ得ㄉㄜˊ解ㄐㄧㄝˇ脫ㄊㄨㄛ！』眾ㄓㄨㄥˋ商ㄕㄤ人ㄖㄣˊ聞ㄨㄣˊ，俱ㄐㄩ發ㄈㄚ聲ㄕㄥ言ㄧㄢˊ：『南ㄋㄚˊ無ㄇㄛˊ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ！』稱ㄔㄥ其ㄑㄧˊ名ㄇㄧㄥˊ故ㄍㄨˋ，即ㄐㄧˊ得ㄉㄜˊ解ㄐㄧㄝˇ脫ㄊㄨㄛ。」\n「無ㄨˊ盡ㄐㄧㄣˋ意ㄧˋ！觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ摩ㄇㄛˊ訶ㄏㄜ薩ㄙㄚˋ，威ㄨㄟ神ㄕㄣˊ之ㄓ力ㄌㄧˋ，巍ㄨㄟˊ巍ㄨㄟˊ如ㄖㄨˊ是ㄕˋ。若ㄖㄨㄛˋ有ㄧㄡˇ眾ㄓㄨㄥˋ生ㄕㄥ多ㄉㄨㄛ於ㄩˊ淫ㄧㄣˊ欲ㄩˋ，常ㄔㄤˊ念ㄋㄧㄢˋ恭ㄍㄨㄥ敬ㄐㄧㄥˋ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ，便ㄅㄧㄢˋ得ㄉㄜˊ離ㄌㄧˊ欲ㄩˋ；若ㄖㄨㄛˋ多ㄉㄨㄛ瞋ㄔㄣ恚ㄏㄨㄟˋ，常ㄔㄤˊ念ㄋㄧㄢˋ恭ㄍㄨㄥ敬ㄐㄧㄥˋ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ，便ㄅㄧㄢˋ得ㄉㄜˊ離ㄌㄧˊ瞋ㄔㄣ；若ㄖㄨㄛˋ多ㄉㄨㄛ愚ㄩˊ癡ㄔ，常ㄔㄤˊ念ㄋㄧㄢˋ恭ㄍㄨㄥ敬ㄐㄧㄥˋ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ，便ㄅㄧㄢˋ得ㄉㄜˊ離ㄌㄧˊ癡ㄔ。無ㄨˊ盡ㄐㄧㄣˋ意ㄧˋ！觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ有ㄧㄡˇ如ㄖㄨˊ是ㄕˋ等ㄉㄥˇ大ㄉㄚˋ威ㄨㄟ神ㄕㄣˊ力ㄌㄧˋ，多ㄉㄨㄛ所ㄙㄨㄛˇ饒ㄖㄠˊ益ㄧˋ，是ㄕˋ故ㄍㄨˋ眾ㄓㄨㄥˋ生ㄕㄥ常ㄔㄤˊ應ㄧㄥ心ㄒㄧㄣ念ㄋㄧㄢˋ。若ㄖㄨㄛˋ有ㄧㄡˇ女ㄋㄩˇ人ㄖㄣˊ，設ㄕㄜˋ欲ㄩˋ求ㄑㄧㄡˊ男ㄋㄢˊ，禮ㄌㄧˇ拜ㄅㄞˋ供ㄍㄨㄥˋ養ㄧㄤˇ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ，便ㄅㄧㄢˋ生ㄕㄥ福ㄈㄨˊ德ㄉㄜˊ智ㄓˋ慧ㄏㄨㄟˋ之ㄓ男ㄋㄢˊ；設ㄕㄜˋ欲ㄩˋ求ㄑㄧㄡˊ女ㄋㄩˇ，便ㄅㄧㄢˋ生ㄕㄥ端ㄉㄨㄢ正ㄓㄥˋ有ㄧㄡˇ相ㄒㄧㄤˋ之ㄓ女ㄋㄩˇ，宿ㄙㄨˋ植ㄓˊ德ㄉㄜˊ本ㄅㄣˇ，眾ㄓㄨㄥˋ人ㄖㄣˊ愛ㄞˋ敬ㄐㄧㄥˋ。無ㄨˊ盡ㄐㄧㄣˋ意ㄧˋ！觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ有ㄧㄡˇ如ㄖㄨˊ是ㄕˋ力ㄌㄧˋ，若ㄖㄨㄛˋ有ㄧㄡˇ眾ㄓㄨㄥˋ生ㄕㄥ恭ㄍㄨㄥ敬ㄐㄧㄥˋ禮ㄌㄧˇ拜ㄅㄞˋ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ，福ㄈㄨˊ不ㄅㄨˋ唐ㄊㄤˊ捐ㄐㄩㄢ；是ㄕˋ故ㄍㄨˋ眾ㄓㄨㄥˋ生ㄕㄥ皆ㄐㄧㄝ應ㄧㄥ受ㄕㄡˋ持ㄔˊ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ名ㄇㄧㄥˊ號ㄏㄠˋ。」\n「無ㄨˊ盡ㄐㄧㄣˋ意ㄧˋ！若ㄖㄨㄛˋ有ㄧㄡˇ人ㄖㄣˊ受ㄕㄡˋ持ㄔˊ六ㄌㄧㄡˋ十ㄕˊ二ㄦˋ億ㄧˋ恆ㄏㄥˊ河ㄏㄜˊ沙ㄕㄚ菩ㄆㄨˊ薩ㄙㄚˋ名ㄇㄧㄥˊ字ㄗˋ，復ㄈㄨˋ盡ㄐㄧㄣˋ形ㄒㄧㄥˊ供ㄍㄨㄥˋ養ㄧㄤˇ飲ㄧㄣˇ食ㄕˊ、衣ㄧ服ㄈㄨˊ、臥ㄨㄛˋ具ㄐㄩˋ、醫ㄧ藥ㄧㄠˋ，於ㄩˊ汝ㄖㄨˇ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ？是ㄕˋ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ功ㄍㄨㄥ德ㄉㄜˊ多ㄉㄨㄛ不ㄈㄡˇ？」無ㄨˊ盡ㄐㄧㄣˋ意ㄧˋ言ㄧㄢˊ：「甚ㄕㄣˋ多ㄉㄨㄛ！世ㄕˋ尊ㄗㄨㄣ！」佛ㄈㄛˊ言ㄧㄢˊ：「若ㄖㄨㄛˋ復ㄈㄨˋ有ㄧㄡˇ人ㄖㄣˊ受ㄕㄡˋ持ㄔˊ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ名ㄇㄧㄥˊ號ㄏㄠˋ，乃ㄋㄞˇ至ㄓˋ一ㄧˋ時ㄕˊ禮ㄌㄧˇ拜ㄅㄞˋ供ㄍㄨㄥˋ養ㄧㄤˇ，是ㄕˋ二ㄦˋ人ㄖㄣˊ福ㄈㄨˊ正ㄓㄥˋ等ㄉㄥˇ無ㄨˊ異ㄧˋ，於ㄩˊ百ㄅㄞˇ千ㄑㄧㄢ萬ㄨㄢˋ億ㄧˋ劫ㄐㄧㄝˊ不ㄅㄨˋ可ㄎㄜˇ窮ㄑㄩㄥˊ盡ㄐㄧㄣˋ。無ㄨˊ盡ㄐㄧㄣˋ意ㄧˋ！受ㄕㄡˋ持ㄔˊ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ名ㄇㄧㄥˊ號ㄏㄠˋ，得ㄉㄜˊ如ㄖㄨˊ是ㄕˋ無ㄨˊ量ㄌㄧㄤˋ無ㄨˊ邊ㄅㄧㄢ福ㄈㄨˊ德ㄉㄜˊ之ㄓ利ㄌㄧˋ。」\n無ㄨˊ盡ㄐㄧㄣˋ意ㄧˋ菩ㄆㄨˊ薩ㄙㄚˋ白ㄅㄛˊ佛ㄈㄛˊ言ㄧㄢˊ：「世ㄕˋ尊ㄗㄨㄣ！觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ云ㄩㄣˊ何ㄏㄜˊ遊ㄧㄡˊ此ㄘˇ娑ㄙㄨㄛ婆ㄆㄛˊ世ㄕˋ界ㄐㄧㄝˋ？云ㄩㄣˊ何ㄏㄜˊ而ㄦˊ為ㄨㄟˊ眾ㄓㄨㄥˋ生ㄕㄥ說ㄕㄨㄛ法ㄈㄚˇ？方ㄈㄤ便ㄅㄧㄢˋ之ㄓ力ㄌㄧˋ，其ㄑㄧˊ事ㄕˋ云ㄩㄣˊ何ㄏㄜˊ？」佛ㄈㄛˊ告ㄍㄠˋ無ㄨˊ盡ㄐㄧㄣˋ意ㄧˋ菩ㄆㄨˊ薩ㄙㄚˋ：「善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ！若ㄖㄨㄛˋ有ㄧㄡˇ國ㄍㄨㄛˊ土ㄊㄨˇ眾ㄓㄨㄥˋ生ㄕㄥ，應ㄧㄥ以ㄧˇ佛ㄈㄛˊ身ㄕㄣ得ㄉㄜˊ度ㄉㄨˋ者ㄓㄜˇ，觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ即ㄐㄧˊ現ㄒㄧㄢˋ佛ㄈㄛˊ身ㄕㄣ而ㄦˊ為ㄨㄟˊ說ㄕㄨㄛ法ㄈㄚˇ；應ㄧㄥ以ㄧˇ辟ㄅㄧˋ支ㄓ佛ㄈㄛˊ身ㄕㄣ得ㄉㄜˊ度ㄉㄨˋ者ㄓㄜˇ，即ㄐㄧˊ現ㄒㄧㄢˋ辟ㄅㄧˋ支ㄓ佛ㄈㄛˊ身ㄕㄣ而ㄦˊ為ㄨㄟˊ說ㄕㄨㄛ法ㄈㄚˇ；應ㄧㄥ以ㄧˇ聲ㄕㄥ聞ㄨㄣˊ身ㄕㄣ得ㄉㄜˊ度ㄉㄨˋ者ㄓㄜˇ，即ㄐㄧˊ現ㄒㄧㄢˋ聲ㄕㄥ聞ㄨㄣˊ身ㄕㄣ而ㄦˊ為ㄨㄟˊ說ㄕㄨㄛ法ㄈㄚˇ；應ㄧㄥ以ㄧˇ梵ㄈㄢˋ王ㄨㄤˊ身ㄕㄣ得ㄉㄜˊ度ㄉㄨˋ者ㄓㄜˇ，即ㄐㄧˊ現ㄒㄧㄢˋ梵ㄈㄢˋ王ㄨㄤˊ身ㄕㄣ而ㄦˊ為ㄨㄟˊ說ㄕㄨㄛ法ㄈㄚˇ；應ㄧㄥ以ㄧˇ帝ㄉㄧˋ釋ㄕˋ身ㄕㄣ得ㄉㄜˊ度ㄉㄨˋ者ㄓㄜˇ，即ㄐㄧˊ現ㄒㄧㄢˋ帝ㄉㄧˋ釋ㄕˋ身ㄕㄣ而ㄦˊ為ㄨㄟˊ說ㄕㄨㄛ法ㄈㄚˇ；應ㄧㄥ以ㄧˇ自ㄗˋ在ㄗㄞˋ天ㄊㄧㄢ身ㄕㄣ得ㄉㄜˊ度ㄉㄨˋ者ㄓㄜˇ，即ㄐㄧˊ現ㄒㄧㄢˋ自ㄗˋ在ㄗㄞˋ天ㄊㄧㄢ身ㄕㄣ而ㄦˊ為ㄨㄟˊ說ㄕㄨㄛ法ㄈㄚˇ；應ㄧㄥ以ㄧˇ大ㄉㄚˋ自ㄗˋ在ㄗㄞˋ天ㄊㄧㄢ身ㄕㄣ得ㄉㄜˊ度ㄉㄨˋ者ㄓㄜˇ，即ㄐㄧˊ現ㄒㄧㄢˋ大ㄉㄚˋ自ㄗˋ在ㄗㄞˋ天ㄊㄧㄢ身ㄕㄣ而ㄦˊ為ㄨㄟˊ說ㄕㄨㄛ法ㄈㄚˇ；應ㄧㄥ以ㄧˇ天ㄊㄧㄢ大ㄉㄚˋ將ㄐㄧㄤˋ軍ㄐㄩㄣ身ㄕㄣ得ㄉㄜˊ度ㄉㄨˋ者ㄓㄜˇ，即ㄐㄧˊ現ㄒㄧㄢˋ天ㄊㄧㄢ大ㄉㄚˋ將ㄐㄧㄤˋ軍ㄐㄩㄣ身ㄕㄣ而ㄦˊ為ㄨㄟˊ說ㄕㄨㄛ法ㄈㄚˇ；應ㄧㄥ以ㄧˇ毘ㄆㄧˊ沙ㄕㄚ門ㄇㄣˊ身ㄕㄣ得ㄉㄜˊ度ㄉㄨˋ者ㄓㄜˇ，即ㄐㄧˊ現ㄒㄧㄢˋ毘ㄆㄧˊ沙ㄕㄚ門ㄇㄣˊ身ㄕㄣ而ㄦˊ為ㄨㄟˊ說ㄕㄨㄛ法ㄈㄚˇ；應ㄧㄥ以ㄧˇ小ㄒㄧㄠˇ王ㄨㄤˊ身ㄕㄣ得ㄉㄜˊ度ㄉㄨˋ者ㄓㄜˇ，即ㄐㄧˊ現ㄒㄧㄢˋ小ㄒㄧㄠˇ王ㄨㄤˊ身ㄕㄣ而ㄦˊ為ㄨㄟˊ說ㄕㄨㄛ法ㄈㄚˇ；應ㄧㄥ以ㄧˇ長ㄓㄤˇ者ㄓㄜˇ身ㄕㄣ得ㄉㄜˊ度ㄉㄨˋ者ㄓㄜˇ，即ㄐㄧˊ現ㄒㄧㄢˋ長ㄓㄤˇ者ㄓㄜˇ身ㄕㄣ而ㄦˊ為ㄨㄟˊ說ㄕㄨㄛ法ㄈㄚˇ；應ㄧㄥ以ㄧˇ居ㄐㄩ士ㄕˋ身ㄕㄣ得ㄉㄜˊ度ㄉㄨˋ者ㄓㄜˇ，即ㄐㄧˊ現ㄒㄧㄢˋ居ㄐㄩ士ㄕˋ身ㄕㄣ而ㄦˊ為ㄨㄟˊ說ㄕㄨㄛ法ㄈㄚˇ；應ㄧㄥ以ㄧˇ宰ㄗㄞˇ官ㄍㄨㄢ身ㄕㄣ得ㄉㄜˊ度ㄉㄨˋ者ㄓㄜˇ，即ㄐㄧˊ現ㄒㄧㄢˋ宰ㄗㄞˇ官ㄍㄨㄢ身ㄕㄣ而ㄦˊ為ㄨㄟˊ說ㄕㄨㄛ法ㄈㄚˇ；應ㄧㄥ以ㄧˇ婆ㄆㄛˊ羅ㄌㄨㄛˊ門ㄇㄣˊ身ㄕㄣ得ㄉㄜˊ度ㄉㄨˋ者ㄓㄜˇ，即ㄐㄧˊ現ㄒㄧㄢˋ婆ㄆㄛˊ羅ㄌㄨㄛˊ門ㄇㄣˊ身ㄕㄣ而ㄦˊ為ㄨㄟˊ說ㄕㄨㄛ法ㄈㄚˇ；應ㄧㄥ以ㄧˇ比ㄅㄧˇ丘ㄑㄧㄡ、比ㄅㄧˇ丘ㄑㄧㄡ尼ㄋㄧˊ、優ㄧㄡ婆ㄆㄛˊ塞ㄙㄜˋ、優ㄧㄡ婆ㄆㄛˊ夷ㄧˊ身ㄕㄣ得ㄉㄜˊ度ㄉㄨˋ者ㄓㄜˇ，即ㄐㄧˊ現ㄒㄧㄢˋ比ㄅㄧˇ丘ㄑㄧㄡ、比ㄅㄧˇ丘ㄑㄧㄡ尼ㄋㄧˊ、優ㄧㄡ婆ㄆㄛˊ塞ㄙㄜˋ、優ㄧㄡ婆ㄆㄛˊ夷ㄧˊ身ㄕㄣ而ㄦˊ為ㄨㄟˊ說ㄕㄨㄛ法ㄈㄚˇ；應ㄧㄥ以ㄧˇ長ㄓㄤˇ者ㄓㄜˇ、居ㄐㄩ士ㄕˋ、宰ㄗㄞˇ官ㄍㄨㄢ、婆ㄆㄛˊ羅ㄌㄨㄛˊ門ㄇㄣˊ、婦ㄈㄨˋ女ㄋㄩˇ身ㄕㄣ得ㄉㄜˊ度ㄉㄨˋ者ㄓㄜˇ，即ㄐㄧˊ現ㄒㄧㄢˋ婦ㄈㄨˋ女ㄋㄩˇ身ㄕㄣ而ㄦˊ為ㄨㄟˊ說ㄕㄨㄛ法ㄈㄚˇ；應ㄧㄥ以ㄧˇ童ㄊㄨㄥˊ男ㄋㄢˊ童ㄊㄨㄥˊ女ㄋㄩˇ身ㄕㄣ得ㄉㄜˊ度ㄉㄨˋ者ㄓㄜˇ，即ㄐㄧˊ現ㄒㄧㄢˋ童ㄊㄨㄥˊ男ㄋㄢˊ童ㄊㄨㄥˊ女ㄋㄩˇ身ㄕㄣ而ㄦˊ為ㄨㄟˊ說ㄕㄨㄛ法ㄈㄚˇ；應ㄧㄥ以ㄧˇ天ㄊㄧㄢ、龍ㄌㄨㄥˊ、夜ㄧㄝˋ叉ㄔㄚ、乾ㄑㄧㄢˊ闥ㄊㄚˋ婆ㄆㄛˊ、阿ㄚ脩ㄒㄧㄡ羅ㄌㄨㄛˊ、迦ㄐㄧㄚ樓ㄌㄡˊ羅ㄌㄨㄛˊ、緊ㄐㄧㄣˇ那ㄋㄚˋ羅ㄌㄨㄛˊ、摩ㄇㄛˊ睺ㄏㄡˊ羅ㄌㄨㄛˊ伽ㄑㄧㄝˊ、人ㄖㄣˊ、非ㄈㄟ人ㄖㄣˊ等ㄉㄥˇ身ㄕㄣ得ㄉㄜˊ度ㄉㄨˋ者ㄓㄜˇ，即ㄐㄧˊ皆ㄐㄧㄝ現ㄒㄧㄢˋ之ㄓ而ㄦˊ為ㄨㄟˊ說ㄕㄨㄛ法ㄈㄚˇ；應ㄧㄥ以ㄧˇ執ㄓˊ金ㄐㄧㄣ剛ㄍㄤ神ㄕㄣˊ得ㄉㄜˊ度ㄉㄨˋ者ㄓㄜˇ，即ㄐㄧˊ現ㄒㄧㄢˋ執ㄓˊ金ㄐㄧㄣ剛ㄍㄤ神ㄕㄣˊ而ㄦˊ為ㄨㄟˊ說ㄕㄨㄛ法ㄈㄚˇ。」\n「無ㄨˊ盡ㄐㄧㄣˋ意ㄧˋ！是ㄕˋ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ成ㄔㄥˊ就ㄐㄧㄡˋ如ㄖㄨˊ是ㄕˋ功ㄍㄨㄥ德ㄉㄜˊ，以ㄧˇ種ㄓㄨㄥˇ種ㄓㄨㄥˇ形ㄒㄧㄥˊ遊ㄧㄡˊ諸ㄓㄨ國ㄍㄨㄛˊ土ㄊㄨˇ，度ㄉㄨˋ脫ㄊㄨㄛ眾ㄓㄨㄥˋ生ㄕㄥ，是ㄕˋ故ㄍㄨˋ汝ㄖㄨˇ等ㄉㄥˇ應ㄧㄥ當ㄉㄤ一ㄧˋ心ㄒㄧㄣ供ㄍㄨㄥˋ養ㄧㄤˇ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ。是ㄕˋ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ摩ㄇㄛˊ訶ㄏㄜ薩ㄙㄚˋ，於ㄩˊ怖ㄅㄨˋ畏ㄨㄟˋ急ㄐㄧˊ難ㄋㄢˋ之ㄓ中ㄓㄨㄥ，能ㄋㄥˊ施ㄕ無ㄨˊ畏ㄨㄟˋ，是ㄕˋ故ㄍㄨˋ此ㄘˇ娑ㄙㄨㄛ婆ㄆㄛˊ世ㄕˋ界ㄐㄧㄝˋ皆ㄐㄧㄝ號ㄏㄠˋ之ㄓ為ㄨㄟˊ施ㄕ無ㄨˊ畏ㄨㄟˋ者ㄓㄜˇ。」\n無ㄨˊ盡ㄐㄧㄣˋ意ㄧˋ菩ㄆㄨˊ薩ㄙㄚˋ白ㄅㄛˊ佛ㄈㄛˊ言ㄧㄢˊ：「世ㄕˋ尊ㄗㄨㄣ！我ㄨㄛˇ今ㄐㄧㄣ當ㄉㄤ供ㄍㄨㄥˋ養ㄧㄤˇ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ。」即ㄐㄧˊ解ㄐㄧㄝˇ頸ㄐㄧㄥˇ眾ㄓㄨㄥˋ寶ㄅㄠˇ珠ㄓㄨ瓔ㄧㄥ珞ㄌㄨㄛˋ，價ㄐㄧㄚˋ值ㄓˊ百ㄅㄞˇ千ㄑㄧㄢ兩ㄌㄧㄤˇ金ㄐㄧㄣ而ㄦˊ以ㄧˇ與ㄩˇ之ㄓ，作ㄗㄨㄛˋ是ㄕˋ言ㄧㄢˊ：「仁ㄖㄣˊ者ㄓㄜˇ！受ㄕㄡˋ此ㄘˇ法ㄈㄚˇ施ㄕ，珍ㄓㄣ寶ㄅㄠˇ瓔ㄧㄥ珞ㄌㄨㄛˋ。」時ㄕˊ，觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ不ㄅㄨˋ肯ㄎㄣˇ受ㄕㄡˋ之ㄓ，無ㄨˊ盡ㄐㄧㄣˋ意ㄧˋ復ㄈㄨˋ白ㄅㄛˊ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ言ㄧㄢˊ：「仁ㄖㄣˊ者ㄓㄜˇ！愍ㄇㄧㄣˇ我ㄨㄛˇ等ㄉㄥˇ故ㄍㄨˋ，受ㄕㄡˋ此ㄘˇ瓔ㄧㄥ珞ㄌㄨㄛˋ。」\n爾ㄦˇ時ㄕˊ，佛ㄈㄛˊ告ㄍㄠˋ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ：「當ㄉㄤ愍ㄇㄧㄣˇ此ㄘˇ無ㄨˊ盡ㄐㄧㄣˋ意ㄧˋ菩ㄆㄨˊ薩ㄙㄚˋ，及ㄐㄧˊ四ㄙˋ眾ㄓㄨㄥˋ、天ㄊㄧㄢ、龍ㄌㄨㄥˊ、夜ㄧㄝˋ叉ㄔㄚ、乾ㄑㄧㄢˊ闥ㄊㄚˋ婆ㄆㄛˊ、阿ㄚ脩ㄒㄧㄡ羅ㄌㄨㄛˊ、迦ㄐㄧㄚ樓ㄌㄡˊ羅ㄌㄨㄛˊ、緊ㄐㄧㄣˇ那ㄋㄚˋ羅ㄌㄨㄛˊ、摩ㄇㄛˊ睺ㄏㄡˊ羅ㄌㄨㄛˊ伽ㄑㄧㄝˊ、人ㄖㄣˊ、非ㄈㄟ人ㄖㄣˊ等ㄉㄥˇ故ㄍㄨˋ，受ㄕㄡˋ是ㄕˋ瓔ㄧㄥ珞ㄌㄨㄛˋ。」即ㄐㄧˊ時ㄕˊ觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ愍ㄇㄧㄣˇ諸ㄓㄨ四ㄙˋ眾ㄓㄨㄥˋ，及ㄐㄧˊ於ㄩˊ天ㄊㄧㄢ、龍ㄌㄨㄥˊ、人ㄖㄣˊ、非ㄈㄟ人ㄖㄣˊ等ㄉㄥˇ，受ㄕㄡˋ其ㄑㄧˊ瓔ㄧㄥ珞ㄌㄨㄛˋ，分ㄈㄣ作ㄗㄨㄛˋ二ㄦˋ分ㄈㄣˋ：一ㄧˋ分ㄈㄣˋ奉ㄈㄥˋ釋ㄕˋ迦ㄐㄧㄚ牟ㄇㄡˊ尼ㄋㄧˊ佛ㄈㄛˊ，一ㄧˋ分ㄈㄣˋ奉ㄈㄥˋ多ㄉㄨㄛ寶ㄅㄠˇ佛ㄈㄛˊ塔ㄊㄚˇ。」「無ㄨˊ盡ㄐㄧㄣˋ意ㄧˋ！觀ㄍㄨㄢ世ㄕˋ音ㄧㄣ菩ㄆㄨˊ薩ㄙㄚˋ有ㄧㄡˇ如ㄖㄨˊ是ㄕˋ自ㄗˋ在ㄗㄞˋ神ㄕㄣˊ力ㄌㄧˋ，遊ㄧㄡˊ於ㄩˊ娑ㄙㄨㄛ婆ㄆㄛˊ世ㄕˋ界ㄐㄧㄝˋ。」\n爾ㄦˇ時ㄕˊ，無ㄨˊ盡ㄐㄧㄣˋ意ㄧˋ菩ㄆㄨˊ薩ㄙㄚˋ以ㄧˇ偈ㄐㄧˋ問ㄨㄣˋ曰ㄩㄝ：「世ㄕˋ尊ㄗㄨㄣ妙   mk('s_amito','佛說阿彌陀經','經','阿彌陀佛','往生淨土、一心念佛、六方諸佛護念','淨土類','姚秦・鳩摩羅什譯',['往生淨土','消業障','增長福慧'],1,900,'如ㄖㄨˊ是ㄕˋ我ㄨㄛˇ聞ㄨㄣˊ：\n一ㄧˋ時ㄕˊ，佛ㄈㄛˊ在ㄗㄞˋ舍ㄕㄜˋ衛ㄨㄟˋ國ㄍㄨㄛˊ，祇ㄑㄧˊ樹ㄕㄨˋ給ㄐㄧˇ孤ㄍㄨ獨ㄉㄨˊ園ㄩㄢˊ，與ㄩˇ大ㄉㄚˋ比ㄅㄧˇ丘ㄑㄧㄡ僧ㄙㄥ，千ㄑㄧㄢ二ㄦˋ百ㄅㄞˇ五ㄨˇ十ㄕˊ人ㄖㄣˊ俱ㄐㄩ，皆ㄐㄧㄝ是ㄕˋ大ㄉㄚˋ阿ㄚ羅ㄌㄨㄛˊ漢ㄏㄢˋ，眾ㄓㄨㄥˋ所ㄙㄨㄛˇ知ㄓ識ㄕˋ，長ㄓㄤˇ老ㄌㄠˇ舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，摩ㄇㄛˊ訶ㄏㄜ目ㄇㄨˋ犍ㄐㄧㄢ連ㄌㄧㄢˊ，摩ㄇㄛˊ訶ㄏㄜ迦ㄐㄧㄚ葉ㄕㄜˋ，摩ㄇㄛˊ訶ㄏㄜ迦ㄐㄧㄚ旃ㄓㄢ延ㄧㄢˊ，摩ㄇㄛˊ訶ㄏㄜ俱ㄐㄩ絺ㄔ羅ㄌㄨㄛˊ，離ㄌㄧˊ婆ㄆㄛˊ多ㄉㄨㄛ，周ㄓㄡ利ㄌㄧˋ槃ㄆㄢˊ陀ㄊㄨㄛˊ伽ㄑㄧㄝˊ，難ㄋㄢˊ陀ㄊㄨㄛˊ，阿ㄚ難ㄋㄢˊ陀ㄊㄨㄛˊ，羅ㄌㄨㄛˊ侯ㄏㄡˊ羅ㄌㄨㄛˊ，憍ㄐㄧㄠ梵ㄈㄢˋ波ㄅㄛ提ㄊㄧˊ，賓ㄅㄧㄣ頭ㄊㄡˊ盧ㄌㄨˊ頗ㄆㄛˇ羅ㄌㄨㄛˊ墮ㄉㄨㄛˋ，迦ㄐㄧㄚ留ㄌㄧㄡˊ陀ㄊㄨㄛˊ夷ㄧˊ，摩ㄇㄛˊ訶ㄏㄜ劫ㄐㄧㄝˊ賓ㄅㄧㄣ那ㄋㄚˋ，薄ㄅㄛˊ拘ㄐㄩ羅ㄌㄨㄛˊ，阿ㄚ那ㄋㄚˋ樓ㄌㄡˊ馱ㄊㄨㄛˊ，如ㄖㄨˊ是ㄕˋ等ㄉㄥˇ諸ㄓㄨ大ㄉㄚˋ弟ㄉㄧˋ子ㄗˇ。\n并ㄅㄧㄥˋ諸ㄓㄨ菩ㄆㄨˊ薩ㄙㄚˋ摩ㄇㄛˊ訶ㄏㄜ薩ㄙㄚˋ，文ㄨㄣˊ殊ㄕㄨ師ㄕ利ㄌㄧˋ法ㄈㄚˇ王ㄨㄤˊ子ㄗˇ，阿ㄚ逸ㄧˋ多ㄉㄨㄛ菩ㄆㄨˊ薩ㄙㄚˋ，乾ㄑㄧㄢˊ陀ㄊㄨㄛˊ訶ㄏㄜ提ㄊㄧˊ菩ㄆㄨˊ薩ㄙㄚˋ，常ㄔㄤˊ精ㄐㄧㄥ進ㄐㄧㄣˋ菩ㄆㄨˊ薩ㄙㄚˋ，與ㄩˇ如ㄖㄨˊ是ㄕˋ等ㄉㄥˇ諸ㄓㄨ大ㄉㄚˋ菩ㄆㄨˊ薩ㄙㄚˋ，及ㄐㄧˊ釋ㄕˋ提ㄊㄧˊ桓ㄏㄨㄢˊ因ㄧㄣ等ㄉㄥˇ，無ㄨˊ量ㄌㄧㄤˋ諸ㄓㄨ天ㄊㄧㄢ大ㄉㄚˋ眾ㄓㄨㄥˋ俱ㄐㄩ。\n爾ㄦˇ時ㄕˊ，佛ㄈㄛˊ告ㄍㄠˋ長ㄓㄤˇ老ㄌㄠˇ舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ：\n「從ㄘㄨㄥˊ是ㄕˋ西ㄒㄧ方ㄈㄤ，過ㄍㄨㄛˋ十ㄕˊ萬ㄨㄢˋ億ㄧˋ佛ㄈㄛˊ土ㄊㄨˇ，有ㄧㄡˇ世ㄕˋ界ㄐㄧㄝˋ名ㄇㄧㄥˊ曰ㄩㄝ極ㄐㄧˊ樂ㄌㄜˋ，其ㄑㄧˊ土ㄊㄨˇ有ㄧㄡˇ佛ㄈㄛˊ，號ㄏㄠˋ阿ㄚ彌ㄇㄧˊ陀ㄊㄨㄛˊ，今ㄐㄧㄣ現ㄒㄧㄢˋ在ㄗㄞˋ說ㄕㄨㄛ法ㄈㄚˇ。舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，彼ㄅㄧˇ土ㄊㄨˇ何ㄏㄜˊ故ㄍㄨˋ名ㄇㄧㄥˊ為ㄨㄟˊ極ㄐㄧˊ樂ㄌㄜˋ，其ㄑㄧˊ國ㄍㄨㄛˊ眾ㄓㄨㄥˋ生ㄕㄥ，無ㄨˊ有ㄧㄡˇ眾ㄓㄨㄥˋ苦ㄎㄨˇ，但ㄉㄢˋ受ㄕㄡˋ諸ㄓㄨ樂ㄌㄜˋ，故ㄍㄨˋ名ㄇㄧㄥˊ極ㄐㄧˊ樂ㄌㄜˋ。又ㄧㄡˋ舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，極ㄐㄧˊ樂ㄌㄜˋ國ㄍㄨㄛˊ土ㄊㄨˇ，七ㄑㄧ重ㄔㄨㄥˊ欄ㄌㄢˊ楯ㄕㄨㄣˇ，七ㄑㄧ重ㄔㄨㄥˊ羅ㄌㄨㄛˊ網ㄨㄤˇ，七ㄑㄧ重ㄔㄨㄥˊ行ㄏㄤˊ樹ㄕㄨˋ，皆ㄐㄧㄝ是ㄕˋ四ㄙˋ寶ㄅㄠˇ周ㄓㄡ匝ㄗㄚ圍ㄨㄟˊ繞ㄖㄠˋ，是ㄕˋ故ㄍㄨˋ彼ㄅㄧˇ國ㄍㄨㄛˊ名ㄇㄧㄥˊ為ㄨㄟˊ極ㄐㄧˊ樂ㄌㄜˋ。」\n「又ㄧㄡˋ舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，極ㄐㄧˊ樂ㄌㄜˋ國ㄍㄨㄛˊ土ㄊㄨˇ，有ㄧㄡˇ七ㄑㄧ寶ㄅㄠˇ池ㄔˊ，八ㄅㄚ功ㄍㄨㄥ德ㄉㄜˊ水ㄕㄨㄟˇ，充ㄔㄨㄥ滿ㄇㄢˇ其ㄑㄧˊ中ㄓㄨㄥ，池ㄔˊ底ㄉㄧˇ純ㄔㄨㄣˊ以ㄧˇ金ㄐㄧㄣ沙ㄕㄚ布ㄅㄨˋ地ㄉㄧˋ，四ㄙˋ邊ㄅㄧㄢ階ㄐㄧㄝ道ㄉㄠˋ，金ㄐㄧㄣ、銀ㄧㄣˊ、琉ㄌㄧㄡˊ璃ㄌㄧˊ、玻ㄅㄛ璃ㄌㄧˊ合ㄏㄜˊ成ㄔㄥˊ，上ㄕㄤˋ有ㄧㄡˇ樓ㄌㄡˊ閣ㄍㄜˊ，亦ㄧˋ以ㄧˇ金ㄐㄧㄣ、銀ㄧㄣˊ、琉ㄌㄧㄡˊ璃ㄌㄧˊ、玻ㄅㄛ璃ㄌㄧˊ、硨ㄔㄜ磲ㄑㄩˊ、赤ㄔˋ珠ㄓㄨ、瑪ㄇㄚˇ瑙ㄋㄠˇ而ㄦˊ嚴ㄧㄢˊ飾ㄕˋ之ㄓ，池ㄔˊ中ㄓㄨㄥ蓮ㄌㄧㄢˊ花ㄏㄨㄚ大ㄉㄚˋ如ㄖㄨˊ車ㄔㄜ輪ㄌㄨㄣˊ，青ㄑㄧㄥ色ㄙㄜˋ青ㄑㄧㄥ光ㄍㄨㄤ，黃ㄏㄨㄤˊ色ㄙㄜˋ黃ㄏㄨㄤˊ光ㄍㄨㄤ，赤ㄔˋ色ㄙㄜˋ赤ㄔˋ光ㄍㄨㄤ，白ㄅㄞˊ色ㄙㄜˋ白ㄅㄞˊ光ㄍㄨㄤ，微ㄨㄟˊ妙ㄇㄧㄠˋ香ㄒㄧㄤ潔ㄐㄧㄝˊ。舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，極ㄐㄧˊ樂ㄌㄜˋ國ㄍㄨㄛˊ土ㄊㄨˇ，成ㄔㄥˊ就ㄐㄧㄡˋ如ㄖㄨˊ是ㄕˋ功ㄍㄨㄥ德ㄉㄜˊ莊ㄓㄨㄤ嚴ㄧㄢˊ。」\n「又ㄧㄡˋ舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，彼ㄅㄧˇ佛ㄈㄛˊ國ㄍㄨㄛˊ土ㄊㄨˇ，常ㄔㄤˊ作ㄗㄨㄛˋ天ㄊㄧㄢ樂ㄩㄝˋ，黃ㄏㄨㄤˊ金ㄐㄧㄣ為ㄨㄟˊ地ㄉㄧˋ，晝ㄓㄡˋ夜ㄧㄝˋ六ㄌㄧㄡˋ時ㄕˊ，雨ㄩˋ天ㄊㄧㄢ曼ㄇㄢˋ陀ㄊㄨㄛˊ羅ㄌㄨㄛˊ華ㄏㄨㄚ，其ㄑㄧˊ土ㄊㄨˇ眾ㄓㄨㄥˋ生ㄕㄥ，常ㄔㄤˊ以ㄧˇ清ㄑㄧㄥ旦ㄉㄢˋ，各ㄍㄜˋ以ㄧˇ衣ㄧ裓ㄐㄧㄝˊ，盛ㄔㄥˊ眾ㄓㄨㄥˋ妙ㄇㄧㄠˋ華ㄏㄨㄚ，供ㄍㄨㄥˋ養ㄧㄤˇ他ㄊㄚ方ㄈㄤ十ㄕˊ萬ㄨㄢˋ億ㄧˋ佛ㄈㄛˊ，即ㄐㄧˊ以ㄧˇ食ㄕˊ時ㄕˊ，還ㄏㄨㄢˊ到ㄉㄠˋ本ㄅㄣˇ國ㄍㄨㄛˊ，飯ㄈㄢˋ食ㄕˊ經ㄐㄧㄥ行ㄒㄧㄥˊ，舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，極ㄐㄧˊ樂ㄌㄜˋ國ㄍㄨㄛˊ土ㄊㄨˇ，成ㄔㄥˊ就ㄐㄧㄡˋ如ㄖㄨˊ是ㄕˋ功ㄍㄨㄥ德ㄉㄜˊ莊ㄓㄨㄤ嚴ㄧㄢˊ。」「復ㄈㄨˋ次ㄘˋ舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，彼ㄅㄧˇ國ㄍㄨㄛˊ常ㄔㄤˊ有ㄧㄡˇ種ㄓㄨㄥˇ種ㄓㄨㄥˇ奇ㄑㄧˊ妙ㄇㄧㄠˋ雜ㄗㄚˊ色ㄙㄜˋ之ㄓ鳥ㄋㄧㄠˇ：白ㄅㄞˊ鶴ㄏㄜˋ、孔ㄎㄨㄥˇ雀ㄑㄩㄝˋ、鸚ㄧㄥ鵡ㄨˇ、舍ㄕㄜˋ利ㄌㄧˋ、迦ㄐㄧㄚ陵ㄌㄧㄥˊ頻ㄆㄧㄣˊ伽ㄑㄧㄝˊ、共ㄍㄨㄥˋ命ㄇㄧㄥˋ之ㄓ鳥ㄋㄧㄠˇ，是ㄕˋ諸ㄓㄨ眾ㄓㄨㄥˋ鳥ㄋㄧㄠˇ，晝ㄓㄡˋ夜ㄧㄝˋ六ㄌㄧㄡˋ時ㄕˊ，出ㄔㄨ和ㄏㄜˊ雅ㄧㄚˇ音ㄧㄣ，其ㄑㄧˊ音ㄧㄣ演ㄧㄢˇ暢ㄔㄤˋ五ㄨˇ根ㄍㄣ、五ㄨˇ力ㄌㄧˋ、七ㄑㄧ菩ㄆㄨˊ提ㄊㄧˊ分ㄈㄣ、八ㄅㄚ聖ㄕㄥˋ道ㄉㄠˋ分ㄈㄣ，如ㄖㄨˊ是ㄕˋ等ㄉㄥˇ法ㄈㄚˇ，其ㄑㄧˊ土ㄊㄨˇ眾ㄓㄨㄥˋ生ㄕㄥ，聞ㄨㄣˊ是ㄕˋ音ㄧㄣ已ㄧˇ，皆ㄐㄧㄝ悉ㄒㄧ念ㄋㄧㄢˋ佛ㄈㄛˊ、念ㄋㄧㄢˋ法ㄈㄚˇ、念ㄋㄧㄢˋ僧ㄙㄥ。」\n「舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，汝ㄖㄨˇ勿ㄨˋ謂ㄨㄟˋ此ㄘˇ鳥ㄋㄧㄠˇ，實ㄕˊ是ㄕˋ罪ㄗㄨㄟˋ報ㄅㄠˋ所ㄙㄨㄛˇ生ㄕㄥ，所ㄙㄨㄛˇ以ㄧˇ者ㄓㄜˇ何ㄏㄜˊ，彼ㄅㄧˇ佛ㄈㄛˊ國ㄍㄨㄛˊ土ㄊㄨˇ，無ㄨˊ三ㄙㄢ惡ㄜˋ道ㄉㄠˋ。舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，其ㄑㄧˊ佛ㄈㄛˊ國ㄍㄨㄛˊ土ㄊㄨˇ，尚ㄕㄤˋ無ㄨˊ惡ㄜˋ道ㄉㄠˋ之ㄓ名ㄇㄧㄥˊ，何ㄏㄜˊ況ㄎㄨㄤˋ有ㄧㄡˇ實ㄕˊ，是ㄕˋ諸ㄓㄨ眾ㄓㄨㄥˋ鳥ㄋㄧㄠˇ，皆ㄐㄧㄝ是ㄕˋ阿ㄚ彌ㄇㄧˊ陀ㄊㄨㄛˊ佛ㄈㄛˊ，欲ㄩˋ令ㄌㄧㄥˋ法ㄈㄚˇ音ㄧㄣ宣ㄒㄩㄢ流ㄌㄧㄡˊ，變ㄅㄧㄢˋ化ㄏㄨㄚˋ所ㄙㄨㄛˇ作ㄗㄨㄛˋ。舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，彼ㄅㄧˇ佛ㄈㄛˊ國ㄍㄨㄛˊ土ㄊㄨˇ，微ㄨㄟˊ風ㄈㄥ吹ㄔㄨㄟ動ㄉㄨㄥˋ諸ㄓㄨ寶ㄅㄠˇ行ㄏㄤˊ樹ㄕㄨˋ，及ㄐㄧˊ寶ㄅㄠˇ羅ㄌㄨㄛˊ網ㄨㄤˇ，出ㄔㄨ微ㄨㄟˊ妙ㄇㄧㄠˋ音ㄧㄣ，譬ㄆㄧˋ如ㄖㄨˊ百ㄅㄞˇ千ㄑㄧㄢ種ㄓㄨㄥˇ樂ㄩㄝˋ，同ㄊㄨㄥˊ時ㄕˊ俱ㄐㄩ作ㄗㄨㄛˋ，聞ㄨㄣˊ是ㄕˋ音ㄧㄣ者ㄓㄜˇ，自ㄗˋ然ㄖㄢˊ皆ㄐㄧㄝ生ㄕㄥ念ㄋㄧㄢˋ佛ㄈㄛˊ、念ㄋㄧㄢˋ法ㄈㄚˇ、念ㄋㄧㄢˋ僧ㄙㄥ之ㄓ心ㄒㄧㄣ。舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，其ㄑㄧˊ佛ㄈㄛˊ國ㄍㄨㄛˊ土ㄊㄨˇ，成ㄔㄥˊ就ㄐㄧㄡˋ如ㄖㄨˊ是ㄕˋ功ㄍㄨㄥ德ㄉㄜˊ莊ㄓㄨㄤ嚴ㄧㄢˊ。」\n「舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，於ㄩˊ汝ㄖㄨˇ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，彼ㄅㄧˇ佛ㄈㄛˊ何ㄏㄜˊ故ㄍㄨˋ號ㄏㄠˋ阿ㄚ彌ㄇㄧˊ陀ㄊㄨㄛˊ，舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，彼ㄅㄧˇ佛ㄈㄛˊ光ㄍㄨㄤ明ㄇㄧㄥˊ無ㄨˊ量ㄌㄧㄤˋ，照ㄓㄠˋ十ㄕˊ方ㄈㄤ國ㄍㄨㄛˊ，無ㄨˊ所ㄙㄨㄛˇ障ㄓㄤˋ礙ㄞˋ，是ㄕˋ故ㄍㄨˋ號ㄏㄠˋ為ㄨㄟˊ阿ㄚ彌ㄇㄧˊ陀ㄊㄨㄛˊ。」「又ㄧㄡˋ舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，彼ㄅㄧˇ佛ㄈㄛˊ壽ㄕㄡˋ命ㄇㄧㄥˋ，及ㄐㄧˊ其ㄑㄧˊ人ㄖㄣˊ民ㄇㄧㄣˊ，無ㄨˊ量ㄌㄧㄤˋ無ㄨˊ邊ㄅㄧㄢ阿ㄚ僧ㄙㄥ祇ㄑㄧˊ劫ㄐㄧㄝˊ，故ㄍㄨˋ名ㄇㄧㄥˊ阿ㄚ彌ㄇㄧˊ陀ㄊㄨㄛˊ。舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，阿ㄚ彌ㄇㄧˊ陀ㄊㄨㄛˊ佛ㄈㄛˊ成ㄔㄥˊ佛ㄈㄛˊ已ㄧˇ來ㄌㄞˊ，於ㄩˊ今ㄐㄧㄣ十ㄕˊ劫ㄐㄧㄝˊ。又ㄧㄡˋ舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，彼ㄅㄧˇ佛ㄈㄛˊ有ㄧㄡˇ無ㄨˊ量ㄌㄧㄤˋ無ㄨˊ邊ㄅㄧㄢ聲ㄕㄥ聞ㄨㄣˊ弟ㄉㄧˋ子ㄗˇ，皆ㄐㄧㄝ阿ㄚ羅ㄌㄨㄛˊ漢ㄏㄢˋ，非ㄈㄟ是ㄕˋ算ㄙㄨㄢˋ數ㄕㄨˋ之ㄓ所ㄙㄨㄛˇ能ㄋㄥˊ知ㄓ，諸ㄓㄨ菩ㄆㄨˊ薩ㄙㄚˋ眾ㄓㄨㄥˋ，亦ㄧˋ復ㄈㄨˋ如ㄖㄨˊ是ㄕˋ。」\n「舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，彼ㄅㄧˇ佛ㄈㄛˊ國ㄍㄨㄛˊ土ㄊㄨˇ，成ㄔㄥˊ就ㄐㄧㄡˋ如ㄖㄨˊ是ㄕˋ功ㄍㄨㄥ德ㄉㄜˊ莊ㄓㄨㄤ嚴ㄧㄢˊ。又ㄧㄡˋ舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，極ㄐㄧˊ樂ㄌㄜˋ國ㄍㄨㄛˊ土ㄊㄨˇ，眾ㄓㄨㄥˋ生ㄕㄥ生ㄕㄥ者ㄓㄜˇ，皆ㄐㄧㄝ是ㄕˋ阿ㄚ鞞ㄆㄧˊ跋ㄅㄚˊ致ㄓˋ，其ㄑㄧˊ中ㄓㄨㄥ多ㄉㄨㄛ有ㄧㄡˇ一ㄧˋ生ㄕㄥ補ㄅㄨˇ處ㄔㄨˋ，其ㄑㄧˊ數ㄕㄨˋ甚ㄕㄣˋ多ㄉㄨㄛ，非ㄈㄟ是ㄕˋ算ㄙㄨㄢˋ數ㄕㄨˋ所ㄙㄨㄛˇ能ㄋㄥˊ知ㄓ之ㄓ，但ㄉㄢˋ可ㄎㄜˇ以ㄧˇ無ㄨˊ量ㄌㄧㄤˋ無ㄨˊ邊ㄅㄧㄢ阿ㄚ僧ㄙㄥ祇ㄑㄧˊ說ㄕㄨㄛ。」\n「舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，眾ㄓㄨㄥˋ生ㄕㄥ聞ㄨㄣˊ者ㄓㄜˇ，應ㄧㄥ當ㄉㄤ發ㄈㄚ願ㄩㄢˋ，願ㄩㄢˋ生ㄕㄥ彼ㄅㄧˇ國ㄍㄨㄛˊ，所ㄙㄨㄛˇ以ㄧˇ者ㄓㄜˇ何ㄏㄜˊ，得ㄉㄜˊ與ㄩˇ如ㄖㄨˊ是ㄕˋ諸ㄓㄨ上ㄕㄤˋ善ㄕㄢˋ人ㄖㄣˊ俱ㄐㄩ會ㄏㄨㄟˋ一ㄧˋ處ㄔㄨˋ。舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，不ㄅㄨˋ可ㄎㄜˇ以ㄧˇ少ㄕㄠˇ善ㄕㄢˋ根ㄍㄣ福ㄈㄨˊ德ㄉㄜˊ因ㄧㄣ緣ㄩㄢˊ，得ㄉㄜˊ生ㄕㄥ彼ㄅㄧˇ國ㄍㄨㄛˊ。」\n「舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，若ㄖㄨㄛˋ有ㄧㄡˇ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ，聞ㄨㄣˊ說ㄕㄨㄛ阿ㄚ彌ㄇㄧˊ陀ㄊㄨㄛˊ佛ㄈㄛˊ，執ㄓˊ持ㄔˊ名ㄇㄧㄥˊ號ㄏㄠˋ，若ㄖㄨㄛˋ一ㄧˋ日ㄖˋ，若ㄖㄨㄛˋ二ㄦˋ日ㄖˋ，若ㄖㄨㄛˋ三ㄙㄢ日ㄖˋ，若ㄖㄨㄛˋ四ㄙˋ日ㄖˋ，若ㄖㄨㄛˋ五ㄨˇ日ㄖˋ，若ㄖㄨㄛˋ六ㄌㄧㄡˋ日ㄖˋ，若ㄖㄨㄛˋ七ㄑㄧ日ㄖˋ，一ㄧˋ心ㄒㄧㄣ不ㄅㄨˋ亂ㄌㄨㄢˋ，其ㄑㄧˊ人ㄖㄣˊ臨ㄌㄧㄣˊ命ㄇㄧㄥˋ終ㄓㄨㄥ時ㄕˊ，阿ㄚ彌ㄇㄧˊ陀ㄊㄨㄛˊ佛ㄈㄛˊ，與ㄩˇ諸ㄓㄨ聖ㄕㄥˋ眾ㄓㄨㄥˋ，現ㄒㄧㄢˋ在ㄗㄞˋ其ㄑㄧˊ前ㄑㄧㄢˊ。是ㄕˋ人ㄖㄣˊ終ㄓㄨㄥ時ㄕˊ，心ㄒㄧㄣ不ㄅㄨˋ顛ㄉㄧㄢ倒ㄉㄠˋ，即ㄐㄧˊ得ㄉㄜˊ往ㄨㄤˇ生ㄕㄥ阿ㄚ彌ㄇㄧˊ陀ㄊㄨㄛˊ佛ㄈㄛˊ極ㄐㄧˊ樂ㄌㄜˋ國ㄍㄨㄛˊ土ㄊㄨˇ。舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，我ㄨㄛˇ見ㄐㄧㄢˋ是ㄕˋ利ㄌㄧˋ，故ㄍㄨˋ說ㄕㄨㄛ此ㄘˇ言ㄧㄢˊ，若ㄖㄨㄛˋ有ㄧㄡˇ眾ㄓㄨㄥˋ生ㄕㄥ，聞ㄨㄣˊ是ㄕˋ說ㄕㄨㄛ者ㄓㄜˇ，應ㄧㄥ當ㄉㄤ發ㄈㄚ願ㄩㄢˋ，生ㄕㄥ彼ㄅㄧˇ國ㄍㄨㄛˊ土ㄊㄨˇ。」\n「舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，如ㄖㄨˊ我ㄨㄛˇ今ㄐㄧㄣ者ㄓㄜˇ，讚ㄗㄢˋ歎ㄊㄢˋ阿ㄚ彌ㄇㄧˊ陀ㄊㄨㄛˊ佛ㄈㄛˊ不ㄅㄨˋ可ㄎㄜˇ思ㄙ議ㄧˋ功ㄍㄨㄥ德ㄉㄜˊ之ㄓ利ㄌㄧˋ，東ㄉㄨㄥ方ㄈㄤ亦ㄧˋ有ㄧㄡˇ阿ㄚ閦ㄔㄨˋ（音ㄧㄣ同ㄊㄨㄥˊ觸ㄔㄨˋ）鞞ㄆㄧˊ佛ㄈㄛˊ，須ㄒㄩ彌ㄇㄧˊ相ㄒㄧㄤˋ佛ㄈㄛˊ，大ㄉㄚˋ須ㄒㄩ彌ㄇㄧˊ佛ㄈㄛˊ，須ㄒㄩ彌ㄇㄧˊ光ㄍㄨㄤ佛ㄈㄛˊ，妙ㄇㄧㄠˋ音ㄧㄣ佛ㄈㄛˊ，如ㄖㄨˊ是ㄕˋ等ㄉㄥˇ恆ㄏㄥˊ河ㄏㄜˊ沙ㄕㄚ數ㄕㄨˋ諸ㄓㄨ佛ㄈㄛˊ，各ㄍㄜˋ於ㄩˊ其ㄑㄧˊ國ㄍㄨㄛˊ，出ㄔㄨ廣ㄍㄨㄤˇ長ㄔㄤˊ舌ㄕㄜˊ相ㄒㄧㄤˋ，遍ㄅㄧㄢˋ覆ㄈㄨˋ三ㄙㄢ千ㄑㄧㄢ大ㄉㄚˋ千ㄑㄧㄢ世ㄕˋ界ㄐㄧㄝˋ，說ㄕㄨㄛ誠ㄔㄥˊ實ㄕˊ言ㄧㄢˊ：『汝ㄖㄨˇ等ㄉㄥˇ眾ㄓㄨㄥˋ生ㄕㄥ，當ㄉㄤ信ㄒㄧㄣˋ是ㄕˋ稱ㄔㄥ讚ㄗㄢˋ不ㄅㄨˋ可ㄎㄜˇ思ㄙ議ㄧˋ功ㄍㄨㄥ德ㄉㄜˊ，一ㄧˊ切ㄑㄧㄝˋ諸ㄓㄨ佛ㄈㄛˊ所ㄙㄨㄛˇ護ㄏㄨˋ念ㄋㄧㄢˋ經ㄐㄧㄥ。』」\n「舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，南ㄋㄢˊ方ㄈㄤ世ㄕˋ界ㄐㄧㄝˋ，有ㄧㄡˇ日ㄖˋ月ㄩㄝˋ燈ㄉㄥ佛ㄈㄛˊ，名ㄇㄧㄥˊ聞ㄨㄣˊ光ㄍㄨㄤ佛ㄈㄛˊ，大ㄉㄚˋ焰ㄧㄢˋ肩ㄐㄧㄢ佛ㄈㄛˊ，須ㄒㄩ彌ㄇㄧˊ燈ㄉㄥ佛ㄈㄛˊ，無ㄨˊ量ㄌㄧㄤˋ精ㄐㄧㄥ進ㄐㄧㄣˋ佛ㄈㄛˊ，如ㄖㄨˊ是ㄕˋ等ㄉㄥˇ恆ㄏㄥˊ河ㄏㄜˊ沙ㄕㄚ數ㄕㄨˋ諸ㄓㄨ佛ㄈㄛˊ，各ㄍㄜˋ於ㄩˊ其ㄑㄧˊ國ㄍㄨㄛˊ，出ㄔㄨ廣ㄍㄨㄤˇ長ㄔㄤˊ舌ㄕㄜˊ相ㄒㄧㄤˋ，遍ㄅㄧㄢˋ覆ㄈㄨˋ三ㄙㄢ千ㄑㄧㄢ大ㄉㄚˋ千ㄑㄧㄢ世ㄕˋ界ㄐㄧㄝˋ，說ㄕㄨㄛ誠ㄔㄥˊ實ㄕˊ言ㄧㄢˊ：『汝ㄖㄨˇ等ㄉㄥˇ眾ㄓㄨㄥˋ生ㄕㄥ，當ㄉㄤ信ㄒㄧㄣˋ是ㄕˋ稱ㄔㄥ讚ㄗㄢˋ不ㄅㄨˋ可ㄎㄜˇ思ㄙ議ㄧˋ功ㄍㄨㄥ德ㄉㄜˊ，一ㄧˊ切ㄑㄧㄝˋ諸ㄓㄨ佛ㄈㄛˊ所ㄙㄨㄛˇ護ㄏㄨˋ念ㄋㄧㄢˋ經ㄐㄧㄥ。』」「舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，西ㄒㄧ方ㄈㄤ世ㄕˋ界ㄐㄧㄝˋ，有ㄧㄡˇ無ㄨˊ量ㄌㄧㄤˋ壽ㄕㄡˋ佛ㄈㄛˊ，無ㄨˊ量ㄌㄧㄤˋ相ㄒㄧㄤˋ佛ㄈㄛˊ，無ㄨˊ量ㄌㄧㄤˋ幢ㄔㄨㄤˊ佛ㄈㄛˊ，大ㄉㄚˋ光ㄍㄨㄤ佛ㄈㄛˊ，大ㄉㄚˋ明ㄇㄧㄥˊ佛ㄈㄛˊ，寶ㄅㄠˇ相ㄒㄧㄤˋ佛ㄈㄛˊ，淨ㄐㄧㄥˋ光ㄍㄨㄤ佛ㄈㄛˊ，如ㄖㄨˊ是ㄕˋ等ㄉㄥˇ恆ㄏㄥˊ河ㄏㄜˊ沙ㄕㄚ數ㄕㄨˋ諸ㄓㄨ佛ㄈㄛˊ，各ㄍㄜˋ於ㄩˊ其ㄑㄧˊ國ㄍㄨㄛˊ，出ㄔㄨ廣ㄍㄨㄤˇ長ㄔㄤˊ舌ㄕㄜˊ相ㄒㄧㄤˋ，遍ㄅㄧㄢˋ覆ㄈㄨˋ三ㄙㄢ千ㄑㄧㄢ大ㄉㄚˋ千ㄑㄧㄢ世ㄕˋ界ㄐㄧㄝˋ，說ㄕㄨㄛ誠ㄔㄥˊ實ㄕˊ言ㄧㄢˊ：『汝ㄖㄨˇ等ㄉㄥˇ眾ㄓㄨㄥˋ生ㄕㄥ，當ㄉㄤ信ㄒㄧㄣˋ是ㄕˋ稱ㄔㄥ讚ㄗㄢˋ不ㄅㄨˋ可ㄎㄜˇ思ㄙ議ㄧˋ功ㄍㄨㄥ德ㄉㄜˊ，一ㄧˊ切ㄑㄧㄝˋ諸ㄓㄨ佛ㄈㄛˊ所ㄙㄨㄛˇ護ㄏㄨˋ念ㄋㄧㄢˋ經ㄐㄧㄥ。』」\n「舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，北ㄅㄟˇ方ㄈㄤ世ㄕˋ界ㄐㄧㄝˋ，有ㄧㄡˇ焰ㄧㄢˋ肩ㄐㄧㄢ佛ㄈㄛˊ，最ㄗㄨㄟˋ勝ㄕㄥˋ音ㄧㄣ佛ㄈㄛˊ，難ㄋㄢˊ沮ㄐㄩˇ佛ㄈㄛˊ，日ㄖˋ生ㄕㄥ佛ㄈㄛˊ，網ㄨㄤˇ明ㄇㄧㄥˊ佛ㄈㄛˊ，如ㄖㄨˊ是ㄕˋ等ㄉㄥˇ恆ㄏㄥˊ河ㄏㄜˊ沙ㄕㄚ數ㄕㄨˋ諸ㄓㄨ佛ㄈㄛˊ，各ㄍㄜˋ於ㄩˊ其ㄑㄧˊ國ㄍㄨㄛˊ，出ㄔㄨ廣ㄍㄨㄤˇ長ㄔㄤˊ舌ㄕㄜˊ相ㄒㄧㄤˋ，遍ㄅㄧㄢˋ覆ㄈㄨˋ三ㄙㄢ千ㄑㄧㄢ大ㄉㄚˋ千ㄑㄧㄢ世ㄕˋ界ㄐㄧㄝˋ，說ㄕㄨㄛ誠ㄔㄥˊ實ㄕˊ言ㄧㄢˊ：『汝ㄖㄨˇ等ㄉㄥˇ眾ㄓㄨㄥˋ生ㄕㄥ，當ㄉㄤ信ㄒㄧㄣˋ是ㄕˋ稱ㄔㄥ讚ㄗㄢˋ不ㄅㄨˋ可ㄎㄜˇ思ㄙ議ㄧˋ功ㄍㄨㄥ德ㄉㄜˊ，一ㄧˊ切ㄑㄧㄝˋ諸ㄓㄨ佛ㄈㄛˊ所ㄙㄨㄛˇ護ㄏㄨˋ念ㄋㄧㄢˋ經ㄐㄧㄥ。』」\n「舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，下ㄒㄧㄚˋ方ㄈㄤ世ㄕˋ界ㄐㄧㄝˋ，有ㄧㄡˇ師ㄕ子ㄗˇ佛ㄈㄛˊ，名ㄇㄧㄥˊ聞ㄨㄣˊ佛ㄈㄛˊ，名ㄇㄧㄥˊ光ㄍㄨㄤ佛ㄈㄛˊ，達ㄉㄚˊ摩ㄇㄛˊ佛ㄈㄛˊ，法ㄈㄚˇ幢ㄔㄨㄤˊ佛ㄈㄛˊ，持ㄔˊ法ㄈㄚˇ佛ㄈㄛˊ，如ㄖㄨˊ是ㄕˋ等ㄉㄥˇ恆ㄏㄥˊ河ㄏㄜˊ沙ㄕㄚ數ㄕㄨˋ諸ㄓㄨ佛ㄈㄛˊ，各ㄍㄜˋ於ㄩˊ其ㄑㄧˊ國ㄍㄨㄛˊ，出ㄔㄨ廣ㄍㄨㄤˇ長ㄔㄤˊ舌ㄕㄜˊ相ㄒㄧㄤˋ，遍ㄅㄧㄢˋ覆ㄈㄨˋ三ㄙㄢ千ㄑㄧㄢ大ㄉㄚˋ千ㄑㄧㄢ世ㄕˋ界ㄐㄧㄝˋ，說ㄕㄨㄛ誠ㄔㄥˊ實ㄕˊ言ㄧㄢˊ：『汝ㄖㄨˇ等ㄉㄥˇ眾ㄓㄨㄥˋ生ㄕㄥ，當ㄉㄤ信ㄒㄧㄣˋ是ㄕˋ稱ㄔㄥ讚ㄗㄢˋ不ㄅㄨˋ可ㄎㄜˇ思ㄙ議ㄧˋ功ㄍㄨㄥ德ㄉㄜˊ，一ㄧˊ切ㄑㄧㄝˋ諸ㄓㄨ佛ㄈㄛˊ所ㄙㄨㄛˇ護ㄏㄨˋ念ㄋㄧㄢˋ經ㄐㄧㄥ。』」「舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，上ㄕㄤˋ方ㄈㄤ世ㄕˋ界ㄐㄧㄝˋ，有ㄧㄡˇ梵ㄈㄢˋ音ㄧㄣ佛ㄈㄛˊ，宿ㄙㄨˋ王ㄨㄤˊ佛ㄈㄛˊ，香ㄒㄧㄤ上ㄕㄤˋ佛ㄈㄛˊ，香ㄒㄧㄤ光ㄍㄨㄤ佛ㄈㄛˊ，大ㄉㄚˋ焰ㄧㄢˋ肩ㄐㄧㄢ佛ㄈㄛˊ，雜ㄗㄚˊ色ㄙㄜˋ寶ㄅㄠˇ華ㄏㄨㄚ嚴ㄧㄢˊ身ㄕㄣ佛ㄈㄛˊ，娑ㄙㄨㄛ羅ㄌㄨㄛˊ樹ㄕㄨˋ王ㄨㄤˊ佛ㄈㄛˊ，寶ㄅㄠˇ華ㄏㄨㄚ德ㄉㄜˊ佛ㄈㄛˊ，見ㄐㄧㄢˋ一ㄧˊ切ㄑㄧㄝˋ義ㄧˋ佛ㄈㄛˊ，如ㄖㄨˊ須ㄒㄩ彌ㄇㄧˊ山ㄕㄢ佛ㄈㄛˊ，如ㄖㄨˊ是ㄕˋ等ㄉㄥˇ恆ㄏㄥˊ河ㄏㄜˊ沙ㄕㄚ數ㄕㄨˋ諸ㄓㄨ佛ㄈㄛˊ，各ㄍㄜˋ於ㄩˊ其ㄑㄧˊ國ㄍㄨㄛˊ，出ㄔㄨ廣ㄍㄨㄤˇ長ㄔㄤˊ舌ㄕㄜˊ相ㄒㄧㄤˋ，遍ㄅㄧㄢˋ覆ㄈㄨˋ三ㄙㄢ千ㄑㄧㄢ大ㄉㄚˋ千ㄑㄧㄢ世ㄕˋ界ㄐㄧㄝˋ，說ㄕㄨㄛ誠ㄔㄥˊ實ㄕˊ言ㄧㄢˊ：『汝ㄖㄨˇ等ㄉㄥˇ眾ㄓㄨㄥˋ生ㄕㄥ，當ㄉㄤ信ㄒㄧㄣˋ是ㄕˋ稱ㄔㄥ讚ㄗㄢˋ不ㄅㄨˋ可ㄎㄜˇ思ㄙ議ㄧˋ功ㄍㄨㄥ德ㄉㄜˊ，一ㄧˊ切ㄑㄧㄝˋ諸ㄓㄨ佛ㄈㄛˊ所ㄙㄨㄛˇ護ㄏㄨˋ念ㄋㄧㄢˋ經ㄐㄧㄥ。』」\n「舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，於ㄩˊ汝ㄖㄨˇ意ㄧˋ云ㄩㄣˊ何ㄏㄜˊ，何ㄏㄜˊ故ㄍㄨˋ名ㄇㄧㄥˊ為ㄨㄟˊ一ㄧˊ切ㄑㄧㄝˋ諸ㄓㄨ佛ㄈㄛˊ所ㄙㄨㄛˇ護ㄏㄨˋ念ㄋㄧㄢˋ經ㄐㄧㄥ，舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，若ㄖㄨㄛˋ有ㄧㄡˇ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ，聞ㄨㄣˊ是ㄕˋ經ㄐㄧㄥ受ㄕㄡˋ持ㄔˊ者ㄓㄜˇ，及ㄐㄧˊ聞ㄨㄣˊ諸ㄓㄨ佛ㄈㄛˊ名ㄇㄧㄥˊ者ㄓㄜˇ，是ㄕˋ諸ㄓㄨ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ，皆ㄐㄧㄝ為ㄨㄟˊ一ㄧˊ切ㄑㄧㄝˋ諸ㄓㄨ佛ㄈㄛˊ之ㄓ所ㄙㄨㄛˇ護ㄏㄨˋ念ㄋㄧㄢˋ，皆ㄐㄧㄝ得ㄉㄜˊ不ㄅㄨˋ退ㄊㄨㄟˋ轉ㄓㄨㄢˇ於ㄩˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ。是ㄕˋ故ㄍㄨˋ舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，汝ㄖㄨˇ等ㄉㄥˇ皆ㄐㄧㄝ當ㄉㄤ信ㄒㄧㄣˋ受ㄕㄡˋ我ㄨㄛˇ語ㄩˇ，及ㄐㄧˊ諸ㄓㄨ佛ㄈㄛˊ所ㄙㄨㄛˇ說ㄕㄨㄛ。」\n「舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，若ㄖㄨㄛˋ有ㄧㄡˇ人ㄖㄣˊ已ㄧˇ發ㄈㄚ願ㄩㄢˋ，今ㄐㄧㄣ發ㄈㄚ願ㄩㄢˋ，當ㄉㄤ發ㄈㄚ願ㄩㄢˋ，欲ㄩˋ生ㄕㄥ阿ㄚ彌ㄇㄧˊ陀ㄊㄨㄛˊ佛ㄈㄛˊ國ㄍㄨㄛˊ者ㄓㄜˇ，是ㄕˋ諸ㄓㄨ人ㄖㄣˊ等ㄉㄥˇ，皆ㄐㄧㄝ得ㄉㄜˊ不ㄅㄨˋ退ㄊㄨㄟˋ轉ㄓㄨㄢˇ於ㄩˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ，於ㄩˊ彼ㄅㄧˇ國ㄍㄨㄛˊ土ㄊㄨˇ，若ㄖㄨㄛˋ已ㄧˇ生ㄕㄥ，若ㄖㄨㄛˋ今ㄐㄧㄣ生ㄕㄥ，若ㄖㄨㄛˋ當ㄉㄤ生ㄕㄥ。是ㄕˋ故ㄍㄨˋ舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，諸ㄓㄨ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ，若ㄖㄨㄛˋ有ㄧㄡˇ信ㄒㄧㄣˋ者ㄓㄜˇ，應ㄧㄥ當ㄉㄤ發ㄈㄚ願ㄩㄢˋ，生ㄕㄥ彼ㄅㄧˇ國ㄍㄨㄛˊ土ㄊㄨˇ。」\n「舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，如ㄖㄨˊ我ㄨㄛˇ今ㄐㄧㄣ者ㄓㄜˇ，稱ㄔㄥ讚ㄗㄢˋ諸ㄓㄨ佛ㄈㄛˊ不ㄅㄨˋ可ㄎㄜˇ思ㄙ議ㄧˋ功ㄍㄨㄥ德ㄉㄜˊ，彼ㄅㄧˇ諸ㄓㄨ佛ㄈㄛˊ等ㄉㄥˇ，亦ㄧˋ稱ㄔㄥ讚ㄗㄢˋ我ㄨㄛˇ不ㄅㄨˋ可ㄎㄜˇ思ㄙ議ㄧˋ功ㄍㄨㄥ德ㄉㄜˊ，而ㄦˊ作ㄗㄨㄛˋ是ㄕˋ言ㄧㄢˊ：『釋ㄕˋ迦ㄐㄧㄚ牟ㄇㄡˊ尼ㄋㄧˊ佛ㄈㄛˊ，能ㄋㄥˊ為ㄨㄟˊ甚ㄕㄣˋ難ㄋㄢˊ希ㄒㄧ有ㄧㄡˇ之ㄓ事ㄕˋ，能ㄋㄥˊ於ㄩˊ娑ㄙㄨㄛ婆ㄆㄛˊ國ㄍㄨㄛˊ土ㄊㄨˇ，五ㄨˇ濁ㄓㄨㄛˊ惡ㄜˋ世ㄕˋ，劫ㄐㄧㄝˊ濁ㄓㄨㄛˊ、見ㄐㄧㄢˋ濁ㄓㄨㄛˊ、煩ㄈㄢˊ惱ㄋㄠˇ濁ㄓㄨㄛˊ、眾ㄓㄨㄥˋ生ㄕㄥ濁ㄓㄨㄛˊ、命ㄇㄧㄥˋ濁ㄓㄨㄛˊ中ㄓㄨㄥ，得ㄉㄜˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ，為ㄨㄟˋ諸ㄓㄨ眾ㄓㄨㄥˋ生ㄕㄥ說ㄕㄨㄛ是ㄕˋ一ㄧˊ切ㄑㄧㄝˋ世ㄕˋ間ㄐㄧㄢ難ㄋㄢˊ信ㄒㄧㄣˋ之ㄓ法ㄈㄚˇ。』」\n「舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，當ㄉㄤ知ㄓ我ㄨㄛˇ於ㄩˊ五ㄨˇ濁ㄓㄨㄛˊ惡ㄜˋ世ㄕˋ，行ㄒㄧㄥˊ此ㄘˇ難ㄋㄢˊ事ㄕˋ，得ㄉㄜˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ，為ㄨㄟˋ一ㄧˊ切ㄑㄧㄝˋ世ㄕˋ間ㄐㄧㄢ說ㄕㄨㄛ此ㄘˇ難ㄋㄢˊ信ㄒㄧㄣˋ之ㄓ法ㄈㄚˇ，是ㄕˋ為ㄨㄟˊ甚ㄕㄣˋ難ㄋㄢˊ。」\n佛ㄈㄛˊ說ㄕㄨㄛ此ㄘˇ經ㄐㄧㄥ已ㄧˇ，舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ，及ㄐㄧˊ諸ㄓㄨ比ㄅㄧˇ丘ㄑㄧㄡ，一ㄧˊ切ㄑㄧㄝˋ世ㄕˋ間ㄐㄧㄢ天ㄊㄧㄢ人ㄖㄣˊ，阿ㄚ修ㄒㄧㄡ羅ㄌㄨㄛˊ等ㄉㄥˇ，聞ㄨㄣˊ佛ㄈㄛˊ所ㄙㄨㄛˇ說ㄕㄨㄛ，歡ㄏㄨㄢ喜ㄒㄧˇ信ㄒㄧㄣˋ受ㄕㄡˋ，作ㄗㄨㄛˋ禮ㄌㄧˇ而ㄦˊ去ㄑㄩˋ。','鳩摩羅什譯的《佛說阿彌陀經》，是淨土宗的根本經典之一。釋迦牟尼佛為舍利弗宣說西方極樂世界的依正莊嚴，勸人執持阿彌陀佛名號、發願往生，並有六方諸佛共同護念、稱讚。注音由使用者提供的圖片逐字辨識整理，請以您慣用的版本核對。','佛在舍衛國祇樹給孤獨園，對舍利弗說：向西方經過十萬億佛土，有個世界叫極樂，那裡的佛名阿彌陀佛，現在正在說法。極樂世界沒有眾苦、只受諸樂，有七寶池、八功德水、天樂、曼陀羅華，眾鳥宣說佛法。阿彌陀佛光明壽命都無量無邊。若有人聽聞阿彌陀佛名號，執持一日乃至七日，一心不亂，臨命終時阿彌陀佛與聖眾現在眼前，使其往生極樂。東西南北上下六方諸佛，也都稱讚這不可思議的功德，並護念受持此經的人。因此應當發願往生彼國。佛說完經後，舍利弗、比丘及一切天人、阿修羅等，聞法歡喜，信受奉行，作禮而去。（白話大意）'),
  mk('s_n_mituo','南無阿彌陀佛','佛號','阿彌陀佛','往生淨土、念佛消業','佛號聖號','—',['往生淨土','消業障','平安順遂'],108,4,'南ㄋㄚˊ無ㄇㄛˊ阿ㄜ彌ㄇㄧˊ陀ㄊㄨㄛˊ佛ㄈㄛˊ','淨土宗最主要的持名念佛聖號，一心稱念，求生西方極樂世界。','「南無」是歸命、敬禮；「阿彌陀佛」意為無量光、無量壽佛。（白話大意）'),

  mk('s_g_kaijing','開經偈','偈頌','本師釋迦牟尼佛','念經前啟請，願解經義','偈頌類','傳為唐・武則天所作',['智慧開悟'],1,15,'無ㄨˊ上ㄕㄤˋ甚ㄕㄣˋ深ㄕㄣ微ㄨㄟˊ妙ㄇㄧㄠˋ法ㄈㄚˇ，百ㄅㄞˇ千ㄑㄧㄢ萬ㄨㄢˋ劫ㄐㄧㄝˊ難ㄋㄢˊ遭ㄗㄠ遇ㄩˋ，我ㄨㄛˇ今ㄐㄧㄣ見ㄐㄧㄢˋ聞ㄨㄣˊ得ㄉㄜˊ受ㄕㄡˋ持ㄔˊ，願ㄩㄢˋ解ㄐㄧㄝˇ如ㄖㄨˊ來ㄌㄞˊ真ㄓㄣ實ㄕˊ義ㄧˋ。','誦經前所念的偈頌，表達對佛法難得聞遇的珍惜，並發願了解經義。','最無上、最深奧微妙的佛法，在百千萬劫中都難以遇到；我今天有幸見到、聽到並能夠受持，願我能夠理解如來所說的真實意義。（白話大意）'),
  mk('s_g_sanguiyi','三皈依','偈頌','三寶','皈依佛法僧，發心修行','偈頌類','—',['增長福慧','智慧開悟'],1,40,'自ㄗˋ皈ㄍㄨㄟ依ㄧ佛ㄈㄛˊ，當ㄉㄤ願ㄩㄢˋ眾ㄓㄨㄥˋ生ㄕㄥ，體ㄊㄧˇ解ㄐㄧㄝˇ大ㄉㄚˋ道ㄉㄠˋ，發ㄈㄚ無ㄨˊ上ㄕㄤˋ心ㄒㄧㄣ。\n自ㄗˋ皈ㄍㄨㄟ依ㄧ法ㄈㄚˇ，當ㄉㄤ願ㄩㄢˋ眾ㄓㄨㄥˋ生ㄕㄥ，深ㄕㄣ入ㄖㄨˋ經ㄐㄧㄥ藏ㄗㄤˋ，智ㄓˋ慧ㄏㄨㄟˋ如ㄖㄨˊ海ㄏㄞˇ。\n自ㄗˋ皈ㄍㄨㄟ依ㄧ僧ㄙㄥ，當ㄉㄤ願ㄩㄢˋ眾ㄓㄨㄥˋ生ㄕㄥ，統ㄊㄨㄥˇ理ㄌㄧˇ大ㄉㄚˋ眾ㄓㄨㄥˋ，一ㄧ切ㄑㄧㄝˋ無ㄨˊ礙ㄞˋ。\n和ㄏㄜˊ南ㄋㄢˊ聖ㄕㄥˋ眾ㄓㄨㄥˋ。','皈依佛、法、僧三寶，是成為佛弟子的起點，也是每日修行的初心。','我皈依佛，願眾生體會大道、發起無上道心；我皈依法，願眾生深入經藏、智慧如海；我皈依僧，願眾生統理大眾、一切無礙。（白話大意）'),
  mk('s_g_sihong','四弘誓願','偈頌','十方諸佛','發菩提心，立願度眾','偈頌類','—',['增長福慧'],1,20,'眾ㄓㄨㄥˋ生ㄕㄥ無ㄨˊ邊ㄅㄧㄢ誓ㄕˋ願ㄩㄢˋ度ㄉㄨˋ，煩ㄈㄢˊ惱ㄋㄠˇ無ㄨˊ盡ㄐㄧㄣˋ誓ㄕˋ願ㄩㄢˋ斷ㄉㄨㄢˋ，法ㄈㄚˇ門ㄇㄣˊ無ㄨˊ量ㄌㄧㄤˋ誓ㄕˋ願ㄩㄢˋ學ㄒㄩㄝˊ，佛ㄈㄛˊ道ㄉㄠˋ無ㄨˊ上ㄕㄤˋ誓ㄕˋ願ㄩㄢˋ成ㄔㄥˊ。','大乘菩薩共同的四個誓願，常於課誦或法會結束時發願。','眾生無邊，誓願度盡；煩惱無盡，誓願斷除；法門無量，誓願學習；佛道無上，誓願成就。（白話大意）'),
  mk('s_g_chanhui','懺悔偈','偈頌','十方諸佛','懺悔業障，清淨身口意','偈頌類','出自《普賢行願品》',['消業障','消災除惡'],3,20,'往ㄨㄤˇ昔ㄒㄧˊ所ㄙㄨㄛˇ造ㄗㄠˋ諸ㄓㄨ惡ㄜˋ業ㄧㄝˋ，皆ㄐㄧㄝ由ㄧㄡˊ無ㄨˊ始ㄕˇ貪ㄊㄢ瞋ㄔㄣ癡ㄔ，從ㄘㄨㄥˊ身ㄕㄣ語ㄩˇ意ㄧˋ之ㄓ所ㄙㄨㄛˇ生ㄕㄥ，一ㄧ切ㄑㄧㄝˋ我ㄨㄛˇ今ㄐㄧㄣ皆ㄐㄧㄝ懺ㄔㄢˋ悔ㄏㄨㄟˇ。','普賢菩薩十大願王中「懺悔業障」的偈頌，常於早晚課或拜懺時念誦。','過去所造的種種惡業，都是由無始以來的貪、瞋、癡，從身、口、意所產生；對於這一切，我今天全部誠心懺悔。（白話大意）'),
  mk('s_g_zanfo','阿彌陀佛讚（阿彌陀佛身金色）','偈頌','阿彌陀佛','讚歎彌陀功德，增長淨土信願','偈頌類','—',['往生淨土','增長福慧'],1,60,'阿ㄜ彌ㄇㄧˊ陀ㄊㄨㄛˊ佛ㄈㄛˊ身ㄕㄣ金ㄐㄧㄣ色ㄙㄜˋ，相ㄒㄧㄤˋ好ㄏㄠˇ光ㄍㄨㄤ明ㄇㄧㄥˊ無ㄨˊ等ㄉㄥˇ倫ㄌㄨㄣˊ，白ㄅㄞˊ毫ㄏㄠˊ宛ㄨㄢˇ轉ㄓㄨㄢˇ五ㄨˇ須ㄒㄩ彌ㄇㄧˊ，紺ㄍㄢˋ目ㄇㄨˋ澄ㄔㄥˊ清ㄑㄧㄥ四ㄙˋ大ㄉㄚˋ海ㄏㄞˇ。\n光ㄍㄨㄤ中ㄓㄨㄥ化ㄏㄨㄚˋ佛ㄈㄛˊ無ㄨˊ數ㄕㄨˋ億ㄧˋ，化ㄏㄨㄚˋ菩ㄆㄨˊ薩ㄙㄚˋ眾ㄓㄨㄥˋ亦ㄧˋ無ㄨˊ邊ㄅㄧㄢ，四ㄙˋ十ㄕˊ八ㄅㄚ願ㄩㄢˋ度ㄉㄨˋ眾ㄓㄨㄥˋ生ㄕㄥ，九ㄐㄧㄡˇ品ㄆㄧㄣˇ咸ㄒㄧㄢˊ令ㄌㄧㄥˋ登ㄉㄥ彼ㄅㄧˇ岸ㄢˋ。\n南ㄋㄚˊ無ㄇㄛˊ西ㄒㄧ方ㄈㄤ極ㄐㄧˊ樂ㄌㄜˋ世ㄕˋ界ㄐㄧㄝˋ大ㄉㄚˋ慈ㄘˊ大ㄉㄚˋ悲ㄅㄟ阿ㄜ彌ㄇㄧˊ陀ㄊㄨㄛˊ佛ㄈㄛˊ。','讚歎阿彌陀佛相好光明與四十八願的偈頌，常用於淨土法會與晚課。','阿彌陀佛身呈金色，相好光明無可比擬；白毫相如五座須彌山，紺青眼目清澈如四大海。光明中化現無數億佛與菩薩，以四十八願度化眾生，使九品眾生都能到達彼岸。（白話大意）'),
  mk('s_g_jingzhong','普賢菩薩警眾偈','偈頌','普賢菩薩','提醒精進、珍惜時光','偈頌類','—',['增長福慧','智慧開悟'],1,20,'是ㄕˋ日ㄖˋ已ㄧˇ過ㄍㄨㄛˋ，命ㄇㄧㄥˋ亦ㄧˋ隨ㄙㄨㄟˊ減ㄐㄧㄢˇ，如ㄖㄨˊ少ㄕㄠˇ水ㄕㄨㄟˇ魚ㄩˊ，斯ㄙ有ㄧㄡˇ何ㄏㄜˊ樂ㄌㄜˋ。大ㄉㄚˋ眾ㄓㄨㄥˋ當ㄉㄤ勤ㄑㄧㄣˊ精ㄐㄧㄥ進ㄐㄧㄣˋ，如ㄖㄨˊ救ㄐㄧㄡˋ頭ㄊㄡˊ燃ㄖㄢˊ，但ㄉㄢˋ念ㄋㄧㄢˋ無ㄨˊ常ㄔㄤˊ，慎ㄕㄣˋ勿ㄨˋ放ㄈㄤˋ逸ㄧˋ。','晚課結尾常念的偈頌，提醒時間無常，要把握當下精進修行。','今天已經過去，壽命也隨之減少，像水快乾的魚，哪裡還有什麼快樂？大家應當精勤用功，如同撲救頭上的火；只要想著世事無常，千萬不要放逸懈怠。（白話大意）'),
  mk('s_m_wangsheng','往生咒（拔一切業障根本得生淨土陀羅尼）','咒','阿彌陀佛','消業障、超度亡者、往生淨土','密教咒語類','劉宋・求那跋陀羅譯',['往生淨土','超度亡者','消業障'],21,60,'南ㄋㄚˊ無ㄇㄛˊ阿ㄜ彌ㄇㄧˊ多ㄉㄨㄛ婆ㄆㄛˊ夜ㄧㄝˋ，哆ㄉㄨㄛ他ㄊㄚ伽ㄑㄧㄝˊ多ㄉㄨㄛ夜ㄧㄝˋ，哆ㄉㄨㄛ地ㄉㄧˋ夜ㄧㄝˋ他ㄊㄚ，阿ㄜ彌ㄇㄧˊ利ㄌㄧˋ都ㄉㄡ婆ㄆㄛˊ毘ㄆㄧˊ，阿ㄜ彌ㄇㄧˊ利ㄌㄧˋ哆ㄉㄨㄛ，悉ㄒㄧ耽ㄉㄢ婆ㄆㄛˊ毘ㄆㄧˊ，阿ㄜ彌ㄇㄧˊ利ㄌㄧˋ哆ㄉㄨㄛ，毘ㄆㄧˊ迦ㄐㄧㄚ蘭ㄌㄢˊ帝ㄉㄧˋ，阿ㄜ彌ㄇㄧˊ利ㄌㄧˋ哆ㄉㄨㄛ，毘ㄆㄧˊ迦ㄐㄧㄚ蘭ㄌㄢˊ多ㄉㄨㄛ，伽ㄑㄧㄝˊ彌ㄇㄧˊ膩ㄋㄧˋ，伽ㄑㄧㄝˊ伽ㄑㄧㄝˊ那ㄋㄚˋ，枳ㄓˇ多ㄉㄨㄛ迦ㄐㄧㄚ利ㄌㄧˋ，娑ㄙㄚˋ婆ㄆㄛˊ訶ㄏㄜ。','全名「拔一切業障根本得生淨土陀羅尼」，常用於超薦亡者、為往生者助念。注音依常見讀法，各道場讀音略有差異，請對照您慣用的版本。',mt),
  mk('s_m_zhunti','準提神咒','咒','準提菩薩','消災免難、滿願、增長福慧','密教咒語類','唐代傳譯',['消災除惡','滿願得子','增長福慧'],108,20,'南ㄋㄚˊ無ㄇㄛˊ颯ㄙㄚˋ哆ㄉㄨㄛ喃ㄋㄢˊ，三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ陀ㄊㄨㄛˊ，俱ㄐㄩ胝ㄓ喃ㄋㄢˊ，怛ㄉㄚˊ姪ㄓˊ他ㄊㄚ，唵ㄨㄥ，折ㄓㄜˊ戾ㄌㄧˋ主ㄓㄨˇ戾ㄌㄧˋ，準ㄓㄨㄣˇ提ㄊㄧˊ娑ㄙㄚˋ婆ㄆㄛˊ訶ㄏㄜ。','準提菩薩被尊稱為「七俱胝佛母」，此咒流傳廣泛，常為祈求消災、順遂、求子或滿願而持誦。注音依常見讀法，請對照您慣用的版本。',mt),
  mk('s_m_jingkou','淨口業真言','咒','本師釋迦牟尼佛','誦經前淨口，口業清淨','密教咒語類','—',['消業障','平安順遂'],3,10,'唵ㄨㄥ，修ㄒㄧㄡ唎ㄌㄧˋ修ㄒㄧㄡ唎ㄌㄧˋ，摩ㄇㄛˊ訶ㄏㄜ修ㄒㄧㄡ唎ㄌㄧˋ，修ㄒㄧㄡ修ㄒㄧㄡ唎ㄌㄧˋ，薩ㄙㄚˋ婆ㄆㄛˊ訶ㄏㄜ。','課誦開始前清淨口業的真言，通常念三遍，再接著念其他經咒。',mt),
  mk('s_m_yaoshi','藥師灌頂真言（藥師咒）','咒','藥師琉璃光如來','消災延壽、身體健康、病苦消除','密教咒語類','唐・玄奘譯本',['身體健康','消災除惡','增長福慧'],21,40,'南ㄋㄚˊ無ㄇㄛˊ薄ㄅㄛˊ伽ㄑㄧㄝˊ伐ㄈㄚˊ帝ㄉㄧˋ，鞞ㄅㄧˋ殺ㄕㄚ社ㄕㄜˋ窶ㄐㄩˋ嚕ㄌㄨ，薜ㄅㄧˋ琉ㄌㄧㄡˊ璃ㄌㄧˊ，缽ㄅㄛ喇ㄌㄚˇ婆ㄆㄛˊ，喝ㄏㄜ囉ㄌㄨㄛˊ闍ㄕㄜˊ也ㄧㄝˇ，怛ㄉㄚˊ他ㄊㄚ揭ㄐㄧㄝˊ多ㄉㄨㄛ耶ㄧㄝˊ，阿ㄚ囉ㄌㄨㄛˊ喝ㄏㄜ帝ㄉㄧˋ，三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ勃ㄅㄛˊ陀ㄊㄨㄛˊ耶ㄧㄝˊ，怛ㄉㄚˊ姪ㄓˊ他ㄊㄚ，唵ㄨㄥ，鞞ㄅㄧˋ殺ㄕㄚ逝ㄕˋ，鞞ㄅㄧˋ殺ㄕㄚ逝ㄕˋ，鞞ㄅㄧˋ殺ㄕㄚ社ㄕㄜˋ，三ㄙㄢ沒ㄇㄛˋ揭ㄐㄧㄝˊ帝ㄉㄧˋ，莎ㄙㄨㄛ訶ㄏㄜ。','藥師琉璃光如來的根本咒，常為祈求消災、延壽、病癒而持誦。此為玄奘譯本的常見念法，注音依常見讀法由我整理，各道場讀音略有差異，請對照您慣用的版本。',mt),
  mk('s_m_lvdumu','綠度母心咒','咒','綠度母','消除障礙、救度危難、增長福德','密教咒語類','藏傳佛教傳承',['消災除惡','平安順遂','增長福慧'],108,8,'嗡ㄨㄥ　達ㄉㄚˊ咧ㄌㄧㄝˋ　都ㄉㄨ達ㄉㄚˊ咧ㄌㄧㄝˋ　都ㄉㄨ咧ㄌㄧㄝˋ　梭ㄙㄨㄛ哈ㄏㄚ','綠度母是藏傳佛教中慈悲救度的代表，常為消除障礙、免除恐懼而持誦。梵文為 Oṃ tāre tuttāre ture svāhā。注音依常見念法整理，請對照您慣用的版本。',mt),
  mk('s_m_wenshu','文殊智慧咒','咒','文殊師利菩薩','增長智慧、記憶與辯才、學業順利','密教咒語類','藏傳佛教傳承',['智慧開悟'],108,6,'嗡ㄨㄥ　阿ㄚ　啦ㄌㄚ　巴ㄅㄚ　札ㄓㄚˊ　那ㄋㄚ　諦ㄉㄧˋ','文殊菩薩的心咒，又稱五字文殊咒，常為增長智慧、背誦記憶、考試而持誦。梵文為 Oṃ a ra pa ca na dhīḥ。各傳承的音譯略有差異，注音請對照您慣用的版本。',mt),

const u8b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const b64u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function cryptoKey(pass,salt){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encText(txt,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await cryptoKey(pass,salt),new TextEncoder().encode(txt)));
  return JSON.stringify({enc:1,salt:u8b64(salt),iv:u8b64(iv),data:u8b64(ct)});
}
async function decText(obj,pass){
  if(!pass)throw new Error('NEEDPASS');
  try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u8(obj.iv)},await cryptoKey(pass,b64u8(obj.salt)),b64u8(obj.data));return new TextDecoder().decode(pt)}
  catch(e){throw new Error('BADPASS')}
}

      checkins:[...S.checkins].sort(),events:S.events,festOv:S.festOv,barriers:S.barriers,dedications:S.dedications,finals:S.finals,ending:S.ending,faq:S.faq,

  /* 合併：念誦紀錄與打卡日取聯集；其餘以較新的一方為準。回傳 true 代表需要把合併結果推回雲端 */
  merge(Rm,forceRemote){

    [...S.logs,...(Rm.logs||[])].forEach(l=>{if(!del.has(l.id))map.set(l.id,l)});

      ['plan','targets','events','barriers','dedications','finals'].forEach(k=>{if(Array.isArray(Rm[k]))S[k]=Rm[k]});

const festType=t=>/聖誕/.test(t)?'佛菩薩聖誕':/盂蘭盆/.test(t)?'法會':'佛菩薩紀念日';
function festList(){
  return FEST.map(f=>{
    const key=f[0]+'-'+f[1]+'-'+f[2],ov=S.festOv[key]||{},b=FESTINFO[f[2]]||{};
    const pick=(k,d)=>ov[k]!==undefined?ov[k]:d;
    return{rule:f[3]||'',key,hidden:!!ov.hidden,edited:Object.keys(ov).some(k=>k!=='hidden'),lm:pick('lm',f[0]),ld:pick('ld',f[1]),span:pick('span',1),
      title:pick('title',f[2]),type:pick('type',b.t||festType(f[2])),origin:pick('origin',b.o||''),brief:pick('brief',b.b||''),practice:pick('practice',b.p||'')};
  });
}
const qingmingDay=y=>Math.floor((y%100)*0.2422+4.81)-Math.floor((y%100)/4);
const isQingming=d=>d.getMonth()===3&&d.getDate()===qingmingDay(d.getFullYear());
function lunarMatch(d0,lm,ld){
  const l=lunar(d0);if(!l||l.leap||l.m!==lm)return false;
  if(l.d===ld)return true;
  if(ld===30&&l.d===29){const ln=lunar(new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+1,12));return !!ln&&ln.d===1}
  return false;
}
/* 該國曆年內第一次出現的農曆月日（不含閏月）；找不到回傳空字串 */
function lunarToSolar(y,lm,ld){for(let i=0;i<366;i++){const d=new Date(y,0,1+i,12);if(d.getFullYear()!==y)break;if(lunarMatch(d,lm,ld))return ds(d)}return ''}
const dayShift=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,12);
const evSpan=e=>{if(!e.endDate||e.endDate<=e.date)return 1;return Math.min(60,Math.round((parseD(e.endDate)-parseD(e.date))/864e5)+1)};
function eventsOn(d){
  const out=[],l=lunar(d),M=d.getMonth()+1,D=d.getDate(),k=ds(d);
  festList().forEach(f=>{
    if(f.hidden)return;
    for(let off=0;off<Math.max(1,f.span);off++){
      const d0=dayShift(d,-off);
      if(f.rule==='qm'?isQingming(d0):lunarMatch(d0,f.lm,f.ld)){out.push({t:'fest',key:f.key,title:f.title,type:f.type,origin:f.origin,brief:f.brief,practice:f.practice,day:off+1,span:Math.max(1,f.span)});break}
    }
  });
  if(l&&S.settings.showMonthly&&(l.d===1||l.d===15))out.push({t:'monthly',title:l.d===1?'朔日（初一）':'望日（十五）',day:1,span:1});
  S.events.forEach(e=>{
    const span=evSpan(e);let day=0;
    if(e.repeat==='none'||!e.repeat){const a=parseD(e.date),df=Math.round((parseD(k)-a)/864e5);if(df>=0&&df<span)day=df+1}
    else for(let off=0;off<span&&!day;off++){
      const d0=dayShift(d,-off);
      if(e.repeat==='solar'){const x=parseD(e.date);if(x.getMonth()===d0.getMonth()&&x.getDate()===d0.getDate())day=off+1}
      else if(e.repeat==='lunar'&&lunarMatch(d0,e.lm,e.ld))day=off+1;
    }
    if(day)out.push({t:'custom',id:e.id,title:e.title,type:e.type||'',origin:e.origin||'',brief:e.brief||'',practice:e.practice||'',note:e.note,day,span});
  });
  S.targets.forEach(t=>{
    const mk=(s,label)=>{if(!s)return;const x=parseD(s);if(x.getMonth()+1===M&&x.getDate()===D){const n=d.getFullYear()-x.getFullYear();out.push({t:'target',title:`${t.name} ${label}${n>0?`（${n} 週年）`:''}`,day:1,span:1})}};
    mk(t.birthday,t.cat==='pet'?'生日／領養日':'生日');
    if(t.status==='passed')mk(t.passed,'往生紀念日');
  });
  return out;
}
function evSpanText(s,e){
  if(!(e.span>1))return `${s.getMonth()+1}/${s.getDate()}（${WK[s.getDay()]}）`;
  const x=dayShift(s,e.span-1);return `${s.getMonth()+1}/${s.getDate()}–${x.getMonth()+1}/${x.getDate()}`;
}
function evRow(d,e){
  const s=dayShift(d,-(e.day-1)),k=e.key||e.id;
  return `<div class="ev" ${k?`data-act="evView" data-k="${h(k)}" data-date="${ds(d)}" style="cursor:pointer"`:''}><time>${evSpanText(s,e)}</time><div class="grow">${h(e.title)}${e.type?` <span class="tag">${h(e.type)}</span>`:''}${e.span>1?`<span class="muted small">（第 ${e.day} 天／共 ${e.span} 天）</span>`:''}${e.brief?`<div class="small">${h(e.brief)}</div>`:''}<div class="muted small">${lunarText(s)}${k?'　點一下看詳情':''}</div></div></div>`;
}

function streak(){
  const set=new Set(S.checkins);let n=0;const d=new Date();d.setHours(12);
  if(!set.has(ds(d)))d.setDate(d.getDate()-1);
  while(set.has(ds(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}
function checkin(){const t=today();if(!S.checkins.includes(t)){S.checkins.push(t);S.checkins.sort();save();return true}return false}

function fill(t,ctx={}){
  return String(t||'').replace(/\{稱謂\}/g,S.settings.title).replace(/\{名\}/g,S.settings.name||'＿＿')

}

/* --- 年度行事曆 --- */
let CAL={y:new Date().getFullYear(),m:new Date().getMonth(),sel:today()};
function pCal(){
  const {y,m}=CAL,first=new Date(y,m,1,12),start=new Date(y,m,1-first.getDay(),12);
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i,12),k=ds(d);
    if(i>=35&&d.getMonth()!==m)break;
    const ev=eventsOn(d);
    cells+=`<div class="day ${d.getMonth()!==m?'out':''} ${k===today()?'today':''} ${k===CAL.sel?'sel':''}" data-act="calSel" data-v="${k}">
      <b>${d.getDate()}</b><small>${lunarCell(d)}</small>
      ${ev.slice(0,2).map(e=>`<i class="${e.t}">${h(e.title)}</i>`).join('')}${ev.length>2?`<i class="monthly">…+${ev.length-2}</i>`:''}
    </div>`;
  }
  const sd=parseD(CAL.sel),sev=eventsOn(sd);
  // 全年列表
  const yearList=[];
  for(let mo=0;mo<12;mo++){const dim=new Date(y,mo+1,0).getDate();for(let dd=1;dd<=dim;dd++){const d=new Date(y,mo,dd,12);eventsOn(d).filter(e=>e.t!=='monthly'&&e.day===1).forEach(e=>yearList.push({d,e}))}}
  return `
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <button class="btn sm" data-act="calMove" data-v="-1">‹ 上月</button>
      <b>${y} 年 ${m+1} 月</b>
      <button class="btn sm" data-act="calMove" data-v="1">下月 ›</button>
    </div>
    <div class="cal">${[...WK].map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div>
    <div class="hint" style="margin-top:8px">${S.settings.showMonthly?'農曆初一、十五以灰字標示。':''}（農曆日期由瀏覽器內建曆法換算）</div>
  </div>
  <div class="card">
    <h2><span>${sd.getMonth()+1}/${sd.getDate()}（週${WK[sd.getDay()]}）<span class="muted small" style="font-weight:400">${lunarText(sd)}</span></span><button class="btn sm" data-act="evForm" data-date="${CAL.sel}">＋ 新增行程</button></h2>
    ${sev.length?sev.map(e=>evRow(sd,e)).join(''):`<div class="muted small">這天沒有安排。</div>`}
  </div>
  <div class="card">
    <h2><span>${y} 年度法會與節日</span></h2>
    <div class="hint" style="margin:-4px 0 6px">點任一項可看來由與持修細節，並可編輯或隱藏。</div>
    ${yearList.map(({d,e})=>evRow(d,e)).join('')||'<div class="muted small">沒有資料</div>'}
  </div>
  ${festList().some(f=>f.hidden)?`<div class="card"><h2>已隱藏的節日</h2>${festList().filter(f=>f.hidden).map(f=>`<div class="ev"><div class="grow">${h(f.title)}</div><button class="btn sm" data-act="festShow" data-k="${h(f.key)}">還原顯示</button></div>`).join('')}</div>`:''}`;
}

function sutraSave(id){
  const cur=id?sutra(id):null,name=val('name');
  let text=val('text'),parts=null;
  if(cur&&cur.parts){parts=cur.parts.map((p,i)=>({name:p.name,text:val('part'+i)}));text=parts.map(p=>p.text).join('')}
  if(!name||!text){toast('請填寫經名與經文原文');return}
  const o={name,text:parts?'':text,brief:val('brief'),kind:val('kind'),deity:val('deity'),category:val('category'),era:val('era'),
    dailyCount:Math.max(1,+val('dailyCount')||1),durationSec:Math.max(1,+val('durationSec')||60),
    effects:val('effects').split(/[,，、]/).map(x=>x.trim()).filter(Boolean),
    translation:val('translation'),intro:val('intro')};

function resizePhoto(file,cb){
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{
    const M=360,k=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL('image/jpeg',.8));
  };img.src=r.result};
  r.readAsDataURL(file);
}

      ${R.tab==='text'?`<div class="rd-text paper sb ${zy?'':'nozy'} zy" style="--fs:${fs}">${fmt(sText(s,R.part))}</div>`
       :R.tab==='trans'?`<div class="paper sb" style="font-size:calc(1.05rem*${fs})">${s.translation?lines(s.translation):'<span class="muted">尚無白話文</span>'}</div>`
       :`<div class="paper sb" style="font-size:calc(1.05rem*${fs})">${s.intro?lines(s.intro):'<span class="muted">尚無介紹</span>'}${s.effects&&s.effects.length?`<div style="margin-top:8px">${s.effects.map(e=>`<span class="tag">${h(e)}</span>`).join('')}</div>`:''}</div>`}`;
    foot=`<div class="rdctl"><div class="grow">
      <div class="cnt"><b id="rdN">${R.count}</b> / <span id="rdG">${R.goal}</span> 遍 <span class="muted small">・今日累計 <span id="rdT">${doneToday(R.sutraId)}</span></span></div>
      <div class="row"><button class="btn" data-act="rdFs" data-v="-0.1" aria-label="縮小字體">A−</button><button class="btn" data-act="rdFs" data-v="0.1" aria-label="放大字體">A＋</button><button class="btn grow" data-act="rdDone">完成並迴向</button></div></div>
      <div class="mkcol"><button class="btn pri big mokugyo" id="rdMok" data-act="rdTap" aria-label="念畢一遍 ＋1"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="bd"><ellipse cx="30" cy="42" rx="23" ry="16"/><path d="M12 42h22c3 0 3-5 0-5H16"/><path d="M53 40l5 4"/></g><g class="mal"><path d="M54 8L40 26"/><circle cx="38" cy="29" r="4" fill="currentColor"/></g></svg></button>
      <button class="btn sm" style="margin-top:6px" data-act="rdDedic">迴向</button></div></div>`;
  }else if(R.stage==='ending'){
    const f=S.finals.find(x=>x.id===R.finalId)||S.finals[0];
    body=`<h3 style="margin-bottom:8px">圓滿結束</h3>
      ${allPlanDone()?`<div class="small muted">🪷 今日功課圓滿</div>
        <div>${S.finals.map(x=>`<button class="chip ${f&&x.id===f.id?'on':''}" data-act="rdPick" data-k="finalId" data-v="${x.id}">${h(x.name)}</button>`).join('')}</div>
        <div class="paper"><div class="rd-text center" style="--fs:.9">${lines(fill(f?f.content:'',ctx))}</div></div>`:''}
      <div class="paper"><div class="rd-text" style="--fs:.95">${lines(fill(S.ending,ctx))}</div></div>`;
    foot=`<div class="row"><button class="btn pri grow" data-act="closeReader">🙏 完成</button></div>`;
  }else{
    const d=S.dedications.find(x=>x.id===R.dedId)||S.dedications[0];
    const names=effT(R.targetIds).map(id=>target(id)).filter(Boolean).map(t=>t.name);
    const sugg=d&&d.hint?d.hint.split(/[、，,]/).map(x=>x.trim()).filter(Boolean):[];
    const next=planItems().find(x=>x.s.id!==R.sutraId&&doneToday(x.s.id)<x.p.times);
    body=`<div class="hint">本次念誦 <b>${h(s.name)}</b> × ${R.count} 遍</div>
      <h3 style="margin:6px 0">迴向文</h3>
      <div>${S.dedications.map(x=>`<button class="chip ${d&&x.id===d.id?'on':''}" data-act="rdPick" data-k="dedId" data-v="${x.id}">${h(x.name)}</button>`).join('')}</div>
      <div class="small muted" style="margin-top:8px">指定迴向對象（不選＝自己＋全部家人毛孩子）：</div>
      <div><button class="chip on" disabled style="opacity:.75">自己</button>${S.targets.map(t=>`<button class="chip ${R.targetIds.includes(t.id)?'on':''}" data-act="rdTog" data-id="${t.id}">${h(t.name)}</button>`).join('')}</div>
      <div class="paper"><div class="small muted">迴向對象：${h((R.targetIds.length?names.concat(sugg):sugg).join('、')||'法界一切眾生')}</div>
        ${d&&d.when?`<div class="small" style="color:var(--acc);margin-top:4px">迴向時機：${h(d.when)}</div>`:''}
        <div class="rd-text center" style="margin-top:8px;--fs:.9">${lines(fill(d?d.content:'',Object.assign({},ctx,{tg:R.targetIds.map(i=>target(i)).filter(Boolean).map(t=>t.name).join('、')})))}</div></div>`;
    foot=`<div class="row"><button class="btn" data-act="rdBack">← 續念</button>
      ${next?`<button class="btn grow" data-act="rdNext" data-id="${next.s.id}">念下一部：${h(next.s.name)}</button>`:''}
      <button class="btn pri grow" data-act="rdFinish">🙏 圓滿結束</button></div>`;
  }
  el.innerHTML=`${head}<div class="rd-body">${body}</div><div class="rd-foot"><div>${foot}</div></div>`;
  const nb=$('.rd-body',el);if(nb)nb.scrollTop=sc;
}
function updateRd(){
  const n=$('#rdN');if(!n)return;n.textContent=R.count;$('#rdT').textContent=doneToday(R.sutraId);
}
function rdTap(){
  const s=sutra(R.sutraId);
  const l={id:uid(),date:today(),ts:Date.now(),sutraId:s.id,name:s.name,n:1,targetIds:effT(R.targetIds)};
  S.logs.push(l);R.sessionLogs.push(l);R.count++;S.lastActivity=Date.now();save();updateRd();
  const mk=$('#rdMok');if(mk){mk.classList.remove('hit');void mk.offsetWidth;mk.classList.add('hit')}
  if(navigator.vibrate)try{navigator.vibrate(20)}catch(e){}
  if(R.count===R.goal){toast('本次遍數圓滿 🙏');setTimeout(()=>{if(R&&R.stage==='read'&&R.count>=R.goal){R.stage='dedicate';renderReader()}},800)}
}
function rdUndo(){
  const l=R.sessionLogs.pop();if(!l)return;
  S.logs=S.logs.filter(x=>x.id!==l.id);S.delLogs.push(l.id);R.count--;save();updateRd();
}
function rdFinish(){
  R.sessionLogs.forEach(l=>l.targetIds=effT(R.targetIds));
  S.lastActivity=Date.now();
  if(allPlanDone()&&checkin())toast('今日功課圓滿，已為您打卡 🪷');else toast('功德圓滿 🙏');
  save();R.stage='ending';renderReader();
}

/* ========== 事件處理 ========== */
const A={
  nav:d=>{page=d.v;render();window.scrollTo(0,0)},
  closeModal,
  maskClose:(d,b,e)=>{if(e.target===b)closeModal()},
  checkin:()=>{checkin();render();toast('今日修行打卡完成 🪷')},
  theme:d=>{S.settings.theme=d.v;save();render()},
  /* 功課 */
  planAdd,
  planAddOne:d=>{if(!S.plan.some(p=>p.sutraId===d.id)){S.plan.push({id:uid(),sutraId:d.id,times:sutra(d.id).dailyCount||1});save()}closeModal();render();toast('已加入今日功課')},
  planUp:d=>{const i=S.plan.findIndex(p=>p.id===d.id);if(i>0){[S.plan[i-1],S.plan[i]]=[S.plan[i],S.plan[i-1]];save();render()}},
  planDown:d=>{const i=S.plan.findIndex(p=>p.id===d.id);if(i>=0&&i<S.plan.length-1){[S.plan[i+1],S.plan[i]]=[S.plan[i],S.plan[i+1]];save();render()}},
  planDel:d=>{if(confirm('從今日功課移除這部經文？（念誦紀錄不會被刪除）')){S.plan=S.plan.filter(p=>p.id!==d.id);save();render()}},
  quick:d=>{
    const s=sutra(d.id);
    if(+d.v>0){S.logs.push({id:uid(),date:today(),ts:Date.now(),sutraId:s.id,name:s.name,n:1,targetIds:[]});S.lastActivity=Date.now()}
    else{const i=S.logs.map(l=>l.date===today()&&l.sutraId===s.id).lastIndexOf(true);if(i>=0){S.delLogs.push(S.logs[i].id);S.logs.splice(i,1)}}
    if(allPlanDone())checkin();
    save();render();
  },
  read:d=>openReader(d.id),
  openFinal,
  /* 經文 */
  sutraView:d=>sutraView(d.id),
  sutraForm:d=>sutraForm(d.id),
  sutraSave:d=>sutraSave(d.id),
  sutraDel:d=>{if(confirm('刪除這部經文？（念誦紀錄會保留）')){S.sutras=S.sutras.filter(s=>s.id!==d.id);S.plan=S.plan.filter(p=>p.sutraId!==d.id);save();closeModal();render()}},
  effTog:(d,b)=>{const inp=$('#modal [name=effects]');let a=inp.value.split(/[,，、]/).map(x=>x.trim()).filter(Boolean);a=a.includes(d.v)?a.filter(x=>x!==d.v):[...a,d.v];inp.value=a.join('，')},
  /* 對象 */
  tgTab:d=>{TG=d.v;render()},
  tgForm:d=>tgForm(d.id),
  tgSave:d=>{
    const name=val('name');if(!name){toast('請填寫名字');return}
    const o={cat:val('cat'),name,species:val('species'),title:val('title'),status:val('status'),birthday:val('birthday'),passed:val('status')==='passed'?val('passed'):'',note:val('note'),photo:tmpPhoto};
    if(d.id)Object.assign(target(d.id),o);else S.targets.push({id:uid(),...o});
    save();closeModal();render();
  },
  tgDel:d=>{if(confirm('刪除這位祈福對象？（累積的念誦紀錄仍保留在總數中）')){S.targets=S.targets.filter(t=>t.id!==d.id);save();render()}},
  tgDedicate:d=>{if(!S.sutras.length){toast('請先到經文庫新增經文');return}tgDedicate(d.id)},
  tgGo:d=>{const sid=val('sid'),times=Math.max(1,+val('times')||1);openReader(sid,{targetIds:[d.id],goal:times})},
  photoClear:()=>{tmpPhoto='';$('#phPrev').innerHTML=''},
  /* 行事曆 */
  calMove:d=>{let m=CAL.m+ +d.v,y=CAL.y;if(m<0){m=11;y--}if(m>11){m=0;y++}CAL.m=m;CAL.y=y;render()},
  calSel:d=>{CAL.sel=d.v;render()},
  evForm:d=>evForm(d.id,d.date),
  evView:d=>evView(d.k,d.date),
  evSave:d=>{
    const title=val('title'),cal=val('cal')||'solar';
    let date=val('date'),end=val('endDate'),rep=val('repeat'),lm,ld;
    if(!title){toast('請填寫名稱');return}
    if(cal==='lunar'){
      lm=+val('lm');ld=+val('ld');rep=val('lrepeat')==='lunar'?'lunar':'none';
      const sp=Math.min(60,Math.max(1,+val('lspan')||1)),yr=+val('lyear')||new Date().getFullYear();
      date=lunarToSolar(yr,lm,ld);
      if(!date){toast('找不到這個農曆日期（'+yr+' 年），請換個年份或日期');return}
      end=sp>1?ds(dayShift(parseD(date),sp-1)):'';
    }else{
      if(!date){toast('請填寫開始日期');return}
      if(end&&end<date){toast('結束日期不能早於開始日期');return}
    }
    const o={title,type:val('type'),cal,date,endDate:end&&end>date?end:'',repeat:rep,lm,ld,brief:val('brief'),origin:val('origin'),practice:val('practice'),note:val('note')};
    if(evSpan(o)>=60&&end&&Math.round((parseD(end)-parseD(date))/864e5)+1>60)toast('連續天數最多 60 天，已自動截到 60 天');
    if(d.id)Object.assign(S.events.find(e=>e.id===d.id),o);else S.events.push({id:uid(),...o});
    save();closeModal();render();
  },
  evDel:d=>{if(confirm('刪除這個行程？')){S.events=S.events.filter(e=>e.id!==d.id);save();closeModal();render()}},
  festForm:d=>festForm(d.k),
  festSave:d=>{
    const title=val('title');if(!title){toast('請填寫名稱');return}
    const fi=festList().find(x=>x.key===d.k)||{};
    const dt=fi.rule==='qm'?{}:{lm:+val('lm'),ld:+val('ld')};
    const ov=Object.assign({},S.festOv[d.k]||{},dt,{title,type:val('type'),span:Math.min(30,Math.max(1,parseInt(val('span'))||1)),brief:val('brief'),origin:val('origin'),practice:val('practice')});
    S.festOv[d.k]=ov;save();closeModal();render();toast('已儲存');
  },
  festReset:d=>{if(confirm('還原成內建的名稱、日期與說明？')){const hid=(S.festOv[d.k]||{}).hidden;if(hid)S.festOv[d.k]={hidden:true};else delete S.festOv[d.k];save();closeModal();render()}},
  festHide:d=>{if(confirm('隱藏這個節日？之後可以在行事曆頁面最下方「已隱藏的節日」還原。')){S.festOv[d.k]=Object.assign({},S.festOv[d.k]||{},{hidden:true});save();closeModal();render()}},
  festShow:d=>{const ov=Object.assign({},S.festOv[d.k]||{});delete ov.hidden;if(Object.keys(ov).length)S.festOv[d.k]=ov;else delete S.festOv[d.k];save();render()},
  /* FAQ */
  faqForm:d=>faqForm(d.id),
  faqSave:d=>{
    const q=val('q'),a=val('a');if(!q||!a){toast('請填寫問題與回答');return}
    S.faq=faqList().map(x=>({...x}));
    if(d.id)Object.assign(S.faq.find(x=>x.id===d.id),{q,a});else S.faq.push({id:uid(),q,a});
    save();closeModal();render();
  },
  faqMove:d=>{
    const a=faqList().map(x=>({...x})),i=a.findIndex(x=>x.id===d.id),j=i+ +d.v;
    if(i<0||j<0||j>=a.length)return;
    [a[i],a[j]]=[a[j],a[i]];S.faq=a;save();
    const bx=$('.faqbox'),y=bx?bx.scrollTop:0;render();
    const nb=$('.faqbox');if(nb)nb.scrollTop=y;toast('已移動');
  },
  faqView:d=>faqView(d.id),
  faqDel:d=>{if(confirm('刪除這則問題？')){S.faq=faqList().filter(x=>x.id!==d.id);save();closeModal();render()}},
  /* 範本 */
  tplForm:d=>tplForm(d.kind,d.id),
  tplSave:d=>{
    const name=val('name'),content=val('content');if(!name||!content){toast('請填寫名稱與內容');return}
    const o={name,hint:val('hint'),content};
    if(d.kind!=='barriers')o.when=val('when');
    if(d.id)Object.assign(S[d.kind].find(x=>x.id===d.id),o);else S[d.kind].push({id:uid(),...o});
    save();closeModal();render();
  },
  tplDel:d=>{if(confirm('刪除這個範本？')){S[d.kind]=S[d.kind].filter(x=>x.id!==d.id);save();render()}},
  syncConnect:async()=>{
    const tok=($('#syncTok')||{}).value&&$('#syncTok').value.trim(),pass=($('#syncPass')||{}).value||'';
    if(!tok){toast('請貼上 GitHub Token');return}
    Sync.setCfg({token:tok,pass,gistId:'',last:0,err:''});
    toast('連線中…');await Sync.run({manual:true,first:true});
    if(Sync.cfg().err&&!Sync.cfg().last){Sync.setCfg({token:'',pass:''});}
    render();
  },
  syncNow:async()=>{await Sync.run({manual:true});render()},
  syncOff:()=>{if(confirm('中斷同步？本機資料與雲端資料都會保留，之後可重新連線。')){try{localStorage.removeItem(SK)}catch(e){}render();toast('已中斷同步')}},
  /* 備份 */
  export:()=>{
    S.settings.lastExport=Date.now();save();
    const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    const n=new Date();a.download=`裟笠備份_${n.getFullYear()}${pad(n.getMonth()+1)}${pad(n.getDate())}.json`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    render();toast('備份已下載');
  },
  wipe:()=>{if(confirm('確定清除全部資料？此動作無法復原，建議先匯出備份。\n（本機的同步連線會一併中斷，雲端資料不會被動到。）')&&confirm('再次確認：真的要清除全部資料嗎？')){localStorage.removeItem(KEY);try{localStorage.removeItem(SK)}catch(e){}S=defaults();save();render()}},
  /* 念誦畫面 */
  rdClose:()=>{if(R&&R.sessionLogs.length&&R.stage==='read'){R.stage='dedicate';renderReader()}else closeReader()},
  rdZy:()=>{S.settings.zy=!S.settings.zy;save();renderReader()},
  rdFs:d=>{S.settings.fs=Math.min(2.2,Math.max(.7,+(S.settings.fs+ +d.v).toFixed(2)));save();renderReader()},
  rdPick:d=>{R[d.k]=d.v;renderReader()},
  rdTab:d=>{R.tab=d.v;renderReader()},
  rdPart:d=>{R.part=+d.v;renderReader()},
  svPart:d=>sutraView(d.id,+d.v),
  rdBegin:()=>{S.lastActivity=Date.now();save();R.stage='read';renderReader()},
  rdSkip:()=>{R.stage='read';renderReader()},
  rdTog:d=>{const i=R.targetIds.indexOf(d.id);i>=0?R.targetIds.splice(i,1):R.targetIds.push(d.id);renderReader()},
  rdTap,rdUndo,
  rdDedic:()=>{
    if(!R.count){toast('請先敲木魚記錄遍數，或按「完成並迴向」');return}
    R.stage='dedicate';renderReader()},
  rdDone:()=>{
    const s=sutra(R.sutraId),p=s&&S.plan.find(x=>x.sutraId===s.id),rem=p?p.times-doneToday(s.id):0;
    if(rem>0){const l={id:uid(),date:today(),ts:Date.now(),sutraId:s.id,name:s.name,n:rem,targetIds:effT(R.targetIds)};
      S.logs.push(l);R.sessionLogs.push(l);R.count+=rem;S.lastActivity=Date.now();save();toast('已補足今日 '+s.name+' 共 '+p.times+' 遍 🙏')}
    R.stage='dedicate';renderReader()},
  rdBack:()=>{R.stage='read';renderReader()},
  rdExtraTog:d=>{const i=R.extra.indexOf(d.v);i>=0?R.extra.splice(i,1):R.extra.push(d.v);renderReader()},
  rdExtraAdd:()=>{const v=$('#rdExtraIn').value.trim();if(v&&!R.extra.includes(v)){R.extra.push(v);renderReader()}},
  rdNext:d=>{rdFinish0();openReader(d.id,{skipBarrier:true})},
  rdFinish,closeReader
};
function rdFinish0(){R.sessionLogs.forEach(l=>l.targetIds=effT(R.targetIds));S.lastActivity=Date.now();save();closeReaderQuiet()}
function closeReaderQuiet(){R=null;$('#reader').hidden=true;$('#reader').innerHTML='';document.body.style.overflow='';try{if(wake){wake.release();wake=null}}catch(e){}}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const f=A[b.dataset.act];if(f)f(b.dataset,b,e);
});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset&&t.dataset.in;
  if(k==='libq'){LF.q=t.value;renderLib()}
  else if(k==='ending'){S.ending=t.value;save()}
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset||{};
  if(d.in==='libkind'){LF.kind=t.value;renderLib()}
  else if(d.in==='libcat'){LF.cat=t.value;renderLib()}
  else if(d.in==='libeff'){LF.eff=t.value;renderLib()}
  else if(d.in==='evcal'){$('#evSolar').hidden=t.value!=='solar';$('#evLunar').hidden=t.value!=='lunar'}
  else if(d.in==='tgstatus'){$('#passedBox').hidden=t.value!=='passed'}
  else if(d.in==='photo'&&t.files[0]){resizePhoto(t.files[0],u=>{tmpPhoto=u;$('#phPrev').innerHTML=`<img src="${u}" class="avatar" alt="">`})}
  else if(d.in==='import'&&t.files[0]){
    const r=new FileReader();
    r.onload=()=>{try{
      const o=JSON.parse(r.result);if(!o||!Array.isArray(o.sutras))throw 0;
      if(!confirm(`匯入後會取代目前所有資料。\n備份內含 ${o.sutras.length} 部經文、${(o.logs||[]).length} 筆念誦紀錄。確定匯入？`))return;
      const df=defaults();S=Object.assign(df,o,{settings:Object.assign(df.settings,o.settings||{})});save();render();toast('匯入完成');
    }catch(err){toast('匯入失敗：檔案格式不正確')}};
    r.readAsText(t.files[0]);t.value='';
  }
  else if(d.set){
    const k=d.set;S.settings[k]=t.type==='checkbox'?t.checked:(t.type==='number'?Math.max(1,+t.value||30):t.value.trim());
    save();if(k==='showMonthly'||k==='zyPos')render();
  }
  else if(d.planTimes){
    const p=S.plan.find(x=>x.id===d.planTimes);if(p){p.times=Math.max(1,parseInt(t.value)||1);save();render()}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal').innerHTML)closeModal();else if(R)A.rdClose()}
  if(e.key==='Enter'&&e.target.id==='rdExtraIn')A.rdExtraAdd();
});

render();
if(Sync.on())Sync.run();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
