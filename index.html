<!DOCTYPE html>
<html lang="zh-Hant" data-theme="chanyi">
<head>

<title>裟笠</title>

<style>
:root{
  --pink:#C9938A; --soft-pink:#E8C4BC; --light-pink:#F5E6E3;
  --blue:#7A9BAD; --soft-blue:#B8CFDA; --light-blue:#E3EDF3;
  --sage:#9AAE9B; --light-sage:#E8F0E8;
  --cream:#FAF3EE; --dark:#37352F; --medium:#5A5248; --gray:#9B9A97;
  --ok:#7F9A80; --warn:#C9938A;
}
/* 蟬意 */
[data-theme=chanyi]{--bg:#F5EEE3;--card:#FFFBF5;--ink:#3B3226;--muted:#8A7C69;--acc:#A6735A;--acc-soft:#EFDFD0;--line:#E4D6C4;--on-acc:#fff}
/* 莊嚴 */
[data-theme=zhuangyan]{--bg:#0E1930;--card:#16254A;--ink:#EFE8D6;--muted:#A8B2C8;--acc:#D8B26C;--acc-soft:#25365F;--line:#2B3C66;--on-acc:#1A1A24}
/* 月白 */
[data-theme=yuebai]{--bg:#F0F6FA;--card:#FFFFFF;--ink:#2B3A47;--muted:#768A98;--acc:#5E8CA8;--acc-soft:#DDEAF2;--line:#D3E2EC;--on-acc:#fff}
/* 沉香 */
[data-theme=chenxiang]{--bg:#E9E5E0;--card:#F6F3EF;--ink:#38312C;--muted:#85786D;--acc:#8A6A54;--acc-soft:#DCD2C8;--line:#D3C9BE;--on-acc:#fff}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:'Noto Sans TC',system-ui,-apple-system,'Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px;padding-bottom:84px}
b,strong,h1,h2,h3,h4{font-weight:700}
h1,h2,h3,h4{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{padding:18px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
header.top h1{font-size:1.35rem;color:var(--acc)}
.logo{color:var(--acc);vertical-align:-7px}
.slogan{display:block;font-size:.72rem;font-weight:400;color:var(--muted);margin:-2px 0 0 38px;letter-spacing:.12em}
header.top .date{color:var(--muted);font-size:.9rem}
nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.nav button{flex:1;border:0;background:none;padding:8px 2px 7px;color:var(--muted);font-size:.74rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0}
nav.nav button span{font-size:1.3rem;line-height:1;margin-bottom:2px}
nav.nav svg{width:1.25em;height:1.25em;display:block}
nav.nav button.on{color:var(--acc);font-weight:700}
@media(min-width:760px){
  nav.nav{justify-content:center;gap:6px}
  nav.nav button{flex:0 0 auto;flex-direction:row;gap:6px;padding:12px 22px;font-size:.95rem}
  nav.nav button span{font-size:1.1rem;margin-bottom:0}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.card h2{font-size:1.08rem;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{color:var(--muted)} .small{font-size:.84rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid{display:grid;gap:12px}
.stats{grid-template-columns:repeat(2,1fr)}
@media(min-width:620px){.stats{grid-template-columns:repeat(5,1fr)}}
.stat{background:var(--acc-soft);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.6rem;color:var(--acc);line-height:1.3}
.stat span{font-size:.8rem;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 10px;min-height:32px;font-size:.88rem}
.btn.dng{color:var(--warn);border-color:var(--soft-pink)}
.btn.big{width:100%;min-height:56px;font-size:1.15rem;border-radius:16px}
.faqq{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:8px 0;background:none;border:0;border-top:1px solid var(--line,rgba(128,128,128,.25));font:inherit;font-weight:600;color:inherit;text-align:left;cursor:pointer;min-height:44px}
.rdctl{display:flex;gap:10px;align-items:center}
.rdctl>.grow{flex:1;min-width:0}
.mkcol{flex:none;text-align:center}
.btn.big.mokugyo{display:flex;align-items:center;justify-content:center;width:92px;height:92px;min-height:0;padding:0;border-radius:50%;margin:0 auto}
.mokugyo svg{width:62px;height:62px;flex:none}
.faqbox{max-height:228px;overflow:auto;-webkit-overflow-scrolling:touch}.mokugyo .mal{transform-origin:54px 8px;transform:rotate(16deg)}
.mokugyo.hit .mal{animation:tok .24s ease-out}
.mokugyo.hit .bd{animation:tokb .24s ease-out;transform-origin:32px 40px}
@keyframes tok{0%{transform:rotate(16deg)}40%{transform:rotate(-10deg)}100%{transform:rotate(16deg)}}
@keyframes tokb{40%{transform:scale(.95)}}
.mx{position:sticky;top:0;float:right;z-index:3;margin:-6px -6px 0 8px;width:36px;height:36px;padding:0;border-radius:50%;font-size:1.1rem;line-height:1}
.btn[disabled]{opacity:.45;cursor:default}
.chip{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:1px 11px;font-size:.82rem;margin:2px 4px 2px 0;cursor:default}
button.chip{cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.tag{display:inline-block;background:var(--acc-soft);color:var(--acc);border-radius:8px;padding:0 8px;font-size:.78rem;margin-right:4px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;min-height:40px}
textarea{resize:vertical;line-height:1.7}
label.f{display:block;margin:10px 0;font-size:.88rem;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{margin-top:3px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.bar{height:8px;background:var(--acc-soft);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .3s}
.bar.full i{background:var(--ok)}
.plan{border-top:1px solid var(--line);padding:12px 0}
.plan:first-of-type{border-top:0}
.plan input[type=number]{width:72px;text-align:center;min-height:32px;padding:2px 6px}
.empty{text-align:center;color:var(--muted);padding:18px 0}
.banner{background:var(--light-pink);color:#6b4a44;border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.9rem}
[data-theme=zhuangyan] .banner{background:#2a3157;color:#EFE8D6}
.ev{display:flex;gap:10px;padding:7px 0;border-top:1px dashed var(--line);align-items:baseline}
.ev:first-child{border-top:0}
.ev time{flex:0 0 6.6em;color:var(--acc);font-weight:700;font-size:.9rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 18px;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--on-acc);font-weight:700}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--acc-soft);display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex:0 0 64px}
.tcard{display:flex;gap:14px}
.sutra-card{cursor:pointer}
.sutra-card:hover{border-color:var(--acc)}
/* 注音 */
ruby{ruby-position:over}
rt{font-size:.5em;color:var(--muted);font-weight:400;letter-spacing:0}
.nozy rt,.nozy .zs{display:none}
.zc{white-space:nowrap}
.zs{display:inline-flex;align-items:center;margin:0 .14em 0 .03em;vertical-align:middle;color:var(--muted)}
.zb{display:inline-flex;flex-direction:column;justify-content:space-between;align-items:center;height:1em;font-weight:400;letter-spacing:0;line-height:1}
.zb.n1{justify-content:center}
.zb i{font-style:normal;font-size:.34em;line-height:1}
.zb.n2 i{font-size:.4em}.zb.n1 i{font-size:.46em}
.zt{font-size:.34em;line-height:1;font-weight:400;margin-left:.02em}
[data-zypos=right] .zy{--lh:1.9}
.sb{--lh:1.7}
.zy{--lh:2.4;line-height:var(--lh)}
.nozy.zy{--lh:1.9}
.sb{max-height:calc(var(--lh)*10*1em);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.paper.sb{max-height:calc(var(--lh)*10*1em + 34px)}
.vol{margin:6px 0 10px}
/* 日曆 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .wd{text-align:center;color:var(--muted);font-size:.8rem;padding:4px 0}
.cal .day{min-height:68px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:3px 4px;cursor:pointer;overflow:hidden;font-size:.85rem}
.cal .day.out{opacity:.4}
.cal .day.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.cal .day.sel{background:var(--acc-soft)}
.cal .day small{display:block;color:var(--muted);font-size:.62rem;line-height:1.2}
.cal .day i{display:block;font-style:normal;font-size:.62rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:0 3px;margin-top:1px;background:var(--acc-soft);color:var(--acc)}
.cal .day i.target{background:var(--light-blue);color:#4b6b7e}
.cal .day i.custom{background:var(--light-sage);color:#587059}
.cal .day i.monthly{background:transparent;color:var(--muted)}
@media(max-width:520px){.cal .day{min-height:56px;padding:2px}.cal .day i{font-size:.56rem}}
/* 彈窗 */
.mask{position:fixed;inset:0;background:rgba(20,16,10,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px 26px}
@media(min-width:760px){.mask{align-items:center}.modal{border-radius:20px}}
.modal h3{margin-bottom:6px;font-size:1.1rem}
.sticky-act{position:sticky;bottom:-26px;background:var(--card);padding:12px 0 0;margin-top:10px;display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;z-index:90;font-size:.92rem;max-width:88vw;text-align:center}
/* 念誦畫面 */
.reader{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.rd-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.rd-head .t{flex:1;font-weight:700;color:var(--acc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-body{flex:1;overflow:auto;padding:18px 18px 28px;max-width:760px;width:100%;margin:0 auto}
.rd-text{font-size:calc(1.35rem*var(--fs,1));letter-spacing:.06em;text-align:justify}
.rd-text.center{text-align:center}
.rd-foot{border-top:1px solid var(--line);background:var(--card);padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
.rd-foot>div{max-width:760px;margin:0 auto}
.cnt{text-align:center;margin-bottom:8px}
.cnt b{font-size:2rem;color:var(--acc)}
.paper{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.hint{color:var(--muted);font-size:.86rem}
@media print{nav,.btn{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1><svg class="logo" viewBox="0 0 64 64" width="32" height="32" aria-hidden="true"><path d="M32 8C35 8 40 22 60 40C46 47 18 47 4 40C24 22 29 8 32 8Z" fill="currentColor"/><path d="M32 8L20 43M32 8L32 45M32 8L44 43M13 33Q32 27 51 33M22 21Q32 17 42 21M10 42Q8 52 14 56M54 42Q56 52 50 56" fill="none" stroke="var(--bg)" stroke-width="1.8" stroke-linecap="round"/></svg> 裟笠 <small class="slogan">一裟一笠，一念清淨</small></h1><div class="date" id="hdrDate"></div></header>
  <main id="app"></main>
</div>
<nav class="nav" id="nav"></nav>
<div id="modal"></div>
<div id="reader" class="reader" hidden></div>

<script>
'use strict';
/* ========== 基礎工具 ========== */
const KEY='sutra_app_v1';
const $=(s,r=document)=>r.querySelector(s);
const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ds(new Date());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const WK='日一二三四五六';
const fmtDur=sec=>{sec=Math.round(sec||0);if(sec<60)return sec+' 秒';const m=Math.floor(sec/60),s=sec%60;return s?`${m} 分 ${s} 秒`:`${m} 分鐘`};
const lines=t=>h(t).replace(/\n/g,'<br>');

/* 注音／拼音標記：支援「字ㄗˋ」與「字[ㄗˋ]／字[Om]」兩種寫法 */
const BPM=/^([˙]?)([ㄅ-ㄯㆠ-ㆿ]+)([ˊˇˋ˙]?)$/;
function zr(c,z){
  const m=BPM.exec(z);
  if(!m||S.settings.zyPos==='top')return `<ruby>${c}<rt>${z}</rt></ruby>`;
  const neutral=m[1]||(m[3]==='˙'?'˙':''),tone=m[3]&&m[3]!=='˙'?m[3]:'';
  const sy=[...(neutral&&m[1]?m[1]:''),...m[2],...(neutral&&!m[1]?m[3]:'')];
  return `<span class="zc">${c}<span class="zs"><span class="zb n${Math.min(sy.length,3)}">${sy.map(x=>`<i>${x}</i>`).join('')}</span>${tone?`<span class="zt">${tone}</span>`:''}</span></span>`;
}
function fmt(t){
  let s=h(t);
  s=s.replace(/([^\s\[\]<>])\[([^\]]+)\]/g,(m,c,z)=>zr(c,z));
  s=s.replace(/([㐀-鿿])([˙]?[ㄅ-ㄯㆠ-ㆿ]+[ˊˇˋ˙]?)/g,(m,c,z)=>zr(c,z));
  return s.replace(/\n/g,'<br>');
}

/* ========== 預設資料 ========== */
const EFFECTS=['消災除惡','滿願得子','增長福慧','智慧開悟','身體健康','平安順遂','事業順遂','往生淨土','超度亡者','消業障'];
const CATS=['佛號聖號','偈頌類','般若類','淨土類','法華類','華嚴類','藥師類','地藏類','觀音類','密教咒語類','懺法類','其他'];

const XINJING=`觀ㄍㄨㄢ自ㄗˋ在ㄗㄞˋ菩ㄆㄨˊ薩ㄙㄚˋ，行ㄒㄧㄥˊ深ㄕㄣ般ㄅㄛ若ㄖㄜˋ波ㄅㄛ羅ㄌㄨㄛˊ蜜ㄇㄧˋ多ㄉㄨㄛ時ㄕˊ，照ㄓㄠˋ見ㄐㄧㄢˋ五ㄨˇ蘊ㄩㄣˋ皆ㄐㄧㄝ空ㄎㄨㄥ，度ㄉㄨˋ一ㄧ切ㄑㄧㄝˋ苦ㄎㄨˇ厄ㄜˋ。
舍ㄕㄜˋ利ㄌㄧˋ子ㄗˇ，色ㄙㄜˋ不ㄅㄨˋ異ㄧˋ空ㄎㄨㄥ，空ㄎㄨㄥ不ㄅㄨˋ異ㄧˋ色ㄙㄜˋ，色ㄙㄜˋ即ㄐㄧˊ是ㄕˋ空ㄎㄨㄥ，空ㄎㄨㄥ即ㄐㄧˊ是ㄕˋ色ㄙㄜˋ，受ㄕㄡˋ想ㄒㄧㄤˇ行ㄒㄧㄥˊ識ㄕˋ，亦ㄧˋ復ㄈㄨˋ如ㄖㄨˊ是ㄕˋ。

  mk('s_puxian','普賢行願品','經','普賢菩薩','十大行願、迴向發願、往生淨土','華嚴類','唐・般若奉詔譯',['增長福慧','往生淨土','消業障'],1,1500,'大ㄉㄚˋ方ㄈㄤ廣ㄍㄨㄤˇ佛ㄈㄛˊ華ㄏㄨㄚˊ嚴ㄧㄢˊ經ㄐㄧㄥ入ㄖㄨˋ不ㄅㄨˋ思ㄙ議ㄧˋ解ㄐㄧㄝˇ脫ㄊㄨㄛ境ㄐㄧㄥˋ界ㄐㄧㄝˋ普ㄆㄨˇ賢ㄒㄧㄢˊ行ㄒㄧㄥˊ願ㄩㄢˋ品ㄆㄧㄣˇ\n唐ㄊㄤˊ罽ㄐㄧˋ賓ㄅㄧㄣ國ㄍㄨㄛˊ三ㄙㄢ藏ㄗㄤˋ般ㄅㄛ若ㄖㄜˇ奉ㄈㄥˋ詔ㄓㄠˋ譯ㄧˋ\n爾ㄦˇ時ㄕˊ普ㄆㄨˇ賢ㄒㄧㄢˊ菩ㄆㄨˊ薩ㄙㄚˋ摩ㄇㄛˊ訶ㄏㄜ薩ㄙㄚˋ。稱ㄔㄥ歎ㄊㄢˋ如ㄖㄨˊ來ㄌㄞˊ勝ㄕㄥˋ功ㄍㄨㄥ德ㄉㄜˊ已ㄧˇ。告ㄍㄠˋ諸ㄓㄨ菩ㄆㄨˊ薩ㄙㄚˋ。及ㄐㄧˊ善ㄕㄢˋ財ㄘㄞˊ言ㄧㄢˊ。善ㄕㄢˋ男ㄋㄢˊ子˙ㄗ。如ㄖㄨˊ來ㄌㄞˊ功ㄍㄨㄥ德ㄉㄜˊ。假ㄐㄧㄚˇ使ㄕˇ十ㄕˊ方ㄈㄤ一ㄧ切ㄑㄧㄝˋ諸ㄓㄨ佛ㄈㄛˊ。經ㄐㄧㄥ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ佛ㄈㄛˊ剎ㄔㄚˋ極ㄐㄧˊ微ㄨㄟˊ塵ㄔㄣˊ數ㄕㄨˋ劫ㄐㄧㄝˊ。相ㄒㄧㄤ續ㄒㄩˋ演ㄧㄢˇ說ㄕㄨㄛ。不ㄅㄨˋ可ㄎㄜˇ窮ㄑㄩㄥˊ盡ㄐㄧㄣˋ。若ㄖㄨㄛˋ欲ㄩˋ成ㄔㄥˊ就ㄐㄧㄡˋ此ㄘˇ功ㄍㄨㄥ德ㄉㄜˊ門ㄇㄣˊ。應ㄧㄥ修ㄒㄧㄡ十ㄕˊ種ㄓㄨㄥˇ廣ㄍㄨㄤˇ大ㄉㄚˋ行ㄒㄧㄥˊ願ㄩㄢˋ。何ㄏㄜˊ等ㄉㄥˇ為ㄨㄟˊ十ㄕˊ。一ㄧ者ㄓㄜˇ禮ㄌㄧˇ敬ㄐㄧㄥˋ諸ㄓㄨ佛ㄈㄛˊ。二ㄦˋ者ㄓㄜˇ稱ㄔㄥ讚ㄗㄢˋ如ㄖㄨˊ來ㄌㄞˊ。三ㄙㄢ者ㄓㄜˇ廣ㄍㄨㄤˇ修ㄒㄧㄡ供ㄍㄨㄥˋ養ㄧㄤˇ。四ㄙˋ者ㄓㄜˇ懺ㄔㄢˋ悔ㄏㄨㄟˇ業ㄧㄝˋ障ㄓㄤˋ。五ㄨˇ者ㄓㄜˇ隨ㄙㄨㄟˊ喜ㄒㄧˇ功ㄍㄨㄥ德ㄉㄜˊ。六ㄌㄧㄡˋ者ㄓㄜˇ請ㄑㄧㄥˇ轉ㄓㄨㄢˇ法ㄈㄚˇ輪ㄌㄨㄣˊ。七ㄑㄧ者ㄓㄜˇ請ㄑㄧㄥˇ佛ㄈㄛˊ住ㄓㄨˋ世ㄕˋ。八ㄅㄚ者ㄓㄜˇ常ㄔㄤˊ隨ㄙㄨㄟˊ佛ㄈㄛˊ學ㄒㄩㄝˊ。九ㄐㄧㄡˇ者ㄓㄜˇ恆ㄏㄥˊ順ㄕㄨㄣˋ眾ㄓㄨㄥˋ生ㄕㄥ。十ㄕˊ者ㄓㄜˇ普ㄆㄨˇ皆ㄐㄧㄝ迴ㄏㄨㄟˊ向ㄒㄧㄤˋ。善ㄕㄢˋ財ㄘㄞˊ白ㄅㄛˊ言ㄧㄢˊ。大ㄉㄚˋ聖ㄕㄥˋ。云ㄩㄣˊ何ㄏㄜˊ禮ㄌㄧˇ敬ㄐㄧㄥˋ。乃ㄋㄞˇ至ㄓˋ迴ㄏㄨㄟˊ向ㄒㄧㄤˋ。\n普ㄆㄨˇ賢ㄒㄧㄢˊ菩ㄆㄨˊ薩ㄙㄚˋ告ㄍㄠˋ善ㄕㄢˋ財ㄘㄞˊ言ㄧㄢˊ。善ㄕㄢˋ男ㄋㄢˊ子˙ㄗ。言ㄧㄢˊ禮ㄌㄧˇ敬ㄐㄧㄥˋ諸ㄓㄨ佛ㄈㄛˊ者ㄓㄜˇ。所ㄙㄨㄛˇ有ㄧㄡˇ盡ㄐㄧㄣˋ法ㄈㄚˇ界ㄐㄧㄝˋ虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ。十ㄕˊ方ㄈㄤ三ㄙㄢ世ㄕˋ一ㄧ切ㄑㄧㄝˋ佛ㄈㄛˊ剎ㄔㄚˋ。極ㄐㄧˊ微ㄨㄟˊ塵ㄔㄣˊ數ㄕㄨˋ諸ㄓㄨ佛ㄈㄛˊ世ㄕˋ尊ㄗㄨㄣ。我ㄨㄛˇ以ㄧˇ普ㄆㄨˇ賢ㄒㄧㄢˊ行ㄒㄧㄥˊ願ㄩㄢˋ力ㄌㄧˋ故ㄍㄨˋ。深ㄕㄣ心ㄒㄧㄣ信ㄒㄧㄣˋ解ㄐㄧㄝˇ。如ㄖㄨˊ對ㄉㄨㄟˋ目ㄇㄨˋ前ㄑㄧㄢˊ。悉ㄒㄧ以ㄧˇ清ㄑㄧㄥ淨ㄐㄧㄥˋ身ㄕㄣ語ㄩˇ意ㄧˋ業ㄧㄝˋ。常ㄔㄤˊ修ㄒㄧㄡ禮ㄌㄧˇ敬ㄐㄧㄥˋ。一ㄧ一ㄧ佛ㄈㄛˊ所ㄙㄨㄛˇ。皆ㄐㄧㄝ現ㄒㄧㄢˋ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ佛ㄈㄛˊ剎ㄔㄚˋ極ㄐㄧˊ微ㄨㄟˊ塵ㄔㄣˊ數ㄕㄨˋ身ㄕㄣ。一ㄧ一ㄧ身ㄕㄣ。遍ㄅㄧㄢˋ禮ㄌㄧˇ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ佛ㄈㄛˊ剎ㄔㄚˋ極ㄐㄧˊ微ㄨㄟˊ塵ㄔㄣˊ數ㄕㄨˋ佛ㄈㄛˊ。虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ盡ㄐㄧㄣˋ。我ㄨㄛˇ禮ㄌㄧˇ乃ㄋㄞˇ盡ㄐㄧㄣˋ。以ㄧˇ虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ不ㄅㄨˋ可ㄎㄜˇ盡ㄐㄧㄣˋ故ㄍㄨˋ。我ㄨㄛˇ此ㄘˇ禮ㄌㄧˇ敬ㄐㄧㄥˋ無ㄨˊ有ㄧㄡˇ窮ㄑㄩㄥˊ盡ㄐㄧㄣˋ。如ㄖㄨˊ是ㄕˋ乃ㄋㄞˇ至ㄓˋ眾ㄓㄨㄥˋ生ㄕㄥ界ㄐㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ業ㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ煩ㄈㄢˊ惱ㄋㄠˇ盡ㄐㄧㄣˋ。我ㄨㄛˇ禮ㄌㄧˇ乃ㄋㄞˇ盡ㄐㄧㄣˋ。而ㄦˊ眾ㄓㄨㄥˋ生ㄕㄥ界ㄐㄧㄝˋ乃ㄋㄞˇ至ㄓˋ煩ㄈㄢˊ惱ㄋㄠˇ無ㄨˊ有ㄧㄡˇ盡ㄐㄧㄣˋ故ㄍㄨˋ。我ㄨㄛˇ此ㄘˇ禮ㄌㄧˇ敬ㄐㄧㄥˋ無ㄨˊ有ㄧㄡˇ窮ㄑㄩㄥˊ盡ㄐㄧㄣˋ。念ㄋㄧㄢˋ念ㄋㄧㄢˋ相ㄒㄧㄤ續ㄒㄩˋ。無ㄨˊ有ㄧㄡˇ間ㄐㄧㄢ斷ㄉㄨㄢˋ。身ㄕㄣ語ㄩˇ意ㄧˋ業ㄧㄝˋ。無ㄨˊ有ㄧㄡˇ疲ㄆㄧˊ厭ㄧㄢˋ。\n復ㄈㄨˋ次ㄘˋ善ㄕㄢˋ男ㄋㄢˊ子˙ㄗ。言ㄧㄢˊ稱ㄔㄥ讚ㄗㄢˋ如ㄖㄨˊ來ㄌㄞˊ者ㄓㄜˇ。所ㄙㄨㄛˇ有ㄧㄡˇ盡ㄐㄧㄣˋ法ㄈㄚˇ界ㄐㄧㄝˋ虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ。十ㄕˊ方ㄈㄤ三ㄙㄢ世ㄕˋ一ㄧ切ㄑㄧㄝˋ剎ㄔㄚˋ土ㄊㄨˇ。所ㄙㄨㄛˇ有ㄧㄡˇ極ㄐㄧˊ微ㄨㄟˊ一ㄧ一ㄧ塵ㄔㄣˊ中ㄓㄨㄥ。皆ㄐㄧㄝ有ㄧㄡˇ一ㄧ切ㄑㄧㄝˋ世ㄕˋ間ㄐㄧㄢ極ㄐㄧˊ微ㄨㄟˊ塵ㄔㄣˊ數ㄕㄨˋ佛ㄈㄛˊ。一ㄧ一ㄧ佛ㄈㄛˊ所ㄙㄨㄛˇ。皆ㄐㄧㄝ有ㄧㄡˇ菩ㄆㄨˊ薩ㄙㄚˋ海ㄏㄞˇ會ㄏㄨㄟˋ圍ㄨㄟˊ繞ㄖㄠˋ。我ㄨㄛˇ當ㄉㄤ悉ㄒㄧ以ㄧˇ甚ㄕㄣˋ深ㄕㄣ勝ㄕㄥˋ解ㄐㄧㄝˇ現ㄒㄧㄢˋ前ㄑㄧㄢˊ知ㄓ見ㄐㄧㄢˋ。各ㄍㄜˋ以ㄧˇ出ㄔㄨ過ㄍㄨㄛˋ辯ㄅㄧㄢˋ才ㄘㄞˊ天ㄊㄧㄢ女ㄋㄩˇ微ㄨㄟˊ妙ㄇㄧㄠˋ舌ㄕㄜˊ根ㄍㄣ。一ㄧ一ㄧ舌ㄕㄜˊ根ㄍㄣ。出ㄔㄨ無ㄨˊ盡ㄐㄧㄣˋ音ㄧㄣ聲ㄕㄥ海ㄏㄞˇ。一ㄧ一ㄧ音ㄧㄣ聲ㄕㄥ。出ㄔㄨ一ㄧ切ㄑㄧㄝˋ言ㄧㄢˊ辭ㄘˊ海ㄏㄞˇ。稱ㄔㄥ揚ㄧㄤˊ讚ㄗㄢˋ歎ㄊㄢˋ一ㄧ切ㄑㄧㄝˋ如ㄖㄨˊ來ㄌㄞˊ諸ㄓㄨ功ㄍㄨㄥ德ㄉㄜˊ海ㄏㄞˇ。窮ㄑㄩㄥˊ未ㄨㄟˋ來ㄌㄞˊ際ㄐㄧˋ。相ㄒㄧㄤ續ㄒㄩˋ不ㄅㄨˋ斷ㄉㄨㄢˋ。盡ㄐㄧㄣˋ於ㄩˊ法ㄈㄚˇ界ㄐㄧㄝˋ。無ㄨˊ不ㄅㄨˋ周ㄓㄡ遍ㄅㄧㄢˋ。如ㄖㄨˊ是ㄕˋ虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ界ㄐㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ業ㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ煩ㄈㄢˊ惱ㄋㄠˇ盡ㄐㄧㄣˋ。我ㄨㄛˇ讚ㄗㄢˋ乃ㄋㄞˇ盡ㄐㄧㄣˋ。而ㄦˊ虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ乃ㄋㄞˇ至ㄓˋ煩ㄈㄢˊ惱ㄋㄠˇ無ㄨˊ有ㄧㄡˇ盡ㄐㄧㄣˋ故ㄍㄨˋ。我ㄨㄛˇ此ㄘˇ讚ㄗㄢˋ歎ㄊㄢˋ無ㄨˊ有ㄧㄡˇ窮ㄑㄩㄥˊ盡ㄐㄧㄣˋ。念ㄋㄧㄢˋ念ㄋㄧㄢˋ相ㄒㄧㄤ續ㄒㄩˋ。無ㄨˊ有ㄧㄡˇ間ㄐㄧㄢ斷ㄉㄨㄢˋ。\n身ㄕㄣ語ㄩˇ意ㄧˋ業ㄧㄝˋ。無ㄨˊ有ㄧㄡˇ疲ㄆㄧˊ厭ㄧㄢˋ。\n復ㄈㄨˋ次ㄘˋ善ㄕㄢˋ男ㄋㄢˊ子˙ㄗ。言ㄧㄢˊ廣ㄍㄨㄤˇ修ㄒㄧㄡ供ㄍㄨㄥˋ養ㄧㄤˇ者ㄓㄜˇ。所ㄙㄨㄛˇ有ㄧㄡˇ盡ㄐㄧㄣˋ法ㄈㄚˇ界ㄐㄧㄝˋ虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ。十ㄕˊ方ㄈㄤ三ㄙㄢ世ㄕˋ一ㄧ切ㄑㄧㄝˋ佛ㄈㄛˊ剎ㄔㄚˋ極ㄐㄧˊ微ㄨㄟˊ塵ㄔㄣˊ中ㄓㄨㄥ。一ㄧ一ㄧ各ㄍㄜˋ有ㄧㄡˇ一ㄧ切ㄑㄧㄝˋ世ㄕˋ界ㄐㄧㄝˋ極ㄐㄧˊ微ㄨㄟˊ塵ㄔㄣˊ數ㄕㄨˋ佛ㄈㄛˊ。一ㄧ一ㄧ佛ㄈㄛˊ所ㄙㄨㄛˇ。種ㄓㄨㄥˇ種ㄓㄨㄥˇ菩ㄆㄨˊ薩ㄙㄚˋ海ㄏㄞˇ會ㄏㄨㄟˋ圍ㄨㄟˊ繞ㄖㄠˋ。我ㄨㄛˇ以ㄧˇ普ㄆㄨˇ賢ㄒㄧㄢˊ行ㄒㄧㄥˊ願ㄩㄢˋ力ㄌㄧˋ故ㄍㄨˋ。起ㄑㄧˇ深ㄕㄣ信ㄒㄧㄣˋ解ㄐㄧㄝˇ現ㄒㄧㄢˋ前ㄑㄧㄢˊ知ㄓ見ㄐㄧㄢˋ。悉ㄒㄧ以ㄧˇ上ㄕㄤˋ妙ㄇㄧㄠˋ諸ㄓㄨ供ㄍㄨㄥˋ養ㄧㄤˇ具ㄐㄩˋ。而ㄦˊ為ㄨㄟˋ供ㄍㄨㄥˋ養ㄧㄤˇ。所ㄙㄨㄛˇ謂ㄨㄟˋ華ㄏㄨㄚˊ雲ㄩㄣˊ鬘ㄇㄢˊ雲ㄩㄣˊ。天ㄊㄧㄢ音ㄧㄣ樂ㄩㄝˋ雲ㄩㄣˊ。天ㄊㄧㄢ傘ㄙㄢˇ蓋ㄍㄞˋ雲ㄩㄣˊ。天ㄊㄧㄢ衣ㄧ服ㄈㄨˊ雲ㄩㄣˊ。天ㄊㄧㄢ種ㄓㄨㄥˇ種ㄓㄨㄥˇ香ㄒㄧㄤ。塗ㄊㄨˊ香ㄒㄧㄤ燒ㄕㄠ香ㄒㄧㄤ末ㄇㄛˋ香ㄒㄧㄤ。如ㄖㄨˊ是ㄕˋ等ㄉㄥˇ雲ㄩㄣˊ。一ㄧ一ㄧ量ㄌㄧㄤˋ如ㄖㄨˊ須ㄒㄩ彌ㄇㄧˊ山ㄕㄢ王ㄨㄤˊ。然ㄖㄢˊ種ㄓㄨㄥˇ種ㄓㄨㄥˇ燈ㄉㄥ。酥ㄙㄨ燈ㄉㄥ油ㄧㄡˊ燈ㄉㄥ。諸ㄓㄨ香ㄒㄧㄤ油ㄧㄡˊ燈ㄉㄥ。一ㄧ一ㄧ燈ㄉㄥ炷ㄓㄨˋ。如ㄖㄨˊ須ㄒㄩ彌ㄇㄧˊ山ㄕㄢ。一ㄧ一ㄧ燈ㄉㄥ油ㄧㄡˊ。如ㄖㄨˊ大ㄉㄚˋ海ㄏㄞˇ水ㄕㄨㄟˇ。以ㄧˇ如ㄖㄨˊ是ㄕˋ等ㄉㄥˇ諸ㄓㄨ供ㄍㄨㄥˋ養ㄧㄤˇ具ㄐㄩˋ。常ㄔㄤˊ為ㄨㄟˋ供ㄍㄨㄥˋ養ㄧㄤˇ。善ㄕㄢˋ男ㄋㄢˊ子˙ㄗ。諸ㄓㄨ供ㄍㄨㄥˋ養ㄧㄤˇ中ㄓㄨㄥ。法ㄈㄚˇ供ㄍㄨㄥˋ養ㄧㄤˇ最ㄗㄨㄟˋ。所ㄙㄨㄛˇ謂ㄨㄟˋ如ㄖㄨˊ說ㄕㄨㄛ修ㄒㄧㄡ行ㄒㄧㄥˊ供ㄍㄨㄥˋ養ㄧㄤˇ。利ㄌㄧˋ益ㄧˋ眾ㄓㄨㄥˋ生ㄕㄥ供ㄍㄨㄥˋ養ㄧㄤˇ。攝ㄕㄜˋ受ㄕㄡˋ眾ㄓㄨㄥˋ生ㄕㄥ供ㄍㄨㄥˋ養ㄧㄤˇ。代ㄉㄞˋ眾ㄓㄨㄥˋ生ㄕㄥ苦ㄎㄨˇ供ㄍㄨㄥˋ養ㄧㄤˇ。勤ㄑㄧㄣˊ修ㄒㄧㄡ善ㄕㄢˋ根ㄍㄣ供ㄍㄨㄥˋ養ㄧㄤˇ。不ㄅㄨˋ捨ㄕㄜˇ菩ㄆㄨˊ薩ㄙㄚˋ業ㄧㄝˋ供ㄍㄨㄥˋ養ㄧㄤˇ。不ㄅㄨˋ離ㄌㄧˊ菩ㄆㄨˊ提ㄊㄧˊ心ㄒㄧㄣ供ㄍㄨㄥˋ養ㄧㄤˇ。善ㄕㄢˋ男ㄋㄢˊ子˙ㄗ。如ㄖㄨˊ前ㄑㄧㄢˊ供ㄍㄨㄥˋ養ㄧㄤˇ無ㄨˊ量ㄌㄧㄤˋ功ㄍㄨㄥ德ㄉㄜˊ。比ㄅㄧˇ法ㄈㄚˇ供ㄍㄨㄥˋ養ㄧㄤˇ一ㄧ念ㄋㄧㄢˋ功ㄍㄨㄥ德ㄉㄜˊ。百ㄅㄞˇ分ㄈㄣˋ不ㄅㄨˋ及ㄐㄧˊ一ㄧ。千ㄑㄧㄢ分ㄈㄣˋ不ㄅㄨˋ及ㄐㄧˊ一ㄧ。百ㄅㄞˇ千ㄑㄧㄢ俱ㄐㄩ胝ㄓ那ㄋㄚˋ由ㄧㄡˊ他ㄊㄚ分ㄈㄣˋ。迦ㄐㄧㄚ羅ㄌㄨㄛˊ分ㄈㄣˋ。算ㄙㄨㄢˋ分ㄈㄣˋ。數ㄕㄨˋ分ㄈㄣˋ。喻ㄩˋ分ㄈㄣˋ。優ㄧㄡ波ㄅㄛ尼ㄋㄧˊ沙ㄕㄚ陀ㄊㄨㄛˊ分ㄈㄣˋ。亦ㄧˋ不ㄅㄨˋ及ㄐㄧˊ一ㄧ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ。以ㄧˇ諸ㄓㄨ如ㄖㄨˊ來ㄌㄞˊ尊ㄗㄨㄣ重ㄓㄨㄥˋ法ㄈㄚˇ故ㄍㄨˋ。以ㄧˇ如ㄖㄨˊ說ㄕㄨㄛ行ㄒㄧㄥˊ出ㄔㄨ生ㄕㄥ諸ㄓㄨ佛ㄈㄛˊ故ㄍㄨˋ。若ㄖㄨㄛˋ諸ㄓㄨ菩ㄆㄨˊ薩ㄙㄚˋ行ㄒㄧㄥˊ法ㄈㄚˇ供ㄍㄨㄥˋ養ㄧㄤˇ。則ㄗㄜˊ得ㄉㄜˊ成ㄔㄥˊ就ㄐㄧㄡˋ供ㄍㄨㄥˋ養ㄧㄤˇ如ㄖㄨˊ來ㄌㄞˊ。如ㄖㄨˊ是ㄕˋ修ㄒㄧㄡ行ㄒㄧㄥˊ。是ㄕˋ真ㄓㄣ供ㄍㄨㄥˋ養ㄧㄤˇ故ㄍㄨˋ。此ㄘˇ廣ㄍㄨㄤˇ大ㄉㄚˋ最ㄗㄨㄟˋ勝ㄕㄥˋ供ㄍㄨㄥˋ養ㄧㄤˇ。虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ界ㄐㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ業ㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ煩ㄈㄢˊ惱ㄋㄠˇ盡ㄐㄧㄣˋ。我ㄨㄛˇ供ㄍㄨㄥˋ乃ㄋㄞˇ盡ㄐㄧㄣˋ。而ㄦˊ虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ乃ㄋㄞˇ至ㄓˋ煩ㄈㄢˊ惱ㄋㄠˇ不ㄅㄨˋ可ㄎㄜˇ盡ㄐㄧㄣˋ故ㄍㄨˋ。我ㄨㄛˇ此ㄘˇ供ㄍㄨㄥˋ養ㄧㄤˇ亦ㄧˋ無ㄨˊ有ㄧㄡˇ盡ㄐㄧㄣˋ。念ㄋㄧㄢˋ念ㄋㄧㄢˋ相ㄒㄧㄤ續ㄒㄩˋ。無ㄨˊ有ㄧㄡˇ間ㄐㄧㄢ斷ㄉㄨㄢˋ。身ㄕㄣ語ㄩˇ意ㄧˋ業ㄧㄝˋ。無ㄨˊ有ㄧㄡˇ疲ㄆㄧˊ厭ㄧㄢˋ。\n復ㄈㄨˋ次ㄘˋ善ㄕㄢˋ男ㄋㄢˊ子˙ㄗ。言ㄧㄢˊ懺ㄔㄢˋ悔ㄏㄨㄟˇ業ㄧㄝˋ障ㄓㄤˋ者ㄓㄜˇ。菩ㄆㄨˊ薩ㄙㄚˋ自ㄗˋ念ㄋㄧㄢˋ。我ㄨㄛˇ於ㄩˊ過ㄍㄨㄛˋ去ㄑㄩˋ無ㄨˊ始ㄕˇ劫ㄐㄧㄝˊ中ㄓㄨㄥ。由ㄧㄡˊ貪ㄊㄢ瞋ㄔㄣ癡ㄔ。發ㄈㄚ身ㄕㄣ口ㄎㄡˇ意ㄧˋ。作ㄗㄨㄛˋ諸ㄓㄨ惡ㄜˋ業ㄧㄝˋ。無ㄨˊ量ㄌㄧㄤˋ無ㄨˊ邊ㄅㄧㄢ。若ㄖㄨㄛˋ此ㄘˇ惡ㄜˋ業ㄧㄝˋ有ㄧㄡˇ體ㄊㄧˇ相ㄒㄧㄤˋ者ㄓㄜˇ。盡ㄐㄧㄣˋ虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ不ㄅㄨˋ能ㄋㄥˊ容ㄖㄨㄥˊ受ㄕㄡˋ。我ㄨㄛˇ今ㄐㄧㄣ悉ㄒㄧ以ㄧˇ清ㄑㄧㄥ淨ㄐㄧㄥˋ三ㄙㄢ業ㄧㄝˋ。遍ㄅㄧㄢˋ於ㄩˊ法ㄈㄚˇ界ㄐㄧㄝˋ極ㄐㄧˊ微ㄨㄟˊ塵ㄔㄣˊ剎ㄔㄚˋ。一ㄧ切ㄑㄧㄝˋ諸ㄓㄨ佛ㄈㄛˊ菩ㄆㄨˊ薩ㄙㄚˋ眾ㄓㄨㄥˋ前ㄑㄧㄢˊ。誠ㄔㄥˊ心ㄒㄧㄣ懺ㄔㄢˋ悔ㄏㄨㄟˇ。後ㄏㄡˋ不ㄅㄨˋ復ㄈㄨˋ造ㄗㄠˋ。恆ㄏㄥˊ住ㄓㄨˋ淨ㄐㄧㄥˋ戒ㄐㄧㄝˋ一ㄧ切ㄑㄧㄝˋ功ㄍㄨㄥ德ㄉㄜˊ。如ㄖㄨˊ是ㄕˋ虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ界ㄐㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ業ㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ煩ㄈㄢˊ惱ㄋㄠˇ盡ㄐㄧㄣˋ。我ㄨㄛˇ懺ㄔㄢˋ乃ㄋㄞˇ盡ㄐㄧㄣˋ。而ㄦˊ虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ乃ㄋㄞˇ至ㄓˋ眾ㄓㄨㄥˋ生ㄕㄥ煩ㄈㄢˊ惱ㄋㄠˇ不ㄅㄨˋ可ㄎㄜˇ盡ㄐㄧㄣˋ故ㄍㄨˋ。我ㄨㄛˇ此ㄘˇ懺ㄔㄢˋ悔ㄏㄨㄟˇ無ㄨˊ有ㄧㄡˇ窮ㄑㄩㄥˊ盡ㄐㄧㄣˋ。念ㄋㄧㄢˋ念ㄋㄧㄢˋ相ㄒㄧㄤ續ㄒㄩˋ。無ㄨˊ有ㄧㄡˇ間ㄐㄧㄢ斷ㄉㄨㄢˋ。身ㄕㄣ語ㄩˇ意ㄧˋ業ㄧㄝˋ。無ㄨˊ有ㄧㄡˇ疲ㄆㄧˊ厭ㄧㄢˋ。\n復ㄈㄨˋ次ㄘˋ善ㄕㄢˋ男ㄋㄢˊ子˙ㄗ。言ㄧㄢˊ隨ㄙㄨㄟˊ喜ㄒㄧˇ功ㄍㄨㄥ德ㄉㄜˊ者ㄓㄜˇ。所ㄙㄨㄛˇ有ㄧㄡˇ盡ㄐㄧㄣˋ法ㄈㄚˇ界ㄐㄧㄝˋ虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ。十ㄕˊ方ㄈㄤ三ㄙㄢ世ㄕˋ一ㄧ切ㄑㄧㄝˋ佛ㄈㄛˊ剎ㄔㄚˋ。極ㄐㄧˊ微ㄨㄟˊ塵ㄔㄣˊ數ㄕㄨˋ諸ㄓㄨ佛ㄈㄛˊ如ㄖㄨˊ來ㄌㄞˊ。從ㄘㄨㄥˊ初ㄔㄨ發ㄈㄚ心ㄒㄧㄣ。為ㄨㄟˋ一ㄧ切ㄑㄧㄝˋ智ㄓˋ。勤ㄑㄧㄣˊ修ㄒㄧㄡ福ㄈㄨˊ聚ㄐㄩˋ。不ㄅㄨˋ惜ㄒㄧ身ㄕㄣ命ㄇㄧㄥˋ。經ㄐㄧㄥ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ佛ㄈㄛˊ剎ㄔㄚˋ極ㄐㄧˊ微ㄨㄟˊ塵ㄔㄣˊ數ㄕㄨˋ劫ㄐㄧㄝˊ。一ㄧ一ㄧ劫ㄐㄧㄝˊ中ㄓㄨㄥ。捨ㄕㄜˇ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ佛ㄈㄛˊ剎ㄔㄚˋ極ㄐㄧˊ微ㄨㄟˊ塵ㄔㄣˊ數ㄕㄨˋ頭ㄊㄡˊ目ㄇㄨˋ手ㄕㄡˇ足ㄗㄨˊ。如ㄖㄨˊ是ㄕˋ一ㄧ切ㄑㄧㄝˋ難ㄋㄢˊ行ㄒㄧㄥˊ苦ㄎㄨˇ行ㄒㄧㄥˊ。圓ㄩㄢˊ滿ㄇㄢˇ種ㄓㄨㄥˇ種ㄓㄨㄥˇ波ㄅㄛ羅ㄌㄨㄛˊ蜜ㄇㄧˋ門ㄇㄣˊ。證ㄓㄥˋ入ㄖㄨˋ種ㄓㄨㄥˇ種ㄓㄨㄥˇ菩ㄆㄨˊ薩ㄙㄚˋ智ㄓˋ地ㄉㄧˋ。成ㄔㄥˊ就ㄐㄧㄡˋ諸ㄓㄨ佛ㄈㄛˊ無ㄨˊ上ㄕㄤˋ菩ㄆㄨˊ提ㄊㄧˊ。及ㄐㄧˊ般ㄅㄛ涅ㄋㄧㄝˋ槃ㄆㄢˊ分ㄈㄣ布ㄅㄨˋ舍ㄕㄜˋ利ㄌㄧˋ。所ㄙㄨㄛˇ有ㄧㄡˇ善ㄕㄢˋ根ㄍㄣ。我ㄨㄛˇ皆ㄐㄧㄝ隨ㄙㄨㄟˊ喜ㄒㄧˇ。及ㄐㄧˊ彼ㄅㄧˇ十ㄕˊ方ㄈㄤ一ㄧ切ㄑㄧㄝˋ世ㄕˋ界ㄐㄧㄝˋ。六ㄌㄧㄡˋ趣ㄑㄩˋ四ㄙˋ生ㄕㄥ一ㄧ切ㄑㄧㄝˋ種ㄓㄨㄥˇ類ㄌㄟˋ。所ㄙㄨㄛˇ有ㄧㄡˇ功ㄍㄨㄥ德ㄉㄜˊ。乃ㄋㄞˇ至ㄓˋ一ㄧ塵ㄔㄣˊ。我ㄨㄛˇ皆ㄐㄧㄝ隨ㄙㄨㄟˊ喜ㄒㄧˇ。十ㄕˊ方ㄈㄤ三ㄙㄢ世ㄕˋ一ㄧ切ㄑㄧㄝˋ聲ㄕㄥ聞ㄨㄣˊ。及ㄐㄧˊ辟ㄆㄧˋ支ㄓ佛ㄈㄛˊ。有ㄧㄡˇ學ㄒㄩㄝˊ無ㄨˊ學ㄒㄩㄝˊ。所ㄙㄨㄛˇ有ㄧㄡˇ功ㄍㄨㄥ德ㄉㄜˊ。我ㄨㄛˇ皆ㄐㄧㄝ隨ㄙㄨㄟˊ喜ㄒㄧˇ。一ㄧ切ㄑㄧㄝˋ菩ㄆㄨˊ薩ㄙㄚˋ所ㄙㄨㄛˇ修ㄒㄧㄡ無ㄨˊ量ㄌㄧㄤˋ難ㄋㄢˊ行ㄒㄧㄥˊ苦ㄎㄨˇ行ㄒㄧㄥˊ。志ㄓˋ求ㄑㄧㄡˊ無ㄨˊ上ㄕㄤˋ正ㄓㄥˋ等ㄉㄥˇ菩ㄆㄨˊ提ㄊㄧˊ。廣ㄍㄨㄤˇ大ㄉㄚˋ功ㄍㄨㄥ德ㄉㄜˊ。我ㄨㄛˇ皆ㄐㄧㄝ隨ㄙㄨㄟˊ喜ㄒㄧˇ。如ㄖㄨˊ是ㄕˋ虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ界ㄐㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ業ㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ煩ㄈㄢˊ惱ㄋㄠˇ盡ㄐㄧㄣˋ。我ㄨㄛˇ此ㄘˇ隨ㄙㄨㄟˊ喜ㄒㄧˇ無ㄨˊ有ㄧㄡˇ窮ㄑㄩㄥˊ盡ㄐㄧㄣˋ。念ㄋㄧㄢˋ念ㄋㄧㄢˋ相ㄒㄧㄤ續ㄒㄩˋ。無ㄨˊ有ㄧㄡˇ間ㄐㄧㄢ斷ㄉㄨㄢˋ。身ㄕㄣ語ㄩˇ意ㄧˋ業ㄧㄝˋ。無ㄨˊ有ㄧㄡˇ疲ㄆㄧˊ厭ㄧㄢˋ。\n復ㄈㄨˋ次ㄘˋ善ㄕㄢˋ男ㄋㄢˊ子˙ㄗ。言ㄧㄢˊ請ㄑㄧㄥˇ轉ㄓㄨㄢˇ法ㄈㄚˇ輪ㄌㄨㄣˊ者ㄓㄜˇ。所ㄙㄨㄛˇ有ㄧㄡˇ盡ㄐㄧㄣˋ法ㄈㄚˇ界ㄐㄧㄝˋ虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ。十ㄕˊ方ㄈㄤ三ㄙㄢ世ㄕˋ一ㄧ切ㄑㄧㄝˋ佛ㄈㄛˊ剎ㄔㄚˋ極ㄐㄧˊ微ㄨㄟˊ塵ㄔㄣˊ中ㄓㄨㄥ。一ㄧ一ㄧ各ㄍㄜˋ有ㄧㄡˇ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ佛ㄈㄛˊ剎ㄔㄚˋ極ㄐㄧˊ微ㄨㄟˊ塵ㄔㄣˊ數ㄕㄨˋ廣ㄍㄨㄤˇ大ㄉㄚˋ佛ㄈㄛˊ剎ㄔㄚˋ。一ㄧ一ㄧ剎ㄔㄚˋ中ㄓㄨㄥ。念ㄋㄧㄢˋ念ㄋㄧㄢˋ有ㄧㄡˇ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ佛ㄈㄛˊ剎ㄔㄚˋ極ㄐㄧˊ微ㄨㄟˊ塵ㄔㄣˊ數ㄕㄨˋ一ㄧ切ㄑㄧㄝˋ諸ㄓㄨ佛ㄈㄛˊ成ㄔㄥˊ等ㄉㄥˇ正ㄓㄥˋ覺ㄐㄩㄝˊ。一ㄧ切ㄑㄧㄝˋ菩ㄆㄨˊ薩ㄙㄚˋ海ㄏㄞˇ會ㄏㄨㄟˋ圍ㄨㄟˊ繞ㄖㄠˋ。而ㄦˊ我ㄨㄛˇ悉ㄒㄧ以ㄧˇ身ㄕㄣ口ㄎㄡˇ意ㄧˋ業ㄧㄝˋ。種ㄓㄨㄥˇ種ㄓㄨㄥˇ方ㄈㄤ便ㄅㄧㄢˋ。殷ㄧㄣ勤ㄑㄧㄣˊ勸ㄑㄩㄢˋ請ㄑㄧㄥˇ。轉ㄓㄨㄢˇ妙ㄇㄧㄠˋ法ㄈㄚˇ輪ㄌㄨㄣˊ。如ㄖㄨˊ是ㄕˋ虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ界ㄐㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ業ㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ煩ㄈㄢˊ惱ㄋㄠˇ盡ㄐㄧㄣˋ。我ㄨㄛˇ常ㄔㄤˊ勸ㄑㄩㄢˋ請ㄑㄧㄥˇ一ㄧ切ㄑㄧㄝˋ諸ㄓㄨ佛ㄈㄛˊ轉ㄓㄨㄢˇ正ㄓㄥˋ法ㄈㄚˇ輪ㄌㄨㄣˊ。無ㄨˊ有ㄧㄡˇ窮ㄑㄩㄥˊ盡ㄐㄧㄣˋ。念ㄋㄧㄢˋ念ㄋㄧㄢˋ相ㄒㄧㄤ續ㄒㄩˋ。無ㄨˊ有ㄧㄡˇ間ㄐㄧㄢ斷ㄉㄨㄢˋ。身ㄕㄣ語ㄩˇ意ㄧˋ業ㄧㄝˋ。無ㄨˊ有ㄧㄡˇ疲ㄆㄧˊ厭ㄧㄢˋ。\n復ㄈㄨˋ次ㄘˋ善ㄕㄢˋ男ㄋㄢˊ子˙ㄗ。言ㄧㄢˊ請ㄑㄧㄥˇ佛ㄈㄛˊ住ㄓㄨˋ世ㄕˋ者ㄓㄜˇ。所ㄙㄨㄛˇ有ㄧㄡˇ盡ㄐㄧㄣˋ法ㄈㄚˇ界ㄐㄧㄝˋ虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ。十ㄕˊ方ㄈㄤ三ㄙㄢ世ㄕˋ一ㄧ切ㄑㄧㄝˋ佛ㄈㄛˊ剎ㄔㄚˋ。極ㄐㄧˊ微ㄨㄟˊ塵ㄔㄣˊ數ㄕㄨˋ諸ㄓㄨ佛ㄈㄛˊ如ㄖㄨˊ來ㄌㄞˊ。將ㄐㄧㄤ欲ㄩˋ示ㄕˋ現ㄒㄧㄢˋ般ㄅㄛ涅ㄋㄧㄝˋ槃ㄆㄢˊ者ㄓㄜˇ。及ㄐㄧˊ諸ㄓㄨ菩ㄆㄨˊ薩ㄙㄚˋ聲ㄕㄥ聞ㄨㄣˊ緣ㄩㄢˊ覺ㄐㄩㄝˊ有ㄧㄡˇ學ㄒㄩㄝˊ無ㄨˊ學ㄒㄩㄝˊ。乃ㄋㄞˇ至ㄓˋ一ㄧ切ㄑㄧㄝˋ諸ㄓㄨ善ㄕㄢˋ知ㄓ識ㄕˋ。我ㄨㄛˇ悉ㄒㄧ勸ㄑㄩㄢˋ請ㄑㄧㄥˇ莫ㄇㄛˋ入ㄖㄨˋ涅ㄋㄧㄝˋ槃ㄆㄢˊ。經ㄐㄧㄥ於ㄩˊ一ㄧ切ㄑㄧㄝˋ佛ㄈㄛˊ剎ㄔㄚˋ極ㄐㄧˊ微ㄨㄟˊ塵ㄔㄣˊ數ㄕㄨˋ劫ㄐㄧㄝˊ。為ㄨㄟˋ欲ㄩˋ利ㄌㄧˋ樂ㄌㄜˋ一ㄧ切ㄑㄧㄝˋ眾ㄓㄨㄥˋ生ㄕㄥ。如ㄖㄨˊ是ㄕˋ虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ界ㄐㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ業ㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ煩ㄈㄢˊ惱ㄋㄠˇ盡ㄐㄧㄣˋ。我ㄨㄛˇ此ㄘˇ勸ㄑㄩㄢˋ請ㄑㄧㄥˇ無ㄨˊ有ㄧㄡˇ窮ㄑㄩㄥˊ盡ㄐㄧㄣˋ。念ㄋㄧㄢˋ念ㄋㄧㄢˋ相ㄒㄧㄤ續ㄒㄩˋ。無ㄨˊ有ㄧㄡˇ間ㄐㄧㄢ斷ㄉㄨㄢˋ。身ㄕㄣ語ㄩˇ意ㄧˋ業ㄧㄝˋ。無ㄨˊ有ㄧㄡˇ疲ㄆㄧˊ厭ㄧㄢˋ。\n復ㄈㄨˋ次ㄘˋ善ㄕㄢˋ男ㄋㄢˊ子˙ㄗ。言ㄧㄢˊ常ㄔㄤˊ隨ㄙㄨㄟˊ佛ㄈㄛˊ學ㄒㄩㄝˊ者ㄓㄜˇ。如ㄖㄨˊ此ㄘˇ娑ㄙㄨㄛ婆ㄆㄛˊ世ㄕˋ界ㄐㄧㄝˋ。毗ㄆㄧˊ盧ㄌㄨˊ遮ㄓㄜ那ㄋㄚˋ如ㄖㄨˊ來ㄌㄞˊ。從ㄘㄨㄥˊ初ㄔㄨ發ㄈㄚ心ㄒㄧㄣ。精ㄐㄧㄥ進ㄐㄧㄣˋ不ㄅㄨˋ退ㄊㄨㄟˋ。以ㄧˇ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ身ㄕㄣ命ㄇㄧㄥˋ而ㄦˊ為ㄨㄟˊ布ㄅㄨˋ施ㄕ。剝ㄅㄛ皮ㄆㄧˊ為ㄨㄟˊ紙ㄓˇ。析ㄒㄧ骨ㄍㄨˇ為ㄨㄟˊ筆ㄅㄧˇ。刺ㄘˋ血ㄒㄩㄝˇ為ㄨㄟˊ墨ㄇㄛˋ。書ㄕㄨ寫ㄒㄧㄝˇ經ㄐㄧㄥ典ㄉㄧㄢˇ。積ㄐㄧ如ㄖㄨˊ須ㄒㄩ彌ㄇㄧˊ。為ㄨㄟˋ重ㄓㄨㄥˋ法ㄈㄚˇ故ㄍㄨˋ。不ㄅㄨˋ惜ㄒㄧ身ㄕㄣ命ㄇㄧㄥˋ。何ㄏㄜˊ況ㄎㄨㄤˋ王ㄨㄤˊ位ㄨㄟˋ。城ㄔㄥˊ邑ㄧˋ聚ㄐㄩˋ落ㄌㄨㄛˋ。宮ㄍㄨㄥ殿ㄉㄧㄢˋ園ㄩㄢˊ林ㄌㄧㄣˊ。一ㄧ切ㄑㄧㄝˋ所ㄙㄨㄛˇ有ㄧㄡˇ。及ㄐㄧˊ餘ㄩˊ種ㄓㄨㄥˇ種ㄓㄨㄥˇ難ㄋㄢˊ行ㄒㄧㄥˊ苦ㄎㄨˇ行ㄒㄧㄥˊ。乃ㄋㄞˇ至ㄓˋ樹ㄕㄨˋ下ㄒㄧㄚˋ成ㄔㄥˊ大ㄉㄚˋ菩ㄆㄨˊ提ㄊㄧˊ。示ㄕˋ種ㄓㄨㄥˇ種ㄓㄨㄥˇ神ㄕㄣˊ通ㄊㄨㄥ。起ㄑㄧˇ種ㄓㄨㄥˇ種ㄓㄨㄥˇ變ㄅㄧㄢˋ化ㄏㄨㄚˋ。現ㄒㄧㄢˋ種ㄓㄨㄥˇ種ㄓㄨㄥˇ佛ㄈㄛˊ身ㄕㄣ。處ㄔㄨˋ種ㄓㄨㄥˇ種ㄓㄨㄥˇ眾ㄓㄨㄥˋ會ㄏㄨㄟˋ。或ㄏㄨㄛˋ處ㄔㄨˋ一ㄧ切ㄑㄧㄝˋ諸ㄓㄨ大ㄉㄚˋ菩ㄆㄨˊ薩ㄙㄚˋ眾ㄓㄨㄥˋ會ㄏㄨㄟˋ道ㄉㄠˋ場ㄔㄤˇ。或ㄏㄨㄛˋ處ㄔㄨˋ聲ㄕㄥ聞ㄨㄣˊ及ㄐㄧˊ辟ㄆㄧˋ支ㄓ佛ㄈㄛˊ眾ㄓㄨㄥˋ會ㄏㄨㄟˋ道ㄉㄠˋ場ㄔㄤˇ。或ㄏㄨㄛˋ處ㄔㄨˋ轉ㄓㄨㄢˇ輪ㄌㄨㄣˊ聖ㄕㄥˋ王ㄨㄤˊ小ㄒㄧㄠˇ王ㄨㄤˊ眷ㄐㄩㄢˋ屬ㄕㄨˇ眾ㄓㄨㄥˋ會ㄏㄨㄟˋ道ㄉㄠˋ場ㄔㄤˇ。或ㄏㄨㄛˋ處ㄔㄨˋ剎ㄔㄚˋ利ㄌㄧˋ及ㄐㄧˊ婆ㄆㄛˊ羅ㄌㄨㄛˊ門ㄇㄣˊ長ㄓㄤˇ者ㄓㄜˇ居ㄐㄩ士ㄕˋ眾ㄓㄨㄥˋ會ㄏㄨㄟˋ道ㄉㄠˋ場ㄔㄤˇ。乃ㄋㄞˇ至ㄓˋ或ㄏㄨㄛˋ處ㄔㄨˋ天ㄊㄧㄢ龍ㄌㄨㄥˊ八ㄅㄚ部ㄅㄨˋ人ㄖㄣˊ非ㄈㄟ人ㄖㄣˊ等ㄉㄥˇ眾ㄓㄨㄥˋ會ㄏㄨㄟˋ道ㄉㄠˋ場ㄔㄤˇ。處ㄔㄨˋ於ㄩˊ如ㄖㄨˊ是ㄕˋ種ㄓㄨㄥˇ種ㄓㄨㄥˇ眾ㄓㄨㄥˋ會ㄏㄨㄟˋ。以ㄧˇ圓ㄩㄢˊ滿ㄇㄢˇ音ㄧㄣ。如ㄖㄨˊ大ㄉㄚˋ雷ㄌㄟˊ震ㄓㄣˋ。隨ㄙㄨㄟˊ其ㄑㄧˊ樂ㄧㄠˋ欲ㄩˋ。成ㄔㄥˊ熟ㄕㄨˊ眾ㄓㄨㄥˋ生ㄕㄥ。乃ㄋㄞˇ至ㄓˋ示ㄕˋ現ㄒㄧㄢˋ入ㄖㄨˋ於ㄩˊ涅ㄋㄧㄝˋ槃ㄆㄢˊ。如ㄖㄨˊ是ㄕˋ一ㄧ切ㄑㄧㄝˋ我ㄨㄛˇ皆ㄐㄧㄝ隨ㄙㄨㄟˊ學ㄒㄩㄝˊ。如ㄖㄨˊ今ㄐㄧㄣ世ㄕˋ尊ㄗㄨㄣ毗ㄆㄧˊ盧ㄌㄨˊ遮ㄓㄜ那ㄋㄚˋ。如ㄖㄨˊ是ㄕˋ盡ㄐㄧㄣˋ法ㄈㄚˇ界ㄐㄧㄝˋ虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ。十ㄕˊ方ㄈㄤ三ㄙㄢ世ㄕˋ一ㄧ切ㄑㄧㄝˋ佛ㄈㄛˊ剎ㄔㄚˋ所ㄙㄨㄛˇ有ㄧㄡˇ塵ㄔㄣˊ中ㄓㄨㄥ一ㄧ切ㄑㄧㄝˋ如ㄖㄨˊ來ㄌㄞˊ。皆ㄐㄧㄝ亦ㄧˋ如ㄖㄨˊ是ㄕˋ。於ㄩˊ念ㄋㄧㄢˋ念ㄋㄧㄢˋ中ㄓㄨㄥ。我ㄨㄛˇ皆ㄐㄧㄝ隨ㄙㄨㄟˊ學ㄒㄩㄝˊ。如ㄖㄨˊ是ㄕˋ虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ界ㄐㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ業ㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ煩ㄈㄢˊ惱ㄋㄠˇ盡ㄐㄧㄣˋ。我ㄨㄛˇ此ㄘˇ隨ㄙㄨㄟˊ學ㄒㄩㄝˊ無ㄨˊ有ㄧㄡˇ窮ㄑㄩㄥˊ盡ㄐㄧㄣˋ。念ㄋㄧㄢˋ念ㄋㄧㄢˋ相ㄒㄧㄤ續ㄒㄩˋ。無ㄨˊ有ㄧㄡˇ間ㄐㄧㄢ斷ㄉㄨㄢˋ。身ㄕㄣ語ㄩˇ意ㄧˋ業ㄧㄝˋ。無ㄨˊ有ㄧㄡˇ疲ㄆㄧˊ厭ㄧㄢˋ。\n復ㄈㄨˋ次ㄘˋ善ㄕㄢˋ男ㄋㄢˊ子˙ㄗ。言ㄧㄢˊ恆ㄏㄥˊ順ㄕㄨㄣˋ眾ㄓㄨㄥˋ生ㄕㄥ者ㄓㄜˇ。謂ㄨㄟˋ盡ㄐㄧㄣˋ法ㄈㄚˇ界ㄐㄧㄝˋ虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ。十ㄕˊ方ㄈㄤ剎ㄔㄚˋ海ㄏㄞˇ所ㄙㄨㄛˇ有ㄧㄡˇ眾ㄓㄨㄥˋ生ㄕㄥ。種ㄓㄨㄥˇ種ㄓㄨㄥˇ差ㄔㄚ別ㄅㄧㄝˊ。所ㄙㄨㄛˇ謂ㄨㄟˋ卵ㄌㄨㄢˇ生ㄕㄥ胎ㄊㄞ生ㄕㄥ濕ㄕ生ㄕㄥ化ㄏㄨㄚˋ生ㄕㄥ。或ㄏㄨㄛˋ有ㄧㄡˇ依ㄧ於ㄩˊ地ㄉㄧˋ水ㄕㄨㄟˇ火ㄏㄨㄛˇ風ㄈㄥ而ㄦˊ生ㄕㄥ住ㄓㄨˋ者ㄓㄜˇ。或ㄏㄨㄛˋ有ㄧㄡˇ依ㄧ空ㄎㄨㄥ及ㄐㄧˊ諸ㄓㄨ卉ㄏㄨㄟˋ木ㄇㄨˋ而ㄦˊ生ㄕㄥ住ㄓㄨˋ者ㄓㄜˇ。種ㄓㄨㄥˇ種ㄓㄨㄥˇ生ㄕㄥ類ㄌㄟˋ。種ㄓㄨㄥˇ種ㄓㄨㄥˇ色ㄙㄜˋ身ㄕㄣ。種ㄓㄨㄥˇ種ㄓㄨㄥˇ形ㄒㄧㄥˊ狀ㄓㄨㄤˋ。種ㄓㄨㄥˇ種ㄓㄨㄥˇ相ㄒㄧㄤˋ貌ㄇㄠˋ。種ㄓㄨㄥˇ種ㄓㄨㄥˇ壽ㄕㄡˋ量ㄌㄧㄤˋ。種ㄓㄨㄥˇ種ㄓㄨㄥˇ族ㄗㄨˊ類ㄌㄟˋ。種ㄓㄨㄥˇ種ㄓㄨㄥˇ名ㄇㄧㄥˊ號ㄏㄠˋ。種ㄓㄨㄥˇ種ㄓㄨㄥˇ心ㄒㄧㄣ性ㄒㄧㄥˋ。種ㄓㄨㄥˇ種ㄓㄨㄥˇ知ㄓ見ㄐㄧㄢˋ。種ㄓㄨㄥˇ種ㄓㄨㄥˇ欲ㄩˋ樂ㄌㄜˋ。種ㄓㄨㄥˇ種ㄓㄨㄥˇ意ㄧˋ行ㄒㄧㄥˊ。種ㄓㄨㄥˇ種ㄓㄨㄥˇ威ㄨㄟ儀ㄧˊ。種ㄓㄨㄥˇ種ㄓㄨㄥˇ衣ㄧ服ㄈㄨˊ。種ㄓㄨㄥˇ種ㄓㄨㄥˇ飲ㄧㄣˇ食ㄕˊ。處ㄔㄨˋ於ㄩˊ種ㄓㄨㄥˇ種ㄓㄨㄥˇ村ㄘㄨㄣ營ㄧㄥˊ聚ㄐㄩˋ落ㄌㄨㄛˋ城ㄔㄥˊ邑ㄧˋ宮ㄍㄨㄥ殿ㄉㄧㄢˋ。乃ㄋㄞˇ至ㄓˋ一ㄧ切ㄑㄧㄝˋ天ㄊㄧㄢ龍ㄌㄨㄥˊ八ㄅㄚ部ㄅㄨˋ人ㄖㄣˊ非ㄈㄟ人ㄖㄣˊ等ㄉㄥˇ。無ㄨˊ足ㄗㄨˊ二ㄦˋ足ㄗㄨˊ四ㄙˋ足ㄗㄨˊ多ㄉㄨㄛ足ㄗㄨˊ。有ㄧㄡˇ色ㄙㄜˋ無ㄨˊ色ㄙㄜˋ。有ㄧㄡˇ想ㄒㄧㄤˇ無ㄨˊ想ㄒㄧㄤˇ。非ㄈㄟ有ㄧㄡˇ想ㄒㄧㄤˇ。非ㄈㄟ無ㄨˊ想ㄒㄧㄤˇ。如ㄖㄨˊ是ㄕˋ等ㄉㄥˇ類ㄌㄟˋ。我ㄨㄛˇ皆ㄐㄧㄝ於ㄩˊ彼ㄅㄧˇ隨ㄙㄨㄟˊ順ㄕㄨㄣˋ而ㄦˊ轉ㄓㄨㄢˇ。種ㄓㄨㄥˇ種ㄓㄨㄥˇ承ㄔㄥˊ事ㄕˋ。種ㄓㄨㄥˇ種ㄓㄨㄥˇ供ㄍㄨㄥˋ養ㄧㄤˇ。如ㄖㄨˊ敬ㄐㄧㄥˋ父ㄈㄨˋ母ㄇㄨˇ。如ㄖㄨˊ奉ㄈㄥˋ師ㄕ長ㄓㄤˇ。及ㄐㄧˊ阿ㄚ羅ㄌㄨㄛˊ漢ㄏㄢˋ。乃ㄋㄞˇ至ㄓˋ如ㄖㄨˊ來ㄌㄞˊ。等ㄉㄥˇ無ㄨˊ有ㄧㄡˇ異ㄧˋ。於ㄩˊ諸ㄓㄨ病ㄅㄧㄥˋ苦ㄎㄨˇ。為ㄨㄟˋ作ㄗㄨㄛˋ良ㄌㄧㄤˊ醫ㄧ。於ㄩˊ失ㄕ道ㄉㄠˋ者ㄓㄜˇ。示ㄕˋ其ㄑㄧˊ正ㄓㄥˋ路ㄌㄨˋ。於ㄩˊ闇ㄢˋ夜ㄧㄝˋ中ㄓㄨㄥ。為ㄨㄟˋ作ㄗㄨㄛˋ光ㄍㄨㄤ明ㄇㄧㄥˊ。於ㄩˊ貧ㄆㄧㄣˊ窮ㄑㄩㄥˊ者ㄓㄜˇ。令ㄌㄧㄥˋ得ㄉㄜˊ伏ㄈㄨˊ藏ㄗㄤˋ。菩ㄆㄨˊ薩ㄙㄚˋ如ㄖㄨˊ是ㄕˋ平ㄆㄧㄥˊ等ㄉㄥˇ饒ㄖㄠˊ益ㄧˋ一ㄧ切ㄑㄧㄝˋ眾ㄓㄨㄥˋ生ㄕㄥ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ。菩ㄆㄨˊ薩ㄙㄚˋ若ㄖㄨㄛˋ能ㄋㄥˊ隨ㄙㄨㄟˊ順ㄕㄨㄣˋ眾ㄓㄨㄥˋ生ㄕㄥ。則ㄗㄜˊ為ㄨㄟˊ隨ㄙㄨㄟˊ順ㄕㄨㄣˋ供ㄍㄨㄥˋ養ㄧㄤˇ諸ㄓㄨ佛ㄈㄛˊ。若ㄖㄨㄛˋ於ㄩˊ眾ㄓㄨㄥˋ生ㄕㄥ尊ㄗㄨㄣ重ㄓㄨㄥˋ承ㄔㄥˊ事ㄕˋ。則ㄗㄜˊ為ㄨㄟˊ尊ㄗㄨㄣ重ㄓㄨㄥˋ承ㄔㄥˊ事ㄕˋ如ㄖㄨˊ來ㄌㄞˊ。若ㄖㄨㄛˋ令ㄌㄧㄥˋ眾ㄓㄨㄥˋ生ㄕㄥ生ㄕㄥ歡ㄏㄨㄢ喜ㄒㄧˇ者ㄓㄜˇ。則ㄗㄜˊ令ㄌㄧㄥˋ一ㄧ切ㄑㄧㄝˋ如ㄖㄨˊ來ㄌㄞˊ歡ㄏㄨㄢ喜ㄒㄧˇ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ。諸ㄓㄨ佛ㄈㄛˊ如ㄖㄨˊ來ㄌㄞˊ。以ㄧˇ大ㄉㄚˋ悲ㄅㄟ心ㄒㄧㄣ而ㄦˊ為ㄨㄟˊ體ㄊㄧˇ故ㄍㄨˋ。因ㄧㄣ於ㄩˊ眾ㄓㄨㄥˋ生ㄕㄥ而ㄦˊ起ㄑㄧˇ大ㄉㄚˋ悲ㄅㄟ。因ㄧㄣ於ㄩˊ大ㄉㄚˋ悲ㄅㄟ生ㄕㄥ菩ㄆㄨˊ提ㄊㄧˊ心ㄒㄧㄣ。因ㄧㄣ菩ㄆㄨˊ提ㄊㄧˊ心ㄒㄧㄣ成ㄔㄥˊ等ㄉㄥˇ正ㄓㄥˋ覺ㄐㄩㄝˊ。譬ㄆㄧˋ如ㄖㄨˊ曠ㄎㄨㄤˋ野ㄧㄝˇ沙ㄕㄚ磧ㄑㄧˋ之ㄓ中ㄓㄨㄥ。有ㄧㄡˇ大ㄉㄚˋ樹ㄕㄨˋ王ㄨㄤˊ。若ㄖㄨㄛˋ根ㄍㄣ得ㄉㄜˊ水ㄕㄨㄟˇ。枝ㄓ葉ㄧㄝˋ華ㄏㄨㄚˊ果ㄍㄨㄛˇ。悉ㄒㄧ皆ㄐㄧㄝ繁ㄈㄢˊ茂ㄇㄠˋ。生ㄕㄥ死ㄙˇ曠ㄎㄨㄤˋ野ㄧㄝˇ菩ㄆㄨˊ提ㄊㄧˊ樹ㄕㄨˋ王ㄨㄤˊ。亦ㄧˋ復ㄈㄨˋ如ㄖㄨˊ是ㄕˋ。一ㄧ切ㄑㄧㄝˋ眾ㄓㄨㄥˋ生ㄕㄥ而ㄦˊ為ㄨㄟˊ樹ㄕㄨˋ根ㄍㄣ。諸ㄓㄨ佛ㄈㄛˊ菩ㄆㄨˊ薩ㄙㄚˋ而ㄦˊ為ㄨㄟˊ華ㄏㄨㄚˊ果ㄍㄨㄛˇ。以ㄧˇ大ㄉㄚˋ悲ㄅㄟ水ㄕㄨㄟˇ饒ㄖㄠˊ益ㄧˋ眾ㄓㄨㄥˋ生ㄕㄥ。則ㄗㄜˊ能ㄋㄥˊ成ㄔㄥˊ就ㄐㄧㄡˋ諸ㄓㄨ佛ㄈㄛˊ菩ㄆㄨˊ薩ㄙㄚˋ智ㄓˋ慧ㄏㄨㄟˋ華ㄏㄨㄚˊ果ㄍㄨㄛˇ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ。若ㄖㄨㄛˋ諸ㄓㄨ菩ㄆㄨˊ薩ㄙㄚˋ以ㄧˇ大ㄉㄚˋ悲ㄅㄟ水ㄕㄨㄟˇ饒ㄖㄠˊ益ㄧˋ眾ㄓㄨㄥˋ生ㄕㄥ。則ㄗㄜˊ能ㄋㄥˊ成ㄔㄥˊ就ㄐㄧㄡˋ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ故ㄍㄨˋ。是ㄕˋ故ㄍㄨˋ菩ㄆㄨˊ提ㄊㄧˊ屬ㄕㄨˇ於ㄩˊ眾ㄓㄨㄥˋ生ㄕㄥ。若ㄖㄨㄛˋ無ㄨˊ眾ㄓㄨㄥˋ生ㄕㄥ。一ㄧ切ㄑㄧㄝˋ菩ㄆㄨˊ薩ㄙㄚˋ。終ㄓㄨㄥ不ㄅㄨˋ能ㄋㄥˊ成ㄔㄥˊ無ㄨˊ上ㄕㄤˋ正ㄓㄥˋ覺ㄐㄩㄝˊ。善ㄕㄢˋ男ㄋㄢˊ子˙ㄗ。汝ㄖㄨˇ於ㄩˊ此ㄘˇ義ㄧˋ。應ㄧㄥ如ㄖㄨˊ是ㄕˋ解ㄐㄧㄝˇ。以ㄧˇ於ㄩˊ眾ㄓㄨㄥˋ生ㄕㄥ心ㄒㄧㄣ平ㄆㄧㄥˊ等ㄉㄥˇ故ㄍㄨˋ。則ㄗㄜˊ能ㄋㄥˊ成ㄔㄥˊ就ㄐㄧㄡˋ圓ㄩㄢˊ滿ㄇㄢˇ大ㄉㄚˋ悲ㄅㄟ。以ㄧˇ大ㄉㄚˋ悲ㄅㄟ心ㄒㄧㄣ隨ㄙㄨㄟˊ眾ㄓㄨㄥˋ生ㄕㄥ故ㄍㄨˋ。則ㄗㄜˊ能ㄋㄥˊ成ㄔㄥˊ就ㄐㄧㄡˋ供ㄍㄨㄥˋ養ㄧㄤˇ如ㄖㄨˊ來ㄌㄞˊ。菩ㄆㄨˊ薩ㄙㄚˋ如ㄖㄨˊ是ㄕˋ隨ㄙㄨㄟˊ順ㄕㄨㄣˋ眾ㄓㄨㄥˋ生ㄕㄥ。虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ界ㄐㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ業ㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ煩ㄈㄢˊ惱ㄋㄠˇ盡ㄐㄧㄣˋ。我ㄨㄛˇ此ㄘˇ隨ㄙㄨㄟˊ順ㄕㄨㄣˋ無ㄨˊ有ㄧㄡˇ窮ㄑㄩㄥˊ盡ㄐㄧㄣˋ。念ㄋㄧㄢˋ念ㄋㄧㄢˋ相ㄒㄧㄤ續ㄒㄩˋ。無ㄨˊ有ㄧㄡˇ間ㄐㄧㄢ斷ㄉㄨㄢˋ。身ㄕㄣ語ㄩˇ意ㄧˋ業ㄧㄝˋ。無ㄨˊ有ㄧㄡˇ疲ㄆㄧˊ厭ㄧㄢˋ。\n復ㄈㄨˋ次ㄘˋ善ㄕㄢˋ男ㄋㄢˊ子˙ㄗ。言ㄧㄢˊ普ㄆㄨˇ皆ㄐㄧㄝ迴ㄏㄨㄟˊ向ㄒㄧㄤˋ者ㄓㄜˇ。從ㄘㄨㄥˊ初ㄔㄨ禮ㄌㄧˇ拜ㄅㄞˋ。乃ㄋㄞˇ至ㄓˋ隨ㄙㄨㄟˊ順ㄕㄨㄣˋ。所ㄙㄨㄛˇ有ㄧㄡˇ功ㄍㄨㄥ德ㄉㄜˊ。皆ㄐㄧㄝ悉ㄒㄧ迴ㄏㄨㄟˊ向ㄒㄧㄤˋ盡ㄐㄧㄣˋ法ㄈㄚˇ界ㄐㄧㄝˋ虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ一ㄧ切ㄑㄧㄝˋ眾ㄓㄨㄥˋ生ㄕㄥ。願ㄩㄢˋ令ㄌㄧㄥˋ眾ㄓㄨㄥˋ生ㄕㄥ常ㄔㄤˊ得ㄉㄜˊ安ㄢ樂ㄌㄜˋ。無ㄨˊ諸ㄓㄨ病ㄅㄧㄥˋ苦ㄎㄨˇ。欲ㄩˋ行ㄒㄧㄥˊ惡ㄜˋ法ㄈㄚˇ。皆ㄐㄧㄝ悉ㄒㄧ不ㄅㄨˋ成ㄔㄥˊ。所ㄙㄨㄛˇ修ㄒㄧㄡ善ㄕㄢˋ業ㄧㄝˋ。皆ㄐㄧㄝ速ㄙㄨˋ成ㄔㄥˊ就ㄐㄧㄡˋ。關ㄍㄨㄢ閉ㄅㄧˋ一ㄧ切ㄑㄧㄝˋ諸ㄓㄨ惡ㄜˋ趣ㄑㄩˋ門ㄇㄣˊ。開ㄎㄞ示ㄕˋ人ㄖㄣˊ天ㄊㄧㄢ涅ㄋㄧㄝˋ槃ㄆㄢˊ正ㄓㄥˋ路ㄌㄨˋ。若ㄖㄨㄛˋ諸ㄓㄨ眾ㄓㄨㄥˋ生ㄕㄥ。因ㄧㄣ其ㄑㄧˊ積ㄐㄧ集ㄐㄧˊ諸ㄓㄨ惡ㄜˋ業ㄧㄝˋ故ㄍㄨˋ。所ㄙㄨㄛˇ感ㄍㄢˇ一ㄧ切ㄑㄧㄝˋ極ㄐㄧˊ重ㄓㄨㄥˋ苦ㄎㄨˇ果ㄍㄨㄛˇ。我ㄨㄛˇ皆ㄐㄧㄝ代ㄉㄞˋ受ㄕㄡˋ。令ㄌㄧㄥˋ彼ㄅㄧˇ眾ㄓㄨㄥˋ生ㄕㄥ。悉ㄒㄧ得ㄉㄜˊ解ㄐㄧㄝˇ脫ㄊㄨㄛ。究ㄐㄧㄡˋ竟ㄐㄧㄥˋ成ㄔㄥˊ就ㄐㄧㄡˋ無ㄨˊ上ㄕㄤˋ菩ㄆㄨˊ提ㄊㄧˊ。菩ㄆㄨˊ薩ㄙㄚˋ如ㄖㄨˊ是ㄕˋ所ㄙㄨㄛˇ修ㄒㄧㄡ迴ㄏㄨㄟˊ向ㄒㄧㄤˋ。虛ㄒㄩ空ㄎㄨㄥ界ㄐㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ界ㄐㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ業ㄧㄝˋ盡ㄐㄧㄣˋ。眾ㄓㄨㄥˋ生ㄕㄥ煩ㄈㄢˊ惱ㄋㄠˇ盡ㄐㄧㄣˋ。我ㄨㄛˇ此ㄘˇ迴ㄏㄨㄟˊ向ㄒㄧㄤˋ無ㄨˊ有ㄧㄡˇ窮ㄑㄩㄥˊ盡ㄐㄧㄣˋ。念ㄋㄧㄢˋ念ㄋㄧㄢˋ相ㄒㄧㄤ續ㄒㄩˋ。無ㄨˊ有ㄧㄡˇ間ㄐㄧㄢ斷ㄉㄨㄢˋ。身ㄕㄣ語ㄩˇ意ㄧˋ業ㄧㄝˋ。無ㄨˊ有ㄧㄡˇ疲ㄆㄧˊ厭ㄧㄢˋ。\n善ㄕㄢˋ男ㄋㄢˊ子˙ㄗ。是ㄕˋ為ㄨㄟˊ菩ㄆㄨˊ薩ㄙㄚˋ摩ㄇㄛˊ訶ㄏㄜ薩ㄙㄚˋ十ㄕˊ種ㄓㄨㄥˇ大ㄉㄚˋ願ㄩㄢˋ。具ㄐㄩˋ足ㄗㄨˊ圓ㄩㄢˊ滿ㄇㄢˇ。若ㄖㄨㄛˋ諸ㄓㄨ菩ㄆㄨˊ薩ㄙㄚˋ於ㄩˊ此ㄘˇ大ㄉㄚˋ願ㄩㄢˋ隨ㄙㄨㄟˊ順ㄕㄨㄣˋ趣ㄑㄩˋ入ㄖㄨˋ。則ㄗㄜˊ能ㄋㄥˊ成ㄔㄥˊ熟ㄕㄨˊ一ㄧ切ㄑㄧㄝˋ眾ㄓㄨㄥˋ生ㄕㄥ。則ㄗㄜˊ能ㄋㄥˊ隨ㄙㄨㄟˊ順ㄕㄨㄣˋ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ。則ㄗㄜˊ能ㄋㄥˊ成ㄔㄥˊ滿ㄇㄢˇ普ㄆㄨˇ賢ㄒㄧㄢˊ菩ㄆㄨˊ薩ㄙㄚˋ諸ㄓㄨ行ㄒㄧㄥˊ願ㄩㄢˋ海ㄏㄞˇ。是ㄕˋ故ㄍㄨˋ善ㄕㄢˋ男ㄋㄢˊ子˙ㄗ。汝ㄖㄨˇ於ㄩˊ此ㄘˇ義ㄧˋ。應ㄧㄥ如ㄖㄨˊ是ㄕˋ知ㄓ。若ㄖㄨㄛˋ有ㄧㄡˇ善ㄕㄢˋ男ㄋㄢˊ子˙ㄗ善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ。以ㄧˇ滿ㄇㄢˇ十ㄕˊ方ㄈㄤ無ㄨˊ量ㄌㄧㄤˋ無ㄨˊ邊ㄅㄧㄢ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ佛ㄈㄛˊ剎ㄔㄚˋ極ㄐㄧˊ微ㄨㄟˊ塵ㄔㄣˊ數ㄕㄨˋ一ㄧ切ㄑㄧㄝˋ世ㄕˋ界ㄐㄧㄝˋ上ㄕㄤˋ妙ㄇㄧㄠˋ七ㄑㄧ寶ㄅㄠˇ。及ㄐㄧˊ諸ㄓㄨ人ㄖㄣˊ天ㄊㄧㄢ最ㄗㄨㄟˋ勝ㄕㄥˋ安ㄢ樂ㄌㄜˋ。布ㄅㄨˋ施ㄕ爾ㄦˇ所ㄙㄨㄛˇ一ㄧ切ㄑㄧㄝˋ世ㄕˋ界ㄐㄧㄝˋ所ㄙㄨㄛˇ有ㄧㄡˇ眾ㄓㄨㄥˋ生ㄕㄥ。供ㄍㄨㄥˋ養ㄧㄤˇ爾ㄦˇ所ㄙㄨㄛˇ一ㄧ切ㄑㄧㄝˋ世ㄕˋ界ㄐㄧㄝˋ諸ㄓㄨ佛ㄈㄛˊ菩ㄆㄨˊ薩ㄙㄚˋ。經ㄐㄧㄥ爾ㄦˇ所ㄙㄨㄛˇ佛ㄈㄛˊ剎ㄔㄚˋ極ㄐㄧˊ微ㄨㄟˊ塵ㄔㄣˊ數ㄕㄨˋ劫ㄐㄧㄝˊ。相ㄒㄧㄤ續ㄒㄩˋ不ㄅㄨˋ斷ㄉㄨㄢˋ。所ㄙㄨㄛˇ得ㄉㄜˊ功ㄍㄨㄥ德ㄉㄜˊ。若ㄖㄨㄛˋ復ㄈㄨˋ有ㄧㄡˇ人ㄖㄣˊ。聞ㄨㄣˊ此ㄘˇ願ㄩㄢˋ王ㄨㄤˊ。一ㄧ經ㄐㄧㄥ於ㄩˊ耳ㄦˇ。所ㄙㄨㄛˇ有ㄧㄡˇ功ㄍㄨㄥ德ㄉㄜˊ。比ㄅㄧˇ前ㄑㄧㄢˊ功ㄍㄨㄥ德ㄉㄜˊ。百ㄅㄞˇ分ㄈㄣˋ不ㄅㄨˋ及ㄐㄧˊ一ㄧ。千ㄑㄧㄢ分ㄈㄣˋ不ㄅㄨˋ及ㄐㄧˊ一ㄧ。乃ㄋㄞˇ至ㄓˋ優ㄧㄡ波ㄅㄛ尼ㄋㄧˊ沙ㄕㄚ陀ㄊㄨㄛˊ分ㄈㄣˋ亦ㄧˋ不ㄅㄨˋ及ㄐㄧˊ一ㄧ。或ㄏㄨㄛˋ復ㄈㄨˋ有ㄧㄡˇ人ㄖㄣˊ。以ㄧˇ深ㄕㄣ信ㄒㄧㄣˋ心ㄒㄧㄣ。於ㄩˊ此ㄘˇ大ㄉㄚˋ願ㄩㄢˋ受ㄕㄡˋ持ㄔˊ讀ㄉㄨˊ誦ㄙㄨㄥˋ。乃ㄋㄞˇ至ㄓˋ書ㄕㄨ寫ㄒㄧㄝˇ一ㄧ四ㄙˋ句ㄐㄩˋ偈ㄐㄧˋ。速ㄙㄨˋ能ㄋㄥˊ除ㄔㄨˊ滅ㄇㄧㄝˋ五ㄨˇ無ㄨˊ間ㄐㄧㄢ業ㄧㄝˋ。所ㄙㄨㄛˇ有ㄧㄡˇ世ㄕˋ間ㄐㄧㄢ身ㄕㄣ心ㄒㄧㄣ等ㄉㄥˇ病ㄅㄧㄥˋ。種ㄓㄨㄥˇ種ㄓㄨㄥˇ苦ㄎㄨˇ惱ㄋㄠˇ。乃ㄋㄞˇ至ㄓˋ佛ㄈㄛˊ剎ㄔㄚˋ極ㄐㄧˊ微ㄨㄟˊ塵ㄔㄣˊ數ㄕㄨˋ一ㄧ切ㄑㄧㄝˋ惡ㄜˋ業ㄧㄝˋ皆ㄐㄧㄝ得ㄉㄜˊ消ㄒㄧㄠ除ㄔㄨˊ。一ㄧ切ㄑㄧㄝˋ魔ㄇㄛˊ軍ㄐㄩㄣ。夜ㄧㄝˋ叉ㄔㄚ羅ㄌㄨㄛˊ剎ㄔㄚˋ。若ㄖㄨㄛˋ鳩ㄐㄧㄡ槃ㄆㄢˊ茶ㄔㄚˊ。若ㄖㄨㄛˋ毗ㄆㄧˊ舍ㄕㄜˋ闍ㄕㄜˊ。若ㄖㄨㄛˋ部ㄅㄨˋ多ㄉㄨㄛ等ㄉㄥˇ。飲ㄧㄣˇ血ㄒㄩㄝˇ啖ㄉㄢˋ肉ㄖㄡˋ諸ㄓㄨ惡ㄜˋ鬼ㄍㄨㄟˇ神ㄕㄣˊ。皆ㄐㄧㄝ悉ㄒㄧ遠ㄩㄢˇ離ㄌㄧˊ。或ㄏㄨㄛˋ時ㄕˊ發ㄈㄚ心ㄒㄧㄣ親ㄑㄧㄣ近ㄐㄧㄣˋ守ㄕㄡˇ護ㄏㄨˋ。是ㄕˋ故ㄍㄨˋ若ㄖㄨㄛˋ人ㄖㄣˊ誦ㄙㄨㄥˋ此ㄘˇ願ㄩㄢˋ者ㄓㄜˇ。行ㄒㄧㄥˊ於ㄩˊ世ㄕˋ間ㄐㄧㄢ。無ㄨˊ有ㄧㄡˇ障ㄓㄤˋ礙ㄞˋ。如ㄖㄨˊ空ㄎㄨㄥ中ㄓㄨㄥ月ㄩㄝˋ。出ㄔㄨ於ㄩˊ雲ㄩㄣˊ翳ㄧˋ。諸ㄓㄨ佛ㄈㄛˊ菩ㄆㄨˊ薩ㄙㄚˋ之ㄓ所ㄙㄨㄛˇ稱ㄔㄥ讚ㄗㄢˋ。一ㄧ切ㄑㄧㄝˋ人ㄖㄣˊ天ㄊㄧㄢ皆ㄐㄧㄝ應ㄧㄥ禮ㄌㄧˇ敬ㄐㄧㄥˋ。一ㄧ切ㄑㄧㄝˋ眾ㄓㄨㄥˋ生ㄕㄥ悉ㄒㄧ應ㄧㄥ供ㄍㄨㄥˋ養ㄧㄤˇ。此ㄘˇ善ㄕㄢˋ男ㄋㄢˊ子˙ㄗ。善ㄕㄢˋ得ㄉㄜˊ人ㄖㄣˊ身ㄕㄣ。圓ㄩㄢˊ滿ㄇㄢˇ普ㄆㄨˇ賢ㄒㄧㄢˊ所ㄙㄨㄛˇ有ㄧㄡˇ功ㄍㄨㄥ德ㄉㄜˊ。不ㄅㄨˋ久ㄐㄧㄡˇ當ㄉㄤ如ㄖㄨˊ普ㄆㄨˇ賢ㄒㄧㄢˊ菩ㄆㄨˊ薩ㄙㄚˋ。速ㄙㄨˋ得ㄉㄜˊ成ㄔㄥˊ就ㄐㄧㄡˋ微ㄨㄟˊ妙ㄇㄧㄠˋ色ㄙㄜˋ身ㄕㄣ。具ㄐㄩˋ三ㄙㄢ十ㄕˊ二ㄦˋ大ㄉㄚˋ丈ㄓㄤˋ夫ㄈㄨ相ㄒㄧㄤˋ。若ㄖㄨㄛˋ生ㄕㄥ人ㄖㄣˊ天ㄊㄧㄢ。所ㄙㄨㄛˇ在ㄗㄞˋ之ㄓ處ㄔㄨˋ。常ㄔㄤˊ居ㄐㄩ勝ㄕㄥˋ族ㄗㄨˊ。悉ㄒㄧ能ㄋㄥˊ破ㄆㄛˋ壞ㄏㄨㄞˋ一ㄧ切ㄑㄧㄝˋ惡ㄜˋ趣ㄑㄩˋ。悉ㄒㄧ能ㄋㄥˊ遠ㄩㄢˇ離ㄌㄧˊ一ㄧ切ㄑㄧㄝˋ惡ㄜˋ友ㄧㄡˇ。悉ㄒㄧ能ㄋㄥˊ制ㄓˋ伏ㄈㄨˊ一ㄧ切ㄑㄧㄝˋ外ㄨㄞˋ道ㄉㄠˋ。悉ㄒㄧ能ㄋㄥˊ解ㄐㄧㄝˇ脫ㄊㄨㄛ一ㄧ切ㄑㄧㄝˋ煩ㄈㄢˊ惱ㄋㄠˇ。如ㄖㄨˊ師ㄕ子˙ㄗ王ㄨㄤˊ。摧ㄘㄨㄟ伏ㄈㄨˊ群ㄑㄩㄣˊ獸ㄕㄡˋ。堪ㄎㄢ受ㄕㄡˋ一ㄧ切ㄑㄧㄝˋ眾ㄓㄨㄥˋ生ㄕㄥ供ㄍㄨㄥˋ養ㄧㄤˇ。又ㄧㄡˋ復ㄈㄨˋ是ㄕˋ人ㄖㄣˊ臨ㄌㄧㄣˊ命ㄇㄧㄥˋ終ㄓㄨㄥ時ㄕˊ。最ㄗㄨㄟˋ後ㄏㄡˋ剎ㄔㄚˋ那ㄋㄚˋ。一ㄧ切ㄑㄧㄝˋ諸ㄓㄨ根ㄍㄣ悉ㄒㄧ皆ㄐㄧㄝ散ㄙㄢˋ壞ㄏㄨㄞˋ。一ㄧ切ㄑㄧㄝˋ親ㄑㄧㄣ屬ㄕㄨˇ悉ㄒㄧ皆ㄐㄧㄝ捨ㄕㄜˇ離ㄌㄧˊ。一ㄧ切ㄑㄧㄝˋ威ㄨㄟ勢ㄕˋ悉ㄒㄧ皆ㄐㄧㄝ退ㄊㄨㄟˋ失ㄕ。輔ㄈㄨˇ相ㄒㄧㄤˋ大ㄉㄚˋ臣ㄔㄣˊ。宮ㄍㄨㄥ城ㄔㄥˊ內ㄋㄟˋ外ㄨㄞˋ。象ㄒㄧㄤˋ馬ㄇㄚˇ車ㄔㄜ乘ㄔㄥˊ。珍ㄓㄣ寶ㄅㄠˇ伏ㄈㄨˊ藏ㄗㄤˋ。如ㄖㄨˊ是ㄕˋ一ㄧ切ㄑㄧㄝˋ無ㄨˊ復ㄈㄨˋ相ㄒㄧㄤ隨ㄙㄨㄟˊ。唯ㄨㄟˊ此ㄘˇ願ㄩㄢˋ王ㄨㄤˊ。不ㄅㄨˋ相ㄒㄧㄤ捨ㄕㄜˇ離ㄌㄧˊ。於ㄩˊ一ㄧ切ㄑㄧㄝˋ時ㄕˊ。引ㄧㄣˇ導ㄉㄠˇ其ㄑㄧˊ前ㄑㄧㄢˊ。一ㄧ剎ㄔㄚˋ那ㄋㄚˋ中ㄓㄨㄥ。即ㄐㄧˊ得ㄉㄜˊ往ㄨㄤˇ生ㄕㄥ極ㄐㄧˊ樂ㄌㄜˋ世ㄕˋ界ㄐㄧㄝˋ。到ㄉㄠˋ已ㄧˇ。即ㄐㄧˊ見ㄐㄧㄢˋ阿ㄚ彌ㄇㄧˊ陀ㄊㄨㄛˊ佛ㄈㄛˊ。文ㄨㄣˊ殊ㄕㄨ師ㄕ利ㄌㄧˋ菩ㄆㄨˊ薩ㄙㄚˋ。普ㄆㄨˇ賢ㄒㄧㄢˊ菩ㄆㄨˊ薩ㄙㄚˋ。觀ㄍㄨㄢ自ㄗˋ在ㄗㄞˋ菩ㄆㄨˊ薩ㄙㄚˋ。彌ㄇㄧˊ勒ㄌㄟˋ菩ㄆㄨˊ薩ㄙㄚˋ等ㄉㄥˇ。此ㄘˇ諸ㄓㄨ菩ㄆㄨˊ薩ㄙㄚˋ。色ㄙㄜˋ相ㄒㄧㄤˋ端ㄉㄨㄢ嚴ㄧㄢˊ。功ㄍㄨㄥ德ㄉㄜˊ具ㄐㄩˋ足ㄗㄨˊ。所ㄙㄨㄛˇ共ㄍㄨㄥˋ圍ㄨㄟˊ繞ㄖㄠˋ。其ㄑㄧˊ人ㄖㄣˊ自ㄗˋ見ㄐㄧㄢˋ生ㄕㄥ蓮ㄌㄧㄢˊ華ㄏㄨㄚ中ㄓㄨㄥ。蒙ㄇㄥˊ佛ㄈㄛˊ授ㄕㄡˋ記ㄐㄧˋ。得ㄉㄜˊ授ㄕㄡˋ記ㄐㄧˋ已ㄧˇ。經ㄐㄧㄥ於ㄩˊ無ㄨˊ數ㄕㄨˋ百ㄅㄞˇ千ㄑㄧㄢ萬ㄨㄢˋ億ㄧˋ那ㄋㄚˋ由ㄧㄡˊ他ㄊㄚ劫ㄐㄧㄝˊ。普ㄆㄨˇ於ㄩˊ十ㄕˊ方ㄈㄤ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ世ㄕˋ界ㄐㄧㄝˋ。以ㄧˇ智ㄓˋ慧ㄏㄨㄟˋ力ㄌㄧˋ。隨ㄙㄨㄟˊ眾ㄓㄨㄥˋ生ㄕㄥ心ㄒㄧㄣ而ㄦˊ為ㄨㄟˊ利ㄌㄧˋ益ㄧˋ。不ㄅㄨˋ久ㄐㄧㄡˇ當ㄉㄤ坐ㄗㄨㄛˋ菩ㄆㄨˊ提ㄊㄧˊ道ㄉㄠˋ場ㄔㄤˇ。降ㄒㄧㄤˊ伏ㄈㄨˊ魔ㄇㄛˊ軍ㄐㄩㄣ。成ㄔㄥˊ等ㄉㄥˇ正ㄓㄥˋ覺ㄐㄩㄝˊ。轉ㄓㄨㄢˇ妙ㄇㄧㄠˋ法ㄈㄚˇ輪ㄌㄨㄣˊ。能ㄋㄥˊ令ㄌㄧㄥˋ佛ㄈㄛˊ剎ㄔㄚˋ極ㄐㄧˊ微ㄨㄟˊ塵ㄔㄣˊ數ㄕㄨˋ世ㄕˋ界ㄐㄧㄝˋ眾ㄓㄨㄥˋ生ㄕㄥ。發ㄈㄚ菩ㄆㄨˊ提ㄊㄧˊ心ㄒㄧㄣ。隨ㄙㄨㄟˊ其ㄑㄧˊ根ㄍㄣ性ㄒㄧㄥˋ。教ㄐㄧㄠˋ化ㄏㄨㄚˋ成ㄔㄥˊ熟ㄕㄨˊ。乃ㄋㄞˇ至ㄓˋ盡ㄐㄧㄣˋ於ㄩˊ未ㄨㄟˋ來ㄌㄞˊ劫ㄐㄧㄝˊ海ㄏㄞˇ。廣ㄍㄨㄤˇ能ㄋㄥˊ利ㄌㄧˋ益ㄧˋ一ㄧ切ㄑㄧㄝˋ眾ㄓㄨㄥˋ生ㄕㄥ。善ㄕㄢˋ男ㄋㄢˊ子˙ㄗ。彼ㄅㄧˇ諸ㄓㄨ眾ㄓㄨㄥˋ生ㄕㄥ。若ㄖㄨㄛˋ聞ㄨㄣˊ若ㄖㄨㄛˋ信ㄒㄧㄣˋ此ㄘˇ大ㄉㄚˋ願ㄩㄢˋ王ㄨㄤˊ。受ㄕㄡˋ持ㄔˊ讀ㄉㄨˊ誦ㄙㄨㄥˋ。廣ㄍㄨㄤˇ為ㄨㄟˋ人ㄖㄣˊ說ㄕㄨㄛ。所ㄙㄨㄛˇ有ㄧㄡˇ功ㄍㄨㄥ德ㄉㄜˊ。除ㄔㄨˊ佛ㄈㄛˊ世ㄕˋ尊ㄗㄨㄣ。餘ㄩˊ無ㄨˊ知ㄓ者ㄓㄜˇ。是ㄕˋ故ㄍㄨˋ汝ㄖㄨˇ等ㄉㄥˇ聞ㄨㄣˊ此ㄘˇ願ㄩㄢˋ王ㄨㄤˊ。莫ㄇㄛˋ生ㄕㄥ疑ㄧˊ念ㄋㄧㄢˋ。應ㄧㄥ當ㄉㄤ諦ㄉㄧˋ受ㄕㄡˋ。受ㄕㄡˋ已ㄧˇ能ㄋㄥˊ讀ㄉㄨˊ。讀ㄉㄨˊ已ㄧˇ能ㄋㄥˊ誦ㄙㄨㄥˋ。誦ㄙㄨㄥˋ已ㄧˇ能ㄋㄥˊ持ㄔˊ。乃ㄋㄞˇ至ㄓˋ書ㄕㄨ寫ㄒㄧㄝˇ。廣ㄍㄨㄤˇ為ㄨㄟˋ人ㄖㄣˊ說ㄕㄨㄛ。是ㄕˋ諸ㄓㄨ人ㄖㄣˊ等ㄉㄥˇ。於ㄩˊ一ㄧ念ㄋㄧㄢˋ中ㄓㄨㄥ。所ㄙㄨㄛˇ有ㄧㄡˇ行ㄒㄧㄥˊ願ㄩㄢˋ。皆ㄐㄧㄝ得ㄉㄜˊ成ㄔㄥˊ就ㄐㄧㄡˋ。所ㄙㄨㄛˇ獲ㄏㄨㄛˋ福ㄈㄨˊ聚ㄐㄩˋ。無ㄨˊ量ㄌㄧㄤˋ無ㄨˊ邊ㄅㄧㄢ。能ㄋㄥˊ於ㄩˊ煩ㄈㄢˊ惱ㄋㄠˇ大ㄉㄚˋ苦ㄎㄨˇ海ㄏㄞˇ中ㄓㄨㄥ。拔ㄅㄚˊ濟ㄐㄧˋ眾ㄓㄨㄥˋ生ㄕㄥ。令ㄌㄧㄥˋ其ㄑㄧˊ出ㄔㄨ離ㄌㄧˊ。皆ㄐㄧㄝ得ㄉㄜˊ往ㄨㄤˇ生ㄕㄥ阿ㄚ彌ㄇㄧˊ陀ㄊㄨㄛˊ佛ㄈㄛˊ極ㄐㄧˊ樂ㄌㄜˋ世ㄕˋ界ㄐㄧㄝˋ。爾ㄦˇ時ㄕˊ普ㄆㄨˇ賢ㄒㄧㄢˊ菩ㄆㄨˊ薩ㄙㄚˋ摩ㄇㄛˊ訶ㄏㄜ薩ㄙㄚˋ。欲ㄩˋ重ㄓㄨㄥˊ宣ㄒㄩㄢ此ㄘˇ義ㄧˋ。普ㄆㄨˇ觀ㄍㄨㄢ十ㄕˊ方ㄈㄤ而ㄦˊ說ㄕㄨㄛ偈ㄐㄧˋ言ㄧㄢˊ。\n普ㄆㄨˇ賢ㄒㄧㄢˊ行ㄒㄧㄥˊ願ㄩㄢˋ品ㄆㄧㄣˇ偈ㄐㄧˋ頌ㄙㄨㄥˋ\n所ㄙㄨㄛˇ有ㄧㄡˇ十ㄕˊ方ㄈㄤ世ㄕˋ界ㄐㄧㄝˋ中ㄓㄨㄥ，三ㄙㄢ世ㄕˋ一ㄧ切ㄑㄧㄝˋ人ㄖㄣˊ師ㄕ子˙ㄗ。\n我ㄨㄛˇ以ㄧˇ清ㄑㄧㄥ淨ㄐㄧㄥˋ身ㄕㄣ語ㄩˇ意ㄧˋ，一ㄧ切ㄑㄧㄝˋ遍ㄅㄧㄢˋ禮ㄌㄧˇ盡ㄐㄧㄣˋ無ㄨˊ餘ㄩˊ。\n普ㄆㄨˇ賢ㄒㄧㄢˊ行ㄒㄧㄥˊ願ㄩㄢˋ威ㄨㄟ神ㄕㄣˊ力ㄌㄧˋ，普ㄆㄨˇ現ㄒㄧㄢˋ一ㄧ切ㄑㄧㄝˋ如ㄖㄨˊ來ㄌㄞˊ前ㄑㄧㄢˊ。\n一ㄧ身ㄕㄣ復ㄈㄨˋ現ㄒㄧㄢˋ剎ㄔㄚˋ塵ㄔㄣˊ身ㄕㄣ，一ㄧ一ㄧ遍ㄅㄧㄢˋ禮ㄌㄧˇ剎ㄔㄚˋ塵ㄔㄣˊ佛ㄈㄛˊ。\n於ㄩˊ一ㄧ塵ㄔㄣˊ中ㄓㄨㄥ塵ㄔㄣˊ數ㄕㄨˋ佛ㄈㄛˊ，各ㄍㄜˋ處ㄔㄨˋ菩ㄆㄨˊ薩ㄙㄚˋ眾ㄓㄨㄥˋ會ㄏㄨㄟˋ中ㄓㄨㄥ。\n無ㄨˊ盡ㄐㄧㄣˋ法ㄈㄚˇ界ㄐㄧㄝˋ塵ㄔㄣˊ亦ㄧˋ然ㄖㄢˊ，深ㄕㄣ信ㄒㄧㄣˋ諸ㄓㄨ佛ㄈㄛˊ皆ㄐㄧㄝ充ㄔㄨㄥ滿ㄇㄢˇ。\n各ㄍㄜˋ以ㄧˇ一ㄧ切ㄑㄧㄝˋ音ㄧㄣ聲ㄕㄥ海ㄏㄞˇ，普ㄆㄨˇ出ㄔㄨ無ㄨˊ盡ㄐㄧㄣˋ妙ㄇㄧㄠˋ言ㄧㄢˊ辭ㄘˊ。\n盡ㄐㄧㄣˋ於ㄩˊ未ㄨㄟˋ來ㄌㄞˊ一ㄧ切ㄑㄧㄝˋ劫ㄐㄧㄝˊ，讚ㄗㄢˋ佛ㄈㄛˊ甚ㄕㄣˋ深ㄕㄣ功ㄍㄨㄥ德ㄉㄜˊ海ㄏㄞˇ。\n以ㄧˇ諸ㄓㄨ最ㄗㄨㄟˋ勝ㄕㄥˋ妙ㄇㄧㄠˋ華ㄏㄨㄚˊ鬘ㄇㄢˊ，伎ㄐㄧˋ樂ㄩㄝˋ塗ㄊㄨˊ香ㄒㄧㄤ及ㄐㄧˊ傘ㄙㄢˇ蓋ㄍㄞˋ。\n如ㄖㄨˊ是ㄕˋ最ㄗㄨㄟˋ勝ㄕㄥˋ莊ㄓㄨㄤ嚴ㄧㄢˊ具ㄐㄩˋ，我ㄨㄛˇ以ㄧˇ供ㄍㄨㄥˋ養ㄧㄤˇ諸ㄓㄨ如ㄖㄨˊ來ㄌㄞˊ。\n最ㄗㄨㄟˋ勝ㄕㄥˋ衣ㄧ服ㄈㄨˊ最ㄗㄨㄟˋ勝ㄕㄥˋ香ㄒㄧㄤ，末ㄇㄛˋ香ㄒㄧㄤ燒ㄕㄠ香ㄒㄧㄤ與ㄩˇ燈ㄉㄥ燭ㄓㄨˊ。\n一ㄧ一ㄧ皆ㄐㄧㄝ如ㄖㄨˊ妙ㄇㄧㄠˋ高ㄍㄠ聚ㄐㄩˋ，我ㄨㄛˇ悉ㄒㄧ供ㄍㄨㄥˋ養ㄧㄤˇ諸ㄓㄨ如ㄖㄨˊ來ㄌㄞˊ。\n我ㄨㄛˇ以ㄧˇ廣ㄍㄨㄤˇ大ㄉㄚˋ勝ㄕㄥˋ解ㄐㄧㄝˇ心ㄒㄧㄣ，深ㄕㄣ信ㄒㄧㄣˋ一ㄧ切ㄑㄧㄝˋ三ㄙㄢ世ㄕˋ佛ㄈㄛˊ。\n悉ㄒㄧ以ㄧˇ普ㄆㄨˇ賢ㄒㄧㄢˊ行ㄒㄧㄥˊ願ㄩㄢˋ力ㄌㄧˋ，普ㄆㄨˇ遍ㄅㄧㄢˋ供ㄍㄨㄥˋ養ㄧㄤˇ諸ㄓㄨ如ㄖㄨˊ來ㄌㄞˊ。\n我ㄨㄛˇ昔ㄒㄧˊ所ㄙㄨㄛˇ造ㄗㄠˋ諸ㄓㄨ惡ㄜˋ業ㄧㄝˋ，皆ㄐㄧㄝ由ㄧㄡˊ無ㄨˊ始ㄕˇ貪ㄊㄢ瞋ㄔㄣ癡ㄔ。\n從ㄘㄨㄥˊ身ㄕㄣ語ㄩˇ意ㄧˋ之ㄓ所ㄙㄨㄛˇ生ㄕㄥ，一ㄧ切ㄑㄧㄝˋ我ㄨㄛˇ今ㄐㄧㄣ皆ㄐㄧㄝ懺ㄔㄢˋ悔ㄏㄨㄟˇ。\n十ㄕˊ方ㄈㄤ一ㄧ切ㄑㄧㄝˋ諸ㄓㄨ眾ㄓㄨㄥˋ生ㄕㄥ，二ㄦˋ乘ㄔㄥˊ有ㄧㄡˇ學ㄒㄩㄝˊ及ㄐㄧˊ無ㄨˊ學ㄒㄩㄝˊ。\n一ㄧ切ㄑㄧㄝˋ如ㄖㄨˊ來ㄌㄞˊ與ㄩˇ菩ㄆㄨˊ薩ㄙㄚˋ，所ㄙㄨㄛˇ有ㄧㄡˇ功ㄍㄨㄥ德ㄉㄜˊ皆ㄐㄧㄝ隨ㄙㄨㄟˊ喜ㄒㄧˇ。\n十ㄕˊ方ㄈㄤ所ㄙㄨㄛˇ有ㄧㄡˇ世ㄕˋ間ㄐㄧㄢ燈ㄉㄥ，最ㄗㄨㄟˋ初ㄔㄨ成ㄔㄥˊ就ㄐㄧㄡˋ菩ㄆㄨˊ提ㄊㄧˊ者ㄓㄜˇ。\n我ㄨㄛˇ今ㄐㄧㄣ一ㄧ切ㄑㄧㄝˋ皆ㄐㄧㄝ勸ㄑㄩㄢˋ請ㄑㄧㄥˇ，轉ㄓㄨㄢˇ於ㄩˊ無ㄨˊ上ㄕㄤˋ妙ㄇㄧㄠˋ法ㄈㄚˇ輪ㄌㄨㄣˊ。\n諸ㄓㄨ佛ㄈㄛˊ若ㄖㄨㄛˋ欲ㄩˋ示ㄕˋ涅ㄋㄧㄝˋ槃ㄆㄢˊ，我ㄨㄛˇ悉ㄒㄧ至ㄓˋ誠ㄔㄥˊ而ㄦˊ勸ㄑㄩㄢˋ請ㄑㄧㄥˇ。\n唯ㄨㄟˊ願ㄩㄢˋ久ㄐㄧㄡˇ住ㄓㄨˋ剎ㄔㄚˋ塵ㄔㄣˊ劫ㄐㄧㄝˊ，利ㄌㄧˋ樂ㄌㄜˋ一ㄧ切ㄑㄧㄝˋ諸ㄓㄨ眾ㄓㄨㄥˋ生ㄕㄥ。\n所ㄙㄨㄛˇ有ㄧㄡˇ ㄧㄢˇ菩ㄆㄨˊ提ㄊㄧˊ行ㄒㄧㄥˊ。\n普ㄆㄨˇ盡ㄐㄧㄣˋ十ㄕˊ方ㄈㄤ諸ㄓㄨ剎ㄔㄚˋ海ㄏㄞˇ，一ㄧ一ㄧ毛ㄇㄠˊ端ㄉㄨㄢ三ㄙㄢ世ㄕˋ海ㄏㄞˇ。\n佛ㄈㄛˊ海ㄏㄞˇ及ㄐㄧˊ與ㄩˇ國ㄍㄨㄛˊ土ㄊㄨˇ海ㄏㄞˇ，我ㄨㄛˇ遍ㄅㄧㄢˋ修ㄒㄧㄡ行ㄒㄧㄥˊ經ㄐㄧㄥ劫ㄐㄧㄝˊ海ㄏㄞˇ。\n一ㄧ切ㄑㄧㄝˋ如ㄖㄨˊ來ㄌㄞˊ語ㄩˇ清ㄑㄧㄥ淨ㄐㄧㄥˋ，一ㄧ言ㄧㄢˊ具ㄐㄩˋ眾ㄓㄨㄥˋ音ㄧㄣ聲ㄕㄥ海ㄏㄞˇ。\n隨ㄙㄨㄟˊ諸ㄓㄨ眾ㄓㄨㄥˋ生ㄕㄥ意ㄧˋ樂ㄧㄠˋ音ㄧㄣ，一ㄧ一ㄧ流ㄌㄧㄡˊ佛ㄈㄛˊ辯ㄅㄧㄢˋ才ㄘㄞˊ海ㄏㄞˇ。\n三ㄙㄢ世ㄕˋ一ㄧ切ㄑㄧㄝˋ諸ㄓㄨ如ㄖㄨˊ來ㄌㄞˊ，於ㄩˊ彼ㄅㄧˇ無ㄨˊ盡ㄐㄧㄣˋ語ㄩˇ言ㄧㄢˊ海ㄏㄞˇ。\n恆ㄏㄥˊ轉ㄓㄨㄢˇ理ㄌㄧˇ趣ㄑㄩˋ妙ㄇㄧㄠˋ法ㄈㄚˇ輪ㄌㄨㄣˊ，我ㄨㄛˇ深ㄕㄣ智ㄓˋ力ㄌㄧˋ普ㄆㄨˇ能ㄋㄥˊ入ㄖㄨˋ。\n我ㄨㄛˇ能ㄋㄥˊ深ㄕㄣ入ㄖㄨˋ於ㄩˊ未ㄨㄟˋ來ㄌㄞˊ，盡ㄐㄧㄣˋ一ㄧ切ㄑㄧㄝˋ劫ㄐㄧㄝˊ為ㄨㄟˊ一ㄧ念ㄋㄧㄢˋ。\n三ㄙㄢ世ㄕˋ所ㄙㄨㄛˇ有ㄧㄡˇ一ㄧ切ㄑㄧㄝˋ劫ㄐㄧㄝˊ，為ㄨㄟˊ一ㄧ念ㄋㄧㄢˋ際ㄐㄧˋ我ㄨㄛˇ皆ㄐㄧㄝ入ㄖㄨˋ。\n我ㄨㄛˇ於ㄩˊ一ㄧ念ㄋㄧㄢˋ見ㄐㄧㄢˋ三ㄙㄢ世ㄕˋ，所ㄙㄨㄛˇ有ㄧㄡˇ一ㄧ切ㄑㄧㄝˋ人ㄖㄣˊ師ㄕ子˙ㄗ。\n亦ㄧˋ常ㄔㄤˊ入ㄖㄨˋ佛ㄈㄛˊ境ㄐㄧㄥˋ界ㄐㄧㄝˋ中ㄓㄨㄥ，如ㄖㄨˊ幻ㄏㄨㄢˋ解ㄐㄧㄝˇ脫ㄊㄨㄛ及ㄐㄧˊ威ㄨㄟ力ㄌㄧˋ。\n於ㄩˊ一ㄧ毛ㄇㄠˊ端ㄉㄨㄢ極ㄐㄧˊ微ㄨㄟˊ中ㄓㄨㄥ，出ㄔㄨ現ㄒㄧㄢˋ三ㄙㄢ世ㄕˋ莊ㄓㄨㄤ嚴ㄧㄢˊ剎ㄔㄚˋ。\n十ㄕˊ方ㄈㄤ塵ㄔㄣˊ剎ㄔㄚˋ諸ㄓㄨ毛ㄇㄠˊ端ㄉㄨㄢ，我ㄨㄛˇ皆ㄐㄧㄝ深ㄕㄣ入ㄖㄨˋ而ㄦˊ嚴ㄧㄢˊ淨ㄐㄧㄥˋ。\n所ㄙㄨㄛˇ有ㄧㄡˇ未ㄨㄟˋ來ㄌㄞˊ照ㄓㄠˋ世ㄕˋ燈ㄉㄥ，成ㄔㄥˊ道ㄉㄠˋ轉ㄓㄨㄢˇ法ㄈㄚˇ悟ㄨˋ群ㄑㄩㄣˊ有ㄧㄡˇ。\n究ㄐㄧㄡˋ竟ㄐㄧㄥˋ佛ㄈㄛˊ事ㄕˋ示ㄕˋ涅ㄋㄧㄝˋ槃ㄆㄢˊ，我ㄨㄛˇ皆ㄐㄧㄝ往ㄨㄤˇ詣ㄧˋ而ㄦˊ親ㄑㄧㄣ近ㄐㄧㄣˋ。\n速ㄙㄨˋ疾ㄐㄧˊ周ㄓㄡ遍ㄅㄧㄢˋ神ㄕㄣˊ通ㄊㄨㄥ力ㄌㄧˋ，普ㄆㄨˇ門ㄇㄣˊ遍ㄅㄧㄢˋ入ㄖㄨˋ大ㄉㄚˋ乘ㄕㄥˋ力ㄌㄧˋ。\n智ㄓˋ行ㄒㄧㄥˊ普ㄆㄨˇ修ㄒㄧㄡ功ㄍㄨㄥ德ㄉㄜˊ力ㄌㄧˋ，威ㄨㄟ神ㄕㄣˊ普ㄆㄨˇ覆ㄈㄨˋ大ㄉㄚˋ慈ㄘˊ力ㄌㄧˋ。\n遍ㄅㄧㄢˋ淨ㄐㄧㄥˋ莊ㄓㄨㄤ嚴ㄧㄢˊ勝ㄕㄥˋ福ㄈㄨˊ力ㄌㄧˋ，無ㄨˊ著ㄓㄨㄛˊ無ㄨˊ依ㄧ智ㄓˋ慧ㄏㄨㄟˋ力ㄌㄧˋ。\n定ㄉㄧㄥˋ慧ㄏㄨㄟˋ方ㄈㄤ便ㄅㄧㄢˋ威ㄨㄟ神ㄕㄣˊ力ㄌㄧˋ，普ㄆㄨˇ能ㄋㄥˊ積ㄐㄧ集ㄐㄧˊ菩ㄆㄨˊ提ㄊㄧˊ力ㄌㄧˋ。\n清ㄑㄧㄥ淨ㄐㄧㄥˋ一ㄧ切ㄑㄧㄝˋ善ㄕㄢˋ業ㄧㄝˋ力ㄌㄧˋ，摧ㄘㄨㄟ滅ㄇㄧㄝˋ一ㄧ切ㄑㄧㄝˋ煩ㄈㄢˊ惱ㄋㄠˇ力ㄌㄧˋ。\n降ㄒㄧㄤˊ伏ㄈㄨˊ一ㄧ切ㄑㄧㄝˋ諸ㄓㄨ魔ㄇㄛˊ力ㄌㄧˋ，圓ㄩㄢˊ滿ㄇㄢˇ普ㄆㄨˇ賢ㄒㄧㄢˊ諸ㄓㄨ行ㄒㄧㄥˊ力ㄌㄧˋ。\n普ㄆㄨˇ能ㄋㄥˊ嚴ㄧㄢˊ淨ㄐㄧㄥˋ諸ㄓㄨ剎ㄔㄚˋ海ㄏㄞˇ，解ㄐㄧㄝˇ脫ㄊㄨㄛ一ㄧ切ㄑㄧㄝˋ眾ㄓㄨㄥˋ生ㄕㄥ海ㄏㄞˇ。\n善ㄕㄢˋ能ㄋㄥˊ分ㄈㄣ別ㄅㄧㄝˊ諸ㄓㄨ法ㄈㄚˇ海ㄏㄞˇ，能ㄋㄥˊ甚ㄕㄣˋ深ㄕㄣ入ㄖㄨˋ智ㄓˋ慧ㄏㄨㄟˋ海ㄏㄞˇ。\n普ㄆㄨˇ能ㄋㄥˊ清ㄑㄧㄥ淨ㄐㄧㄥˋ諸ㄓㄨ行ㄒㄧㄥˊ海ㄏㄞˇ，圓ㄩㄢˊ滿ㄇㄢˇ一ㄧ切ㄑㄧㄝˋ諸ㄓㄨ願ㄩㄢˋ海ㄏㄞˇ。\n親ㄑㄧㄣ近ㄐㄧㄣˋ供ㄍㄨㄥˋ養ㄧㄤˇ諸ㄓㄨ佛ㄈㄛˊ海ㄏㄞˇ，修ㄒㄧㄡ行ㄒㄧㄥˊ無ㄨˊ倦ㄐㄩㄢˋ經ㄐㄧㄥ劫ㄐㄧㄝˊ海ㄏㄞˇ。\n三ㄙㄢ世ㄕˋ一ㄧ切ㄑㄧㄝˋ諸ㄓㄨ如ㄖㄨˊ來ㄌㄞˊ，最ㄗㄨㄟˋ勝ㄕㄥˋ菩ㄆㄨˊ提ㄊㄧˊ諸ㄓㄨ行ㄒㄧㄥˊ願ㄩㄢˋ。\n我ㄨㄛˇ皆ㄐㄧㄝ供ㄍㄨㄥˋ養ㄧㄤˇ圓ㄩㄢˊ滿ㄇㄢˇ修ㄒㄧㄡ，以ㄧˇ普ㄆㄨˇ賢ㄒㄧㄢˊ行ㄒㄧㄥˊ悟ㄨˋ菩ㄆㄨˊ提ㄊㄧˊ。\n一ㄧ切ㄑㄧㄝˋ如ㄖㄨˊ來ㄌㄞˊ有ㄧㄡˇ長ㄓㄤˇ子˙ㄗ，彼ㄅㄧˇ名ㄇㄧㄥˊ號ㄏㄠˋ曰ㄩㄝ普ㄆㄨˇ賢ㄒㄧㄢˊ尊ㄗㄨㄣ。\n我ㄨㄛˇ今ㄐㄧㄣ迴ㄏㄨㄟˊ向ㄒㄧㄤˋ諸ㄓㄨ善ㄕㄢˋ根ㄍㄣ，願ㄩㄢˋ諸ㄓㄨ智ㄓˋ行ㄒㄧㄥˊ悉ㄒㄧ同ㄊㄨㄥˊ彼ㄅㄧˇ。\n願ㄩㄢˋ身ㄕㄣ口ㄎㄡˇ意ㄧˋ恆ㄏㄥˊ清ㄑㄧㄥ淨ㄐㄧㄥˋ，諸ㄓㄨ行ㄒㄧㄥˊ剎ㄔㄚˋ土ㄊㄨˇ亦ㄧˋ復ㄈㄨˋ然ㄖㄢˊ。\n如ㄖㄨˊ是ㄕˋ智ㄓˋ慧ㄏㄨㄟˋ號ㄏㄠˋ普ㄆㄨˇ賢ㄒㄧㄢˊ，願ㄩㄢˋ我ㄨㄛˇ與ㄩˇ彼ㄅㄧˇ皆ㄐㄧㄝ同ㄊㄨㄥˊ等ㄉㄥˇ。\n我ㄨㄛˇ為ㄨㄟˋ遍ㄅㄧㄢˋ淨ㄐㄧㄥˋ普ㄆㄨˇ賢ㄒㄧㄢˊ行ㄒㄧㄥˊ，文ㄨㄣˊ殊ㄕㄨ師ㄕ利ㄌㄧˋ諸ㄓㄨ大ㄉㄚˋ願ㄩㄢˋ。\n滿ㄇㄢˇ彼ㄅㄧˇ事ㄕˋ業ㄧㄝˋ盡ㄐㄧㄣˋ無ㄨˊ餘ㄩˊ，未ㄨㄟˋ來ㄌㄞˊ際ㄐㄧˋ劫ㄐㄧㄝˊ恆ㄏㄥˊ無ㄨˊ倦ㄐㄩㄢˋ。\n我ㄨㄛˇ所ㄙㄨㄛˇ修ㄒㄧㄡ行ㄒㄧㄥˊ無ㄨˊ有ㄧㄡˇ量ㄌㄧㄤˋ，獲ㄏㄨㄛˋ得ㄉㄜˊ無ㄨˊ量ㄌㄧㄤˋ諸ㄓㄨ功ㄍㄨㄥ德ㄉㄜˊ。\n安ㄢ住ㄓㄨˋ無ㄨˊ量ㄌㄧㄤˋ諸ㄓㄨ行ㄒㄧㄥˊ中ㄓㄨㄥ，了ㄌㄧㄠˇ達ㄉㄚˊ一ㄧ切ㄑㄧㄝˋ神ㄕㄣˊ通ㄊㄨㄥ力ㄌㄧˋ。\n文ㄨㄣˊ殊ㄕㄨ師ㄕ利ㄌㄧˋ勇ㄩㄥˇ猛ㄇㄥˇ智ㄓˋ，普ㄆㄨˇ賢ㄒㄧㄢˊ慧ㄏㄨㄟˋ行ㄒㄧㄥˊ亦ㄧˋ復ㄈㄨˋ然ㄖㄢˊ。\n我ㄨㄛˇ今ㄐㄧㄣ迴ㄏㄨㄟˊ向ㄒㄧㄤˋ諸ㄓㄨ善ㄕㄢˋ根ㄍㄣ，隨ㄙㄨㄟˊ彼ㄅㄧˇ一ㄧ切ㄑㄧㄝˋ常ㄔㄤˊ修ㄒㄧㄡ學ㄒㄩㄝˊ。\n三ㄙㄢ世ㄕˋ諸ㄓㄨ佛ㄈㄛˊ所ㄙㄨㄛˇ稱ㄔㄥ歎ㄊㄢˋ，如ㄖㄨˊ是ㄕˋ最ㄗㄨㄟˋ勝ㄕㄥˋ諸ㄓㄨ大ㄉㄚˋ願ㄩㄢˋ。\n我ㄨㄛˇ今ㄐㄧㄣ迴ㄏㄨㄟˊ向ㄒㄧㄤˋ諸ㄓㄨ善ㄕㄢˋ根ㄍㄣ，為ㄨㄟˋ得ㄉㄜˊ普ㄆㄨˇ賢ㄒㄧㄢˊ殊ㄕㄨ勝ㄕㄥˋ行ㄒㄧㄥˊ。\n願ㄩㄢˋ我ㄨㄛˇ臨ㄌㄧㄣˊ欲ㄩˋ命ㄇㄧㄥˋ終ㄓㄨㄥ時ㄕˊ，盡ㄐㄧㄣˋ除ㄔㄨˊ一ㄧ切ㄑㄧㄝˋ諸ㄓㄨ障ㄓㄤˋ礙ㄞˋ。\n面ㄇㄧㄢˋ見ㄐㄧㄢˋ彼ㄅㄧˇ佛ㄈㄛˊ阿ㄚ彌ㄇㄧˊ陀ㄊㄨㄛˊ，即ㄐㄧˊ得ㄉㄜˊ往ㄨㄤˇ生ㄕㄥ安ㄢ樂ㄌㄜˋ剎ㄔㄚˋ。\n我ㄨㄛˇ既ㄐㄧˋ往ㄨㄤˇ生ㄕㄥ彼ㄅㄧˇ國ㄍㄨㄛˊ已ㄧˇ，現ㄒㄧㄢˋ前ㄑㄧㄢˊ成ㄔㄥˊ就ㄐㄧㄡˋ此ㄘˇ大ㄉㄚˋ願ㄩㄢˋ。\n一ㄧ切ㄑㄧㄝˋ圓ㄩㄢˊ滿ㄇㄢˇ盡ㄐㄧㄣˋ無ㄨˊ餘ㄩˊ，利ㄌㄧˋ樂ㄌㄜˋ一ㄧ切ㄑㄧㄝˋ眾ㄓㄨㄥˋ生ㄕㄥ界ㄐㄧㄝˋ。\n彼ㄅㄧˇ佛ㄈㄛˊ眾ㄓㄨㄥˋ會ㄏㄨㄟˋ咸ㄒㄧㄢˊ清ㄑㄧㄥ淨ㄐㄧㄥˋ，我ㄨㄛˇ時ㄕˊ於ㄩˊ勝ㄕㄥˋ蓮ㄌㄧㄢˊ華ㄏㄨㄚ生ㄕㄥ。\n親ㄑㄧㄣ睹ㄉㄨˇ如ㄖㄨˊ來ㄌㄞˊ無ㄨˊ量ㄌㄧㄤˋ光ㄍㄨㄤ，現ㄒㄧㄢˋ前ㄑㄧㄢˊ授ㄕㄡˋ我ㄨㄛˇ菩ㄆㄨˊ提ㄊㄧˊ記ㄐㄧˋ。\n蒙ㄇㄥˊ彼ㄅㄧˇ如ㄖㄨˊ來ㄌㄞˊ授ㄕㄡˋ記ㄐㄧˋ已ㄧˇ，化ㄏㄨㄚˋ身ㄕㄣ無ㄨˊ數ㄕㄨˋ百ㄅㄞˇ俱ㄐㄩ胝ㄓ。\n智ㄓˋ力ㄌㄧˋ廣ㄍㄨㄤˇ大ㄉㄚˋ遍ㄅㄧㄢˋ十ㄕˊ方ㄈㄤ，普ㄆㄨˇ利ㄌㄧˋ一ㄧ切ㄑㄧㄝˋ眾ㄓㄨㄥˋ生ㄕㄥ界ㄐㄧㄝˋ。\n乃ㄋㄞˇ至ㄓˋ虛ㄒㄩ空ㄎㄨㄥ世ㄕˋ界ㄐㄧㄝˋ盡ㄐㄧㄣˋ，眾ㄓㄨㄥˋ生ㄕㄥ及ㄐㄧˊ業ㄧㄝˋ煩ㄈㄢˊ惱ㄋㄠˇ盡ㄐㄧㄣˋ。\n如ㄖㄨˊ是ㄕˋ一ㄧ切ㄑㄧㄝˋ無ㄨˊ盡ㄐㄧㄣˋ時ㄕˊ，我ㄨㄛˇ願ㄩㄢˋ究ㄐㄧㄡˋ竟ㄐㄧㄥˋ恆ㄏㄥˊ無ㄨˊ盡ㄐㄧㄣˋ。\n十ㄕˊ方ㄈㄤ所ㄙㄨㄛˇ有ㄧㄡˇ無ㄨˊ邊ㄅㄧㄢ剎ㄔㄚˋ，莊ㄓㄨㄤ嚴ㄧㄢˊ眾ㄓㄨㄥˋ寶ㄅㄠˇ供ㄍㄨㄥˋ如ㄖㄨˊ來ㄌㄞˊ。\n最ㄗㄨㄟˋ勝ㄕㄥˋ安ㄢ樂ㄌㄜˋ施ㄕ天ㄊㄧㄢ人ㄖㄣˊ，經ㄐㄧㄥ一ㄧ切ㄑㄧㄝˋ剎ㄔㄚˋ微ㄨㄟˊ塵ㄔㄣˊ劫ㄐㄧㄝˊ。\n若ㄖㄨㄛˋ人ㄖㄣˊ於ㄩˊ此ㄘˇ勝ㄕㄥˋ願ㄩㄢˋ王ㄨㄤˊ，一ㄧ經ㄐㄧㄥ於ㄩˊ耳ㄦˇ能ㄋㄥˊ生ㄕㄥ信ㄒㄧㄣˋ。\n求ㄑㄧㄡˊ勝ㄕㄥˋ菩ㄆㄨˊ提ㄊㄧˊ心ㄒㄧㄣ渴ㄎㄜˇ仰ㄧㄤˇ，獲ㄏㄨㄛˋ勝ㄕㄥˋ功ㄍㄨㄥ德ㄉㄜˊ過ㄍㄨㄛˋ於ㄩˊ彼ㄅㄧˇ。\n即ㄐㄧˊ常ㄔㄤˊ遠ㄩㄢˇ離ㄌㄧˊ惡ㄜˋ知ㄓ識ㄕˋ，永ㄩㄥˇ離ㄌㄧˊ一ㄧ切ㄑㄧㄝˋ諸ㄓㄨ惡ㄜˋ道ㄉㄠˋ。\n速ㄙㄨˋ見ㄐㄧㄢˋ如ㄖㄨˊ來ㄌㄞˊ無ㄨˊ量ㄌㄧㄤˋ光ㄍㄨㄤ，具ㄐㄩˋ此ㄘˇ普ㄆㄨˇ賢ㄒㄧㄢˊ最ㄗㄨㄟˋ勝ㄕㄥˋ願ㄩㄢˋ。\n此ㄘˇ人ㄖㄣˊ善ㄕㄢˋ得ㄉㄜˊ勝ㄕㄥˋ壽ㄕㄡˋ命ㄇㄧㄥˋ，此ㄘˇ人ㄖㄣˊ善ㄕㄢˋ來ㄌㄞˊ人ㄖㄣˊ中ㄓㄨㄥ生ㄕㄥ。\n此ㄘˇ人ㄖㄣˊ不ㄅㄨˋ久ㄐㄧㄡˇ當ㄉㄤ成ㄔㄥˊ就ㄐㄧㄡˋ，如ㄖㄨˊ彼ㄅㄧˇ普ㄆㄨˇ賢ㄒㄧㄢˊ菩ㄆㄨˊ薩ㄙㄚˋ行ㄒㄧㄥˊ。\n往ㄨㄤˇ昔ㄒㄧˊ由ㄧㄡˊ無ㄨˊ智ㄓˋ慧ㄏㄨㄟˋ力ㄌㄧˋ，所ㄙㄨㄛˇ造ㄗㄠˋ極ㄐㄧˊ惡ㄜˋ五ㄨˇ無ㄨˊ間ㄐㄧㄢ。\n誦ㄙㄨㄥˋ此ㄘˇ普ㄆㄨˇ賢ㄒㄧㄢˊ大ㄉㄚˋ願ㄩㄢˋ王ㄨㄤˊ，一ㄧ念ㄋㄧㄢˋ速ㄙㄨˋ疾ㄐㄧˊ皆ㄐㄧㄝ消ㄒㄧㄠ滅ㄇㄧㄝˋ。\n族ㄗㄨˊ姓ㄒㄧㄥˋ種ㄓㄨㄥˇ類ㄌㄟˋ及ㄐㄧˊ容ㄖㄨㄥˊ色ㄙㄜˋ，相ㄒㄧㄤˋ好ㄏㄠˇ智ㄓˋ慧ㄏㄨㄟˋ咸ㄒㄧㄢˊ圓ㄩㄢˊ滿ㄇㄢˇ。\n諸ㄓㄨ魔ㄇㄛˊ外ㄨㄞˋ道ㄉㄠˋ不ㄅㄨˋ能ㄋㄥˊ摧ㄘㄨㄟ，堪ㄎㄢ為ㄨㄟˊ三ㄙㄢ界ㄐㄧㄝˋ所ㄙㄨㄛˇ應ㄧㄥ供ㄍㄨㄥˋ。\n速ㄙㄨˋ詣ㄧˋ菩ㄆㄨˊ提ㄊㄧˊ大ㄉㄚˋ樹ㄕㄨˋ王ㄨㄤˊ，坐ㄗㄨㄛˋ已ㄧˇ降ㄒㄧㄤˊ伏ㄈㄨˊ諸ㄓㄨ魔ㄇㄛˊ眾ㄓㄨㄥˋ。\n成ㄔㄥˊ等ㄉㄥˇ正ㄓㄥˋ覺ㄐㄩㄝˊ轉ㄓㄨㄢˇ法ㄈㄚˇ輪ㄌㄨㄣˊ，普ㄆㄨˇ利ㄌㄧˋ一ㄧ切ㄑㄧㄝˋ諸ㄓㄨ含ㄏㄢˊ識ㄕˊ。\n若ㄖㄨㄛˋ人ㄖㄣˊ於ㄩˊ此ㄘˇ普ㄆㄨˇ賢ㄒㄧㄢˊ願ㄩㄢˋ，讀ㄉㄨˊ誦ㄙㄨㄥˋ受ㄕㄡˋ持ㄔˊ及ㄐㄧˊ演ㄧㄢˇ說ㄕㄨㄛ。\n果ㄍㄨㄛˇ報ㄅㄠˋ唯ㄨㄟˊ佛ㄈㄛˊ能ㄋㄥˊ證ㄓㄥˋ知ㄓ，決ㄐㄩㄝˊ定ㄉㄧㄥˋ獲ㄏㄨㄛˋ勝ㄕㄥˋ菩ㄆㄨˊ提ㄊㄧˊ道ㄉㄠˋ。\n若ㄖㄨㄛˋ人ㄖㄣˊ誦ㄙㄨㄥˋ此ㄘˇ普ㄆㄨˇ賢ㄒㄧㄢˊ願ㄩㄢˋ，我ㄨㄛˇ說ㄕㄨㄛ少ㄕㄠˇ分ㄈㄣˋ之ㄓ善ㄕㄢˋ根ㄍㄣ。\n一ㄧ念ㄋㄧㄢˋ一ㄧ切ㄑㄧㄝˋ悉ㄒㄧ皆ㄐㄧㄝ圓ㄩㄢˊ，成ㄔㄥˊ就ㄐㄧㄡˋ眾ㄓㄨㄥˋ生ㄕㄥ清ㄑㄧㄥ淨ㄐㄧㄥˋ願ㄩㄢˋ。\n我ㄨㄛˇ此ㄘˇ普ㄆㄨˇ賢ㄒㄧㄢˊ殊ㄕㄨ勝ㄕㄥˋ行ㄒㄧㄥˊ，無ㄨˊ邊ㄅㄧㄢ勝ㄕㄥˋ福ㄈㄨˊ皆ㄐㄧㄝ迴ㄏㄨㄟˊ向ㄒㄧㄤˋ。\n普ㄆㄨˇ願ㄩㄢˋ沈ㄔㄣˊ溺ㄋㄧˋ諸ㄓㄨ眾ㄓㄨㄥˋ生ㄕㄥ，速ㄙㄨˋ往ㄨㄤˇ無ㄨˊ量ㄌㄧㄤˋ光ㄍㄨㄤ佛ㄈㄛˊ剎ㄔㄚˋ。\n爾ㄦˇ時ㄕˊ普ㄆㄨˇ賢ㄒㄧㄢˊ菩ㄆㄨˊ薩ㄙㄚˋ摩ㄇㄛˊ訶ㄏㄜ薩ㄙㄚˋ。於ㄩˊ如ㄖㄨˊ來ㄌㄞˊ前ㄑㄧㄢˊ。說ㄕㄨㄛ此ㄘˇ普ㄆㄨˇ賢ㄒㄧㄢˊ廣ㄍㄨㄤˇ大ㄉㄚˋ願ㄩㄢˋ王ㄨㄤˊ清ㄑㄧㄥ淨ㄐㄧㄥˋ偈ㄐㄧˋ已ㄧˇ。善ㄕㄢˋ財ㄘㄞˊ童ㄊㄨㄥˊ子˙ㄗ。踴ㄩㄥˇ躍ㄩㄝˋ無ㄨˊ量ㄌㄧㄤˋ。一ㄧ切ㄑㄧㄝˋ菩ㄆㄨˊ薩ㄙㄚˋ皆ㄐㄧㄝ大ㄉㄚˋ歡ㄏㄨㄢ喜ㄒㄧˇ。如ㄖㄨˊ來ㄌㄞˊ讚ㄗㄢˋ言ㄧㄢˊ。善ㄕㄢˋ哉ㄗㄞ善ㄕㄢˋ哉ㄗㄞ。\n爾ㄦˇ時ㄕˊ世ㄕˋ尊ㄗㄨㄣ。與ㄩˇ諸ㄓㄨ聖ㄕㄥˋ者ㄓㄜˇ菩ㄆㄨˊ薩ㄙㄚˋ摩ㄇㄛˊ訶ㄏㄜ薩ㄙㄚˋ。演ㄧㄢˇ說ㄕㄨㄛ如ㄖㄨˊ是ㄕˋ不ㄅㄨˋ可ㄎㄜˇ思ㄙ議ㄧˋ解ㄐㄧㄝˇ脫ㄊㄨㄛ境ㄐㄧㄥˋ界ㄐㄧㄝˋ勝ㄕㄥˋ法ㄈㄚˇ門ㄇㄣˊ時ㄕˊ。文ㄨㄣˊ殊ㄕㄨ師ㄕ利ㄌㄧˋ菩ㄆㄨˊ薩ㄙㄚˋ而ㄦˊ為ㄨㄟˊ上ㄕㄤˋ首ㄕㄡˇ。諸ㄓㄨ大ㄉㄚˋ菩ㄆㄨˊ薩ㄙㄚˋ及ㄐㄧˊ所ㄙㄨㄛˇ成ㄔㄥˊ熟ㄕㄨˊ六ㄌㄧㄡˋ千ㄑㄧㄢ比ㄅㄧˇ丘ㄑㄧㄡ。彌ㄇㄧˊ勒ㄌㄜˋ菩ㄆㄨˊ薩ㄙㄚˋ而ㄦˊ為ㄨㄟˊ上ㄕㄤˋ首ㄕㄡˇ。賢ㄒㄧㄢˊ劫ㄐㄧㄝˊ一ㄧ切ㄑㄧㄝˋ諸ㄓㄨ大ㄉㄚˋ菩ㄆㄨˊ薩ㄙㄚˋ。無ㄨˊ垢ㄍㄡˋ普ㄆㄨˇ賢ㄒㄧㄢˊ菩ㄆㄨˊ薩ㄙㄚˋ而ㄦˊ為ㄨㄟˊ上ㄕㄤˋ首ㄕㄡˇ。一ㄧ生ㄕㄥ補ㄅㄨˇ處ㄔㄨˋ。住ㄓㄨˋ灌ㄍㄨㄢˋ頂ㄉㄧㄥˇ位ㄨㄟˋ。諸ㄓㄨ大ㄉㄚˋ菩ㄆㄨˊ薩ㄙㄚˋ。及ㄐㄧˊ餘ㄩˊ十ㄕˊ方ㄈㄤ種ㄓㄨㄥˇ種ㄓㄨㄥˇ世ㄕˋ界ㄐㄧㄝˋ。普ㄆㄨˇ來ㄌㄞˊ集ㄐㄧˊ會ㄏㄨㄟˋ。一ㄧ切ㄑㄧㄝˋ剎ㄔㄚˋ海ㄏㄞˇ極ㄐㄧˊ微ㄨㄟˊ塵ㄔㄣˊ數ㄕㄨˋ諸ㄓㄨ菩ㄆㄨˊ薩ㄙㄚˋ摩ㄇㄛˊ訶ㄏㄜ薩ㄙㄚˋ眾ㄓㄨㄥˋ。大ㄉㄚˋ智ㄓˋ舍ㄕㄜˋ利ㄌㄧˋ弗ㄈㄨˊ。摩ㄇㄛˊ訶ㄏㄜ目ㄇㄨˋ犍ㄐㄧㄢ連ㄌㄧㄢˊ等ㄉㄥˇ。而ㄦˊ為ㄨㄟˊ上ㄕㄤˋ首ㄕㄡˇ。諸ㄓㄨ大ㄉㄚˋ聲ㄕㄥ聞ㄨㄣˊ。并ㄅㄧㄥˋ諸ㄓㄨ人ㄖㄣˊ天ㄊㄧㄢ一ㄧ切ㄑㄧㄝˋ世ㄕˋ主ㄓㄨˇ。天ㄊㄧㄢ龍ㄌㄨㄥˊ夜ㄧㄝˋ叉ㄔㄚ。乾ㄑㄧㄢˊ闥ㄊㄚˋ婆ㄆㄛˊ。阿ㄚ修ㄒㄧㄡ羅ㄌㄨㄛˊ。迦ㄐㄧㄚ樓ㄌㄡˊ羅ㄌㄨㄛˊ。緊ㄐㄧㄣˇ那ㄋㄚˋ羅ㄌㄨㄛˊ。摩ㄇㄛˊ睺ㄏㄡˊ羅ㄌㄨㄛˊ伽ㄑㄧㄝˊ。人ㄖㄣˊ非ㄈㄟ人ㄖㄣˊ等ㄉㄥˇ。一ㄧ切ㄑㄧㄝˋ大ㄉㄚˋ眾ㄓㄨㄥˋ。聞ㄨㄣˊ佛ㄈㄛˊ所ㄙㄨㄛˇ說ㄕㄨㄛ。皆ㄐㄧㄝ大ㄉㄚˋ歡ㄏㄨㄢ喜ㄒㄧˇ。信ㄒㄧㄣˋ受ㄕㄡˋ奉ㄈㄥˋ行ㄒㄧㄥˊ。','全稱《大方廣佛華嚴經入不思議解脫境界普賢行願品》，唐・般若奉詔譯，是《華嚴經》最後一品，宣說普賢菩薩的十大行願：禮敬諸佛、稱讚如來、廣修供養、懺悔業障、隨喜功德、請轉法輪、請佛住世、常隨佛學、恆順眾生、普皆迴向，結尾以偈頌導歸極樂，是淨土行者常誦的經典。注音取自使用者提供的 PDF（逐字注音校對版），請以您慣用的版本核對。','善財童子請問如何禮敬諸佛乃至迴向，普賢菩薩以十大願回答：一、禮敬諸佛；二、稱讚如來；三、廣修供養（法供養最勝）；四、懺悔業障；五、隨喜功德；六、請轉法輪；七、請佛住世；八、常隨佛學；九、恆順眾生；十、普皆迴向。每一願都「虛空界盡、眾生界盡、眾生業盡、眾生煩惱盡，我願乃盡」，念念相續無有間斷。受持此願王的功德不可思議，臨命終時諸根散壞，唯此願王不相捨離，引導往生極樂世界，見阿彌陀佛。最後以偈頌重述，大眾歡喜信受奉行。（白話大意）'),
  mk('s_baofumu','報父母恩咒','咒','地藏王菩薩','報答父母恩、迴向七世父母離苦得樂','密教咒語類','—',['超度亡者','消業障','增長福慧'],21,6,'南ㄋㄢˊ無ㄇㄛˊ密ㄇㄧˋ利ㄌㄧˋ多ㄉㄨㄛ哆ㄉㄨㄛ婆ㄆㄛˊ曳ㄧˋ娑ㄙㄨㄛ訶ㄏㄜ','農曆七月為佛教的「孝月」，常持此咒迴向給七世父母，願他們離苦得樂。注音取自使用者提供的圖片：「南」字的聲調在圖上看不清楚（我標為ㄋㄢˊ），請對照您慣用的版本核對。','咒語通常保留原音念誦，不逐字翻譯。'),
  Object.assign(mk('s_dizangjing','地藏菩薩本願經','經','地藏王菩薩','孝親報恩、超度亡者、消業障、利益存亡','地藏類','唐・實叉難陀譯',['超度亡者','消業障','增長福慧'],1,7200,'','《地藏菩薩本願經》簡稱《地藏經》，唐・實叉難陀譯，分上、中、下三卷共十三品，說明地藏菩薩的大願與孝親報恩、超度亡者、利益存亡的功德，常於親人往生、中元普度、地藏菩薩聖誕時誦持。注音由使用者提供的圖片分三卷辨識整理，上卷未再做第二遍核對，請以您慣用的版本核對。','佛在忉利天為母親說法，地藏菩薩以無量願力度化六道眾生，發願「地獄不空，誓不成佛」。經中說明地藏菩薩的本生因緣（孝女光目、婆羅門女救母）、地獄種種名號與業報、稱念佛名與供養地藏的功德，以及如何以誦經、布施、造像等為亡者修福，使存者亡者同獲利益。（簡介）'),{parts:[{name:'上卷',text:'地ㄉㄧˋ藏ㄗㄤˋ菩ㄆㄨˊ薩ㄙㄚˋ本ㄅㄣˇ願ㄩㄢˋ經ㄐㄧㄥ卷ㄐㄩㄢˋ上ㄕㄤˋ\n唐ㄊㄤˊ于ㄩˊ闐ㄊㄧㄢˊ國ㄍㄨㄛˊ三ㄙㄢ藏ㄗㄤˋ沙ㄕㄚ門ㄇㄣˊ實ㄕˊ叉ㄔㄚ難ㄋㄢˊ陀ㄊㄨㄛˊ譯ㄧˋ\n忉ㄉㄠ利ㄌㄧˋ天ㄊㄧㄢ宮ㄍㄨㄥ神ㄕㄣˊ通ㄊㄨㄥ品ㄆㄧㄣˇ第ㄉㄧˋ一ㄧ\n如ㄖㄨˊ是ㄕˋ我ㄨㄛˇ聞ㄨㄣˊ。一ㄧˊ時ㄕˊ佛ㄈㄛˊ在ㄗㄞˋ忉ㄉㄠ利ㄌㄧˋ天ㄊㄧㄢ，為ㄨㄟˋ母ㄇㄨˇ說ㄕㄨㄛ法ㄈㄚˇ。爾ㄦˇ時ㄕˊ十ㄕˊ方ㄈㄤ無ㄨˊ量ㄌㄧㄤˋ世ㄕˋ界ㄐㄧㄝˋ，不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ一ㄧˊ切ㄑㄧㄝˋ諸ㄓㄨ佛ㄈㄛˊ，及ㄐㄧˊ大ㄉㄚˋ菩ㄆㄨˊ薩ㄙㄚˋ摩ㄇㄛˊ訶ㄏㄜ薩ㄙㄚˋ，皆ㄐㄧㄝ來ㄌㄞˊ集ㄐㄧˊ會ㄏㄨㄟˋ。讚ㄗㄢˋ歎ㄊㄢˋ釋ㄕˋ迦ㄐㄧㄚ牟ㄇㄡˊ尼ㄋㄧˊ佛ㄈㄛˊ，能ㄋㄥˊ於ㄩˊ五ㄨˇ濁ㄓㄨㄛˊ惡ㄜˋ世ㄕˋ，現ㄒㄧㄢˋ不ㄅㄨˋ可ㄎㄜˇ思ㄙ議ㄧˋ大ㄉㄚˋ智ㄓˋ慧ㄏㄨㄟˋ神ㄕㄣˊ通ㄊㄨㄥ之ㄓ力ㄌㄧˋ，調ㄊㄧㄠˊ伏ㄈㄨˊ剛ㄍㄤ強ㄑㄧㄤˊ眾ㄓㄨㄥˋ生ㄕㄥ，知ㄓ苦ㄎㄨˇ樂ㄧㄠˋ法ㄈㄚˇ，各ㄍㄜˋ遣ㄑㄧㄢˇ侍ㄕˋ者ㄓㄜˇ，問ㄨㄣˋ訊ㄒㄩㄣˋ世ㄕˋ尊ㄗㄨㄣ。是ㄕˋ時ㄕˊ，如ㄖㄨˊ來ㄌㄞˊ含ㄏㄢˊ笑ㄒㄧㄠˋ，放ㄈㄤˋ百ㄅㄞˇ千ㄑㄧㄢ萬ㄨㄢˋ億ㄧˋ大ㄉㄚˋ光ㄍㄨㄤ明ㄇㄧㄥˊ雲ㄩㄣˊ，所ㄙㄨㄛˇ謂ㄨㄟˋ大ㄉㄚˋ圓ㄩㄢˊ滿ㄇㄢˇ光ㄍㄨㄤ明ㄇㄧㄥˊ雲ㄩㄣˊ、大ㄉㄚˋ慈ㄘˊ悲ㄅㄟ光ㄍㄨㄤ明ㄇㄧㄥˊ雲ㄩㄣˊ、大ㄉㄚˋ智ㄓˋ慧ㄏㄨㄟˋ光ㄍㄨㄤ明ㄇㄧㄥˊ雲ㄩㄣˊ、大ㄉㄚˋ般ㄅㄛ若ㄖㄜˇ光ㄍㄨㄤ明ㄇㄧㄥˊ雲ㄩㄣˊ、大ㄉㄚˋ三ㄙㄢ昧ㄇㄟˋ光ㄍㄨㄤ明ㄇㄧㄥˊ雲ㄩㄣˊ、大ㄉㄚˋ吉ㄐㄧˊ祥ㄒㄧㄤˊ光ㄍㄨㄤ明ㄇㄧㄥˊ雲ㄩㄣˊ、大ㄉㄚˋ福ㄈㄨˊ德ㄉㄜˊ光ㄍㄨㄤ明ㄇㄧㄥˊ雲ㄩㄣˊ、大ㄉㄚˋ功ㄍㄨㄥ德ㄉㄜˊ光ㄍㄨㄤ明ㄇㄧㄥˊ雲ㄩㄣˊ、大ㄉㄚˋ歸ㄍㄨㄟ依ㄧ光ㄍㄨㄤ明ㄇㄧㄥˊ雲ㄩㄣˊ、大ㄉㄚˋ讚ㄗㄢˋ歎ㄊㄢˋ光ㄍㄨㄤ明ㄇㄧㄥˊ雲ㄩㄣˊ，放ㄈㄤˋ如ㄖㄨˊ是ㄕˋ等ㄉㄥˇ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ光ㄍㄨㄤ明ㄇㄧㄥˊ雲ㄩㄣˊ已ㄧˇ。又ㄧㄡˋ出ㄔㄨ種ㄓㄨㄥˇ種ㄓㄨㄥˇ微ㄨㄟˊ妙ㄇㄧㄠˋ之ㄓ音ㄧㄣ，所ㄙㄨㄛˇ謂ㄨㄟˋ檀ㄊㄢˊ波ㄅㄛ羅ㄌㄨㄛˊ蜜ㄇㄧˋ音ㄧㄣ、尸ㄕ波ㄅㄛ羅ㄌㄨㄛˊ蜜ㄇㄧˋ音ㄧㄣ、羼ㄔㄢˋ提ㄊㄧˊ波ㄅㄛ羅ㄌㄨㄛˊ蜜ㄇㄧˋ音ㄧㄣ、毗ㄆㄧˊ離ㄌㄧˊ耶ㄧㄝˊ波ㄅㄛ羅ㄌㄨㄛˊ蜜ㄇㄧˋ音ㄧㄣ、禪ㄔㄢˊ波ㄅㄛ羅ㄌㄨㄛˊ蜜ㄇㄧˋ音ㄧㄣ、般ㄅㄛ若ㄖㄜˇ波ㄅㄛ羅ㄌㄨㄛˊ密ㄇㄧˋ音ㄧㄣ、慈ㄘˊ悲ㄅㄟ音ㄧㄣ、喜ㄒㄧˇ捨ㄕㄜˇ音ㄧㄣ、解ㄐㄧㄝˇ脫ㄊㄨㄛ音ㄧㄣ、無ㄨˊ漏ㄌㄡˋ音ㄧㄣ、智ㄓˋ慧ㄏㄨㄟˋ音ㄧㄣ、大ㄉㄚˋ智ㄓˋ慧ㄏㄨㄟˋ音ㄧㄣ、師ㄕ子ㄗˇ吼ㄏㄡˇ音ㄧㄣ、大ㄉㄚˋ師ㄕ子ㄗˇ吼ㄏㄡˇ音ㄧㄣ、雲ㄩㄣˊ雷ㄌㄟˊ音ㄧㄣ、大ㄉㄚˋ雲ㄩㄣˊ雷ㄌㄟˊ音ㄧㄣ。出ㄔㄨ如ㄖㄨˊ是ㄕˋ等ㄉㄥˇ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ不ㄅㄨˋ可ㄎㄜˇ說ㄕㄨㄛ音ㄧㄣ已ㄧˇ，娑ㄙㄨㄛ婆ㄆㄛˊ世ㄕˋ界ㄐㄧㄝˋ，及ㄐㄧˊ他ㄊㄚ方ㄈㄤ國ㄍㄨㄛˊ土ㄊㄨˇ，有ㄧㄡˇ無ㄨˊ量ㄌㄧㄤˋ億ㄧˋ天ㄊㄧㄢ龍ㄌㄨㄥˊ鬼ㄍㄨㄟˇ神ㄕㄣˊ，亦ㄧˋ集ㄐㄧˊ到ㄉㄠˋ忉ㄉㄠ利ㄌㄧˋ天ㄊㄧㄢ宮ㄍㄨㄥ，所ㄙㄨㄛˇ謂ㄨㄟˋ四ㄙˋ天ㄊㄧㄢ王ㄨㄤˊ天ㄊㄧㄢ、忉ㄉㄠ利ㄌㄧˋ天ㄊㄧㄢ、須ㄒㄩ燄ㄧㄢˋ摩ㄇㄛˊ天ㄊㄧㄢ、兜ㄉㄡ率ㄕㄨㄞˋ陀ㄊㄨㄛˊ天ㄊㄧㄢ、化ㄏㄨㄚˋ樂ㄌㄜˋ天ㄊㄧㄢ、他ㄊㄚ化ㄏㄨㄚˋ自ㄗˋ在ㄗㄞˋ天ㄊㄧㄢ、梵ㄈㄢˋ眾ㄓㄨㄥˋ天ㄊㄧㄢ、梵ㄈㄢˋ輔ㄈㄨˇ天ㄊㄧㄢ、大ㄉㄚˋ梵ㄈㄢˋ天ㄊㄧㄢ、少ㄕㄠˇ光ㄍㄨㄤ天ㄊㄧㄢ、無ㄨˊ量ㄌㄧㄤˋ光ㄍㄨㄤ天ㄊㄧㄢ、光ㄍㄨㄤ音ㄧㄣ天ㄊㄧㄢ、少ㄕㄠˇ淨ㄐㄧㄥˋ天ㄊㄧㄢ、無ㄨˊ量ㄌㄧㄤˋ淨ㄐㄧㄥˋ天ㄊㄧㄢ、遍ㄅㄧㄢˋ淨ㄐㄧㄥˋ天ㄊㄧㄢ、福ㄈㄨˊ生ㄕㄥ天ㄊㄧㄢ、福ㄈㄨˊ愛ㄞˋ天ㄊㄧㄢ、廣ㄍㄨㄤˇ果ㄍㄨㄛˇ天ㄊㄧㄢ、無ㄨˊ煩ㄈㄢˊ天ㄊㄧㄢ、無ㄨˊ熱ㄖㄜˋ天ㄊㄧㄢ、善ㄕㄢ ㄛˊ空ㄎㄨㄥ曰ㄩㄝ：是ㄕˋ何ㄏㄜˊ神ㄕㄣˊ德ㄉㄜˊ，寬ㄎㄨㄢ我ㄨㄛˇ憂ㄧㄡ慮ㄌㄩˋ。我ㄨㄛˇ自ㄗˋ失ㄕ母ㄇㄨˇ以ㄧˇ來ㄌㄞˊ，晝ㄓㄡˋ夜ㄧㄝˋ憶ㄧˋ戀ㄌㄧㄢˋ，無ㄨˊ處ㄔㄨˋ可ㄎㄜˇ問ㄨㄣˋ知ㄓ母ㄇㄨˇ生ㄕㄥ界ㄐㄧㄝˋ。時ㄕˊ空ㄎㄨㄥ中ㄓㄨㄥ有ㄧㄡˇ聲ㄕㄥ，再ㄗㄞˋ報ㄅㄠˋ女ㄋㄩˇ曰ㄩㄝ：我ㄨㄛˇ是ㄕˋ汝ㄖㄨˇ所ㄙㄨㄛˇ瞻ㄓㄢ禮ㄌㄧˇ者ㄓㄜˇ，過ㄍㄨㄛˋ去ㄑㄩˋ覺ㄐㄩㄝˊ華ㄏㄨㄚˊ定ㄉㄧㄥˋ自ㄗˋ在ㄗㄞˋ王ㄨㄤˊ如ㄖㄨˊ來ㄌㄞˊ，見ㄐㄧㄢˋ汝ㄖㄨˇ憶ㄧˋ母ㄇㄨˇ，倍ㄅㄟˋ於ㄩˊ常ㄔㄤˊ情ㄑㄧㄥˊ眾ㄓㄨㄥˋ生ㄕㄥ之ㄓ分ㄈㄣˋ，故ㄍㄨˋ來ㄌㄞˊ告ㄍㄠˋ示ㄕˋ。婆ㄆㄛˊ羅ㄌㄨㄛˊ門ㄇㄣˊ女ㄋㄩˇ聞ㄨㄣˊ此ㄘˇ聲ㄕㄥ已ㄧˇ，舉ㄐㄩˇ身ㄕㄣ自ㄗˋ撲ㄆㄨ，肢ㄓ節ㄐㄧㄝˊ皆ㄐㄧㄝ損ㄙㄨㄣˇ。左ㄗㄨㄛˇ右ㄧㄡˋ扶ㄈㄨˊ侍ㄕˋ，良ㄌㄧㄤˊ久ㄐㄧㄡˇ方ㄈㄤ蘇ㄙㄨ。而ㄦˊ白ㄅㄛˊ空ㄎㄨㄥ曰ㄩㄝ：願ㄩㄢˋ佛ㄈㄛˊ慈ㄘˊ愍ㄇㄧㄣˇ，速ㄙㄨˋ說ㄕㄨㄛ我ㄨㄛˇ母ㄇㄨˇ生ㄕㄥ界ㄐㄧㄝˋ，我ㄨㄛˇ今ㄐㄧㄣ身ㄕㄣ心ㄒㄧㄣ，將ㄐㄧㄤ死ㄙˇ不ㄅㄨˋ久ㄐㄧㄡˇ。時ㄕˊ覺ㄐㄩㄝˊ華ㄏㄨㄚˊ定ㄉㄧㄥˋ自ㄗˋ在ㄗㄞˋ王ㄨㄤˊ如ㄖㄨˊ來ㄌㄞˊ，告ㄍㄠˋ聖ㄕㄥˋ女ㄋㄩˇ曰ㄩㄝ：汝ㄖㄨˇ供ㄍㄨㄥ養ㄧㄤˇ畢ㄅㄧˋ，但ㄉㄢˋ早ㄗㄠˇ返ㄈㄢˇ舍ㄕㄜˋ，端ㄉㄨㄢ坐ㄗㄨㄛˋ思ㄙ惟ㄨㄟˊ吾ㄨˊ之ㄓ名ㄇㄧㄥˊ號ㄏㄠˋ，即ㄐㄧˊ當ㄉㄤ知ㄓ母ㄇㄨˇ所ㄙㄨㄛˇ生ㄕㄥ去ㄑㄩˋ處ㄔㄨˋ。時ㄕˊ婆ㄆㄛˊ羅ㄌㄨㄛˊ門ㄇㄣˊ女ㄋㄩˇ尋ㄒㄩㄣˊ禮ㄌㄧˇ佛ㄈㄛˊ已ㄧˇ，即ㄐㄧˊ歸ㄍㄨㄟ其ㄑㄧˊ舍ㄕㄜˋ。以ㄧˇ憶ㄧˋ母ㄇㄨˇ故ㄍㄨˋ，端ㄉㄨㄢ坐ㄗㄨㄛˋ念ㄋㄧㄢˋ覺ㄐㄩㄝˊ華ㄏㄨㄚˊ定ㄉㄧㄥˋ自ㄗˋ在ㄗㄞˋ王ㄨㄤˊ如ㄖㄨˊ來ㄌㄞˊ。經ㄐㄧㄥ一ㄧˊ日ㄖˋ一ㄧˊ夜ㄧㄝˋ，忽ㄏㄨ見ㄐㄧㄢˋ自ㄗˋ身ㄕㄣ到ㄉㄠˋ一ㄧˋ海ㄏㄞˇ邊ㄅㄧㄢ。其ㄑㄧˊ水ㄕㄨㄟˇ涌ㄩㄥˇ沸ㄈㄟˋ，多ㄉㄨㄛ諸ㄓㄨ惡ㄜˋ獸ㄕㄡˋ，盡ㄐㄧㄣˋ復ㄈㄨˋ鐵ㄊㄧㄝˇ身ㄕㄣ，飛ㄈㄟ走ㄗㄡˇ海ㄏㄞˇ上ㄕㄤˋ，東ㄉㄨㄥ西ㄒㄧ馳ㄔˊ逐ㄓㄨˊ。見ㄐㄧㄢˋ諸ㄓㄨ男ㄋㄢˊ子ㄗˇ女ㄋㄩˇ人ㄖㄣˊ，百ㄅㄞˇ千ㄑㄧㄢ萬ㄨㄢˋ數ㄕㄨˋ，出ㄔㄨ沒ㄇㄛˋ海ㄏㄞˇ中ㄓㄨㄥ，被ㄅㄟˋ諸ㄓㄨ惡ㄜˋ獸ㄕㄡˋ爭ㄓㄥ取ㄑㄩˇ食ㄕˊ噉ㄉㄢˋ。又ㄧㄡˋ見ㄐㄧㄢˋ夜ㄧㄝˋ叉ㄔㄚ，其ㄑㄧˊ形ㄒㄧㄥˊ各ㄍㄜˋ異ㄧˋ，或ㄏㄨㄛˋ多ㄉㄨㄛ手ㄕㄡˇ多ㄉㄨㄛ眼ㄧㄢˇ、多ㄉㄨㄛ足ㄗㄨˊ多ㄉㄨㄛ頭ㄊㄡˊ、口ㄎㄡˇ牙ㄧㄚˊ外ㄨㄞˋ出ㄔㄨ，利ㄌㄧˋ刃ㄖㄣˋ如ㄖㄨˊ劍ㄐㄧㄢˋ。驅ㄑㄩ諸ㄓㄨ罪ㄗㄨㄟˋ人ㄖㄣˊ，使ㄕˇ近ㄐㄧㄣˋ惡ㄜˋ獸ㄕㄡˋ，復ㄈㄨˋ自ㄗˋ搏ㄅㄛˊ攫ㄐㄩㄝˊ，頭ㄊㄡˊ足ㄗㄨˊ相ㄒㄧㄤ就ㄐㄧㄡˋ。其ㄑㄧˊ形ㄒㄧㄥˊ萬ㄨㄢˋ類ㄌㄟˋ，不ㄅㄨˋ敢ㄍㄢˇ久ㄐㄧㄡˇ視ㄕˋ。時ㄕˊ婆ㄆㄛˊ羅ㄌㄨㄛˊ門ㄇㄣˊ女ㄋㄩˇ，以ㄧˇ念ㄋㄧㄢˋ佛ㄈㄛˊ力ㄌㄧˋ故ㄍㄨˋ，自ㄗˋ然ㄖㄢˊ無ㄨˊ懼ㄐㄩˋ。有ㄧㄡˇ一ㄧˋ鬼ㄍㄨㄟˇ王ㄨㄤˊ，名ㄇㄧㄥˊ曰ㄩㄝ無ㄨˊ毒ㄉㄨˊ，稽ㄑㄧˇ首ㄕㄡˇ來ㄌㄞˊ迎ㄧㄥˊ，白ㄅㄛˊ聖ㄕㄥˋ女ㄋㄩˇ曰ㄩㄝ：善ㄕㄢˋ哉ㄗㄞ，菩ㄆㄨˊ薩ㄙㄚˋ，何ㄏㄜˊ緣ㄩㄢˊ來ㄌㄞˊ此ㄘˇ？時ㄕˊ婆ㄆㄛˊ羅ㄌㄨㄛˊ門ㄇㄣˊ女ㄋㄩˇ問ㄨㄣˋ鬼ㄍㄨㄟˇ王ㄨㄤˊ曰ㄩㄝ：此ㄘˇ是ㄕˋ何ㄏㄜˊ處ㄔㄨˋ？無ㄨˊ毒ㄉㄨˊ答ㄉㄚˊ曰ㄩㄝ：此ㄘˇ是ㄕˋ大ㄉㄚˋ鐵ㄊㄧㄝˇ圍ㄨㄟˊ山ㄕㄢ西ㄒㄧ面ㄇㄧㄢˋ第ㄉㄧˋ一ㄧˋ重ㄔㄨㄥˊ海ㄏㄞˇ。聖ㄕㄥˋ女ㄋㄩˇ問ㄨㄣˋ曰ㄩㄝ：我ㄨㄛˇ聞ㄨㄣˊ鐵ㄊㄧㄝˇ圍ㄨㄟˊ之ㄓ內ㄋㄟˋ，地ㄉㄧˋ獄ㄩˋ在ㄗㄞˋ中ㄓㄨㄥ，是ㄕˋ事ㄕˋ實ㄕˊ否ㄈㄡˇ？無ㄨˊ毒ㄉㄨˊ答ㄉㄚˊ曰ㄩㄝ：實ㄕˊ有ㄧㄡˇ地ㄉㄧˋ獄ㄩˋ。聖ㄕㄥˋ女ㄋㄩˇ問ㄨㄣˋ曰ㄩㄝ：我ㄨㄛˇ今ㄐㄧㄣ云ㄩㄣˊ何ㄏㄜˊ得ㄉㄜˊ到ㄉㄠˋ獄ㄩˋ所ㄙㄨㄛˇ？無ㄨˊ毒ㄉㄨˊ答ㄉㄚˊ曰ㄩㄝ：若ㄖㄨㄛˋ非ㄈㄟ威ㄨㄟ神ㄕㄣˊ，即ㄐㄧˊ須ㄒㄩ業ㄧㄝˋ力ㄌㄧˋ，非ㄈㄟ此ㄘˇ二ㄦˋ事ㄕˋ，終ㄓㄨㄥ不ㄅㄨˋ能ㄋㄥˊ到ㄉㄠˋ。聖ㄕㄥˋ女ㄋㄩˇ又ㄧㄡˋ問ㄨㄣˋ：此ㄘˇ水ㄕㄨㄟˇ何ㄏㄜˊ緣ㄩㄢˊ，而ㄦˊ乃ㄋㄞˇ涌ㄩㄥˇ沸ㄈㄟˋ，多ㄉㄨㄛ諸ㄓㄨ罪ㄗㄨㄟˋ人ㄖㄣˊ，及ㄐㄧˊ以ㄧˇ惡ㄜˋ獸ㄕㄡˋ？無ㄨˊ毒ㄉㄨˊ答ㄉㄚˊ曰ㄩㄝ：此ㄘˇ是ㄕˋ閻ㄧㄢˊ浮ㄈㄨˊ提ㄊㄧˊ造ㄗㄠˋ惡ㄜˋ眾ㄓㄨㄥˋ生ㄕㄥ，新ㄒㄧㄣ死ㄙˇ之ㄓ者ㄓㄜˇ，經ㄐㄧㄥ四ㄙˋ十ㄕˊ九ㄐㄧㄡˇ日ㄖˋ後ㄏㄡˋ，無ㄨˊ人ㄖㄣˊ繼ㄐㄧˋ嗣ㄙˋ，為ㄨㄟˋ作ㄗㄨㄛˋ功ㄍㄨㄥ德ㄉㄜˊ，救ㄐㄧㄡˋ拔ㄅㄚˊ苦ㄎㄨˇ難ㄋㄢˋ，生ㄕㄥ時ㄕˊ又ㄧㄡˋ無ㄨˊ善ㄕㄢˋ因ㄧㄣ。當ㄉㄤ據ㄐㄩˋ本ㄅㄣˇ業ㄧㄝˋ所ㄙㄨㄛˇ感ㄍㄢˇ地ㄉㄧˋ獄ㄩˋ，自ㄗˋ然ㄖㄢˊ先ㄒㄧㄢ渡ㄉㄨˋ此ㄘˇ海ㄏㄞˇ。海ㄏㄞˇ東ㄉㄨㄥ十ㄕˊ萬ㄨㄢˋ由ㄧㄡˊ旬ㄒㄩㄣˊ，又ㄧㄡˋ有ㄧㄡˇ一ㄧˋ海ㄏㄞˇ，其ㄑㄧˊ苦ㄎㄨˇ倍ㄅ 歎ㄊㄢˋ品ㄆㄧㄣˇ第ㄉㄧˋ六ㄌㄧㄡˋ\n爾ㄦˇ時ㄕˊ世ㄕˋ尊ㄗㄨㄣ舉ㄐㄩˇ身ㄕㄣ放ㄈㄤˋ大ㄉㄚˋ光ㄍㄨㄤ明ㄇㄧㄥˊ，遍ㄅㄧㄢˋ照ㄓㄠˋ百ㄅㄞˇ千ㄑㄧㄢ萬ㄨㄢˋ億ㄧˋ恆ㄏㄥˊ河ㄏㄜˊ沙ㄕㄚ等ㄉㄥˇ諸ㄓㄨ佛ㄈㄛˊ世ㄕˋ界ㄐㄧㄝˋ。出ㄔㄨ大ㄉㄚˋ音ㄧㄣ聲ㄕㄥ，普ㄆㄨˇ告ㄍㄠˋ諸ㄓㄨ佛ㄈㄛˊ世ㄕˋ界ㄐㄧㄝˋ一ㄧ切ㄑㄧㄝˋ諸ㄓㄨ菩ㄆㄨˊ薩ㄙㄚˋ摩ㄇㄛˊ訶ㄏㄜ薩ㄙㄚˋ，及ㄐㄧˊ天ㄊㄧㄢ、龍ㄌㄨㄥˊ、鬼ㄍㄨㄟˇ、神ㄕㄣˊ、人ㄖㄣˊ、非ㄈㄟ人ㄖㄣˊ等ㄉㄥˇ。聽ㄊㄧㄥ吾ㄨˊ今ㄐㄧㄣ日ㄖˋ稱ㄔㄥ揚ㄧㄤˊ讚ㄗㄢˋ歎ㄊㄢˋ地ㄉㄧˋ藏ㄗㄤˋ菩ㄆㄨˊ薩ㄙㄚˋ摩ㄇㄛˊ訶ㄏㄜ薩ㄙㄚˋ，於ㄩˊ十ㄕˊ方ㄈㄤ世ㄕˋ界ㄐㄧㄝˋ，現ㄒㄧㄢˋ大ㄉㄚˋ不ㄅㄨˋ可ㄎㄜˇ思ㄙ議ㄧˋ威ㄨㄟ神ㄕㄣˊ慈ㄘˊ悲ㄅㄟ之ㄓ力ㄌㄧˋ，救ㄐㄧㄡˋ護ㄏㄨˋ一ㄧ切ㄑㄧㄝˋ罪ㄗㄨㄟˋ苦ㄎㄨˇ之ㄓ事ㄕˋ。吾ㄨˊ滅ㄇㄧㄝˋ度ㄉㄨˋ後ㄏㄡˋ，汝ㄖㄨˇ等ㄉㄥˇ諸ㄓㄨ菩ㄆㄨˊ薩ㄙㄚˋ大ㄉㄚˋ士ㄕˋ，及ㄐㄧˊ天ㄊㄧㄢ龍ㄌㄨㄥˊ鬼ㄍㄨㄟˇ神ㄕㄣˊ等ㄉㄥˇ，廣ㄍㄨㄤˇ作ㄗㄨㄛˋ方ㄈㄤ便ㄅㄧㄢˋ，衛ㄨㄟˋ護ㄏㄨˋ是ㄕˋ經ㄐㄧㄥ，令ㄌㄧㄥˋ一ㄧ切ㄑㄧㄝˋ眾ㄓㄨㄥˋ生ㄕㄥ證ㄓㄥˋ涅ㄋㄧㄝˋ槃ㄆㄢˊ樂ㄌㄜˋ。說ㄕㄨㄛ是ㄕˋ語ㄩˇ已ㄧˇ，會ㄏㄨㄟˋ中ㄓㄨㄥ有ㄧㄡˇ一ㄧˊ菩ㄆㄨˊ薩ㄙㄚˋ，名ㄇㄧㄥˊ曰ㄩㄝ普ㄆㄨˇ廣ㄍㄨㄤˇ，合ㄏㄜˊ掌ㄓㄤˇ恭ㄍㄨㄥ敬ㄐㄧㄥˋ而ㄦˊ白ㄅㄛˊ佛ㄈㄛˊ言ㄧㄢˊ：今ㄐㄧㄣ見ㄐㄧㄢˋ世ㄕˋ尊ㄗㄨㄣ讚ㄗㄢˋ歎ㄊㄢˋ地ㄉㄧˋ藏ㄗㄤˋ菩ㄆㄨˊ薩ㄙㄚˋ，有ㄧㄡˇ如ㄖㄨˊ是ㄕˋ不ㄅㄨˋ可ㄎㄜˇ思ㄙ議ㄧˋ大ㄉㄚˋ威ㄨㄟ神ㄕㄣˊ德ㄉㄜˊ，唯ㄨㄟˊ願ㄩㄢˋ世ㄕˋ尊ㄗㄨㄣ為ㄨㄟˋ未ㄨㄟˋ來ㄌㄞˊ世ㄕˋ末ㄇㄛˋ法ㄈㄚˇ眾ㄓㄨㄥˋ生ㄕㄥ，宣ㄒㄩㄢ說ㄕㄨㄛ地ㄉㄧˋ藏ㄗㄤˋ菩ㄆㄨˊ薩ㄙㄚˋ利ㄌㄧˋ益ㄧˋ人ㄖㄣˊ天ㄊㄧㄢ因ㄧㄣ果ㄍㄨㄛˇ等ㄉㄥˇ事ㄕˋ，使ㄕˇ諸ㄓㄨ天ㄊㄧㄢ龍ㄌㄨㄥˊ八ㄅㄚ部ㄅㄨˋ，及ㄐㄧˊ未ㄨㄟˋ來ㄌㄞˊ世ㄕˋ眾ㄓㄨㄥˋ生ㄕㄥ，頂ㄉㄧㄥˇ受ㄕㄡˋ佛ㄈㄛˊ語ㄩˇ。爾ㄦˇ時ㄕˊ世ㄕˋ尊ㄗㄨㄣ告ㄍㄠˋ普ㄆㄨˇ廣ㄍㄨㄤˇ菩ㄆㄨˊ薩ㄙㄚˋ及ㄐㄧˊ四ㄙˋ眾ㄓㄨㄥˋ等ㄉㄥˇ：諦ㄉㄧˋ聽ㄊㄧㄥ諦ㄉㄧˋ聽ㄊㄧㄥ！吾ㄨˊ當ㄉㄤ為ㄨㄟˋ汝ㄖㄨˇ略ㄌㄩㄝˋ說ㄕㄨㄛ地ㄉㄧˋ藏ㄗㄤˋ菩ㄆㄨˊ薩ㄙㄚˋ利ㄌㄧˋ益ㄧˋ人ㄖㄣˊ天ㄊㄧㄢ福ㄈㄨˊ德ㄉㄜˊ之ㄓ事ㄕˋ。普ㄆㄨˇ廣ㄍㄨㄤˇ白ㄅㄛˊ言ㄧㄢˊ：唯ㄨㄟˊ然ㄖㄢˊ！世ㄕˋ尊ㄗㄨㄣ，願ㄩㄢˋ樂ㄌㄜˋ欲ㄩˋ聞ㄨㄣˊ。佛ㄈㄛˊ告ㄍㄠˋ普ㄆㄨˇ廣ㄍㄨㄤˇ菩ㄆㄨˊ薩ㄙㄚˋ：未ㄨㄟˋ來ㄌㄞˊ世ㄕˋ中ㄓㄨㄥ，若ㄖㄨㄛˋ有ㄧㄡˇ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ、善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ，聞ㄨㄣˊ是ㄕˋ地ㄉㄧˋ藏ㄗㄤˋ菩ㄆㄨˊ薩ㄙㄚˋ摩ㄇㄛˊ訶ㄏㄜ薩ㄙㄚˋ名ㄇㄧㄥˊ者ㄓㄜˇ，或ㄏㄨㄛˋ合ㄏㄜˊ掌ㄓㄤˇ者ㄓㄜˇ、讚ㄗㄢˋ歎ㄊㄢˋ者ㄓㄜˇ、作ㄗㄨㄛˋ禮ㄌㄧˇ者ㄓㄜˇ、戀ㄌㄧㄢˋ慕ㄇㄨˋ者ㄓㄜˇ，是ㄕˋ人ㄖㄣˊ超ㄔㄠ越ㄩㄝˋ三ㄙㄢ十ㄕˊ劫ㄐㄧㄝˊ罪ㄗㄨㄟˋ。普ㄆㄨˇ廣ㄍㄨㄤˇ，若ㄖㄨㄛˋ有ㄧㄡˇ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ、善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ，或ㄏㄨㄛˋ彩ㄘㄞˇ畫ㄏㄨㄚˋ形ㄒㄧㄥˊ像ㄒㄧㄤˋ，或ㄏㄨㄛˋ土ㄊㄨˇ石ㄕˊ膠ㄐㄧㄠ漆ㄑㄧ，金ㄐㄧㄣ銀ㄧㄣˊ銅ㄊㄨㄥˊ鐵ㄊㄧㄝˇ、作ㄗㄨㄛˋ此ㄘˇ菩ㄆㄨˊ薩ㄙㄚˋ，一ㄧ瞻ㄓㄢ一ㄧ禮ㄌㄧˇ者ㄓㄜˇ，是ㄕˋ人ㄖㄣˊ百ㄅㄞˇ返ㄈㄢˇ生ㄕㄥ於ㄩˊ三ㄙㄢ十ㄕˊ三ㄙㄢ天ㄊㄧㄢ，永ㄩㄥˇ不ㄅㄨˋ墮ㄉㄨㄛˋ於ㄩˊ惡ㄜˋ道ㄉㄠˋ。假ㄐㄧㄚˇ如ㄖㄨˊ天ㄊㄧㄢ福ㄈㄨˊ盡ㄐㄧㄣˋ故ㄍㄨˋ，下ㄒㄧㄚˋ生ㄕㄥ人ㄖㄣˊ間ㄐㄧㄢ，猶ㄧㄡˊ為ㄨㄟˊ國ㄍㄨㄛˊ王ㄨㄤˊ，不ㄅㄨˋ失ㄕ大ㄉㄚˋ利ㄌㄧˋ。若ㄖㄨㄛˋ有ㄧㄡˇ女ㄋㄩˇ人ㄖㄣˊ，厭ㄧㄢˋ女ㄋㄩˇ人ㄖㄣˊ身ㄕㄣ，盡ㄐㄧㄣˋ心ㄒㄧㄣ供ㄍㄨㄥ養ㄧㄤˇ地ㄉㄧˋ藏ㄗㄤˋ菩ㄆㄨˊ薩ㄙㄚˋ畫ㄏㄨㄚˋ像ㄒㄧㄤˋ，及ㄐㄧˊ土ㄊㄨˇ石ㄕˊ膠ㄐㄧㄠ漆ㄑㄧ銅ㄊㄨㄥˊ鐵ㄊㄧㄝˇ等ㄉㄥˇ像ㄒㄧㄤˋ，如ㄖㄨˊ是ㄕˋ日ㄖˋ日ㄖˋ不ㄅㄨˋ退ㄊㄨㄟˋ，常ㄔㄤˊ以ㄧˇ華ㄏㄨㄚ香ㄒㄧㄤ、飲ㄧㄣˇ食ㄕˊ、衣ㄧ服ㄈㄨˊ、繒ㄗㄥ綵ㄘㄞˇ、幢ㄔㄨㄤˊ幡ㄈㄢ、錢ㄑㄧㄢˊ、寶ㄅㄠˇ物ㄨˋ等ㄉㄥˇ供ㄍㄨㄥ養ㄧㄤˇ。是ㄕˋ善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ，盡ㄐㄧㄣˋ此ㄘˇ一ㄧˊ報ㄅㄠˋ女ㄋㄩˇ身ㄕㄣ，百ㄅㄞˇ千ㄑㄧㄢ萬ㄨㄢˋ劫ㄐㄧㄝˊ，更ㄍㄥˋ不ㄅㄨˋ生ㄕㄥ有ㄧㄡˇ女ㄋㄩˇ人ㄖㄣˊ世ㄕˋ界ㄐㄧㄝˋ，何ㄏㄜˊ況ㄎㄨㄤˋ復ㄈㄨˋ受ㄕㄡˋ。除ㄔㄨˊ非ㄈㄟ慈ㄘˊ願ㄩㄢˋ力ㄌㄧˋ故ㄍㄨˋ，要ㄧㄠˋ受ㄕㄡˋ女ㄋㄩˇ身ㄕㄣ，度ㄉㄨˋ脫ㄊㄨㄛ眾ㄓㄨㄥˋ生ㄕㄥ，承ㄔㄥˊ斯ㄙ供ㄍㄨㄥ養ㄧㄤˇ地ㄉㄧˋ藏ㄗㄤˋ力ㄌㄧˋ故ㄍㄨˋ，及ㄐㄧˊ功ㄍㄨㄥ德ㄉㄜˊ力ㄌㄧˋ，百ㄅㄞˇ千ㄑㄧㄢ萬ㄨㄢˋ劫ㄐㄧㄝˊ不ㄅㄨˋ受ㄕㄡˋ女ㄋㄩˇ身ㄕㄣ。復ㄈㄨˋ次ㄘˋ普ㄆㄨˇ廣ㄍㄨㄤˇ： ㄥ唱ㄔㄤˋ言ㄧㄢˊ：我ㄨㄛˇ某ㄇㄡˇ甲ㄐㄧㄚˇ等ㄉㄥˇ，為ㄨㄟˋ是ㄕˋ病ㄅㄧㄥˋ人ㄖㄣˊ對ㄉㄨㄟˋ經ㄐㄧㄥ像ㄒㄧㄤˋ前ㄑㄧㄢˊ捨ㄕㄜˇ諸ㄓㄨ等ㄉㄥˇ物ㄨˋ，或ㄏㄨㄛˋ供ㄍㄨㄥ養ㄧㄤˇ經ㄐㄧㄥ像ㄒㄧㄤˋ、或ㄏㄨㄛˋ造ㄗㄠˋ佛ㄈㄛˊ菩ㄆㄨˊ薩ㄙㄚˋ形ㄒㄧㄥˊ像ㄒㄧㄤˋ、或ㄏㄨㄛˋ造ㄗㄠˋ塔ㄊㄚˇ寺ㄙˋ、或ㄏㄨㄛˋ燃ㄖㄢˊ油ㄧㄡˊ燈ㄉㄥ、或ㄏㄨㄛˋ施ㄕ常ㄔㄤˊ住ㄓㄨˋ。如ㄖㄨˊ是ㄕˋ三ㄙㄢ白ㄅㄛˊ病ㄅㄧㄥˋ人ㄖㄣˊ，遣ㄑㄧㄢˇ令ㄌㄧㄥˋ聞ㄨㄣˊ知ㄓ。假ㄐㄧㄚˇ令ㄌㄧㄥˋ諸ㄓㄨ識ㄕˊ分ㄈㄣ散ㄙㄢˋ，至ㄓˋ氣ㄑㄧˋ盡ㄐㄧㄣˋ者ㄓㄜˇ，乃ㄋㄞˇ至ㄓˋ一ㄧ日ㄖˋ、二ㄦˋ日ㄖˋ、三ㄙㄢ日ㄖˋ、四ㄙˋ日ㄖˋ至ㄓˋ七ㄑㄧ日ㄖˋ以ㄧˇ來ㄌㄞˊ。但ㄉㄢˋ高ㄍㄠ聲ㄕㄥ白ㄅㄛˊ，高ㄍㄠ聲ㄕㄥ讀ㄉㄨˊ經ㄐㄧㄥ。是ㄕˋ人ㄖㄣˊ命ㄇㄧㄥˋ終ㄓㄨㄥ之ㄓ後ㄏㄡˋ。宿ㄙㄨˋ殃ㄧㄤ重ㄓㄨㄥˋ罪ㄗㄨㄟˋ，至ㄓˋ於ㄩˊ五ㄨˇ無ㄨˊ間ㄐㄧㄢˋ罪ㄗㄨㄟˋ，永ㄩㄥˇ得ㄉㄜˊ解ㄐㄧㄝˇ脫ㄊㄨㄛ，所ㄙㄨㄛˇ受ㄕㄡˋ生ㄕㄥ處ㄔㄨˋ，常ㄔㄤˊ知ㄓ宿ㄙㄨˋ命ㄇㄧㄥˋ。何ㄏㄜˊ況ㄎㄨㄤˋ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ、善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ自ㄗˋ書ㄕㄨ此ㄘˇ經ㄐㄧㄥ，或ㄏㄨㄛˋ教ㄐㄧㄠˋ人ㄖㄣˊ書ㄕㄨ、或ㄏㄨㄛˋ自ㄗˋ塑ㄙㄨˋ畫ㄏㄨㄚˋ菩ㄆㄨˊ薩ㄙㄚˋ形ㄒㄧㄥˊ像ㄒㄧㄤˋ，乃ㄋㄞˇ至ㄓˋ教ㄐㄧㄠˋ人ㄖㄣˊ塑ㄙㄨˋ畫ㄏㄨㄚˋ。所ㄙㄨㄛˇ受ㄕㄡˋ果ㄍㄨㄛˇ報ㄅㄠˋ，必ㄅㄧˋ獲ㄏㄨㄛˋ大ㄉㄚˋ利ㄌㄧˋ。是ㄕˋ故ㄍㄨˋ普ㄆㄨˇ廣ㄍㄨㄤˇ，若ㄖㄨㄛˋ見ㄐㄧㄢˋ有ㄧㄡˇ人ㄖㄣˊ讀ㄉㄨˊ誦ㄙㄨㄥˋ是ㄕˋ經ㄐㄧㄥ，乃ㄋㄞˇ至ㄓˋ一ㄧ念ㄋㄧㄢˋ讚ㄗㄢˋ歎ㄊㄢˋ是ㄕˋ經ㄐㄧㄥ，或ㄏㄨㄛˋ恭ㄍㄨㄥ敬ㄐㄧㄥˋ者ㄓㄜˇ。汝ㄖㄨˇ須ㄒㄩ百ㄅㄞˇ千ㄑㄧㄢ方ㄈㄤ便ㄅㄧㄢˋ，勸ㄑㄩㄢˋ是ㄕˋ等ㄉㄥˇ人ㄖㄣˊ，勤ㄑㄧㄣˊ心ㄒㄧㄣ莫ㄇㄛˋ退ㄊㄨㄟˋ，能ㄋㄥˊ得ㄉㄜˊ未ㄨㄟˋ來ㄌㄞˊ、現ㄒㄧㄢˋ在ㄗㄞˋ千ㄑㄧㄢ萬ㄨㄢˋ億ㄧˋ不ㄅㄨˋ可ㄎㄜˇ思ㄙ議ㄧˋ功ㄍㄨㄥ德ㄉㄜˊ。復ㄈㄨˋ次ㄘˋ普ㄆㄨˇ廣ㄍㄨㄤˇ：若ㄖㄨㄛˋ未ㄨㄟˋ來ㄌㄞˊ世ㄕˋ諸ㄓㄨ眾ㄓㄨㄥˋ生ㄕㄥ等ㄉㄥˇ，或ㄏㄨㄛˋ夢ㄇㄥˋ或ㄏㄨㄛˋ寐ㄇㄟˋ，見ㄐㄧㄢˋ諸ㄓㄨ鬼ㄍㄨㄟˇ神ㄕㄣˊ乃ㄋㄞˇ及ㄐㄧˊ諸ㄓㄨ形ㄒㄧㄥˊ，或ㄏㄨㄛˋ悲ㄅㄟ、或ㄏㄨㄛˋ啼ㄊㄧˊ、或ㄏㄨㄛˋ愁ㄔㄡˊ、或ㄏㄨㄛˋ嘆ㄊㄢˋ、或ㄏㄨㄛˋ恐ㄎㄨㄥˇ、或ㄏㄨㄛˋ怖ㄅㄨˋ。此ㄘˇ皆ㄐㄧㄝ是ㄕˋ一ㄧ生ㄕㄥ十ㄕˊ生ㄕㄥ百ㄅㄞˇ生ㄕㄥ千ㄑㄧㄢ生ㄕㄥ過ㄍㄨㄛˋ去ㄑㄩˋ父ㄈㄨˋ母ㄇㄨˇ、男ㄋㄢˊ女ㄋㄩˇ弟ㄉㄧˋ妹ㄇㄟˋ、夫ㄈㄨ妻ㄑㄧ眷ㄐㄩㄢˋ屬ㄕㄨˇ，在ㄗㄞˋ於ㄩˊ惡ㄜˋ趣ㄑㄩˋ，未ㄨㄟˋ得ㄉㄜˊ出ㄔㄨ離ㄌㄧˊ，無ㄨˊ處ㄔㄨˋ希ㄒㄧ望ㄨㄤˋ福ㄈㄨˊ力ㄌㄧˋ救ㄐㄧㄡˋ拔ㄅㄚˊ，當ㄉㄤ告ㄍㄠˋ宿ㄙㄨˋ世ㄕˋ骨ㄍㄨˇ肉ㄖㄡˋ，使ㄕˇ作ㄗㄨㄛˋ方ㄈㄤ便ㄅㄧㄢˋ，願ㄩㄢˋ離ㄌㄧˊ惡ㄜˋ道ㄉㄠˋ。普ㄆㄨˇ廣ㄍㄨㄤˇ，汝ㄖㄨˇ以ㄧˇ神ㄕㄣˊ力ㄌㄧˋ，遣ㄑㄧㄢˇ是ㄕˋ眷ㄐㄩㄢˋ屬ㄕㄨˇ，令ㄌㄧㄥˋ對ㄉㄨㄟˋ諸ㄓㄨ佛ㄈㄛˊ菩ㄆㄨˊ薩ㄙㄚˋ像ㄒㄧㄤˋ前ㄑㄧㄢˊ，志ㄓˋ心ㄒㄧㄣ自ㄗˋ讀ㄉㄨˊ此ㄘˇ經ㄐㄧㄥ，或ㄏㄨㄛˋ請ㄑㄧㄥˇ人ㄖㄣˊ讀ㄉㄨˊ，其ㄑㄧˊ數ㄕㄨˇ三ㄙㄢ遍ㄅㄧㄢˋ或ㄏㄨㄛˋ七ㄑㄧ遍ㄅㄧㄢˋ。如ㄖㄨˊ是ㄕˋ惡ㄜˋ道ㄉㄠˋ眷ㄐㄩㄢˋ屬ㄕㄨˇ，經ㄐㄧㄥ聲ㄕㄥ畢ㄅㄧˋ是ㄕˋ遍ㄅㄧㄢˋ數ㄕㄨˇ，當ㄉㄤ得ㄉㄜˊ解ㄐㄧㄝˇ脫ㄊㄨㄛ，乃ㄋㄞˇ至ㄓˋ夢ㄇㄥˋ寐ㄇㄟˋ之ㄓ中ㄓㄨㄥ，永ㄩㄥˇ不ㄅㄨˊ復ㄈㄨˋ見ㄐㄧㄢˋ。復ㄈㄨˋ次ㄘˋ普ㄆㄨˇ廣ㄍㄨㄤˇ：若ㄖㄨㄛˋ未ㄨㄟˋ來ㄌㄞˊ世ㄕˋ，有ㄧㄡˇ諸ㄓㄨ下ㄒㄧㄚˋ賤ㄐㄧㄢˋ等ㄉㄥˇ人ㄖㄣˊ，或ㄏㄨㄛˋ奴ㄋㄨˊ或ㄏㄨㄛˋ婢ㄅㄧˋ，乃ㄋㄞˇ至ㄓˋ諸ㄓㄨ不ㄅㄨˊ自ㄗˋ由ㄧㄡˊ之ㄓ人ㄖㄣˊ，覺ㄐㄩㄝˊ知ㄓ宿ㄙㄨˋ業ㄧㄝˋ，要ㄧㄠˋ懺ㄔㄢˋ悔ㄏㄨㄟˇ者ㄓㄜˇ。志ㄓˋ心ㄒㄧㄣ瞻ㄓㄢ禮ㄌㄧˇ地ㄉㄧˋ藏ㄗㄤˋ菩ㄆㄨˊ薩ㄙㄚˋ形ㄒㄧㄥˊ像ㄒㄧㄤˋ，乃ㄋㄞˇ至ㄓˋ一ㄧ七ㄑㄧ日ㄖˋ中ㄓㄨㄥ，念ㄋㄧㄢˋ菩ㄆㄨˊ薩ㄙㄚˋ名ㄇㄧㄥˊ，可ㄎㄜˇ滿ㄇㄢˇ萬ㄨㄢˋ遍ㄅㄧㄢˋ。如ㄖㄨˊ是ㄕˋ等ㄉㄥˇ人ㄖㄣˊ，盡ㄐㄧㄣˋ此ㄘˇ報ㄅㄠˋ後ㄏㄡˋ，千ㄑㄧㄢ萬ㄨㄢˋ生ㄕㄥ中ㄓㄨㄥ，常ㄔㄤˊ生ㄕㄥ尊ㄗㄨㄣ貴ㄍㄨㄟˋ，更ㄍㄥˋ不ㄅㄨˋ經ㄐㄧㄥ三ㄙㄢ惡ㄜˋ道ㄉㄠˋ苦ㄎㄨˇ。復ㄈㄨˋ次ㄘˋ普ㄆㄨˇ廣ㄍㄨㄤˇ：若ㄖㄨㄛˋ未ㄨㄟˋ來ㄌㄞˊ世ㄕˋ中ㄓㄨㄥ，閻ㄧㄢˊ浮ㄈㄨˊ提ㄊㄧˊ內ㄋㄟˋ，剎ㄔㄚˋ利ㄌㄧˋ、婆ㄆㄛˊ羅ㄌㄨㄛˊ門ㄇㄣˊ、長ㄓㄤˇ者ㄓㄜˇ、居ㄐㄩ士ㄕˋ、一ㄧ切ㄑㄧㄝˋ人ㄖㄣˊ等ㄉㄥˇ，及ㄐㄧˊ異ㄧˋ姓ㄒㄧㄥˋ種ㄓㄨㄥˇ族ㄗㄨˊ，有ㄧㄡˇ新ㄒㄧㄣ產ㄔㄢˇ者ㄓㄜˇ，或ㄏㄨㄛˋ男ㄋㄢˊ或ㄏㄨㄛˋ女ㄋㄩˇ，七ㄑㄧ日ㄖˋ之ㄓ中ㄓㄨㄥ，早ㄗㄠˇ與ㄩˇ讀ㄉㄨˊ誦ㄙㄨㄥˋ此ㄘˇ不 ame:'下卷',text:'地ㄉㄧˋ藏ㄗㄤˋ菩ㄆㄨˊ薩ㄙㄚˋ本ㄅㄣˇ願ㄩㄢˋ經ㄐㄧㄥ卷ㄐㄩㄢˋ下ㄒㄧㄚˋ\n校ㄐㄧㄠˋ量ㄌㄧㄤˊ布ㄅㄨˋ施ㄕ功ㄍㄨㄥ德ㄉㄜˊ緣ㄩㄢˊ品ㄆㄧㄣˇ第ㄉㄧˋ十ㄕˊ\n爾ㄦˇ時ㄕˊ地ㄉㄧˋ藏ㄗㄤˋ菩ㄆㄨˊ薩ㄙㄚˋ摩ㄇㄛˊ訶ㄏㄜ薩ㄙㄚˋ，承ㄔㄥˊ佛ㄈㄛˊ威ㄨㄟ神ㄕㄣˊ，從ㄘㄨㄥˊ座ㄗㄨㄛˋ而ㄦˊ起ㄑㄧˇ，胡ㄏㄨˊ跪ㄍㄨㄟˋ合ㄏㄜˊ掌ㄓㄤˇ白ㄅㄛˊ佛ㄈㄛˊ言ㄧㄢˊ：世ㄕˋ尊ㄗㄨㄣ，我ㄨㄛˇ觀ㄍㄨㄢ業ㄧㄝˋ道ㄉㄠˋ眾ㄓㄨㄥˋ生ㄕㄥ，校ㄐㄧㄠˋ量ㄌㄧㄤˊ布ㄅㄨˋ施ㄕ，有ㄧㄡˇ輕ㄑㄧㄥ有ㄧㄡˇ重ㄓㄨㄥˋ，有ㄧㄡˇ一ㄧˋ生ㄕㄥ受ㄕㄡˋ福ㄈㄨˊ，有ㄧㄡˇ十ㄕˊ生ㄕㄥ受ㄕㄡˋ福ㄈㄨˊ，有ㄧㄡˇ百ㄅㄞˇ生ㄕㄥ千ㄑㄧㄢ生ㄕㄥ受ㄕㄡˋ大ㄉㄚˋ福ㄈㄨˊ利ㄌㄧˋ者ㄓㄜˇ。是ㄕˋ事ㄕˋ云ㄩㄣˊ何ㄏㄜˊ，唯ㄨㄟˊ願ㄩㄢˋ世ㄕˋ尊ㄗㄨㄣ為ㄨㄟˋ我ㄨㄛˇ說ㄕㄨㄛ之ㄓ。爾ㄦˇ時ㄕˊ佛ㄈㄛˊ告ㄍㄠˋ地ㄉㄧˋ藏ㄗㄤˋ菩ㄆㄨˊ薩ㄙㄚˋ：吾ㄨˊ今ㄐㄧㄣ於ㄩˊ忉ㄉㄠ利ㄌㄧˋ天ㄊㄧㄢ宮ㄍㄨㄥ一ㄧˊ切ㄑㄧㄝˋ眾ㄓㄨㄥˋ會ㄏㄨㄟˋ，說ㄕㄨㄛ閻ㄧㄢˊ浮ㄈㄨˊ提ㄊㄧˊ布ㄅㄨˋ施ㄕ較ㄐㄧㄠˋ量ㄌㄧㄤˊ功ㄍㄨㄥ德ㄉㄜˊ輕ㄑㄧㄥ重ㄓㄨㄥˋ，汝ㄖㄨˇ當ㄉㄤ諦ㄉㄧˋ聽ㄊㄧㄥ，吾ㄨˊ為ㄨㄟˋ汝ㄖㄨˇ說ㄕㄨㄛ。地ㄉㄧˋ藏ㄗㄤˋ白ㄅㄛˊ佛ㄈㄛˊ言ㄧㄢˊ：我ㄨㄛˇ疑ㄧˊ是ㄕˋ事ㄕˋ，願ㄩㄢˋ樂ㄧㄠˋ欲ㄩˋ聞ㄨㄣˊ。佛ㄈㄛˊ告ㄍㄠˋ地ㄉㄧˋ藏ㄗㄤˋ菩ㄆㄨˊ薩ㄙㄚˋ：南ㄋㄢˊ閻ㄧㄢˊ浮ㄈㄨˊ提ㄊㄧˊ，有ㄧㄡˇ諸ㄓㄨ國ㄍㄨㄛˊ王ㄨㄤˊ、宰ㄗㄞˇ輔ㄈㄨˇ大ㄉㄚˋ臣ㄔㄣˊ、大ㄉㄚˋ長ㄓㄤˇ者ㄓㄜˇ、大ㄉㄚˋ剎ㄔㄚˋ利ㄌㄧˋ、大ㄉㄚˋ婆ㄆㄛˊ羅ㄌㄨㄛˊ門ㄇㄣˊ等ㄉㄥˇ，若ㄖㄨㄛˋ遇ㄩˋ最ㄗㄨㄟˋ下ㄒㄧㄚˋ貧ㄆㄧㄣˊ窮ㄑㄩㄥˊ，乃ㄋㄞˇ至ㄓˋ癃ㄌㄨㄥˊ殘ㄘㄢˊ瘖ㄧㄣ啞ㄧㄚˇ，聾ㄌㄨㄥˊ癡ㄔ無ㄨˊ目ㄇㄨˋ，如ㄖㄨˊ是ㄕˋ種ㄓㄨㄥˇ種ㄓㄨㄥˇ不ㄅㄨˋ完ㄨㄢˊ具ㄐㄩˋ者ㄓㄜˇ。是ㄕˋ大ㄉㄚˋ國ㄍㄨㄛˊ王ㄨㄤˊ等ㄉㄥˇ欲ㄩˋ布ㄅㄨˋ施ㄕ時ㄕˊ，若ㄖㄨㄛˋ能ㄋㄥˊ具ㄐㄩˋ大ㄉㄚˋ慈ㄘˊ悲ㄅㄟ下ㄒㄧㄚˋ心ㄒㄧㄣ含ㄏㄢˊ笑ㄒㄧㄠˋ，親ㄑㄧㄣ手ㄕㄡˇ遍ㄅㄧㄢˋ布ㄅㄨˋ施ㄕ，或ㄏㄨㄛˋ使ㄕˇ人ㄖㄣˊ施ㄕ，軟ㄖㄨㄢˇ言ㄧㄢˊ慰ㄨㄟˋ喻ㄩˋ，是ㄕˋ國ㄍㄨㄛˊ王ㄨㄤˊ等ㄉㄥˇ所ㄙㄨㄛˇ獲ㄏㄨㄛˋ福ㄈㄨˊ利ㄌㄧˋ，如ㄖㄨˊ布ㄅㄨˋ施ㄕ百ㄅㄞˇ恆ㄏㄥˊ河ㄏㄜˊ沙ㄕㄚ佛ㄈㄛˊ功ㄍㄨㄥ德ㄉㄜˊ之ㄓ利ㄌㄧˋ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ。緣ㄩㄢˊ是ㄕˋ國ㄍㄨㄛˊ王ㄨㄤˊ等ㄉㄥˇ，於ㄩˊ是ㄕˋ最ㄗㄨㄟˋ貧ㄆㄧㄣˊ賤ㄐㄧㄢˋ輩ㄅㄟˋ及ㄐㄧˊ不ㄅㄨˋ完ㄨㄢˊ具ㄐㄩˋ者ㄓㄜˇ，發ㄈㄚ大ㄉㄚˋ慈ㄘˊ心ㄒㄧㄣ，是ㄕˋ故ㄍㄨˋ福ㄈㄨˊ利ㄌㄧˋ有ㄧㄡˇ如ㄖㄨˊ此ㄘˇ報ㄅㄠˋ。百ㄅㄞˇ千ㄑㄧㄢ生ㄕㄥ中ㄓㄨㄥ，常ㄔㄤˊ得ㄉㄜˊ七ㄑㄧ寶ㄅㄠˇ具ㄐㄩˋ足ㄗㄨˊ，何ㄏㄜˊ況ㄎㄨㄤˋ衣ㄧ食ㄕˊ受ㄕㄡˋ用ㄩㄥˋ。復ㄈㄨˋ次ㄘˋ地ㄉㄧˋ藏ㄗㄤˋ：若ㄖㄨㄛˋ未ㄨㄟˋ來ㄌㄞˊ世ㄕˋ，有ㄧㄡˇ諸ㄓㄨ國ㄍㄨㄛˊ王ㄨㄤˊ，至ㄓˋ婆ㄆㄛˊ羅ㄌㄨㄛˊ門ㄇㄣˊ等ㄉㄥˇ，遇ㄩˋ佛ㄈㄛˊ塔ㄊㄚˇ寺ㄙˋ，或ㄏㄨㄛˋ佛ㄈㄛˊ形ㄒㄧㄥˊ像ㄒㄧㄤˋ，乃ㄋㄞˇ至ㄓˋ菩ㄆㄨˊ薩ㄙㄚˋ聲ㄕㄥ聞ㄨㄣˊ辟ㄆㄧˋ支ㄓ佛ㄈㄛˊ像ㄒㄧㄤˋ，躬ㄍㄨㄥ自ㄗˋ營ㄧㄥˊ辦ㄅㄢˋ供ㄍㄨㄥˋ養ㄧㄤˇ布ㄅㄨˋ施ㄕ。是ㄕˋ國ㄍㄨㄛˊ王ㄨㄤˊ等ㄉㄥˇ，當ㄉㄤ得ㄉㄜˊ三ㄙㄢ劫ㄐㄧㄝˊ為ㄨㄟˊ帝ㄉㄧˋ釋ㄕˋ身ㄕㄣ，受ㄕㄡˋ勝ㄕㄥˋ妙ㄇㄧㄠˋ樂ㄌㄜˋ。若ㄖㄨㄛˋ能ㄋㄥˊ以ㄧˇ此ㄘˇ布ㄅㄨˋ施ㄕ福ㄈㄨˊ利ㄌㄧˋ，迴ㄏㄨㄟˊ向ㄒㄧㄤˋ法ㄈㄚˇ界ㄐㄧㄝˋ，是ㄕˋ大ㄉㄚˋ國ㄍㄨㄛˊ王ㄨㄤˊ等ㄉㄥˇ，於ㄩˊ十ㄕˊ劫ㄐㄧㄝˊ中ㄓㄨㄥ，常ㄔㄤˊ為ㄨㄟˊ大ㄉㄚˋ梵ㄈㄢˋ天ㄊㄧㄢ王ㄨㄤˊ。復ㄈㄨˋ次ㄘˋ地ㄉㄧˋ藏ㄗㄤˋ：若ㄖㄨㄛˋ未ㄨㄟˋ來ㄌㄞˊ世ㄕˋ，有ㄧㄡˇ諸ㄓㄨ國ㄍㄨㄛˊ王ㄨㄤˊ，至ㄓˋ婆ㄆㄛˊ羅ㄌㄨㄛˊ門ㄇㄣˊ等ㄉㄥˇ，遇ㄩˋ先ㄒㄧㄢ佛ㄈㄛˊ塔ㄊㄚˇ廟ㄇㄧㄠˋ，或ㄏㄨㄛˋ至ㄓˋ經ㄐㄧㄥ像ㄒㄧㄤˋ，毀ㄏㄨㄟˇ壞ㄏㄨㄞˋ破ㄆㄛˋ落ㄌㄨㄛˋ，乃ㄋㄞˇ能ㄋㄥˊ發ㄈㄚ心ㄒㄧㄣ修ㄒㄧㄡ補ㄅㄨˇ。是ㄕˋ國ㄍㄨㄛˊ王ㄨㄤˊ等ㄉㄥˇ，或ㄏㄨㄛˋ自ㄗˋ營ㄧㄥˊ辦ㄅㄢˋ，或ㄏㄨㄛˋ勸ㄑㄩㄢˋ他ㄊㄚ人ㄖㄣˊ，乃ㄋㄞˇ至ㄓˋ百ㄅㄞˇ千ㄑㄧㄢ人ㄖㄣˊ等ㄉㄥˇ布ㄅㄨˋ施ㄕ結ㄐㄧㄝˊ緣ㄩㄢˊ。是ㄕˋ國ㄍㄨㄛˊ王ㄨㄤˊ等ㄉㄥˇ，百ㄅㄞˇ千ㄑㄧㄢ生ㄕㄥ中ㄓㄨㄥ常ㄔㄤˊ為ㄨㄟˊ轉ㄓㄨㄢˇ輪ㄌㄨㄣˊ王ㄨㄤˊ身ㄕㄣ。如ㄖㄨˊ是ㄕˋ他ㄊㄚ人ㄖㄣˊ同ㄊㄨㄥˊ布ㄅㄨˋ施ㄕ者ㄓㄜˇ，百ㄅㄞˇ千ㄑㄧㄢ生ㄕㄥ中ㄓㄨㄥ常ㄔㄤˊ為ㄨㄟˊ小ㄒㄧㄠˇ國ㄍㄨㄛˊ王ㄨㄤˊ身ㄕㄣ。更ㄍㄥˋ能ㄋㄥˊ於ㄩˊ塔ㄊㄚˇ廟ㄇㄧㄠˋ前ㄑㄧㄢˊ，發ㄈㄚ迴ㄏㄨㄟˊ向ㄒㄧㄤˋ心ㄒㄧㄣ。如ㄖㄨˊ是ㄕˋ國ㄍㄨㄛˊ王ㄨㄤˊ乃 向ㄒㄧㄤˋ法ㄈㄚˇ界ㄐㄧㄝˋ，是ㄕˋ人ㄖㄣˊ功ㄍㄨㄥ德ㄉㄜˊ，百ㄅㄞˇ千ㄑㄧㄢ生ㄕㄥ中ㄓㄨㄥ受ㄕㄡˋ上ㄕㄤˋ妙ㄇㄧㄠˋ樂ㄌㄜˋ。如ㄖㄨˊ但ㄉㄢˋ迴ㄏㄨㄟˊ向ㄒㄧㄤˋ自ㄗˋ家ㄐㄧㄚ眷ㄐㄩㄢˋ屬ㄕㄨˇ，或ㄏㄨㄛˋ自ㄗˋ身ㄕㄣ利ㄌㄧˋ益ㄧˋ，如ㄖㄨˊ是ㄕˋ之ㄓ果ㄍㄨㄛˇ，即ㄐㄧˊ三ㄙㄢ生ㄕㄥ受ㄕㄡˋ樂ㄌㄜˋ，捨ㄕㄜˇ一ㄧ得ㄉㄜˊ萬ㄨㄢˋ報ㄅㄠˋ。是ㄕˋ故ㄍㄨˋ地ㄉㄧˋ藏ㄗㄤˋ，布ㄅㄨˋ施ㄕ因ㄧㄣ緣ㄩㄢˊ，其ㄑㄧˊ事ㄕˋ如ㄖㄨˊ是ㄕˋ。\n地ㄉㄧˋ神ㄕㄣˊ護ㄏㄨˋ法ㄈㄚˇ品ㄆㄧㄣˇ第ㄉㄧˋ十ㄕˊ一ㄧ\n爾ㄦˇ時ㄕˊ堅ㄐㄧㄢ牢ㄌㄠˊ地ㄉㄧˋ神ㄕㄣˊ白ㄅㄛˊ佛ㄈㄛˊ言ㄧㄢˊ：世ㄕˋ尊ㄗㄨㄣ，我ㄨㄛˇ從ㄘㄨㄥˊ昔ㄒㄧˊ來ㄌㄞˊ瞻ㄓㄢ視ㄕˋ頂ㄉㄧㄥˇ禮ㄌㄧˇ無ㄨˊ量ㄌㄧㄤˋ菩ㄆㄨˊ薩ㄙㄚˋ摩ㄇㄛˊ訶ㄏㄜ薩ㄙㄚˋ，皆ㄐㄧㄝ是ㄕˋ大ㄉㄚˋ不ㄅㄨˋ可ㄎㄜˇ思ㄙ議ㄧˋ神ㄕㄣˊ通ㄊㄨㄥ智ㄓˋ慧ㄏㄨㄟˋ，廣ㄍㄨㄤˇ度ㄉㄨˋ眾ㄓㄨㄥˋ生ㄕㄥ。是ㄕˋ地ㄉㄧˋ藏ㄗㄤˋ菩ㄆㄨˊ薩ㄙㄚˋ摩ㄇㄛˊ訶ㄏㄜ薩ㄙㄚˋ，於ㄩˊ諸ㄓㄨ菩ㄆㄨˊ薩ㄙㄚˋ誓ㄕˋ願ㄩㄢˋ深ㄕㄣ重ㄓㄨㄥˋ，世ㄕˋ尊ㄗㄨㄣ，是ㄕˋ地ㄉㄧˋ藏ㄗㄤˋ菩ㄆㄨˊ薩ㄙㄚˋ於ㄩˊ閻ㄧㄢˊ浮ㄈㄨˊ提ㄊㄧˊ有ㄧㄡˇ大ㄉㄚˋ因ㄧㄣ緣ㄩㄢˊ。如ㄖㄨˊ文ㄨㄣˊ殊ㄕㄨ、普ㄆㄨˇ賢ㄒㄧㄢˊ、觀ㄍㄨㄢ音ㄧㄣ、彌ㄇㄧˊ勒ㄌㄜˋ，亦ㄧˋ化ㄏㄨㄚˋ百ㄅㄞˇ千ㄑㄧㄢ身ㄕㄣ形ㄒㄧㄥˊ，度ㄉㄨˋ於ㄩˊ六ㄌㄧㄡˋ道ㄉㄠˋ，其ㄑㄧˊ願ㄩㄢˋ尚ㄕㄤˋ有ㄧㄡˇ畢ㄅㄧˋ竟ㄐㄧㄥˋ。是ㄕˋ地ㄉㄧˋ藏ㄗㄤˋ菩ㄆㄨˊ薩ㄙㄚˋ教ㄐㄧㄠˋ化ㄏㄨㄚˋ六ㄌㄧㄡˋ道ㄉㄠˋ一ㄧˊ切ㄑㄧㄝˋ眾ㄓㄨㄥˋ生ㄕㄥ，所ㄙㄨㄛˇ發ㄈㄚ誓ㄕˋ願ㄩㄢˋ劫ㄐㄧㄝˊ數ㄕㄨˋ，如ㄖㄨˊ千ㄑㄧㄢ百ㄅㄞˇ億ㄧˋ恆ㄏㄥˊ河ㄏㄜˊ沙ㄕㄚ。世ㄕˋ尊ㄗㄨㄣ，我ㄨㄛˇ觀ㄍㄨㄢ未ㄨㄟˋ來ㄌㄞˊ及ㄐㄧˊ現ㄒㄧㄢˋ在ㄗㄞˋ眾ㄓㄨㄥˋ生ㄕㄥ，於ㄩˊ所ㄙㄨㄛˇ住ㄓㄨˋ處ㄔㄨˋ，於ㄩˊ南ㄋㄢˊ方ㄈㄤ清ㄑㄧㄥ潔ㄐㄧㄝˊ之ㄓ地ㄉㄧˋ，以ㄧˇ土ㄊㄨˇ石ㄕˊ竹ㄓㄨˊ木ㄇㄨˋ作ㄗㄨㄛˋ其ㄑㄧˊ龕ㄎㄢ室ㄕˋ，是ㄕˋ中ㄓㄨㄥ能ㄋㄥˊ塑ㄙㄨˋ畫ㄏㄨㄚˋ，乃ㄋㄞˇ至ㄓˋ金ㄐㄧㄣ銀ㄧㄣˊ銅ㄊㄨㄥˊ鐵ㄊㄧㄝˇ，作ㄗㄨㄛˋ地ㄉㄧˋ藏ㄗㄤˋ形ㄒㄧㄥˊ像ㄒㄧㄤˋ，燒ㄕㄠ香ㄒㄧㄤ供ㄍㄨㄥˋ養ㄧㄤˇ，瞻ㄓㄢ禮ㄌㄧˇ讚ㄗㄢˋ歎ㄊㄢˋ。是ㄕˋ人ㄖㄣˊ居ㄐㄩ處ㄔㄨˋ，即ㄐㄧˊ得ㄉㄜˊ十ㄕˊ種ㄓㄨㄥˇ利ㄌㄧˋ益ㄧˋ。何ㄏㄜˊ等ㄉㄥˇ為ㄨㄟˊ十ㄕˊ：一ㄧˋ者ㄓㄜˇ、土ㄊㄨˇ地ㄉㄧˋ豐ㄈㄥ壤ㄖㄤˇ；二ㄦˋ者ㄓㄜˇ、家ㄐㄧㄚ宅ㄓㄞˊ永ㄩㄥˇ安ㄢ；三ㄙㄢ者ㄓㄜˇ、先ㄒㄧㄢ亡ㄨㄤˊ生ㄕㄥ天ㄊㄧㄢ；四ㄙˋ者ㄓㄜˇ、現ㄒㄧㄢˋ存ㄘㄨㄣˊ益ㄧˋ壽ㄕㄡˋ；五ㄨˇ者ㄓㄜˇ、所ㄙㄨㄛˇ求ㄑㄧㄡˊ遂ㄙㄨㄟˋ意ㄧˋ；六ㄌㄧㄡˋ者ㄓㄜˇ、無ㄨˊ水ㄕㄨㄟˇ火ㄏㄨㄛˇ災ㄗㄞ；七ㄑㄧ者ㄓㄜˇ、虛ㄒㄩ耗ㄏㄠˋ辟ㄅㄧˋ除ㄔㄨˊ；八ㄅㄚ者ㄓㄜˇ、杜ㄉㄨˋ絕ㄐㄩㄝˊ惡ㄜˋ夢ㄇㄥˋ；九ㄐㄧㄡˇ者ㄓㄜˇ、出ㄔㄨ入ㄖㄨˋ神ㄕㄣˊ護ㄏㄨˋ；十ㄕˊ者ㄓㄜˇ、多ㄉㄨㄛ遇ㄩˋ聖ㄕㄥˋ因ㄧㄣ。世ㄕˋ尊ㄗㄨㄣ，未ㄨㄟˋ來ㄌㄞˊ世ㄕˋ中ㄓㄨㄥ，及ㄐㄧˊ現ㄒㄧㄢˋ在ㄗㄞˋ眾ㄓㄨㄥˋ生ㄕㄥ，若ㄖㄨㄛˋ能ㄋㄥˊ於ㄩˊ所ㄙㄨㄛˇ住ㄓㄨˋ處ㄔㄨˋ方ㄈㄤ面ㄇㄧㄢˋ，作ㄗㄨㄛˋ如ㄖㄨˊ是ㄕˋ供ㄍㄨㄥˋ養ㄧㄤˇ，得ㄉㄜˊ如ㄖㄨˊ是ㄕˋ利ㄌㄧˋ益ㄧˋ。復ㄈㄨˋ白ㄅㄛˊ佛ㄈㄛˊ言ㄧㄢˊ：世ㄕˋ尊ㄗㄨㄣ，未ㄨㄟˋ來ㄌㄞˊ世ㄕˋ中ㄓㄨㄥ，若ㄖㄨㄛˋ有ㄧㄡˇ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ，於ㄩˊ所ㄙㄨㄛˇ住ㄓㄨˋ處ㄔㄨˋ，有ㄧㄡˇ此ㄘˇ經ㄐㄧㄥ典ㄉㄧㄢˇ及ㄐㄧˊ菩ㄆㄨˊ薩ㄙㄚˋ像ㄒㄧㄤˋ，是ㄕˋ人ㄖㄣˊ更ㄍㄥˋ能ㄋㄥˊ轉ㄓㄨㄢˇ讀ㄉㄨˊ經ㄐㄧㄥ典ㄉㄧㄢˇ，供ㄍㄨㄥˋ養ㄧㄤˇ菩ㄆㄨˊ薩ㄙㄚˋ。我ㄨㄛˇ常ㄔㄤˊ日ㄖˋ夜ㄧㄝˋ以ㄧˇ本ㄅㄣˇ神ㄕㄣˊ力ㄌㄧˋ，衛ㄨㄟˋ護ㄏㄨˋ是ㄕˋ人ㄖㄣˊ，乃ㄋㄞˇ至ㄓˋ水ㄕㄨㄟˇ火ㄏㄨㄛˇ盜ㄉㄠˋ賊ㄗㄟˊ，大ㄉㄚˋ橫ㄏㄥˋ小ㄒㄧㄠˇ橫ㄏㄥˋ，一ㄧˊ切ㄑㄧㄝˋ惡ㄜˋ事ㄕˋ，悉ㄒㄧ皆ㄐㄧㄝ消ㄒㄧㄠ滅ㄇㄧㄝˋ。佛ㄈㄛˊ告ㄍㄠˋ堅ㄐㄧㄢ牢ㄌㄠˊ地ㄉㄧˋ神ㄕㄣˊ：汝ㄖㄨˇ大ㄉㄚˋ神ㄕㄣˊ力ㄌㄧˋ，諸ㄓㄨ神ㄕㄣˊ少ㄕㄠˇ及ㄐㄧˊ。何ㄏㄜˊ以ㄧˇ故ㄍㄨˋ？閻ㄧㄢˊ浮ㄈㄨˊ土ㄊㄨˇ地ㄉㄧˋ，悉ㄒㄧ蒙ㄇㄥˊ汝ㄖㄨˇ護ㄏㄨˋ，乃ㄋㄞˇ至ㄓˋ草ㄘㄠˇ木ㄇㄨˋ沙ㄕㄚ石ㄕˊ，稻ㄉㄠˋ麻ㄇㄚˊ竹ㄓㄨˊ葦ㄨㄟˇ，穀ㄍㄨˇ米ㄇㄧˇ寶ㄅㄠˇ貝ㄅㄟˋ，從ㄘㄨㄥˊ地ㄉㄧˋ而ㄦˊ有ㄧㄡˇ，皆ㄐㄧㄝ因ㄧㄣ汝ㄖㄨˇ力ㄌㄧˋ。又ㄧㄡˋ常ㄔㄤˊ稱ㄔㄥ揚ㄧㄤˊ地ㄉㄧˋ藏ㄗㄤˋ菩ㄆㄨˊ薩ㄙㄚˋ利ㄌㄧˋ益ㄧˋ之ㄓ事ㄕˋ。汝ㄖㄨˇ之ㄓ功ㄍㄨㄥ德ㄉㄜˊ，及ㄐㄧˊ以ㄧˇ神ㄕㄣˊ通ㄊㄨㄥ，百ㄅㄞˇ千ㄑㄧㄢ倍ㄅㄟˋ於ㄩˊ常ㄔㄤˊ分ㄈㄣˋ地ㄉㄧˋ神ㄕㄣˊ。若ㄖㄨㄛ ㄛ偈ㄐㄧˋ言ㄧㄢˊ：\n吾ㄨˊ觀ㄍㄨㄢ地ㄉㄧˋ藏ㄗㄤˋ威ㄨㄟ神ㄕㄣˊ力ㄌㄧˋ\n恆ㄏㄥˊ河ㄏㄜˊ沙ㄕㄚ劫ㄐㄧㄝˊ說ㄕㄨㄛ難ㄋㄢˊ盡ㄐㄧㄣˋ\n見ㄐㄧㄢˋ聞ㄨㄣˊ瞻ㄓㄢ禮ㄌㄧˇ一ㄧˊ念ㄋㄧㄢˋ間ㄐㄧㄢ\n利ㄌㄧˋ益ㄧˋ人ㄖㄣˊ天ㄊㄧㄢ無ㄨˊ量ㄌㄧㄤˋ事ㄕˋ\n若ㄖㄨㄛˋ男ㄋㄢˊ若ㄖㄨㄛˋ女ㄋㄩˇ若ㄖㄨㄛˋ龍ㄌㄨㄥˊ神ㄕㄣˊ\n報ㄅㄠˋ盡ㄐㄧㄣˋ應ㄧㄥ當ㄉㄤ墮ㄉㄨㄛˋ惡ㄜˋ道ㄉㄠˋ\n至ㄓˋ心ㄒㄧㄣ歸ㄍㄨㄟ依ㄧ大ㄉㄚˋ士ㄕˋ身ㄕㄣ\n壽ㄕㄡˋ命ㄇㄧㄥˋ轉ㄓㄨㄢˇ增ㄗㄥ除ㄔㄨˊ罪ㄗㄨㄟˋ障ㄓㄤˋ\n少ㄕㄠˋ失ㄕ父ㄈㄨˋ母ㄇㄨˇ恩ㄣ愛ㄞˋ者ㄓㄜˇ\n未ㄨㄟˋ知ㄓ魂ㄏㄨㄣˊ神ㄕㄣˊ在ㄗㄞˋ何ㄏㄜˊ趣ㄑㄩˋ\n兄ㄒㄩㄥ弟ㄉㄧˋ姊ㄗˇ妹ㄇㄟˋ及ㄐㄧˊ諸ㄓㄨ親ㄑㄧㄣ\n生ㄕㄥ長ㄓㄤˇ以ㄧˇ來ㄌㄞˊ皆ㄐㄧㄝ不ㄅㄨˋ識ㄕˋ\n或ㄏㄨㄛˋ塑ㄙㄨˋ或ㄏㄨㄛˋ畫ㄏㄨㄚˋ大ㄉㄚˋ士ㄕˋ身ㄕㄣ\n悲ㄅㄟ戀ㄌㄧㄢˋ瞻ㄓㄢ禮ㄌㄧˇ不ㄅㄨˋ暫ㄓㄢˋ捨ㄕㄜˇ\n三ㄙㄢ七ㄑㄧ日ㄖˋ中ㄓㄨㄥ念ㄋㄧㄢˋ其ㄑㄧˊ名ㄇㄧㄥˊ\n菩ㄆㄨˊ薩ㄙㄚˋ當ㄉㄤ現ㄒㄧㄢˋ無ㄨˊ邊ㄅㄧㄢ體ㄊㄧˇ\n示ㄕˋ其ㄑㄧˊ眷ㄐㄩㄢˋ屬ㄕㄨˇ所ㄙㄨㄛˇ生ㄕㄥ界ㄐㄧㄝˋ\n縱ㄗㄨㄥˋ墮ㄉㄨㄛˋ惡ㄜˋ趣ㄑㄩˋ尋ㄒㄩㄣˊ出ㄔㄨ離ㄌㄧˊ\n若ㄖㄨㄛˋ能ㄋㄥˊ不ㄅㄨˋ退ㄊㄨㄟˋ是ㄕˋ初ㄔㄨ心ㄒㄧㄣ\n即ㄐㄧˊ獲ㄏㄨㄛˋ摩ㄇㄛˊ頂ㄉㄧㄥˇ受ㄕㄡˋ聖ㄕㄥˋ記ㄐㄧˋ\n欲ㄩˋ修ㄒㄧㄡ無ㄨˊ上ㄕㄤˋ菩ㄆㄨˊ提ㄊㄧˊ者ㄓㄜˇ\n乃ㄋㄞˇ至ㄓˋ出ㄔㄨ離ㄌㄧˊ三ㄙㄢ界ㄐㄧㄝˋ苦ㄎㄨˇ\n是ㄕˋ人ㄖㄣˊ既ㄐㄧˋ發ㄈㄚ大ㄉㄚˋ悲ㄅㄟ心ㄒㄧㄣ\n先ㄒㄧㄢ當ㄉㄤ瞻ㄓㄢ禮ㄌㄧˇ大ㄉㄚˋ士ㄕˋ像ㄒㄧㄤˋ\n一ㄧˊ切ㄑㄧㄝˋ諸ㄓㄨ願ㄩㄢˋ速ㄙㄨˋ成ㄔㄥˊ就ㄐㄧㄡˋ\n永ㄩㄥˇ無ㄨˊ業ㄧㄝˋ障ㄓㄤˋ能ㄋㄥˊ遮ㄓㄜ止ㄓˇ\n有ㄧㄡˇ人ㄖㄣˊ發ㄈㄚ心ㄒㄧㄣ念ㄋㄧㄢˋ經ㄐㄧㄥ典ㄉㄧㄢˇ\n欲ㄩˋ度ㄉㄨˋ群ㄑㄩㄣˊ迷ㄇㄧˊ超ㄔㄠ彼ㄅㄧˇ岸ㄢˋ\n雖ㄙㄨㄟ立ㄌㄧˋ是ㄕˋ願ㄩㄢˋ不ㄅㄨˋ思ㄙ議ㄧˋ\n旋ㄒㄩㄢˊ讀ㄉㄨˊ旋ㄒㄩㄢˊ忘ㄨㄤˋ多ㄉㄨㄛ廢ㄈㄟˋ失ㄕ\n斯ㄙ人ㄖㄣˊ有ㄧㄡˇ業ㄧㄝˋ障ㄓㄤˋ惑ㄏㄨㄛˋ故ㄍㄨˋ\n於ㄩˊ大ㄉㄚˋ乘ㄕㄥˋ經ㄐㄧㄥ不ㄅㄨˋ能ㄋㄥˊ記ㄐㄧˋ\n供ㄍㄨㄥˋ養ㄧㄤˇ地ㄉㄧˋ藏ㄗㄤˋ以ㄧˇ香ㄒㄧㄤ華ㄏㄨㄚˊ\n衣ㄧ服ㄈㄨˊ飲ㄧㄣˇ食ㄕˊ諸ㄓㄨ玩ㄨㄢˊ具ㄐㄩˋ\n以ㄧˇ淨ㄐㄧㄥˋ水ㄕㄨㄟˇ安ㄢ大ㄉㄚˋ士ㄕˋ前ㄑㄧㄢˊ\n一ㄧˊ日ㄖˋ一ㄧˊ夜ㄧㄝˋ求ㄑㄧㄡˊ服ㄈㄨˊ之ㄓ\n發ㄈㄚ殷ㄧㄣ重ㄓㄨㄥˋ心ㄒㄧㄣ慎ㄕㄣˋ五ㄨˇ辛ㄒㄧㄣ\n酒ㄐㄧㄡˇ肉ㄖㄡˋ邪ㄒㄧㄝˊ婬ㄧㄣˊ及ㄐㄧˊ妄ㄨㄤˋ語ㄩˇ\n三ㄙㄢ七ㄑㄧ日ㄖˋ內ㄋㄟˋ勿ㄨˋ殺ㄕㄚ害ㄏㄞˋ\n至ㄓˋ心ㄒㄧㄣ思ㄙ念ㄋㄧㄢˋ大ㄉㄚˋ士ㄕˋ名ㄇㄧㄥˊ\n即ㄐㄧˊ於ㄩˊ夢ㄇㄥˋ中ㄓㄨㄥ見ㄐㄧㄢˋ無ㄨˊ邊ㄅㄧㄢ\n覺ㄐㄩㄝˊ來ㄌㄞˊ便ㄅㄧㄢˋ得ㄉㄜˊ利ㄌㄧˋ根ㄍㄣ耳ㄦˇ\n應ㄧㄥ是ㄕˋ經ㄐㄧㄥ教ㄐㄧㄠˋ歷ㄌㄧˋ耳ㄦˇ聞ㄨㄣˊ\n千ㄑㄧㄢ萬ㄨㄢˋ生ㄕㄥ中ㄓㄨㄥ永ㄩㄥˇ不ㄅㄨˋ忘ㄨㄤˋ\n以ㄧˇ是ㄕˋ大ㄉㄚˋ士ㄕˋ不ㄅㄨˋ思ㄙ議ㄧˋ\n能ㄋㄥˊ使ㄕˇ斯ㄙ人ㄖㄣˊ獲ㄏㄨㄛˋ此ㄘˇ慧ㄏㄨㄟˋ\n貧ㄆㄧㄣˊ窮ㄑㄩㄥˊ眾ㄓㄨㄥˋ生ㄕㄥ及ㄐㄧˊ疾ㄐㄧˊ病ㄅㄧㄥˋ\n家ㄐㄧㄚ宅ㄓㄞˊ凶ㄒㄩㄥ衰ㄕㄨㄞ眷ㄐㄩㄢˋ屬ㄕㄨˇ離ㄌㄧˊ\n睡ㄕㄨㄟˋ夢ㄇㄥˋ之ㄓ中ㄓㄨㄥ悉ㄒㄧ不ㄅㄨˋ安ㄢ\n求ㄑㄧㄡˊ者ㄓㄜˇ乖ㄍㄨㄞ違ㄨㄟˊ無ㄨˊ稱ㄔㄥˋ遂ㄙㄨㄟˋ\n至ㄓˋ心ㄒㄧㄣ瞻ㄓㄢ禮ㄌㄧˇ地ㄉㄧˋ藏ㄗㄤˋ像ㄒㄧㄤˋ\n一ㄧˊ切ㄑㄧㄝˋ惡ㄜˋ事ㄕˋ皆ㄐㄧㄝ消ㄒㄧㄠ滅ㄇㄧㄝˋ\n至ㄓˋ於ㄩˊ夢ㄇㄥˋ中ㄓㄨㄥ盡ㄐㄧㄣˋ得ㄉㄜˊ安ㄢ\n衣ㄧ食ㄕˊ豐ㄈㄥ饒ㄖㄠˊ神ㄕㄣˊ鬼ㄍㄨㄟˇ護ㄏㄨˋ\n欲ㄩˋ入ㄖㄨˋ山ㄕㄢ林ㄌㄧㄣˊ及ㄐㄧˊ渡ㄉㄨˋ海ㄏㄞˇ\n毒ㄉㄨˊ惡ㄜˋ禽ㄑㄧㄣˊ獸ㄕㄡˋ及ㄐㄧˊ惡ㄜˋ人ㄖㄣˊ\n惡ㄜˋ神ㄕㄣˊ惡ㄜˋ鬼ㄍㄨㄟˇ并ㄅㄧㄥˋ惡ㄜˋ風ㄈㄥ\n一ㄧˊ切ㄑㄧㄝˋ諸ㄓㄨ難ㄋㄢˊ諸ㄓㄨ苦ㄎㄨˇ惱ㄋㄠˇ\n但ㄉㄢˋ當ㄉㄤ瞻ㄓㄢ禮ㄌㄧˇ及ㄐㄧˊ供ㄍㄨㄥˋ養ㄧㄤˇ\n地ㄉㄧˋ藏ㄗㄤˋ菩ㄆㄨˊ薩ㄙㄚˋ大ㄉㄚˋ士ㄕˋ像ㄒㄧㄤˋ\n如ㄖㄨˊ是ㄕˋ山ㄕㄢ林ㄌㄧㄣˊ大ㄉㄚˋ海ㄏㄞˇ中ㄓㄨㄥ\n應ㄧㄥ是ㄕˋ諸ㄓㄨ惡ㄜˋ皆ㄐㄧㄝ消ㄒㄧㄠ滅ㄇㄧㄝˋ\n觀ㄍㄨㄢ音ㄧㄣ至ㄓˋ心ㄒㄧㄣ聽ㄊㄧㄥ吾ㄨˊ說ㄕㄨㄛ\n地ㄉㄧˋ藏ㄗㄤˋ無ㄨˊ盡ㄐㄧㄣˋ不ㄅㄨˋ思ㄙ議ㄧˋ\n百ㄅㄞˇ千ㄑㄧㄢ萬ㄨㄢˋ劫ㄐㄧㄝˊ說ㄕㄨㄛ不ㄅㄨˋ周ㄓㄡ\n廣ㄍㄨㄤˇ宣ㄒㄩㄢ大ㄉㄚˋ士ㄕˋ如ㄖㄨˊ是ㄕˋ力ㄌㄧˋ\n地ㄉㄧˋ藏ㄗㄤˋ名ㄇㄧㄥˊ字ㄗˋ人ㄖㄣˊ若ㄖㄨㄛˋ聞ㄨㄣˊ\n乃ㄋㄞˇ至ㄓˋ見ㄐㄧㄢˋ像ㄒㄧㄤˋ瞻ㄓㄢ禮ㄌㄧˇ者ㄓㄜˇ\n香ㄒㄧㄤ華ㄏㄨㄚˊ衣ㄧ服ㄈㄨˊ飲ㄧㄣˇ食ㄕˊ奉ㄈㄥˋ\n供ㄍㄨ   mk('s_yaoshijing','藥師琉璃光如來本願功德經','經','藥師琉璃光如來','消災延壽、病苦消除、遠離橫禍','藥師類','唐・玄奘譯',['身體健康','消災除惡','增長福慧'],1,2400,'如ㄖㄨˊ是ㄕˋ我ㄨㄛˇ聞ㄨㄣˊ：一ㄧˋ時ㄕˊ，薄ㄅㄛˊ伽ㄑㄧㄝˊ梵ㄈㄢˋ遊ㄧㄡˊ化ㄏㄨㄚˋ諸ㄓㄨ國ㄍㄨㄛˊ，至ㄓˋ廣ㄍㄨㄤˇ嚴ㄧㄢˊ城ㄔㄥˊ，住ㄓㄨˋ樂ㄩㄝˋ音ㄧㄣ樹ㄕㄨˋ下ㄒㄧㄚˋ，與ㄩˇ大ㄉㄚˋ苾ㄅㄧˋ芻ㄔㄨ眾ㄓㄨㄥˋ八ㄅㄚ千ㄑㄧㄢ人ㄖㄣˊ俱ㄐㄩ，菩ㄆㄨˊ薩ㄙㄚˋ摩ㄇㄛˊ訶ㄏㄜ薩ㄙㄚˋ三ㄙㄢ萬ㄨㄢˋ六ㄌㄧㄡˋ千ㄑㄧㄢ，及ㄐㄧˊ國ㄍㄨㄛˊ王ㄨㄤˊ、大ㄉㄚˋ臣ㄔㄣˊ、婆ㄆㄛˊ羅ㄌㄨㄛˊ門ㄇㄣˊ、居ㄐㄩ士ㄕˋ、天ㄊㄧㄢ、龍ㄌㄨㄥˊ、藥ㄧㄠˋ叉ㄔㄚ、人ㄖㄣˊ、非ㄈㄟ人ㄖㄣˊ等ㄉㄥˇ，無ㄨˊ量ㄌㄧㄤˋ大ㄉㄚˋ眾ㄓㄨㄥˋ，恭ㄍㄨㄥ敬ㄐㄧㄥˋ圍ㄨㄟˊ繞ㄖㄠˋ，而ㄦˊ為ㄨㄟˋ說ㄕㄨㄛ法ㄈㄚˇ。\n爾ㄦˇ時ㄕˊ，曼ㄇㄢˋ殊ㄕㄨ室ㄕˋ利ㄌㄧˋ法ㄈㄚˇ王ㄨㄤˊ子ㄗˇ，承ㄔㄥˊ佛ㄈㄛˊ威ㄨㄟ神ㄕㄣˊ，從ㄘㄨㄥˊ座ㄗㄨㄛˋ而ㄦˊ起ㄑㄧˇ，偏ㄆㄧㄢ袒ㄊㄢˇ一ㄧˋ肩ㄐㄧㄢ，右ㄧㄡˋ膝ㄒㄧ著ㄓㄨㄛˊ地ㄉㄧˋ，向ㄒㄧㄤˋ薄ㄅㄛˊ伽ㄑㄧㄝˊ梵ㄈㄢˋ，曲ㄑㄩ躬ㄍㄨㄥ合ㄏㄜˊ掌ㄓㄤˇ，白ㄅㄛˊ言ㄧㄢˊ：「世ㄕˋ尊ㄗㄨㄣ，惟ㄨㄟˊ願ㄩㄢˋ演ㄧㄢˇ說ㄕㄨㄛ如ㄖㄨˊ是ㄕˋ相ㄒㄧㄤˋ類ㄌㄟˋ諸ㄓㄨ佛ㄈㄛˊ名ㄇㄧㄥˊ號ㄏㄠˋ，及ㄐㄧˊ本ㄅㄣˇ大ㄉㄚˋ願ㄩㄢˋ殊ㄕㄨ勝ㄕㄥˋ功ㄍㄨㄥ德ㄉㄜˊ，令ㄌㄧㄥˋ諸ㄓㄨ聞ㄨㄣˊ者ㄓㄜˇ業ㄧㄝˋ障ㄓㄤˋ消ㄒㄧㄠ除ㄔㄨˊ，為ㄨㄟˋ欲ㄩˋ利ㄌㄧˋ樂ㄌㄜˋ像ㄒㄧㄤˋ法ㄈㄚˇ轉ㄓㄨㄢˇ時ㄕˊ諸ㄓㄨ有ㄧㄡˇ情ㄑㄧㄥˊ故ㄍㄨˋ。」\n爾ㄦˇ時ㄕˊ，世ㄕˋ尊ㄗㄨㄣ讚ㄗㄢˋ曼ㄇㄢˋ殊ㄕㄨ室ㄕˋ利ㄌㄧˋ童ㄊㄨㄥˊ子ㄗˇ言ㄧㄢˊ：「善ㄕㄢˋ哉ㄗㄞ！善ㄕㄢˋ哉ㄗㄞ！曼ㄇㄢˋ殊ㄕㄨ室ㄕˋ利ㄌㄧˋ！汝ㄖㄨˇ以ㄧˇ大ㄉㄚˋ悲ㄅㄟ，勸ㄑㄩㄢˋ請ㄑㄧㄥˇ我ㄨㄛˇ說ㄕㄨㄛ諸ㄓㄨ佛ㄈㄛˊ名ㄇㄧㄥˊ號ㄏㄠˋ、本ㄅㄣˇ願ㄩㄢˋ功ㄍㄨㄥ德ㄉㄜˊ，為ㄨㄟˋ拔ㄅㄚˊ業ㄧㄝˋ障ㄓㄤˋ所ㄙㄨㄛˇ纏ㄔㄢˊ有ㄧㄡˇ情ㄑㄧㄥˊ，利ㄌㄧˋ益ㄧˋ安ㄢ樂ㄌㄜˋ像ㄒㄧㄤˋ法ㄈㄚˇ轉ㄓㄨㄢˇ時ㄕˊ諸ㄓㄨ有ㄧㄡˇ情ㄑㄧㄥˊ故ㄍㄨˋ。汝ㄖㄨˇ今ㄐㄧㄣ諦ㄉㄧˋ聽ㄊㄧㄥ！極ㄐㄧˊ善ㄕㄢˋ思ㄙ惟ㄨㄟˊ！當ㄉㄤ為ㄨㄟˋ汝ㄖㄨˇ說ㄕㄨㄛ。」曼ㄇㄢˋ殊ㄕㄨ室ㄕˋ利ㄌㄧˋ言ㄧㄢˊ：「唯ㄨㄟˇ然ㄖㄢˊ！願ㄩㄢˋ說ㄕㄨㄛ，我ㄨㄛˇ等ㄉㄥˇ樂ㄧㄠˋ聞ㄨㄣˊ。」\n佛ㄈㄛˊ告ㄍㄠˋ曼ㄇㄢˋ殊ㄕㄨ室ㄕˋ利ㄌㄧˋ：「東ㄉㄨㄥ方ㄈㄤ去ㄑㄩˋ此ㄘˇ，過ㄍㄨㄛˋ十ㄕˊ殑ㄑㄧㄥˊ伽ㄑㄧㄝˊ沙ㄕㄚ等ㄉㄥˇ佛ㄈㄛˊ土ㄊㄨˇ，有ㄧㄡˇ世ㄕˋ界ㄐㄧㄝˋ名ㄇㄧㄥˊ淨ㄐㄧㄥˋ琉ㄌㄧㄡˊ璃ㄌㄧˊ，佛ㄈㄛˊ號ㄏㄠˋ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ、應ㄧㄥ、正ㄓㄥˋ等ㄉㄥˇ覺ㄐㄩㄝˊ、明ㄇㄧㄥˊ行ㄒㄧㄥˊ圓ㄩㄢˊ滿ㄇㄢˇ、善ㄕㄢˋ逝ㄕˋ、世ㄕˋ間ㄐㄧㄢ解ㄐㄧㄝˇ、無ㄨˊ上ㄕㄤˋ士ㄕˋ、調ㄊㄧㄠˊ御ㄩˋ丈ㄓㄤˋ夫ㄈㄨ、天ㄊㄧㄢ人ㄖㄣˊ師ㄕ、佛ㄈㄛˊ、薄ㄅㄛˊ伽ㄑㄧㄝˊ梵ㄈㄢˋ。曼ㄇㄢˋ殊ㄕㄨ室ㄕˋ利ㄌㄧˋ！彼ㄅㄧˇ世ㄕˋ尊ㄗㄨㄣ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ，本ㄅㄣˇ行ㄒㄧㄥˊ菩ㄆㄨˊ薩ㄙㄚˋ道ㄉㄠˋ時ㄕˊ，發ㄈㄚ十ㄕˊ二ㄦˋ大ㄉㄚˋ願ㄩㄢˋ，令ㄌㄧㄥˋ諸ㄓㄨ有ㄧㄡˇ情ㄑㄧㄥˊ所ㄙㄨㄛˇ求ㄑㄧㄡˊ皆ㄐㄧㄝ得ㄉㄜˊ。\n第ㄉㄧˋ一ㄧ大ㄉㄚˋ願ㄩㄢˋ：願ㄩㄢˋ我ㄨㄛˇ來ㄌㄞˊ世ㄕˋ得ㄉㄜˊ阿ㄚ耨ㄋㄡˋ多ㄉㄨㄛ羅ㄌㄨㄛˊ三ㄙㄢ藐ㄇㄧㄠˇ三ㄙㄢ菩ㄆㄨˊ提ㄊㄧˊ時ㄕˊ，自ㄗˋ身ㄕㄣ光ㄍㄨㄤ明ㄇㄧㄥˊ，熾ㄔˋ然ㄖㄢˊ照ㄓㄠˋ曜ㄧㄠˋ無ㄨˊ量ㄌㄧㄤˋ無ㄨˊ數ㄕㄨˋ無ㄨˊ邊ㄅㄧㄢ世ㄕˋ界ㄐㄧㄝˋ，以ㄧˇ三ㄙㄢ十ㄕˊ二ㄦˋ大ㄉㄚˋ丈ㄓㄤˋ夫ㄈㄨ相ㄒㄧㄤˋ、八ㄅㄚ十ㄕˊ隨ㄙㄨㄟˊ形ㄒㄧㄥˊ好ㄏㄠˇ，莊ㄓㄨㄤ嚴ㄧㄢˊ其ㄑㄧˊ身ㄕㄣ，令ㄌㄧㄥˋ一ㄧˊ切ㄑㄧㄝˋ有ㄧㄡˇ情ㄑㄧㄥˊ，如ㄖㄨˊ我ㄨㄛˇ無ㄨˊ異ㄧˋ。\n第ㄉㄧˋ二ㄦˋ大ㄉㄚˋ願ㄩㄢˋ：願ㄩㄢˋ我ㄨㄛˇ來ㄌㄞˊ世ㄕˋ得ㄉㄜˊ菩ㄆㄨˊ提ㄊㄧˊ時ㄕˊ，身ㄕㄣ如ㄖㄨˊ琉ㄌㄧㄡˊ璃ㄌㄧˊ，內ㄋㄟˋ外ㄨㄞˋ明ㄇㄧㄥˊ徹ㄔㄜˋ，淨ㄐㄧㄥˋ無ㄨˊ瑕ㄒㄧㄚˊ穢ㄏㄨㄟˋ，光ㄍㄨㄤ明ㄇㄧㄥˊ廣ㄍㄨㄤˇ大ㄉㄚˋ，功ㄍㄨㄥ德ㄉㄜˊ巍ㄨㄟˊ巍ㄨㄟˊ，身ㄕㄣ善ㄕㄢˋ安ㄢ住ㄓㄨˋ，燄ㄧㄢˋ網ㄨㄤˇ莊ㄓㄨㄤ嚴ㄧㄢˊ，過ㄍㄨㄛˋ於ㄩˊ日ㄖˋ月ㄩㄝˋ。幽ㄧㄡ冥ㄇㄧㄥˊ眾ㄓㄨㄥˋ生ㄕㄥ，悉ㄒㄧ蒙ㄇㄥˊ開ㄎㄞ曉ㄒㄧㄠˇ，隨ㄙㄨㄟˊ意ㄧˋ所ㄙㄨㄛˇ趣ㄑㄩˋ，作ㄗㄨㄛˋ諸ㄓㄨ事ㄕˋ業ㄧㄝˋ。\n第ㄉㄧˋ三ㄙㄢ大ㄉㄚˋ願ㄩㄢˋ：願ㄩㄢˋ我ㄨㄛˇ來ㄌㄞˊ世ㄕˋ得ㄉㄜˊ菩ㄆㄨˊ提ㄊㄧˊ時ㄕˊ，以ㄧˇ無ㄨˊ量ㄌㄧㄤ ˊ，我ㄨㄛˇ當ㄉㄤ先ㄒㄧㄢ以ㄧˇ上ㄕㄤˋ妙ㄇㄧㄠˋ飲ㄧㄣˇ食ㄕˊ，飽ㄅㄠˇ足ㄗㄨˊ其ㄑㄧˊ身ㄕㄣ，後ㄏㄡˋ以ㄧˇ法ㄈㄚˇ味ㄨㄟˋ，畢ㄅㄧˋ竟ㄐㄧㄥˋ安ㄢ樂ㄌㄜˋ而ㄦˊ建ㄐㄧㄢˋ立ㄌㄧˋ之ㄓ。\n第ㄉㄧˋ十ㄕˊ二ㄦˋ大ㄉㄚˋ願ㄩㄢˋ：願ㄩㄢˋ我ㄨㄛˇ來ㄌㄞˊ世ㄕˋ得ㄉㄜˊ菩ㄆㄨˊ提ㄊㄧˊ時ㄕˊ，若ㄖㄨㄛˋ諸ㄓㄨ有ㄧㄡˇ情ㄑㄧㄥˊ，貧ㄆㄧㄣˊ無ㄨˊ衣ㄧ服ㄈㄨˊ，蚊ㄨㄣˊ虻ㄇㄥˊ寒ㄏㄢˊ熱ㄖㄜˋ，晝ㄓㄡˋ夜ㄧㄝˋ逼ㄅㄧ惱ㄋㄠˇ。若ㄖㄨㄛˋ聞ㄨㄣˊ我ㄨㄛˇ名ㄇㄧㄥˊ，專ㄓㄨㄢ念ㄋㄧㄢˋ受ㄕㄡˋ持ㄔˊ，如ㄖㄨˊ其ㄑㄧˊ所ㄙㄨㄛˇ好ㄏㄠˋ，即ㄐㄧˊ得ㄉㄜˊ種ㄓㄨㄥˇ種ㄓㄨㄥˇ上ㄕㄤˋ妙ㄇㄧㄠˋ衣ㄧ服ㄈㄨˊ，亦ㄧˋ得ㄉㄜˊ一ㄧˊ切ㄑㄧㄝˋ寶ㄅㄠˇ莊ㄓㄨㄤ嚴ㄧㄢˊ具ㄐㄩˋ，花ㄏㄨㄚ鬘ㄇㄢˊ塗ㄊㄨˊ香ㄒㄧㄤ，鼓ㄍㄨˇ樂ㄩㄝˋ眾ㄓㄨㄥˋ伎ㄐㄧˋ，隨ㄙㄨㄟˊ心ㄒㄧㄣ所ㄙㄨㄛˇ翫ㄨㄢˊ，皆ㄐㄧㄝ得ㄉㄜˊ滿ㄇㄢˇ足ㄗㄨˊ。\n曼ㄇㄢˋ殊ㄕㄨ室ㄕˋ利ㄌㄧˋ！是ㄕˋ為ㄨㄟˊ彼ㄅㄧˇ世ㄕˋ尊ㄗㄨㄣ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ、應ㄧㄥ、正ㄓㄥˋ等ㄉㄥˇ覺ㄐㄩㄝˊ，行ㄒㄧㄥˊ菩ㄆㄨˊ薩ㄙㄚˋ道ㄉㄠˋ時ㄕˊ，所ㄙㄨㄛˇ發ㄈㄚ十ㄕˊ二ㄦˋ微ㄨㄟˊ妙ㄇㄧㄠˋ上ㄕㄤˋ願ㄩㄢˋ。\n復ㄈㄨˋ次ㄘˋ，曼ㄇㄢˋ殊ㄕㄨ室ㄕˋ利ㄌㄧˋ！彼ㄅㄧˇ世ㄕˋ尊ㄗㄨㄣ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ，行ㄒㄧㄥˊ菩ㄆㄨˊ薩ㄙㄚˋ道ㄉㄠˋ時ㄕˊ，所ㄙㄨㄛˇ發ㄈㄚ大ㄉㄚˋ願ㄩㄢˋ，及ㄐㄧˊ彼ㄅㄧˇ佛ㄈㄛˊ土ㄊㄨˇ功ㄍㄨㄥ德ㄉㄜˊ莊ㄓㄨㄤ嚴ㄧㄢˊ，我ㄨㄛˇ若ㄖㄨㄛˋ一ㄧˋ劫ㄐㄧㄝˊ，若ㄖㄨㄛˋ一ㄧˋ劫ㄐㄧㄝˊ餘ㄩˊ，說ㄕㄨㄛ不ㄅㄨˋ能ㄋㄥˊ盡ㄐㄧㄣˋ。然ㄖㄢˊ彼ㄅㄧˇ佛ㄈㄛˊ土ㄊㄨˇ，一ㄧˊ向ㄒㄧㄤˋ清ㄑㄧㄥ淨ㄐㄧㄥˋ，無ㄨˊ有ㄧㄡˇ女ㄋㄩˇ人ㄖㄣˊ，亦ㄧˋ無ㄨˊ惡ㄜˋ趣ㄑㄩˋ，及ㄐㄧˊ苦ㄎㄨˇ音ㄧㄣ聲ㄕㄥ。琉ㄌㄧㄡˊ璃ㄌㄧˊ為ㄨㄟˊ地ㄉㄧˋ，金ㄐㄧㄣ繩ㄕㄥˊ界ㄐㄧㄝˋ道ㄉㄠˋ，城ㄔㄥˊ闕ㄑㄩㄝˋ宮ㄍㄨㄥ閣ㄍㄜˊ，軒ㄒㄩㄢ窗ㄔㄨㄤ羅ㄌㄨㄛˊ網ㄨㄤˇ，皆ㄐㄧㄝ七ㄑㄧ寶ㄅㄠˇ成ㄔㄥˊ；亦ㄧˋ如ㄖㄨˊ西ㄒㄧ方ㄈㄤ極ㄐㄧˊ樂ㄌㄜˋ世ㄕˋ界ㄐㄧㄝˋ，功ㄍㄨㄥ德ㄉㄜˊ莊ㄓㄨㄤ嚴ㄧㄢˊ，等ㄉㄥˇ無ㄨˊ差ㄔㄚ別ㄅㄧㄝˊ。於ㄩˊ其ㄑㄧˊ國ㄍㄨㄛˊ中ㄓㄨㄥ，有ㄧㄡˇ二ㄦˋ菩ㄆㄨˊ薩ㄙㄚˋ摩ㄇㄛˊ訶ㄏㄜ薩ㄙㄚˋ：一ㄧˋ名ㄇㄧㄥˊ日ㄖˋ光ㄍㄨㄤ遍ㄅㄧㄢˋ照ㄓㄠˋ，二ㄦˋ名ㄇㄧㄥˊ月ㄩㄝˋ光ㄍㄨㄤ遍ㄅㄧㄢˋ照ㄓㄠˋ。是ㄕˋ彼ㄅㄧˇ無ㄨˊ量ㄌㄧㄤˋ無ㄨˊ數ㄕㄨˋ菩ㄆㄨˊ薩ㄙㄚˋ眾ㄓㄨㄥˋ之ㄓ上ㄕㄤˋ首ㄕㄡˇ，次ㄘˋ補ㄅㄨˇ佛ㄈㄛˊ處ㄔㄨˋ，悉ㄒㄧ能ㄋㄥˊ持ㄔˊ彼ㄅㄧˇ世ㄕˋ尊ㄗㄨㄣ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ正ㄓㄥˋ法ㄈㄚˇ寶ㄅㄠˇ藏ㄗㄤˋ。是ㄕˋ故ㄍㄨˋ曼ㄇㄢˋ殊ㄕㄨ室ㄕˋ利ㄌㄧˋ！諸ㄓㄨ有ㄧㄡˇ信ㄒㄧㄣˋ心ㄒㄧㄣ善ㄕㄢˋ男ㄋㄢˊ子ㄗˇ、善ㄕㄢˋ女ㄋㄩˇ人ㄖㄣˊ等ㄉㄥˇ，應ㄧㄥ當ㄉㄤ願ㄩㄢˋ生ㄕㄥ彼ㄅㄧˇ佛ㄈㄛˊ世ㄕˋ界ㄐㄧㄝˋ。」\n爾ㄦˇ時ㄕˊ，世ㄕˋ尊ㄗㄨㄣ復ㄈㄨˋ告ㄍㄠˋ曼ㄇㄢˋ殊ㄕㄨ室ㄕˋ利ㄌㄧˋ童ㄊㄨㄥˊ子ㄗˇ言ㄧㄢˊ：「曼ㄇㄢˋ殊ㄕㄨ室ㄕˋ利ㄌㄧˋ！有ㄧㄡˇ諸ㄓㄨ眾ㄓㄨㄥˋ生ㄕㄥ，不ㄅㄨˋ識ㄕˋ善ㄕㄢˋ惡ㄜˋ，惟ㄨㄟˊ懷ㄏㄨㄞˊ貪ㄊㄢ吝ㄌㄧㄣˋ，不ㄅㄨˋ知ㄓ布ㄅㄨˋ施ㄕ及ㄐㄧˊ施ㄕ果ㄍㄨㄛˇ報ㄅㄠˋ，愚ㄩˊ癡ㄔ無ㄨˊ智ㄓˋ，缺ㄑㄩㄝ於ㄩˊ信ㄒㄧㄣˋ根ㄍㄣ；多ㄉㄨㄛ聚ㄐㄩˋ財ㄘㄞˊ寶ㄅㄠˇ，勤ㄑㄧㄣˊ加ㄐㄧㄚ守ㄕㄡˇ護ㄏㄨˋ，見ㄐㄧㄢˋ乞ㄑㄧˇ者ㄓㄜˇ來ㄌㄞˊ，其ㄑㄧˊ心ㄒㄧㄣ不ㄅㄨˋ喜ㄒㄧˇ；設ㄕㄜˋ不ㄅㄨˋ獲ㄏㄨㄛˋ已ㄧˇ，而ㄦˊ行ㄒㄧㄥˊ施ㄕ時ㄕˊ，如ㄖㄨˊ割ㄍㄜ身ㄕㄣ肉ㄖㄡˋ，深ㄕㄣ生ㄕㄥ痛ㄊㄨㄥˋ惜ㄒㄧˊ。復ㄈㄨˋ有ㄧㄡˇ無ㄨˊ量ㄌㄧㄤˋ慳ㄑㄧㄢ貪ㄊㄢ有ㄧㄡˇ情ㄑㄧㄥˊ，積ㄐㄧ集ㄐㄧˊ資ㄗ財ㄘㄞˊ，於ㄩˊ其ㄑㄧˊ自ㄗˋ身ㄕㄣ尚ㄕㄤˋ不ㄅㄨˋ受ㄕㄡˋ用ㄩㄥˋ，何ㄏㄜˊ況ㄎㄨㄤˋ能ㄋㄥˊ與ㄩˇ父ㄈㄨˋ母ㄇㄨˇ、妻ㄑㄧ子ㄗˇ、奴ㄋㄨˊ婢ㄅㄧˋ、作ㄗㄨㄛˋ使ㄕˇ，及ㄐㄧˊ來ㄌㄞˊ乞ㄑㄧˇ者ㄓㄜˇ？彼ㄅㄧˇ諸ㄓㄨ有ㄧㄡˇ情ㄑㄧㄥˊ，從ㄘㄨㄥˊ此ㄘˇ命ㄇㄧㄥˋ終ㄓㄨㄥ，生ㄕㄥ餓ㄜˋ鬼ㄍㄨㄟˇ界ㄐㄧㄝˋ，或ㄏㄨㄛˋ傍ㄆㄤˊ生ㄕㄥ趣ㄑㄩˋ。由ㄧㄡˊ昔ㄒㄧˊ人ㄖㄣˊ間ㄐㄧㄢ，曾ㄘㄥˊ得ㄉㄜˊ暫ㄓㄢˋ聞ㄨㄣˊ藥ㄧㄠˋ師ㄕ琉ㄌㄧㄡˊ璃ㄌㄧˊ光ㄍㄨㄤ如ㄖㄨˊ來ㄌㄞˊ名ㄇㄧㄥˊ故ㄍㄨˋ，今ㄐㄧㄣ在ㄗㄞˋ惡ㄜˋ趣ㄑㄩˋ，暫ㄓㄢˋ得ㄉㄜˊ憶ㄧˋ念ㄋㄧㄢˋ彼ㄅㄧˇ如ㄖㄨˊ來ㄌㄞˊ名ㄇㄧㄥˊ，即ㄐㄧˊ於ㄩˊ念ㄋㄧㄢˋ時ㄕˊ，從ㄘㄨㄥˊ彼ㄅㄧˇ處ㄔㄨˋ沒ㄇㄛˋ，還ㄏㄨㄢˊ生ㄕㄥ人ㄖㄣˊ中ㄓㄨㄥ，得ㄉㄜˊ宿ㄙㄨˋ命ㄇㄧㄥˋ念ㄋㄧㄢˋ，畏ㄨㄟˋ惡ㄜˋ趣ㄑㄩˋ苦ㄎㄨˇ，
